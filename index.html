FC links impulsivity across many psychiatric disorders (see Chapter 13)."}]},{"t":"Comorbid symptoms: the VMPFC","sec":"Symptoms and Circuits","fig":"Fig 11-8","c":[{"head":"Conduct disorder","body":"Stealing a car, cruelty, picking fights"},{"head":"Oppositional defiant disorder","body":"Temper tantrums, argumentative, disobedient, aggressive"},{"head":"Bipolar / anxiety spectrum","body":"Mood instability, mania, anxiety"}],"p":[{"label":"Key","text":"Inadequate tuning of the ventromedial prefrontal cortex may underlie these commonly comorbid symptoms."}]},{"t":"Tonic and phasic firing","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-9, 11-10","c":[{"head":"Tonic (baseline) firing: PFC","body":["Modest NE stimulates postsynaptic α2A","Modest DA stimulates D1 and D3","Sets the baseline “tone”","Moderation is key"]},{"head":"Phasic (burst) firing: nucleus accumbens","body":["Salience triggers bursts of DA","Reinforces learning and reward conditioning (education, career, relationships)","Out of bounds: hijacked by drugs → compulsive drug seeking"]}],"p":[{"label":"Goal","text":"Therapeutic goal in ADHD: modestly enhance phasic DA, and boost tonic NE and DA."}]},{"t":"Deficient arousal: weak NE and DA signals","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-11, 11-12","tb":[[["Transmitter","Receptor sensitivity order","At low levels","Modest increase"],["Dopamine","D3 (most sensitive) > D2 > D1 (least sensitive)","Only D3 stimulated; D1 (key for cognition) not","D3, then D2, then D1 engaged: PFC function improves"],["Norepinephrine","α2A more sensitive than α1 and β1","Inadequate α2A stimulation","α2A stimulated: PFC function improves"]]],"p":[{"label":"Key","text":"Postsynaptic D1 receptors predominate in the PFC and work best when neither under- nor overstimulated."}]},{"t":"Excessive arousal: stress and comorbidity","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-13, 11-14","f":[["Stress, anxiety, substance abuse, mania","NE and DA too high","NE recruits α1 and β1; DA overstimulates D1","Impaired working memory; cognitive dysfunction"]],"p":[{"label":"Key","text":"Cognitive dysfunction comes from too much AND too little arousal: NE and DA must sit in a “sweet spot.”"}]},{"t":"The inverted U","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-15, 11-16","tb":[[["Stimulation of α2A and D1","Result"],["Too low (left)","All signals the same: unguided attention"],["Moderate (top)","Optimal pyramidal cell function"],["Too high (right; α1 recruited)","Jumbled signals: misdirected attention"]]],"x":["Schematic, not measured data"]},{"t":"Inside the dendritic spine: α2A vs D1","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-17, 11-18, 11-19","tb":[[["","α2A (NE)","D1 (DA)"],["G protein","Gi (inhibitory)","Gs (stimulatory)"],["cAMP","Decreased","Increased"],["HCN channel","Closed","Opened (especially if excessive)"],["Incoming signal","Survives: strengthened","Leaks out: weakened or lost"],["Role","Increases the signal","Reduces the noise (moderate stimulation)"]]],"p":[{"label":"Key","text":"Moderate stimulation of BOTH receptors gives the best signal-to-noise ratio."}]},{"t":"Tuned vs mistuned pyramidal neurons","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Figs 11-20, 11-21","c":[{"head":"Properly tuned (11-20)","body":["Normal NE (LC) at α2A: signal increased","Normal DA (VTA) at D1: noise reduced","Guided attention, focus, control of emotions and impulses"]},{"head":"ADHD (11-21)","body":["Low NE: signal reduced","Low DA: noise increased","Hyperactivity, inattention, impulsivity, or a mix"]}],"p":[{"label":"Nuance","text":"If one transmitter is low and the other high, a different symptom set may appear; location of the mistuned neuron decides which symptoms."}]},{"t":"Chronic stress in ADHD","sec":"NE and DA “Tuning” of the Prefrontal Cortex","fig":"Fig 11-27","f":[["A: at first, high NE and DA → signal down, noise up","B: chronic stress depletes NE and DA → still poor output","C: treatment raises NE and DA to optimal → signal up, noise down"]],"p":[{"label":"Key","text":"Either way, the endpoint is the same: bring NE and DA to the top of the inverted U."}]},{"t":"A neurodevelopmental disorder","sec":"Neurodevelopment and ADHD","fig":"Figs 11-22, 11-23","b":["Unifying idea: delayed maturation of prefrontal cortex circuitry.","PFC synapses expand rapidly by age 6; up to half are eliminated by adolescence.","Sensorimotor and limbic regions mature first, PFC last; in ADHD cortical development is delayed."],"x":["genetic contribution: one of the highest in psychiatry","symptoms must appear (DSM-5; was age 7 in DSM-IV)","adult prevalence relative to children and adolescents"]},{"t":"Development of executive functions","sec":"Neurodevelopment and ADHD","fig":"Fig 11-22A","tb":[[["Age","Executive function milestone"],["~1 year","Working memory emerges"],["3–4 years (preschool)","Little ability to sustain attention; easily distracted by irrelevant stimuli"],["~6 years","Attending to one task while ignoring irrelevant stimuli; cognitive flexibility and inhibition; age when inattentive ADHD symptoms become noticeable"],["Adolescence onward (14–60)","Planning; sustained attention without perseveration; recognition memory; abstract concepts"]]]},{"t":"ADHD across the lifespan","sec":"Neurodevelopment and ADHD","fig":"Fig 11-24","tb":[[["Stage","Symptom pattern","Consequences"],["Preschool","Hyperactivity, impulsivity; inattention hard to identify","Behavioral disturbances"],["School age","Inattention becomes prominent","Academic problems, social difficulties, self-esteem"],["Adolescence","Impulsivity and hyperactivity decline","Academic failure, legal issues, smoking, injury, substance abuse"],["College / adulthood","Inattention persists; comorbidities soar","Occupational and relationship problems, accidents, substance abuse"]]],"p":[{"label":"Gap","text":"Half of children with ADHD are diagnosed and treated; fewer than 1 in 5 adults."}]},{"t":"Adult and “late-onset” ADHD","sec":"Neurodevelopment and ADHD","fig":"","c":[{"head":"Why adults are missed","body":["Onset by age 12 required","Hard to make retrospective diagnoses","Comorbidities take the focus"]},{"head":"Late-onset debate","body":"Should adults with onset after 12 (some up to 45) be excluded? Or is their executive dysfunction from depression, anxiety, or a sleep disorder?"}],"p":[{"label":"Clinical link","text":"Screen for cognitive symptoms and treat them, whatever the label."}]},{"t":"Setting treatment priorities","sec":"Which Symptoms Should Be Treated First?","fig":"Fig 11-25","c":[{"head":"Principles","body":["Hard to progress while alcohol or stimulant abuse continues","In adults: use ADHD treatments to augment first-line mood, anxiety, substance treatments","Keep a high index of suspicion for ADHD in these disorders","Later, address nicotine: ADHD smokers smoke about twice as often (nicotine boosts DA and arousal)"]}],"f":[["Alcohol / stimulant / substance abuse","Mood disorders","Anxiety disorders","ADHD","Nicotine dependence"]]},{"t":"Tricky combinations","sec":"Which Symptoms Should Be Treated First?","fig":"","tb":[[["Comorbidity","Problem","Approach in Ch. 11"],["Tics","Excess DA in motor striatum vs deficient DA in cortex","Stimulants may help ADHD but worsen tics"],["Conduct, oppositional, explosive, psychotic, bipolar disorders","Excess DA in some PFC circuits + comorbid ADHD","Heroic cases: stimulant + serotonin–dopamine blocker (D1 release in PFC, D2 block in limbic areas)"],["Anxiety","Stimulant may worsen anxiety","Augment with a tonic NET inhibitor or α2A agonist"],["Substance abuse","Little sense giving stimulants to drug abusers","NET inhibitor or α2A agonist; NET inhibitors may cut heavy drinking"]]]},{"t":"The goal: dial NE and DA up to optimal","sec":"Stimulant Treatment of ADHD","fig":"Fig 11-26","c":[{"head":"Untreated (11-26A)","body":["NE low: signal reduced","DA low: noise increased","Fidgeting, shifting attention"]},{"head":"Treated (11-26B)","body":["NE optimized: signal increased","DA optimized: noise reduced","Can sit in seat and focus"]}],"p":[{"label":"Key","text":"Both NE/DA reuptake blocking stimulants and some noradrenergic agents can do this."}]},{"t":"Methylphenidate vs amphetamine","sec":"Stimulant Treatment of ADHD","fig":"Figs 11-28 to 11-32","tb":[[["","Methylphenidate","Amphetamine"],["Binding at NET/DAT","Allosteric (like depression drugs): stops the pump","Competitive inhibitor and pseudosubstrate at the monoamine site"],["Transported into neuron?","No","Yes: hitchhikes into the terminal"],["VMAT2","No action","Competitive inhibitor; displaces DA from vesicles"],["At high (abuse) doses","—","DA floods out via opened channels and reversed DATs → euphoria"],["Isomers","D much more potent than L at NET and DAT","D more potent at DAT; D = L at NET"]]]},{"t":"Amphetamine: the “yin and yang”","sec":"Stimulant Treatment of ADHD","fig":"Fig 11-32","p":[{"label":"Key","text":"Steps 1–2 dominate at ADHD doses; steps 3–6 at abuse doses cause the flood of DA and euphoria."}],"x":["Competitively inhibits DAT","Transported into terminal by DAT","Packaged into vesicles by VMAT","Displaces DA from vesicles","High DA opens channels: DA spills out","High DA reverses DAT: DA pumped out"]},{"t":"Lisdexamfetamine and the D/L balance","sec":"Stimulant Treatment of ADHD","fig":"Figs 11-30, 11-31, 11-33","c":[{"head":"Lisdexamfetamine","body":["Prodrug: D-amphetamine linked to lysine","Cleaved in the stomach into D-amphetamine plus L-lysine","Slowly, rather than rapidly, absorbed"]}],"tb":[[["Preparation","Relative action"],["D-amphetamine","More DAT than NET"],["Mixed D,L salts","More NET than D alone; still DAT > NET"],["D-methylphenidate","More potent than L at both"]]]},{"t":"The mysterious DAT: three outcomes","sec":"Stimulant Treatment of ADHD","fig":"","tb":[[["How DAT is engaged","Outcome","Timing"],["Continuous, round-the-clock occupancy","Antidepressant effect via downstream molecular changes (tonic DA)","Delayed (weeks)"],["Above a threshold (~50–60% occupancy) during the day","Therapeutic effect in ADHD and daytime sleepiness","Immediate on/off"],["Rapid and high occupancy (snorted, IV, smoked, IR high dose)","Euphoria, abuse; later addiction","Immediate (abuse); delayed (addiction)"]]],"p":[{"label":"Key","text":"“Don’t mess incorrectly with your DAT!” Applies to methylphenidate, modafinil, amphetamine, methamphetamine, and cocaine."}]},{"t":"Getting the daily curve “just right”","sec":"Stimulant Treatment of ADHD","fig":"Fig 11-34","tb":[[["Profile","Problem"],["Ideal (11-34A)","Above threshold on waking, through the productive day, below it in time for bed"],["Delayed onset (11-34B)","Morning symptoms"],["Too short (11-34B)","Late afternoon and evening symptoms; rebound hyperactivity and insomnia if levels drop too early"],["Too long (11-34C)","Evening side effects, notably insomnia"]]],"p":[{"label":"Clinical link","text":"No single formulation fits every patient or every day: choose from Tables 11-1 to 11-4 to match the desired duration and onset."}]},{"t":"Table 11-1: D,L-methylphenidate (1/2)","sec":"Stimulant Treatment of ADHD","fig":"Table 11-1","tb":[[["Formulation","Brand names","Duration","Dosing","Approval"],["Immediate-release tablet","Ritalin","Early peak, 3–4 h","Second dose at lunch","Ages 6 to 12 and adults"],["Immediate-release oral solution","Methylin","Early peak, 3–4 h","Second dose at lunch","Ages 6 to 12"],["Extended-release tablet","Ritalin SR, Methylin ER, Metadate ER","Early peak, 3–8 h","Lunch dosing may be needed","Ages 6 and older"],["Extended-release tablet","Concerta","Small early peak, 12 h","Once daily, morning","Ages 6 and older"],["Extended-release chewable tablet","QuilliChew ER","Peak at 5 h, 8 h","Once daily, morning","Ages 6 and older"],["Extended-release capsule","Metadate CD","Strong early peak, 8 h","Once daily, morning","Ages 6 to 17"],["Extended-release capsule","Ritalin LA","Two strong peaks (early and ~4 h), 6–8 h","Once daily, morning","Ages 6 to 12"]]]},{"t":"Table 11-1 (2/2) and Table 11-2: D-methylphenidate","sec":"Stimulant Treatment of ADHD","fig":"Tables 11-1, 11-2","tb":[[["Formulation","Brand names","Duration","Dosing","Approval"],["Extended-release capsule","Aptensio XR","Up to 12 h","Once daily, morning","Ages 6 and older"],["Extended-release oral suspension","Quillivant XR","Peak at 5 h, 12 h","Once daily, morning","Ages 6 and older"],["Extended-release transdermal patch","Daytrana","One peak at 7–10 h, 12 h","Once daily, morning","Ages 6 to 17"],["Orally disintegrating tablet","Cotempla XR-ODT","12 h","Once daily, morning","Ages 6 to 17"],["Extended-release capsule","Jornay PM","Absorption delayed 10 h; single peak at 14 h","Once daily, EVENING","Ages 6 and older"],["Extended-release capsule","Adhansia XR","Two peaks (1.5 and 12 h)","Once daily, morning","Ages 6 and older"],["Table 11-2: IR tablet (D-MPH)","Focalin","Early peak, 4–6 h","Second dose at lunch","Ages 6 to 17"],["Table 11-2: ER capsule (D-MPH)","Focalin XR","Two peaks (1.5 and 6.5 h), 8–10 h","Once daily, morning","Ages 6 to 17 and adults"]]]},{"t":"Table 11-3: D,L-amphetamine formulations","sec":"Stimulant Treatment of ADHD","fig":"Table 11-3","tb":[[["Formulation","Brand names","Duration","Dosing","Approval"],["Immediate-release tablet","Adderall","4–6 h","Second dose at lunch","Ages 3 and older"],["Immediate-release tablet","Evekeo","6 h","Second dose at lunch","Ages 3 and older"],["ER orally disintegrating tablets","Adzenys XR-ODT","8–12 h, peak at 5 h","Once daily, morning","Ages 6 and older"],["Extended-release oral suspension","Dyanavel XR","10–12 h, peak at 4 h","Once daily, morning","Ages 6 to 17"],["Extended-release capsule","Adderall XR","8–12 h, peak at 6–8 h","Once daily, morning","Ages 6 and older"],["Extended-release capsule","Mydayis","Up to 16 h","Once daily, morning","Ages 13 and older"],["Extended-release oral suspension","Adzenys ER","Not published","Once daily, morning","Ages 6 and older"]]]},{"t":"Table 11-4: D-amphetamine formulations","sec":"Stimulant Treatment of ADHD","fig":"Table 11-4","tb":[[["Formulation","Brand names","Duration","Dosing","Approval"],["Immediate-release tablet","Zenzedi","4–5 h","Second dose at lunch","Ages 3 to 16"],["Immediate-release oral solution","ProCentra (previously Liquadd)","4–6 h","Second dose at lunch","Ages 3 to 16"],["Extended-release capsule","Dexedrine","6–8 h","Once daily, morning","Ages 6 to 16"],["Lisdexamfetamine dimesylate capsule","Vyvanse","Up to 12 h, peak at 3.5 h","Once daily, morning","Ages 6 to 17 and adults"]]],"p":[{"label":"Pattern","text":"Across Tables 11-1 to 11-4: durations range from ~4 to 16 hours, with options for rapid morning onset, evening dosing that works on waking (Jornay PM), and non-oral forms (patch, liquids, ODTs)."}]},{"t":"Slow-dose vs pulsatile stimulants","sec":"Stimulant Treatment of ADHD","fig":"Figs 11-33, 11-35, 11-36","c":[{"head":"Slow-dose (11-33)","body":["ER oral forms, transdermal methylphenidate, lisdexamfetamine","Slow onset, long duration, subsaturating occupancy","Enhance TONIC NE/DA at α2A and D1 in PFC","Too little DAT occupancy in nucleus accumbens for phasic D2 signalling","Less abuse potential"]},{"head":"Pulsatile (11-35)","body":["Oral immediate-release, intranasal, IV, smoked; also cocaine, methamphetamine","Rapid rise in NE and DA","Amplifies TONIC and PHASIC signalling","Phasic DA in nucleus accumbens → euphoria, abuse, addiction"]}]},{"t":"Optimizing stimulants: target NET too","sec":"Stimulant Treatment of ADHD","fig":"","b":["Occupy enough NETs in PFC, slowly and for long enough, to boost tonic NE (α2A) and tonic DA (D1).","Occupy relatively few DATs in the nucleus accumbens so phasic D2 signalling is not increased.","Ideal: slow onset, robust but subsaturating transporter blockade, long duration, then wear-off.","Result: improved ADHD symptoms, hours of relief, and no euphoria."],"p":[{"label":"Note","text":"Newer formulations may resist crushing for snorting, smoking, or injecting."}]},{"t":"Atomoxetine: a selective NRI","sec":"Noradrenergic Treatment of ADHD","fig":"Figs 11-37, 11-38","c":[{"head":"Prefrontal cortex","body":"NET clears both NE and DA there, so blocking NET raises BOTH NE and DA: α2A and D1 stimulated."},{"head":"Nucleus accumbens","body":"Few NE neurons and NETs: no rise in NE or DA, so no reinforcement, abuse, or addiction."}],"p":[{"label":"List","text":"Other NET inhibitors listed in Fig 11-38: reboxetine, bupropion, venlafaxine, duloxetine, desvenlafaxine, milnacipran, desipramine, nortriptyline."}]},{"t":"Atomoxetine in stressed, comorbid ADHD","sec":"Noradrenergic Treatment of ADHD","fig":"Fig 11-39","tb":[[["","Stimulants","Selective NRIs"],["Relief pattern","At the mercy of plasma levels and momentary occupancy","24-hour relief (like SSRIs/SNRIs)"],["Short-term effect size","Larger","Smaller, especially without comorbidity"],["Not necessarily inferior when","—","No prior stimulant, or long-term treatment (>8–11 weeks)"]]],"f":[["Stress + comorbidity: excessive phasic NE and DA in PFC","Slow-onset, continuous NET inhibition","Tonic α2A and D1 restored; phasic activity downregulated; receptors desensitized","ADHD, anxiety, depression, heavy drinking may improve"]]},{"t":"α-adrenergic receptors in the PFC","sec":"Noradrenergic Treatment of ADHD","fig":"","tb":[[["Receptor","Location","Role"],["α2A","High in cortex and locus coeruleus","Primary mediator of NE effects in PFC: attention, hyperactivity, impulsivity"],["α2B","High in thalamus","May mediate sedating actions of NE"],["α2C","Densest in striatum (also locus coeruleus)","Sedative and hypotensive actions"],["α1 (A, B, D)","Postsynaptic","Opposes α2; dominates when NE release is high (stress, comorbidity) → cognitive impairment"]]],"p":[{"label":"Key","text":"α2 receptors are dense in the PFC but sparse in the nucleus accumbens."}]},{"t":"Guanfacine vs clonidine","sec":"Noradrenergic Treatment of ADHD","fig":"Figs 11-40, 11-41, 11-42","tb":[[["","Guanfacine","Clonidine"],["Selectivity","α2A; 15–60× more selective than for α2B/α2C","Nonselective α2A, α2B, α2C; also imidazoline receptors"],["Sedation / hypotension","10× weaker than clonidine","More (imidazoline, α2B, α2C actions)"],["PFC enhancement","25× more potent than clonidine","Less"],["ADHD approval","Controlled-release (ER) only; also as augmentation to stimulants","Controlled-release only (IR approved for hypertension)"],["Off-label","Conduct disorder, ODD, Tourette syndrome","Conduct disorder, ODD, Tourette syndrome"]]]},{"t":"Who benefits from an α2A agonist?","sec":"Noradrenergic Treatment of ADHD","fig":"Figs 11-43, 11-44","tb":[[["Scenario","Hypothesized state","Treatment effect"],["ADHD from low NE only (11-43)","NE low (signal reduced); DA OK","α2A agonist alone raises the signal: sit still, behave, pay attention"],["ADHD + oppositional symptoms, untreated (11-44A)","NE very low, DA low in VMPFC","Tantrums, argumentative, disobedient, aggressive"],["Stimulant alone (11-44B)","DA optimized; NE still low","Partial improvement"],["Stimulant + α2A agonist (11-44C)","DA and NE optimized","Behaves and cooperates"]]],"p":[{"label":"Clinical link","text":"Guanfacine ER is approved to augment stimulants and may especially help oppositional symptoms."}]},{"t":"In development","sec":"Future Treatments for ADHD","fig":"Fig 11-45","c":[{"head":"Delivery technologies","body":"New amphetamine and methylphenidate formulations to customize duration; abuse-resistant matrices."},{"head":"Viloxazine ER (Fig 11-45)","body":"Selective NRI with 5HT2B and 5HT2C actions; once marketed abroad for depression; late-stage testing for ADHD."},{"head":"Mazindol","body":"DAT inhibitor once approved for appetite suppression; in testing."},{"head":"Centanafadine","body":"Triple (5HT–NE–DA) reuptake inhibitor; in testing."}]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Core symptoms","body":"Inattention, impulsivity, hyperactivity, linked to specific prefrontal circuits."},{"head":"NE/DA dysregulation","body":"Too little in some patients, too much (stress, comorbidity) in others."},{"head":"Development","body":"Delayed PFC maturation; onset by 12; often persists into adulthood."},{"head":"Stimulants","body":"Amplify tonic but not phasic NE/DA by controlling rate, degree, and duration of transporter occupancy."},{"head":"NRIs","body":"Atomoxetine: 24-hour relief; may suit adults with stress and comorbidity."},{"head":"α2A agonists","body":"Guanfacine ER, clonidine ER: strengthen PFC signal; augment stimulants."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Look for ADHD in adults","body":"Especially with mood, anxiety, and substance disorders; aim for full remission."},{"head":"Prefer slow-dose stimulants","body":"Sustained delivery boosts tonic signalling with less abuse potential."},{"head":"Match the daily curve","body":"Pick formulations for onset and duration; watch evening insomnia and rebound."},{"head":"Use non-stimulants wisely","body":"NRIs or α2A agonists for anxiety, substance abuse, tics, or stimulant failure."}]}],"cards":[{"id":"c11-1","q":"Match each ADHD symptom to its prefrontal region.","a":"Sustained attention: DLPFC; selective attention: dACC; impulsivity: OFC; hyperactivity: prefrontal motor cortex."},{"id":"c11-2","q":"What does the Stroop task measure?","a":"Selective attention (dACC): name the ink color, not the word."},{"id":"c11-3","q":"Rank dopamine receptor sensitivity.","a":"D3 most sensitive, then D2, then D1 least sensitive."},{"id":"c11-4","q":"Why does too much NE impair working memory?","a":"High NE recruits less sensitive α1 and β1 receptors."},{"id":"c11-5","q":"How do α2A and D1 differ at the dendritic spine?","a":"α2A: Gi, less cAMP, HCN closed, signal strengthened. D1: Gs, more cAMP, HCN open, signal weakened (noise reduced)."},{"id":"c11-6","q":"What genetic contribution does ADHD have?","a":"About 75%."},{"id":"c11-7","q":"How do ADHD symptoms change from preschool to adulthood?","a":"Hyperactivity/impulsivity early and decline by adolescence; inattention persists; comorbidities rise."},{"id":"c11-8","q":"In complex adults, what is often treated first?","a":"Substance abuse, then mood and anxiety disorders; ADHD and nicotine later."},{"id":"c11-9","q":"How does methylphenidate differ from amphetamine at DAT?","a":"Methylphenidate blocks allosterically and is not transported; amphetamine is a competitive pseudosubstrate that is transported."},{"id":"c11-10","q":"What happens at high (abuse) doses of amphetamine?","a":"VMAT2 inhibition, DA displacement, channel opening and DAT reversal: a DA flood and euphoria."},{"id":"c11-11","q":"What DAT occupancy threshold produces ADHD benefit?","a":"About 50–60%."},{"id":"c11-12","q":"Which formulation is dosed in the evening?","a":"Jornay PM (absorption delayed 10 h, peak at 14 h)."},{"id":"c11-13","q":"Why do slow-dose stimulants have less abuse potential?","a":"They boost tonic PFC signalling without enough accumbens DAT occupancy to boost phasic D2 signalling."},{"id":"c11-14","q":"Why does atomoxetine not cause abuse?","a":"Few NETs in the nucleus accumbens, so no rise in NE or DA there."},{"id":"c11-15","q":"Why is guanfacine preferred over clonidine for PFC effects?","a":"More α2A-selective, 25× more potent for PFC, 10× less sedation and hypotension."},{"id":"c11-16","q":"When might an α2A agonist be added to a stimulant?","a":"When NE remains low despite stimulant (e.g. oppositional symptoms); guanfacine ER is approved for augmentation."}],"glossary":[{"t":"DLPFC","m":"Dorsolateral prefrontal cortex"},{"t":"dACC","m":"Dorsal anterior cingulate cortex"},{"t":"OFC / VMPFC","m":"Orbitofrontal / ventromedial PFC"},{"t":"CSTC","m":"Cortico-striato-thalamo-cortical"},{"t":"NET / DAT","m":"NE / DA transporters"},{"t":"VMAT2","m":"Vesicular monoamine transporter 2"},{"t":"LC / VTA","m":"Locus coeruleus / ventral tegmental area"},{"t":"HCN","m":"Hyperpolarization-activated cyclic nucleotide-gated channel"},{"t":"Gi / Gs","m":"Inhibitory / stimulatory G protein"},{"t":"cAMP","m":"Cyclic adenosine monophosphate"},{"t":"IR / ER","m":"Immediate / extended release"},{"t":"ODT","m":"Orally disintegrating tablet"},{"t":"MPH","m":"Methylphenidate"},{"t":"NRI","m":"Norepinephrine reuptake inhibitor"},{"t":"NDRI","m":"NE–DA reuptake inhibitor"},{"t":"ODD","m":"Oppositional defiant disorder"},{"t":"TCA","m":"Tricyclic antidepressant"},{"t":"PFC","m":"Prefrontal cortex"}]},{"n":12,"title":"Dementia: Causes, Symptomatic Treatments, and Acetylcholine","short":"Dementia","notes":[{"t":"The big picture: a pivot to symptoms","sec":"","fig":"","c":[{"head":"Disease modification","body":"Decades of treatments targeting Aβ have not (yet) slowed, halted, or reversed Alzheimer disease."},{"head":"Symptomatic treatment","body":"Target neurotransmitters in the circuits behind each symptom: memory, psychosis, agitation, depression, apathy."}],"p":[{"label":"Why it matters","text":"As the number of people with dementia explodes, relieving psychosis and agitation matters more than ever for patients and caregivers."}]},{"t":"Table 12-1: All-cause dementia diagnosis","sec":"Dementia and Mild Cognitive Impairment","fig":"Table 12-1","tb":[[["All-cause dementia"],["Cognitive/neuropsychiatric symptoms that interfere with ability to perform usual activities"],["Decline from previous levels of functioning"],["Not attributable to delirium or a major psychiatric disorder"],["Cognitive impairment diagnosed through neuropsychological testing or patient informant"],["Cognitive impairment involves two of: impaired ability to acquire/retain new information; reasoning impairment; visuospatial impairment; changes in personality or behavior"]]],"p":[{"label":"Note","text":"Symptoms also include language and communication problems and behavioral symptoms such as psychosis and agitation."}]},{"t":"Mild cognitive impairment (MCI)","sec":"Dementia and Mild Cognitive Impairment","fig":"Fig 12-1","c":[{"head":"What MCI is","body":"Mild decline that does not significantly affect activities of daily living; often, but not always, a dementia precursor. Not dementia itself."},{"head":"Over time","body":"After 5 years about half meet dementia criteria; after 10 years or at autopsy, up to 80% prove to have AD."}],"x":["of people aged 65+ have MCI","of people with MCI develop AD within 3 years","of MCI patients convert to dementia each year"]},{"t":"Subjective memory complaints","sec":"Dementia and Mild Cognitive Impairment","fig":"","p":[{"label":"Definition","text":"Called MCI by many experts when there is no dementia, depression, anxiety, sleep/wake disorder, pain disorder, or ADHD. Biomarkers are being developed to separate normal aging, reversible causes (e.g. depression), and early dementia."}],"x":["Over half of community-dwelling elderly report less ability than 5–10 years ago to:","Find the right word","Remember where objects are"]},{"t":"Table 12-2: Differential diagnosis, clinical presentation","sec":"Four Major Causes of Dementia","fig":"Table 12-2","tb":[[["Condition","Clinical presentation"],["Mild cognitive impairment","Reduced speed of mental processing and choice reaction times; benign forgetfulness that is mild, inconsistent, and not associated with functional impairment"],["Alzheimer disease","Short-term memory loss; impaired executive function; difficulty with activities of daily living; time and spatial disorientation; language impairment, personality changes"],["Vascular dementia","Impaired abstraction, mental flexibility, processing speed, working memory; verbal memory better preserved; slower cognitive decline; dementia within several months of a stroke"],["Lewy body dementias","Visual hallucinations; spontaneous parkinsonism; cognitive fluctuations; worse visuospatial, attention, executive deficits; memory less severe; earlier psychosis and personality changes; REM sleep disturbances"],["Frontotemporal degeneration","Progressive behavioral and personality changes that impair social conduct (apathy, disinhibition, etc.); language impairment; possibly preserved episodic memory"]]]},{"t":"Table 12-3: Differential diagnosis, neural imaging","sec":"Four Major Causes of Dementia","fig":"Table 12-3","tb":[[["","MRI","FDG PET (hypometabolism)"],["Alzheimer disease","Medial temporal lobe atrophy","Temporo-parietal cortices"],["Vascular dementia","Medial temporal lobe atrophy; white matter abnormalities","Fronto-subcortical networks"],["Lewy body dementias","Medial temporal lobe atrophy","Parieto-occipital and temporo-parietal cortices"],["Frontotemporal degeneration","Medial temporal lobe atrophy","Frontotemporal cortices"]]],"p":[{"label":"Pattern","text":"MRI looks similar across causes; FDG PET patterns differ."}]},{"t":"Alzheimer disease: the most common cause","sec":"Four Major Causes of Dementia","fig":"Figs 12-2 to 12-5","c":[{"head":"Three pathological hallmarks","body":["Aβ aggregated into plaques","Neurofibrillary tangles of hyperphosphorylated tau","Substantial neuronal loss (visible to the naked eye)"]},{"head":"Seen in living patients","body":["FDG PET: posterior (temporo-parietal) hypometabolism","MRI in mild AD: 20–30% entorhinal and 15–25% hippocampal volume loss; ventricular enlargement"]}],"x":["people worldwide with dementia","Americans with AD today","projected by 2050 without disease-modifying treatment"]},{"t":"Vascular dementia","sec":"Four Major Causes of Dementia","fig":"Figs 12-6, 12-7","c":[{"head":"Imaging","body":"FDG PET: sensorimotor and subcortical hypometabolism, relative sparing of association cortex. MRI: worsening white-matter hyperintensities."},{"head":"AD–vascular loop (12-7)","body":"Aβ in blood vessels raises vascular dementia risk; a leaky blood–brain barrier raises Aβ production or lowers its clearance."}],"x":["of dementia cases: second most common","of elderly stroke patients develop post-stroke cognitive impairment or dementia","with AD is frequent"]},{"t":"Lewy body dementias","sec":"Four Major Causes of Dementia","fig":"Figs 12-8, 12-9","c":[{"head":"α-synuclein","body":"Aggregates into oligomers, then Lewy bodies and Lewy neurites, as neurons degenerate."},{"head":"Parkinson’s disease dementia","body":"On average 10 years after PD diagnosis; death on average 4 years after onset. Degeneration in thalamus, caudate, hippocampus."}],"x":["of dementia cases are Lewy body dementias","of LBD also has other dementia pathology (especially AD)","of Parkinson’s patients develop cognitive dysfunction"]},{"t":"Table 12-4: Dementia with Lewy bodies, diagnosis","sec":"Four Major Causes of Dementia","fig":"Table 12-4","tb":[[["Core features","Suggestive features"],["Fluctuating attention and concentration","REM sleep behavior disorder"],["Recurrent well-formed visual hallucinations","Severe neuroleptic sensitivity"],["Spontaneous parkinsonism","Low dopamine transporter uptake in basal ganglia (SPECT or PET)"]],[["Supportive features","Make DLB less likely"],["Repeated falls; syncope; transient loss of consciousness","Cerebrovascular disease"],["Hallucinations in other senses; delusions","Other illness or brain disorder that could explain the picture"],["Severe autonomic dysfunction; depression","Parkinsonism first appearing at severe dementia"]]]},{"t":"DLB vs PDD, and the AD–PD spectrum","sec":"Four Major Causes of Dementia","fig":"Figs 12-10, 12-11","tb":[[["Timing (the “1-year rule”)","Diagnosis"],["Motor symptoms precede dementia by ≥1 year","Parkinson’s disease dementia"],["Dementia at the same time as, or before, parkinsonism","Dementia with Lewy bodies"]]],"x":["of AD patients eventually show parkinsonian symptoms","of AD brains have Lewy bodies","of PD patients develop dementia, often with AD pathology"]},{"t":"Frontotemporal dementia","sec":"Four Major Causes of Dementia","fig":"Figs 12-12, 12-13; Table 12-5","c":[{"head":"Four subtypes (12-12)","body":"bvFTD (most common) + three primary progressive aphasias: semantic, non-fluent, logopenic."},{"head":"Epidemiology","body":"About as common as LBD: 3–26% prevalence at 65+; onset typically 50–65. Patients often unaware of behavior."}],"tb":[[["Table 12-5: bvFTD","Features"],["Clinical presentation","Progressive personality changes (disinhibition, apathy, loss of sympathy/empathy); hyperorality; perseverative/compulsive behaviors; cognitive deficits; cued memory and visuospatial abilities spared"],["Pathological presentation","Atrophy in prefrontal cortex, insula, anterior cingulate, striatum, thalamus; non-dominant hemisphere more affected"]]]},{"t":"Mixed dementia is the rule","sec":"Four Major Causes of Dementia","fig":"Fig 12-14","p":[{"label":"Key","text":"Dementia with a single pathology is the exception: most patients have combinations of abnormal protein aggregates plus vascular changes."}],"x":["of community dementia patients had multiple pathologies","likelier to develop dementia with multiple vs single pathology","of AD neuropathology cases also had Lewy body or vascular injury"]},{"t":"The amyloid cascade hypothesis","sec":"Pursuing Disease Modification by Targeting Aβ","fig":"Fig 12-15","f":[["↑ production / ↓ breakdown of Aβ","Plaque formation","Tau hyperphosphorylation; tangles","Synaptic dysfunction; neuron loss","Memory loss, cognitive deficits"]],"p":[{"label":"Key","text":"Corollary: block the cascade early and AD would be prevented, halted, or reversed. Intervening once memory loss is obvious may be too late."}]},{"t":"Processing amyloid precursor protein","sec":"Pursuing Disease Modification by Targeting Aβ","fig":"Figs 12-16, 12-17","c":[{"head":"Non-amyloidogenic","body":"α-secretase cuts APP within the Aβ sequence: no Aβ is made."},{"head":"Amyloidogenic","body":"β-secretase then γ-secretase cut APP into Aβ peptides 38–43 amino acids long."}],"tb":[[["Isoform","Frequency","Aggregation"],["Aβ40","Most common","Less prone"],["Aβ42","Less common","More prone; considered more toxic"],["Aβ43","Rare","Most prone"]]]},{"t":"APOE: the strongest genetic influence","sec":"Pursuing Disease Modification by Targeting Aβ","fig":"Fig 12-18","p":[{"label":"Alleles","text":"APOE2 appears protective; APOE3, the most common form, carries intermediate risk. In Fig 12-18 the population breakdown is shown as 77%, 15%, and 8% for the three alleles."}],"x":["AD risk with one APOE4 copy","AD risk with two APOE4 copies","carry APOE4: general population vs AD"]},{"t":"Table 12-6: Potential disease-modifying treatments","sec":"Pursuing Disease Modification by Targeting Aβ","fig":"Table 12-6","tb":[[["Agents targeting Aβ pathology","Agents targeting tau pathology"],["Anti-amyloid antibodies","Anti-tau antibodies"],["Active Aβ immunization","Active tau immunization"],["β-secretase inhibitors","Tau aggregation inhibitors"],["γ-secretase inhibitors","Microtubule stabilizers"],["α-secretase promoters","Tau phosphorylation inhibitors"],["Aβ aggregation inhibitors",""]]],"p":[{"label":"Status","text":"None has yet shown therapeutic benefit in AD."}]},{"t":"Is Aβ the cause, or a tombstone?","sec":"Pursuing Disease Modification by Targeting Aβ","fig":"","c":[{"head":"Skeptics: the “tombstone”","body":"Aβ may be an epiphenomenon, a marker of neuronal death rather than its cause. Removing tombstones won’t stop people dying."},{"head":"Proponents: “too late”","body":"Trials enrolled patients with MCI or AD, when oxidative stress, inflammation, tangles, and synaptic damage are already self-perpetuating. Treat earlier."}],"p":[{"label":"Consequence","text":"Hence the push to diagnose AD in its presymptomatic stage."}]},{"t":"Three stages of Alzheimer disease","sec":"Diagnosing Alzheimer Disease Before It Is Too Late","fig":"Fig 12-19","tb":[[["Stage","Clinical picture","Biomarkers"],["1: Presymptomatic (asymptomatic amyloidosis)","Cognition intact","Positive amyloid PET; low CSF Aβ (deposited in brain)"],["2: MCI (prodromal / “MCI due to AD”)","Episodic memory deficits; no dementia","Neurodegeneration: ↑ CSF tau, FDG PET hypometabolism, MRI atrophy, neurofilament light (NfL)"],["3: Dementia","Cognitive deficits can be severe","Heavy Aβ deposition in almost 100% of probable AD"]]],"p":[{"label":"Key","text":"Neurodegeneration, not amyloidosis, is thought to drive progression from stage 1 to 2 and from 2 to 3."}]},{"t":"Amyloid in the brain: not destiny","sec":"Diagnosing Alzheimer Disease Before It Is Too Late","fig":"Figs 12-20, 12-21","c":[{"head":"Amyloid PET across stages (12-20)","body":["A: most normal controls: no Aβ","B: ~¼ of normal elderly: Aβ positive (presymptomatic AD)","C: about half of MCI: no Aβ (another cause)","D, E: the other half of MCI: moderate to severe Aβ","F: AD dementia: heavy Aβ"]}],"tb":[[["Age","% with brain Aβ"],["50–60","\u003c5%"],["60–70","10%"],["70–80","25%"],["80–90",">50%"]]]},{"t":"Tau and progression from MCI","sec":"Diagnosing Alzheimer Disease Before It Is Too Late","fig":"Fig 12-22","c":[{"head":"Aβ-positive MCI","body":["About half progress to dementia within a year","About 80% may progress within 3 years","Probable AD needs all-cause dementia criteria, insidious onset, clear worsening, amnestic or non-amnestic presentation"]}],"f":[["Normal tau binds and stabilizes microtubules for vesicle transport","Hyperphosphorylated tau detaches: microtubules destabilize, synapses fail","Paired helical filaments aggregate into neurofibrillary tangles"]]},{"t":"Three treatable symptom networks","sec":"Symptomatic Treatment and the Acetylcholine Network","fig":"Fig 12-23","tb":[[["Network","Nodes targeted","Drugs"],["Memory (12-23A)","Acetylcholine; glutamate","Acetylcholinesterase inhibitors; NMDA antagonist memantine"],["Psychosis (12-23B)","Serotonin (and dopamine)","5HT2A antagonist pimavanserin (approved for Parkinson’s disease psychosis)"],["Agitation (12-23C)","Norepinephrine, serotonin, dopamine, glutamate","Brexpiprazole; dextromethorphan–bupropion (in testing)"]]],"p":[{"label":"Principle","text":"Same idea as throughout the book: a symptom maps to a malfunctioning circuit, so the same symptom can appear in many disorders."}]},{"t":"Acetylcholine synthesis and breakdown","sec":"Symptomatic Treatment and the Acetylcholine Network","fig":"Figs 12-24, 12-25","tb":[[["","AChE","BuChE (“pseudocholinesterase”)"],["Main brain location","Neurons receiving ACh input (key synaptic enzyme)","Glia; possibly some neurons and plaques"],["Outside brain","Gut, skeletal muscle, red cells, lymphocytes, platelets","Gut, plasma, skeletal muscle, placenta, liver"]]],"f":[["Choline (diet, intraneuronal) + AcCoA (from glucose)","ChAT → acetylcholine","VAChT → vesicle","Released; AChE/BuChE → choline","Choline transporter → recycled"]]},{"t":"Muscarinic receptors","sec":"Symptomatic Treatment and the Acetylcholine Network","fig":"Figs 12-26, 12-27","tb":[[["Subtype","Location / action","Key role in Ch. 12"],["M1","Postsynaptic, stimulatory","Memory in hippocampus and neocortex; may facilitate DA release"],["M3, M5","Postsynaptic, stimulatory","—"],["M2","Presynaptic autoreceptor, inhibitory; heteroreceptor on GABA/glutamate","Stops further ACh (or GABA/glutamate) release"],["M4","Presynaptic autoreceptor; also postsynaptic in some areas","Inhibits VTA dopamine release: reduces psychosis"]]],"p":[{"label":"Horizon","text":"M4/M1 agonist xanomeline (Chapter 5) could theoretically reduce psychosis and cognitive symptoms in AD too."}]},{"t":"Nicotinic receptors and pathways","sec":"Symptomatic Treatment and the Acetylcholine Network","fig":"Figs 12-28 to 12-32","c":[{"head":"Cholinergic pathways","body":["Brainstem → PFC, basal forebrain, thalamus, hypothalamus, amygdala, hippocampus (12-31)","Basal forebrain → PFC, amygdala, hippocampus: especially important for memory (12-32)"]}],"tb":[[["Nicotinic subtype","Role"],["α4β2","Postsynaptic; regulates DA release in nucleus accumbens; main target of nicotine"],["α7 (postsynaptic)","Cognition in prefrontal cortex"],["α7 (presynaptic)","Feed-forward ACh release; on DA/glutamate neurons facilitates their release"],["Allosteric modulation","PAMs increase channel opening (galantamine is one)"]]]},{"t":"Why cholinesterase inhibitors work, then fade","sec":"Symptomatic Treatment and the Acetylcholine Network","fig":"Figs 12-33A–D","f":[["A: normal basal forebrain cholinergic input to cortex and hippocampus","B: early loss of nucleus basalis neurons; postsynaptic targets remain → memory loss","C: AChE inhibitor raises ACh at remaining targets → some function restored","D: later, cortical and hippocampal neurons die; targets lost → drug loses effect"]]},{"t":"Three cholinesterase inhibitors","sec":"Memory Drugs: Cholinesterase Inhibitors and Memantine","fig":"Figs 12-34, 12-35, 12-36","tb":[[["","Donepezil","Rivastigmine","Galantamine"],["Enzymes","AChE only","AChE and BuChE","AChE"],["Binding","Reversible, long-acting","“Pseudoirreversible” (reverses over hours), intermediate","Plus nicotinic PAM (second mechanism)"],["Special features","Easy dosing","Possibly selective for cortex/hippocampus AChE; BuChE in glia may matter more with gliosis","PAM benefit not clinically proven"],["Side effects","Mostly GI, transient","More GI orally; transdermal patch greatly reduces them","GI (peripheral ACh)"]]]},{"t":"Glutamate in Alzheimer disease","sec":"Memory Drugs: Cholinesterase Inhibitors and Memantine","fig":"Figs 12-37A–C","f":[["A: rest: NMDA channel blocked by Mg²⁺","B: normal transmission: glutamate + glycine + depolarization → Ca²⁺ in → LTP, learning","C: AD: steady glutamate “leak” → memory problems; later free radicals, dendrite and neuron death"]],"p":[{"label":"Key","text":"Excitotoxicity links glutamate to both symptoms and progression."}]},{"t":"Memantine: “artificial magnesium”","sec":"Memory Drugs: Cholinesterase Inhibitors and Memantine","fig":"Figs 12-37D, 12-37E, 12-38","c":[{"head":"Mechanism","body":["Uncompetitive, open-channel NMDA antagonist","Low-to-moderate affinity; voltage dependent","Fast block and unblock at the Mg²⁺ site"]},{"head":"Why it works","body":["Blocks tonic excitotoxic glutamate: new resting state","Phasic bursts displace it: normal learning continues","No PCP/ketamine-like psychotomimetic effects"]}],"p":[{"label":"Analogy","text":"Stronger than Mg²⁺ (which excitotoxic glutamate overwhelms) but weaker than PCP or ketamine: “having your cake and eating it, too.”"}]},{"t":"Table 12-7: Prevalence of behavioral symptoms (BPSD)","sec":"Behavioral Symptoms of Dementia","fig":"Table 12-7; Fig 12-39"},{"t":"Agitation vs psychosis: define them separately","sec":"Behavioral Symptoms of Dementia","fig":"","c":[{"head":"Agitation (IPA definition)","body":["Cognitive impairment or dementia syndrome","Behavior consistent with emotional distress","Excessive motor activity, verbal or physical aggression","Causes excess disability; not solely due to another disorder"]},{"head":"Dementia-related psychosis","body":["Delusions or hallucinations after onset of cognitive decline","Persist at least one month","Not better explained by delirium or another mental illness"]}],"p":[{"label":"Caution","text":"Intrusive hallucinations or paranoid delusions can themselves trigger agitation."}]},{"t":"Table 12-8: Assessing agitation (CMAI)","sec":"Behavioral Symptoms of Dementia","fig":"Table 12-8","tb":[[["Physical / aggressive","Physical / non-aggressive"],["Hitting, kicking, grabbing, pushing","Pacing, aimless wandering"],["Throwing things, biting, scratching, spitting","Inappropriate dress/disrobing; trying to get to a different place"],["Hurting self or others; destroying property","Intentional falling; eating/drinking inappropriate substances"],["Making physical sexual advances","Handling things inappropriately; hiding, hoarding things"],["","Repetitive mannerisms; general restlessness"]],[["Verbal / aggressive","Verbal / non-aggressive"],["Screaming","Repetitive sentences or questions; strange noises"],["Making verbal sexual advances","Complaining; negativism"],["Cursing or verbal aggression","Constant unwarranted request for attention"]]]},{"t":"Table 12-9: Non-pharmacological options","sec":"Behavioral Symptoms of Dementia","fig":"Table 12-9","tb":[[["Options (1)","Options (2)"],["Address unmet needs (hunger, pain, thirst, boredom)","Outlets for pent-up energy (exercise, activities)"],["Identify/modify environmental stressors","Avoid behavior triggers"],["Identify/modify daily routine stressors","Increase social engagement"],["Caregiver support/training","Relaxation techniques"],["Behavior modification","Reminiscence therapy"],["Group/individual therapy","Music therapy"],["Problem solving","Aromatherapy"],["Distraction","Pet therapy"]]],"p":[{"label":"First","text":"First manage reversible precipitants: pain, nicotine withdrawal, drug side effects, undiagnosed illness, over- or under-stimulating settings."}]},{"t":"The D2-blocker dilemma","sec":"Behavioral Symptoms of Dementia","fig":"","c":[{"head":"Why controversial","body":["“Chemical straitjacket” over-tranquilization","Black-box warning: stroke and death","Risks: stroke, thromboembolism, falls, QT prolongation, pneumonia (aspiration when sedated)"]},{"head":"Why sometimes used","body":["Non-treatment risks: early institutionalization, danger to self and others","Cautious off-label use after weighing risks: risperidone, olanzapine, aripiprazole, haloperidol (not quetiapine)"]}],"p":[{"label":"Result","text":"This dilemma drives the search for safer, network-specific drugs."}]},{"t":"Table 12-10: Psychosis prevalence (%) by dementia","sec":"Dementia-Related Psychosis","fig":"Table 12-10","tb":[[["","Alzheimer","Vascular","Lewy bodies","Parkinson’s dementia","Frontotemporal"],["Overall psychosis","30","15","75","50","10"],["Delusions","10–39","14–27","40–57","28–50","2.3–6"],["Hallucinations","11–17","5–14","55–78","32–63","1.2–13"]]],"p":[{"label":"Clinical link","text":"Psychosis is linked to greater caregiver burden, faster progression to severe dementia, institutionalization, and death. It is more frequent in advanced dementia."}]},{"t":"Psychosis looks different by dementia type","sec":"Dementia-Related Psychosis","fig":"Figs 12-40, 12-41","c":[{"head":"Alzheimer disease","body":"Delusions more common (especially persecutory and misidentification)."},{"head":"Lewy body dementias","body":"Hallucinations more common (especially visual)."}],"tb":[[["Parkinson’s disease psychosis (Fig 12-41)",""],["Hallucinations only / both / delusions only","~85% / 7.5% / 7.5%"],["Hallucination types","Visual 62.5%; auditory 45%; tactile 22.5%; olfactory 2.5%; minor 45%"],["PDD vs PD without dementia","Hallucinations 50–70% vs 10%"]]]},{"t":"The psychosis network and pimavanserin","sec":"Dementia-Related Psychosis","fig":"Figs 12-42A, B, C","f":[["Plaques, tangles, Lewy bodies, strokes destroy GABA interneurons","Unopposed 5HT2A excitation → glutamate hyperactivity","Visual cortex → visual hallucinations; VTA → DA → delusions, auditory hallucinations"],["Pimavanserin blocks 5HT2A on PFC glutamate neurons","Compensates for lost GABA inhibition","Normalized glutamate → fewer hallucinations and delusions"]],"p":[{"label":"Status","text":"Pimavanserin: approved for Parkinson’s disease psychosis; positive trials in all-cause dementia-related psychosis."}]},{"t":"Top-down brakes vs bottom-up drives","sec":"Agitation in Alzheimer Disease","fig":"Figs 12-43, 12-44","c":[{"head":"A: balanced","body":"Top-down cortical brake and bottom-up limbic drive in balance"},{"head":"B: normal","body":"Cortical brake inhibits impulsive limbic drive"},{"head":"C: AD","body":"Neurodegeneration removes the brake: limbic drive unchecked → agitation"}],"p":[{"label":"Key","text":"Sensory, emotional, and motor cortex tend to survive, while top-down inhibitory neurons degenerate: the capacity to act out remains, the capacity to inhibit does not."}]},{"t":"How the thalamic filter fails","sec":"Agitation in Alzheimer Disease","fig":"Figs 12-45A, B; 12-46A, B","c":[{"head":"Motor output (12-45)","body":["Normal: cortex → striatum → thalamic GABA filters sensory input","AD: plaques/tangles destroy cortical glutamate neurons","Thalamus unfiltered → cortex and amygdala","Reflexive, thoughtless motor agitation"]},{"head":"Emotional output (12-46)","body":["Unfiltered emotional input sets off the amygdala","Amygdala → VTA: DA release worsens the filter","Amygdala → locus coeruleus: NE release to cortex","Amygdala → cortex: emotional, affective agitation"]}]},{"t":"Current off-label options for agitation","sec":"Agitation in Alzheimer Disease","fig":"","tb":[[["Line","Options per Ch. 12","Not recommended"],["First line (many experts)","SSRIs, SNRIs","—"],["Second line (to avoid D2 blockers)","β blockers, carbamazepine, perhaps gabapentin and pregabalin","Valproate, topiramate, oxcarbazepine, benzodiazepines"]]],"p":[{"label":"Clinical link","text":"Many of these lack robust efficacy and cause sedation, unsteady gait, diarrhea, or weakness. Treat pain first: even acetaminophen can reduce agitation."}]},{"t":"Brexpiprazole: five actions against agitation","sec":"Agitation in Alzheimer Disease","fig":"Fig 12-47","c":[{"head":"Noradrenergic","body":"Blocking NE at α1 and α2C on pyramidal dendrites reduces arousal and emotional responses."},{"head":"Serotonergic and dopaminergic","body":"Less 5HT2A excitation, more 5HT1A inhibition; less VTA DA improves thalamic filtering."}],"x":["D2 partial agonism","5HT1A partial agonism"]},{"t":"Dextromethorphan–bupropion for agitation","sec":"Agitation in Alzheimer Disease","fig":"Fig 12-48","f":[["Bupropion inhibits CYP2D6 (and is an NDRI)","Dextromethorphan levels sustained: stronger NMDA block than memantine","NMDA blocked in cortex, thalamus, amygdala, VTA, locus coeruleus","Less motor and emotional agitation"]],"p":[{"label":"Status","text":"Dextromethorphan with quinidine is approved for pseudobulbar affect; dextromethorphan combinations are in late-stage testing for MDD, treatment-resistant depression, and AD agitation."}]},{"t":"Depression and dementia","sec":"Depression, Pseudobulbar Affect, and Apathy","fig":"Figs 12-49, 12-50","c":[{"head":"Possible links (12-49)","body":"Risk factor; prodrome; shared risk factors/neurobiology; cognitive impairment as a feature of depression; depression as a reaction to decline."},{"head":"Why treatment is hard (12-50)","body":"Drug targets (circuits) may have degenerated; psychosocial approaches are harder with cognitive impairment."}],"x":["dementia risk with a history of MDD (especially vascular)","of people with dementia have depressive symptoms","MDD in later life may be prodromal AD"]},{"t":"Drug options for depression in dementia","sec":"Depression, Pseudobulbar Affect, and Apathy","fig":"","tb":[[["Agent","Notes from Ch. 12"],["SSRIs (sertraline, citalopram, escitalopram, fluoxetine)","Some limited efficacy; may help agitation; citalopram prolongs QT (escitalopram may not); risk of falls, osteoporosis, interactions; may worsen PD symptoms (RLS, limb movements, REM behavior disorder)"],["Trazodone","Sedating; short half-life (6–8 h) so low night doses help sleep without daytime effects; may help behavior in FTD more than AD"],["Vortioxetine, duloxetine","Pro-cognitive in depression (processing speed), not yet shown in dementia"]]],"p":[{"label":"Clinical link","text":"Use the lowest effective dose and monitor continuously."}]},{"t":"Pseudobulbar affect (PBA)","sec":"Depression, Pseudobulbar Affect, and Apathy","fig":"","c":[{"head":"What it is","body":"Uncontrolled crying or laughing, disproportionate or inappropriate to context: a disorder of affect expression, often mistaken for a mood disorder."},{"head":"Where and how to treat","body":"In AD and other dementias, MS, ALS, traumatic brain injury. Dextromethorphan–quinidine (NMDA and σ actions); SSRIs off-label."}]},{"t":"Apathy: the ABC model","sec":"Depression, Pseudobulbar Affect, and Apathy","fig":"Fig 12-51","tb":[[["Type","Region","Features"],["Affective (emotional)","VMPFC, OFC","Can’t use emotional context to guide behavior; emotional blunting; altered social interactions"],["Behavioral","Motor areas, DMPFC","Deficits initiating and maintaining movement"],["Cognitive","DLPFC","Lost motivation for goal-directed behavior; lost interest; trouble planning and executing"]]],"p":[{"label":"Treatment","text":"Options (none approved or robust): cholinesterase inhibitors first in AD (maybe better for prevention); DA agents (bupropion, levodopa, stimulants); SSRIs/SNRIs may suit FTD. Affective apathy is more common in bvFTD."}]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Four causes","body":"Alzheimer, vascular, Lewy body, frontotemporal; mixed pathology is common."},{"head":"Amyloid cascade","body":"Leading theory, but Aβ-targeting drugs have failed so far."},{"head":"Three AD stages","body":"Presymptomatic amyloidosis, MCI, dementia; biomarkers enable earlier diagnosis."},{"head":"Memory","body":"Cholinesterase inhibitors (cholinergic hypothesis) and memantine (glutamate hypothesis)."},{"head":"Psychosis","body":"Pimavanserin (5HT2A antagonist) for dementia-related psychosis."},{"head":"Agitation","body":"Brexpiprazole and dextromethorphan–bupropion in late-stage testing."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Look for reversible causes","body":"Depression, sleep disorders, pain, drugs, and illness can mimic or worsen cognitive and behavioral symptoms."},{"head":"Separate psychosis from agitation","body":"Different networks, different treatments; some patients need both."},{"head":"Non-drug care first","body":"Address unmet needs, triggers, caregiver support; treat pain (acetaminophen can help)."},{"head":"Respect the black box","body":"Weigh stroke and death risk before any off-label D2 blocker."}]}],"cards":[{"id":"c12-1","q":"List the Table 12-1 criteria for all-cause dementia.","a":"Interferes with usual activities; decline from before; not delirium/major psychiatric disorder; tested impairment; ≥2 cognitive/behavioral domains."},{"id":"c12-2","q":"What proportion of MCI converts to AD within 3 years?","a":"About 35%."},{"id":"c12-3","q":"Name the three pathological hallmarks of AD.","a":"Aβ plaques, tau neurofibrillary tangles, neuronal loss."},{"id":"c12-4","q":"How does FDG PET differ between AD and vascular dementia?","a":"AD: temporo-parietal hypometabolism. Vascular: sensorimotor/subcortical, association cortex spared."},{"id":"c12-5","q":"What is the 1-year rule for DLB vs PDD?","a":"Motor symptoms ≥1 year before dementia = PDD; otherwise DLB."},{"id":"c12-6","q":"Which Aβ isoform is most toxic, and which rarest?","a":"Aβ42 is considered most toxic; Aβ43 is rare and most prone to aggregate."},{"id":"c12-7","q":"How much does APOE4 raise AD risk?","a":"3× with one copy; 10× with two."},{"id":"c12-8","q":"What biomarkers mark stage 2 AD?","a":"Raised CSF tau, FDG PET hypometabolism, MRI atrophy, neurofilament light."},{"id":"c12-9","q":"Contrast AChE and BuChE.","a":"AChE: key synaptic enzyme in neurons. BuChE: mainly glia, plasma, liver."},{"id":"c12-10","q":"Why do cholinesterase inhibitors lose effect over time?","a":"Postsynaptic neurons and receptor targets die as AD progresses."},{"id":"c12-11","q":"What makes rivastigmine and galantamine distinctive?","a":"Rivastigmine: also BuChE, patch reduces GI effects. Galantamine: nicotinic PAM."},{"id":"c12-12","q":"Why is memantine called “artificial magnesium”?","a":"Low-affinity open-channel NMDA block at the Mg²⁺ site, displaced by normal glutamate bursts."},{"id":"c12-13","q":"Which dementia has the highest psychosis prevalence?","a":"Dementia with Lewy bodies (~75%)."},{"id":"c12-14","q":"How does pimavanserin treat dementia-related psychosis?","a":"Blocks 5HT2A on glutamate neurons, compensating for lost GABA inhibition, normalizing glutamate and DA."},{"id":"c12-15","q":"Name brexpiprazole’s five actions against agitation.","a":"D2 and 5HT1A partial agonism; 5HT2A, α1, and α2 antagonism."},{"id":"c12-16","q":"How does apathy differ from depression?","a":"Lack of motivation without guilt, worthlessness, or hopelessness."}],"glossary":[{"t":"MCI","m":"Mild cognitive impairment"},{"t":"AD","m":"Alzheimer disease"},{"t":"LBD / DLB","m":"Lewy body dementias / dementia with Lewy bodies"},{"t":"PDD","m":"Parkinson’s disease dementia"},{"t":"FTD / bvFTD","m":"(Behavioral variant) frontotemporal dementia"},{"t":"PPA","m":"Primary progressive aphasia"},{"t":"APP","m":"Amyloid precursor protein"},{"t":"NFT","m":"Neurofibrillary tangle"},{"t":"MAPT","m":"Microtubule-associated protein tau"},{"t":"APOE","m":"Apolipoprotein E gene"},{"t":"FDG PET","m":"Fluorodeoxyglucose positron emission tomography"},{"t":"NfL","m":"Neurofilament light"},{"t":"ChAT","m":"Choline acetyltransferase"},{"t":"AChE / BuChE","m":"Acetyl- / butyrylcholinesterase"},{"t":"VAChT","m":"Vesicular acetylcholine transporter"},{"t":"PAM","m":"Positive allosteric modulator"},{"t":"BPSD","m":"Behavioral and psychological symptoms of dementia"},{"t":"CMAI","m":"Cohen–Mansfield Agitation Inventory"},{"t":"PBA","m":"Pseudobulbar affect"},{"t":"DXM","m":"Dextromethorphan"}]},{"n":13,"title":"Impulsivity, Compulsivity, and Addiction","short":"Addiction & compulsivity","notes":[{"t":"Impulsivity vs compulsivity","sec":"What Are Impulsivity and Compulsivity?","fig":"","c":[{"head":"Impulsivity","body":["Rapid, unplanned reactions with little regard for consequences","Inability to STOP INITIATING actions","Prefers immediate over better delayed reward","Failure of motor inhibition; risky choices"]},{"head":"Compulsivity","body":["Repetitive, impairing behavior with no adaptive function","Inability to TERMINATE ongoing actions","Persists despite undesirable consequences","Cannot adapt after negative feedback"]}],"p":[{"label":"Key","text":"Both are symptoms that cut across many psychiatric disorders."}]},{"t":"Habits and the Pavlovian addict","sec":"What Are Impulsivity and Compulsivity?","fig":"","c":[{"head":"Goal-directed behavior","body":"Driven by knowledge of, and desire for, its consequences. Cognitively demanding."},{"head":"Habits (a type of compulsion)","body":"Stimulus–response associations stamped in by repetition; triggered automatically; insensitive to outcomes."}],"p":[{"label":"Addiction as habit","text":"Drug seeking and taking become conditioned responses to people, places, items, craving, and withdrawal, like Pavlov’s dog salivating at the bell. Addiction is “almost as though one has learned how to have a psychiatric disorder.”"}]},{"t":"Table 13-1: Impulsive–compulsive disorders","sec":"What Are Impulsivity and Compulsivity?","fig":"Table 13-1","tb":[[["Substance addictions","Behavioral addictions","OC-related disorders","Impulse control disorders"],["Cannabis, nicotine, alcohol, opioids, stimulants, hallucinogens, empathogens, dissociatives","Binge eating disorder; gambling disorder; internet gaming disorder","OCD; body dysmorphic disorder; trichotillomania; skin picking; hoarding; shopping; hypochondriasis; somatization","Agitation in AD; ADHD impulsivity; provocative behaviors in mania; DMDD; pyromania; kleptomania; paraphilias; hypersexual disorder; autism spectrum; Tourette/tics; stereotyped movements; borderline PD; self-harm; conduct disorder; antisocial PD; ODD; intermittent explosive disorder; aggression and violence (impulsive, psychotic, psychopathic)"]]]},{"t":"Two parallel cortico-striatal loops","sec":"Neurocircuitry of Impulsive–Compulsive Disorders","fig":"Figs 13-1, 13-2","tb":[[["","Impulsivity and reward (13-1)","Compulsivity and motor response inhibition (13-2)"],["Striatal driver","Ventral striatum","Dorsal striatum"],["Loop","Ventral striatum → thalamus → VMPFC and ACC → back","Dorsal striatum → thalamus → OFC → back"],["Top-down brake","Prefrontal cortex","OFC"],["Learning system","Action–outcome (ventral)","Habit (dorsal)"],["When brake fails","Impulsive behavior","Compulsive behavior"]]],"p":[{"label":"Key","text":"Too much bottom-up drive, or too little top-down inhibition."}]},{"t":"From impulse to compulsion: ventral to dorsal","sec":"Neurocircuitry of Impulsive–Compulsive Disorders","fig":"Fig 13-3","c":[{"head":"More impulsive (13-3)","body":"Mania, ADHD, impulsive violence, intermittent explosive disorder, kleptomania, borderline PD, antisocial behavior, pyromania"},{"head":"More compulsive (13-3)","body":"OCD, trichotillomania, skin picking, body dysmorphic disorder, hypochondriasis, somatization, compulsive shopping, Tourette, paraphilias; drug addiction, gambling, binge eating span both"}],"f":[["Impulsive act driven by reward (ventral loop)","Repetition; neuroadaptation and neuroplasticity","Control migrates to the dorsal habit system","Compulsive, habitual behavior"]]},{"t":"Why it matters for treatment","sec":"Neurocircuitry of Impulsive–Compulsive Disorders","fig":"","c":[{"head":"Different causes of lost brakes","body":["Alzheimer agitation: degeneration of top-down control","ADHD: delayed or absent top-down control","Others: problems at striatal or prefrontal nodes of either loop"]},{"head":"The therapeutic goal","body":"Stop or reverse the spiral from the impulsive loop to the compulsive habit loop. Few highly effective treatments exist today."}]},{"t":"Dopamine and reward","sec":"The Dopamine Theory of Addiction","fig":"Fig 13-4","f":[["Natural, substance-induced, or behavioral highs","VTA dopamine neurons fire","Dopamine release in nucleus accumbens","“YES!”: reinforcement and reward"]],"p":[{"label":"Key","text":"Natural highs: intellectual accomplishment, athletic victory, a good symphony, orgasm. Drugs of abuse often release dopamine more explosively and pleasurably, on demand, and can start the cascade into habit formation."}]},{"t":"The brain’s own pharmacy","sec":"The Dopamine Theory of Addiction","fig":"Fig 13-5","c":[{"head":"Drugs acting on this system","body":["Alcohol","Opioids","Stimulants","Marijuana","Benzodiazepines, sedative hypnotics","Hallucinogens","Nicotine"]}],"tb":[[["Brain’s own…","Natural neurotransmitter"],["Morphine / heroin","Endorphins"],["Marijuana","Endocannabinoids (e.g. anandamide)"],["Nicotine","Acetylcholine"],["Cocaine / amphetamine","Dopamine itself"]]]},{"t":"Once addicted: anticipation takes over","sec":"The Dopamine Theory of Addiction","fig":"","c":[{"head":"Early","body":"Ventral striatal DA neurons respond to the primary reinforcer: taking the drug, eating, gambling. ACC activity enhanced; fun."},{"head":"Addicted","body":"Dorsal striatal DA neurons respond to conditioned cues (the syringe, the pipe, the casino) before the drug is taken."}],"p":[{"label":"Clinical link","text":"Explains why addicts are aroused when seeking drugs but withdrawn and apathetic otherwise. This is a habit and a conditioned response, not simply “giving in to temptation.”"}]},{"t":"Stimulants: therapy vs abuse","sec":"Stimulants","fig":"Figs 13-6, 13-7","c":[{"head":"Therapeutic (ADHD)","body":"Controlled, constant levels; moderate DAT/NET occupancy in PFC; tonic DA (Chapter 11)."},{"head":"Abuse","body":"Sudden, massive DAT blockade in the mesolimbic circuit; phasic DA; the faster the entry, the bigger the high."}],"tb":[[["Route","Speed of brain entry / reinforcement"],["Oral","Slowed by GI absorption: least reinforcing"],["Snorted","Faster"],["IV","Very fast"],["Smoked","Fastest (avoids first-pass; huge lung surface)"]]]},{"t":"Stimulant pharmacology and toxicity","sec":"Stimulants","fig":"","tb":[[["Drug","Transporters inhibited","Extra"],["Amphetamine, methamphetamine","DAT, NET","—"],["Cocaine","DAT, NET, SERT","Local anesthetic"]],[["Dose","Effects"],["High","Tremor, emotional lability, restlessness, irritability, panic, stereotyped behavior"],["Higher, repeated","Paranoia and hallucinations resembling schizophrenia; hypertension, tachycardia, ventricular irritability, hyperthermia, respiratory depression"],["Overdose","Acute heart failure, stroke, seizures"]]]},{"t":"The progression of stimulant abuse","sec":"Stimulants","fig":"Fig 13-8","x":["FunPleasurable phasic DA firing","Craving“Where’s my dopamine?” Residual tonic firing only","AddictedHigher doses needed for phasic highs","WithdrawalAnhedonia, sleepiness between doses","Compulsive useMarathon sex, paranoia, HIV, violence","Burn-outEnduring cognitive loss; DA depletion; axonal degeneration"]},{"t":"Atypical stimulants and treatment","sec":"Stimulants","fig":"","c":[{"head":"“Bath salts” / “plant food”","body":["Synthetic stimulants (MDPV; mephedrone, methylone) disguised as Epsom salts","Reinforcing; agitation, paranoia, hallucinations, suicidality, chest pain"]},{"head":"Inhalants (“huffing”)","body":["Toluene, glue, aerosols, freon: direct DA releasers","Alcohol-like intoxication; long-term depression, weight loss, brain damage","Sudden death: cardiac arrest, aspiration, suffocation; freon freezes lungs"]}],"p":[{"label":"Treatment","text":"No drug is approved for stimulant addiction; many DA- and 5HT-linked therapies have failed. A cocaine vaccine may come in future."}]},{"t":"Smoking in psychiatric practice","sec":"Nicotine","fig":"","p":[{"label":"Clinical link","text":"Smoking histories are often not taken or recorded as a diagnosis. Ask every patient, and offer treatment."}],"x":["of the US general population smoke","of psychopharmacology patients smoke","of patients with ADHD, schizophrenia, bipolar disorder"]},{"t":"How nicotine releases dopamine","sec":"Nicotine","fig":"Fig 13-9","c":[{"head":"Direct","body":"α4β2 receptors on VTA DA neurons → DA release in nucleus accumbens (linked to addiction)"},{"head":"Indirect (glutamate)","body":"Presynaptic α7 on glutamate neurons → glutamate → DA release"},{"head":"Disinhibition (GABA)","body":"Desensitizes α4β2 on VTA GABA interneurons → less GABA → DA disinhibited"}],"p":[{"label":"Key","text":"Three routes to one result: more mesolimbic dopamine."}]},{"t":"Why cigarettes and packs are the size they are","sec":"Nicotine","fig":"Fig 13-10","f":[["Resting α4β2","Nicotine opens it → DA, reward","Desensitized by the end of one cigarette","Resensitizes over ~45 min → craving","Chronic: upregulation → amplified craving"]],"p":[{"label":"Key","text":"20 cigarettes over 16 waking hours ≈ one every 45 minutes: just enough to keep receptors desensitized all day. At first the goal is maximal DA; eventually it is mostly to prevent craving."}]},{"t":"Nicotinic partial agonists (NPAs)","sec":"Nicotine","fig":"Figs 13-11, 13-12","tb":[[["Agent","Channel state","Desensitized?"],["Full agonist (ACh short-acting; nicotine long-acting)","Frequently open","Yes (nicotine)"],["Partial agonist (varenicline)","Intermediate: less than full agonist, more than antagonist","No"],["Antagonist","Stabilized closed","No"]]],"p":[{"label":"Addictiveness","text":"Of all substances, tobacco may have the highest probability of dependence after one try: about 2/3 of smokers want to quit, 1/3 try, only 2–3% succeed long term."}]},{"t":"Treating nicotine addiction","sec":"Nicotine","fig":"Fig 13-13","tb":[[["Treatment","Mechanism","Effectiveness per Ch. 13"],["Varenicline (NPA)","α4β2 partial agonist","Triples to quadruples quit rates at 1, 6, 12 months; ~10% abstinent at 1 year"],["Bupropion (NDRI)","Gives back a little DA to craving D2 receptors","About half the quit rate of varenicline"],["Nicotine replacement (gum, lozenge, spray, inhaler, patch)","Steady, non-pulsatile nicotine; not very reinforcing","Similar to bupropion"],["Future","Nicotine vaccines; other nicotinic agents","In investigation"]]]},{"t":"How alcohol acts","sec":"Alcohol, Sedative Hypnotics, and GHB","fig":"Figs 13-14, 13-15","c":[{"head":"Enhances GABA","body":["Blocks presynaptic GABAB → more GABA release","PAM at GABAA, especially δ-containing (neurosteroid-sensitive, benzodiazepine-insensitive)"]},{"head":"Reduces glutamate","body":["Presynaptic mGluRs and VSCCs: less release","Reduces glutamate at postsynaptic NMDA and mGluRs"]},{"head":"Opioid synapses","body":["Opioid neurons from arcuate nucleus to VTA","Direct μ action or β-endorphin/enkephalin release","Net: DA release in nucleus accumbens"]}]},{"t":"Drugs for alcohol use disorder","sec":"Alcohol, Sedative Hypnotics, and GHB","fig":"Figs 13-16, 13-17","tb":[[["Drug","Mechanism","Notes"],["Naltrexone (oral or 30-day injection); nalmefene (outside US)","μ-opioid antagonist: blocks the alcohol “high”","Fewer heavy-drinking days; more abstinence; injection preferable but rarely prescribed"],["Acamprosate","Taurine derivative; blocks mGluRs (mGlu5, maybe mGlu2); “artificial alcohol”","Eases glutamate excess and GABA deficiency in withdrawal; rarely prescribed"],["Disulfiram","Irreversible aldehyde dehydrogenase inhibitor","Acetaldehyde buildup: flushing, nausea, vomiting, hypotension; compliance problems; occasionally dangerous"],["Topiramate, ondansetron","Unapproved","May be effective"]]]},{"t":"Sedative hypnotics and GHB","sec":"Alcohol, Sedative Hypnotics, and GHB","fig":"Fig 13-14","c":[{"head":"Sedative hypnotics","body":["PAMs at benzodiazepine-sensitive and/or insensitive GABAA receptors","Barbiturates: much less safe in overdose, more dependence and abuse, dangerous withdrawal","Rarely prescribed today"]},{"head":"GHB","body":["Agonist at GHB receptors and GABAB","Treats narcolepsy/cataplexy (Chapter 10)","Abused to get high; a “date rape” drug"]}],"tb":[[["GABAA site (Fig 13-14)","Binds"],["α1, α2, α3, α5 + γ receptors","Benzodiazepines; barbiturates (separate site)"],["δ-containing (α4, α6) receptors","Neuroactive steroids, alcohol, general anesthetics"]]]},{"t":"Opiates vs opioids; the endogenous system","sec":"Opioids","fig":"Fig 13-18","c":[{"head":"Opiate","body":"Naturally derived from the opium poppy: heroin, morphine, codeine."},{"head":"Opioid","body":"Any natural or synthetic substance binding opioid receptors: hydrocodone, oxycodone, fentanyl, methadone."}],"tb":[[["Precursor","Peptide","Receptor"],["POMC (pro-opiomelanocortin)","β-endorphin (“brain’s own morphine”)","μ"],["Proenkephalin","Enkephalin","δ"],["Prodynorphin","Dynorphin","κ"]]]},{"t":"The opioid epidemic","sec":"Opioids","fig":"","tb":[[["Finding","Figure given in Ch. 13"],["Misuse","20% use not as prescribed; 20% share pills"],["Fentanyl","100× morphine; carfentanil 10,000×; too potent for naloxone to reverse"],["Overdose deaths","~1/3 of ~60,000 annual US opioid deaths from fentanyl and derivatives"]]],"x":["of the world’s opioid supply consumed in the US","Americans fill an opioid prescription each year","become iatrogenically addicted"]},{"t":"Opioid effects, tolerance, and withdrawal","sec":"Opioids","fig":"","c":[{"head":"Tolerance and dependence","body":"Receptors adapt quickly; higher doses needed; little room between euphoric and toxic doses. Naloxone reverses (except fentanyl-type) but can precipitate withdrawal."},{"head":"Withdrawal","body":"Dysphoria, craving, irritability, tachycardia, tremor, sweating, piloerection (“cold turkey”). The quest for euphoria becomes a quest to avoid withdrawal."}],"f":[["Intense brief “rush”","Hours of tranquility","Drowsiness (“nodding”), clouding, apathy","Overdose: respiratory depression, coma"]]},{"t":"Medication-assisted treatment (MAT)","sec":"Opioids","fig":"","tb":[[["","Methadone","Buprenorphine"],["Action","Full μ agonist","μ partial agonist"],["Route","Oral, usually daily at a clinic","Sublingual (poorly absorbed if swallowed); 6-month implant; 1-month depot"],["Withdrawal suppression","Complete","Especially once mild withdrawal has started"],["Diversion protection","—","Combined with naloxone: inactive orally/sublingually, but blocks the high if injected"]]],"p":[{"label":"Reality","text":"After 30–90 days of residential rehab off all drugs, relapse may reach 60–80% within a month and 90–95% by 3 months."}]},{"t":"Withdrawal: severity and duration","sec":"Opioids","fig":"Figs 13-19 to 13-21","tb":[[["Drug stopped","Peak","Duration","Severity"],["Morphine / heroin","36–72 h","7–10 days","Most intense"],["Methadone","72–96 h","14+ days","Less intense, longest"],["Buprenorphine","After a few days (~72 h)","About a week","Less intense, shorter"]],[["Add-on","Effect on withdrawal"],["α2 agonist (lofexidine, clonidine)","Reduces intensity (autonomic symptoms), not duration"],["α2 agonist + naltrexone","Reduces both severity and duration"]]]},{"t":"Long-acting injectable naltrexone","sec":"Opioids","fig":"Fig 13-22","c":[{"head":"Oral (50 mg daily)","body":["Fluctuating, dose-dependent levels","Must decide to take it 30 times a month"]},{"head":"Monthly injection (380 mg IM)","body":["Higher, consistent levels","One decision every 30 days","An impulsive patient cannot readily stop it to relapse"]}],"p":[{"label":"Clinical link","text":"Transitioning to maintenance on a long-acting antagonist, rather than to abstinence alone, may improve long-term outcomes."}]},{"t":"The endocannabinoid system","sec":"Cannabis","fig":"Figs 13-23, 13-24","tb":[[["","CB1","CB2"],["Location","Neuron terminals throughout CNS and PNS (most abundant)","Mostly immune cells; also glia, brainstem"],["2-AG","High-efficacy agonist","High-efficacy agonist"],["Anandamide","Low-efficacy agonist","Very low-efficacy agonist"]]],"f":[["Postsynaptic neuron activated","Endocannabinoid made from membrane lipids","Travels BACK to presynaptic CB1","Inhibits transmitter release"]]},{"t":"THC vs CBD","sec":"Cannabis","fig":"Figs 13-25, 13-26","tb":[[["Effect","Low-CBD cannabis","High-CBD cannabis","CBD alone"],["Psychosis symptoms","Higher risk of hallucinations, delusions","Lower risk","Possible antipsychotic effects"],["Psychotic disorder","Earlier age of onset","Later age of onset","—"],["Cognition","Higher risk of acute memory impairment","Lower risk","—"],["Anxiety","Anxiogenic; ↑ amygdala activity","—","Anxiolytic; ↓ amygdala activity"]]],"p":[{"label":"Key","text":"THC: psychoactive partial agonist at CB1/CB2. CBD: an isomer of THC, not psychoactive, relatively inactive at CB receptors; mechanism unknown."}]},{"t":"Cannabis effects and risks","sec":"Cannabis","fig":"","c":[{"head":"Usual intoxication","body":["Well-being, relaxation, friendliness","Lost sense of time; slowed thinking","Short-term memory impairment; “special insights”","High dose: panic, delirium, psychosis"]},{"head":"“Amotivational syndrome”","body":["Heavy daily users","Low drive and ambition","Short attention, poor judgment, distractibility, introversion","Deteriorating habits; depersonalization"]}],"p":[{"label":"Clinical link","text":"If nobody smoked high-potency cannabis, 12% of first-episode psychosis across Europe would be prevented (32% in London, 50% in Amsterdam). Cannabis can also worsen existing psychosis."}]},{"t":"Table 13-2: Cannabis benefits and risks (1/2)","sec":"Cannabis","fig":"Table 13-2","tb":[[["Evidence","Associated with benefits to","Associated with risk of"],["Substantial","Chronic pain; chemotherapy-induced nausea; spasticity in MS (patient-reported)","Respiratory symptoms; motor vehicle crashes; lower birth weight; psychosis"],["Moderate","Sleep in obstructive sleep apnea, fibromyalgia, chronic pain, MS; airway dynamics; forced vital capacity; cognition in psychosis","Pediatric overdose injuries; impaired learning, memory, attention; increased (hypo)mania in bipolar disorder; depressive disorders; suicidality and suicide completion; social anxiety disorder; developing other substance use disorders"]]]},{"t":"Table 13-2: Cannabis benefits and risks (2/2)","sec":"Cannabis","fig":"Table 13-2","tb":[[["Evidence","Associated with benefits to","Associated with risk of"],["Limited","Increasing appetite/decreasing weight loss in HIV/AIDS; spasticity in MS (clinician-reported); Tourette syndrome; anxiety; PTSD","Testicular cancer; acute myocardial infarction; ischemic stroke or subarachnoid hemorrhage; prediabetes; COPD; pregnancy complications; neonatal ICU admission; impaired academic achievement; unemployment; impaired social functioning; more positive symptoms in schizophrenia; bipolar disorder; anxiety disorders (other than social anxiety); worse PTSD symptoms"]]]},{"t":"Table 13-3: Insufficient evidence","sec":"Cannabis","fig":"Table 13-3","tb":[[["Insufficient evidence: benefits to","Insufficient evidence: risk of"],["Dementia; intraocular pressure in glaucoma; depression in chronic pain or MS; cancer; anorexia nervosa; irritable bowel syndrome; epilepsy; spasticity in spinal cord injury; ALS; Huntington’s disease; Parkinson’s disease; dystonia; addiction; psychosis","Lung, head and neck cancers; esophageal cancer; prostate and cervical cancer; certain leukemias; asthma; liver disease with hepatitis C; adverse immune cell response; immune status in HIV; oral HPV; all-cause mortality; occupational injuries; overdose death; later outcomes in offspring (e.g. SIDS, academic achievement, substance abuse); worse negative symptoms in schizophrenia"]]]},{"t":"Table 13-4: Approved uses for THC and CBD","sec":"Cannabis","fig":"Table 13-4","tb":[[["Drug","Active ingredient","Formulation","Approval(s)","Schedule"],["Dronabinol","Synthetic THC","Oral capsule or solution","Chemo-induced nausea and vomiting (US); appetite in AIDS wasting (US)","III"],["Nabilone","Synthetic THC analogue","Oral capsule","Chemo-induced nausea and vomiting (US)","II (potency)"],["Nabiximols","Purified ~1:1 THC and CBD","Spray","MS spasticity (UK, Canada, Europe, Australia, NZ, Israel); MS and cancer pain (Canada, Israel)","N/A"],["Epidiolex","CBD purified from marijuana","Oral solution","Seizures in Lennox–Gastaut and Dravet syndromes, age 2+ (US)","Not controlled"]]]},{"t":"Hallucinogens: 5HT2A agonists","sec":"Hallucinogens, Empathogens, and Dissociatives","fig":"Fig 13-27","c":[{"head":"Pharmacology","body":"Agonists mainly at 5HT2A, plus 5HT2B, 5HT7, 5HT1D, 5HT1E, 5HT2C, 5HT6 and more. Rapid tolerance, even after one dose (5HT2A desensitization)."},{"head":"Flashbacks","body":"Spontaneous recurrence of intoxication symptoms days to months later (mostly LSD). Possibly long-lasting serotonin adaptation, or emotional conditioning in the amygdala like PTSD re-experiencing."}],"tb":[[["Class","Example"],["Tryptamines","Psilocybin (prodrug for psilocin)"],["Ergolines","LSD"],["Phenethylamines","Mescaline"]]]},{"t":"The hallucinogenic “trip”","sec":"Hallucinogens, Empathogens, and Dissociatives","fig":"","c":[{"head":"Typical effects","body":["Illusions more than true hallucinations","Visual trails; macropsia, micropsia","Synesthesia; slowed time; intensified sound","Depersonalization, derealization","Clear consciousness, full alertness","Psychedelic (mind expanding) and psychotomimetic"]},{"head":"Adverse effects","body":["Impaired judgment; fear of losing one’s mind","Anxiety, nausea, tachycardia, ↑ BP, ↑ temperature","“Bad trip” (panic)","Delirium with disorientation and agitation","Uncommonly frank psychosis"]}]},{"t":"MDMA: the prototype empathogen","sec":"Hallucinogens, Empathogens, and Dissociatives","fig":"Fig 13-28","p":[{"label":"Profile","text":"More selective for SERT than DAT/NET (opposite of amphetamine). Released 5HT acts mostly at 5HT2A. Effects: well-being, euphoria, closeness, sociability; some get mania-like states, anxious derealization."}],"x":["Competitively inhibits SERT","Transported into terminal via SERT","Packaged into vesicles via VMAT","Displaces 5HT from vesicles","High 5HT opens channels: spills out","High 5HT reverses SERT"]},{"t":"Dissociatives: PCP and ketamine","sec":"Hallucinogens, Empathogens, and Dissociatives","fig":"","c":[{"head":"Phencyclidine (PCP)","body":["NMDA antagonist: model for schizophrenia","Unacceptable as anesthetic: schizophrenia-like psychosis on emergence","Analgesia, amnesia, delirium, ataxia, slurred speech, vertical nystagmus","Catatonia, paranoia","Overdose: coma, hyperthermia, seizures, rhabdomyolysis"]},{"head":"Ketamine (“special K”)","bo
