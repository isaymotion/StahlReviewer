dy":["Same NMDA site; still used as dissociative anesthetic (children, veterinary)","Much less psychotomimetic than PCP","Subanesthetic doses: depersonalization, derealization; hallucinations uncommon","Rapid treatment for resistant depression; trials in suicidality and with psychotherapy"]}]},{"t":"Liking, wanting, and habits","sec":"Abuse Your Way to Abstinence?","fig":"Fig 13-29A","f":[["Normal: “liking” (opioid-dependent) and “wanting” (dopamine-dependent)","Impulsivity: wanting outweighs outcome; binge → absence → anticipation","Compulsivity: reward no longer matters; stimulus drives habit"]],"p":[{"label":"The problem","text":"No current drug blocks the ventral-to-dorsal migration, because its mechanism is unknown. Reversal currently relies on long-term abstinence, hoping conditioning fades."}]},{"t":"Extinction: making relapse unrewarding","sec":"Abuse Your Way to Abstinence?","fig":"Fig 13-29B","tb":[[["Approach","How it works","Notes"],["“Drink your way to sobriety” (Sinclair method)","Oral naltrexone or nalmefene ~1 hour before drinking; alcohol no longer rewarding","Effective when paired with drinking, not during abstinence; best for reducing heavy drinking"],["“Inject your way to heroin abstinence”","Long-acting naltrexone; attempts to “inject over” it fail to produce a high","Repeated failed highs extinguish the habit"],["“Smoke your way to quitting”","Varenicline binds more tightly than nicotine; cheating smokes are not rewarding","Unlike patch or bupropion, which can be “smoked over”"]]]},{"t":"“Therapeutic” dissociation, hallucinations, and empathy","sec":"Abuse Your Way to Abstinence?","fig":"","c":[{"head":"Set","body":"The patient’s mind-set"},{"head":"Setting","body":"The environment, including sounds"},{"head":"Cast","body":"The therapist and others present"}],"tb":[[["Assisted therapy","Studied for"],["Ketamine","Craving and abuse of cocaine, nicotine, alcohol; may promote prefrontal neuroplasticity"],["Psilocybin","Late-stage cancer anxiety, resistant anxiety and depression; OCD, pain, addictions, cluster headache, and more"],["MDMA","PTSD: safe state to explore and weaken (reconsolidate) traumatic memories"]]]},{"t":"Binge eating disorder (BED)","sec":"Behavioral Addictions, OCD, and Impulse Control","fig":"","p":[{"label":"Clinical link","text":"Lisdexamfetamine may work not by suppressing appetite but by promoting striatal neuroplasticity, reversing the ventral-to-dorsal shift. Off-label options (limited): topiramate, some depression drugs, naltrexone. Psychotherapy enhances drug efficacy."}],"x":["eating disorder, yet commonly undiagnosed","meet criteria for mood, anxiety, substance, or ADHD disorder","approved drug: lisdexamfetamine"]},{"t":"Gambling and internet gaming","sec":"Behavioral Addictions, OCD, and Impulse Control","fig":"","c":[{"head":"Features like drug addiction","body":["Repeated unsuccessful efforts to stop","Tolerance (higher stakes)","Psychological withdrawal","Relief when resuming"]},{"head":"A drug-induced clue","body":"Gambling has been observed after treatment with dopamine agonists and partial agonists: stimulating mesolimbic DA can trigger it."}]},{"t":"OCD: addicted to compulsions?","sec":"Behavioral Addictions, OCD, and Impulse Control","fig":"Fig 13-30","c":[{"head":"Reframing OCD","body":["Now its own category, not an anxiety disorder","Rituals as habits provoked by environmental stimuli","Inefficient OFC, cognitive inflexibility: like addiction","Exposure and response prevention may reverse circuitry (benefit persists after stopping); SSRIs suppress it"]}],"tb":[[["Line","Treatment"],["First","SSRI (modest; half respond poorly); ERP often more effective"],["Second","Clomipramine, SNRIs, MAOIs; very high-dose SSRI or SSRI + serotonin–dopamine blocker"],["Other augmentation","Benzodiazepine, lithium, buspirone"],["Devices / surgery","rTMS (approved); DBS or stereotactic ablation (experimental)"]]]},{"t":"Impulse control disorders and violence","sec":"Behavioral Addictions, OCD, and Impulse Control","fig":"Fig 13-31","tb":[[["Type","Features"],["Impulsive (most common)","Imbalance of top-down stop vs bottom-up go; treat underlying condition; may become compulsive habit needing behavioral extinction"],["Psychotic (~20%)","Needs standard, even aggressive, treatment of psychosis"],["Psychopathic (least common)","Cold, calculated; most lethal, least treatable"]]],"p":[{"label":"Principle","text":"Stopping frequent short-term rewarding impulses may prevent long-term habits."}]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Two dimensions","body":"Impulsivity (ventral reward loop) and compulsivity (dorsal habit loop) cut across many disorders."},{"head":"Migration","body":"Rewarding impulses become compulsive habits: control moves ventral to dorsal."},{"head":"Reward","body":"Mesolimbic DA as final common pathway, fed by the brain’s own “pharmacy.”"},{"head":"Treatments","body":"Varenicline, bupropion, NRT; naltrexone, acamprosate; methadone, buprenorphine, naltrexone LAI."},{"head":"Novel ideas","body":"Extinction by pairing antagonists with use; dissociative/psychedelic-assisted psychotherapy."},{"head":"Behavioral","body":"BED (lisdexamfetamine); gambling; OCD; impulsive violence."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Ask about substances","body":"Smoking, drinking, and drug use are common and under-treated in psychiatric patients."},{"head":"Use the proven treatments","body":"Varenicline, naltrexone (especially LAI), buprenorphine/methadone are under-prescribed."},{"head":"Think habit, not willpower","body":"Cues trigger conditioned drug seeking; expect relapse as part of recovery."},{"head":"Ask about binge eating","body":"Especially with mood, anxiety, substance, or ADHD comorbidity."}]}],"cards":[{"id":"c13-1","q":"Contrast impulsivity and compulsivity.","a":"Impulsivity: can’t stop initiating actions. Compulsivity: can’t terminate ongoing actions."},{"id":"c13-2","q":"Which striatal region drives each?","a":"Impulsivity: ventral striatum. Compulsivity: dorsal striatum."},{"id":"c13-3","q":"What is the dopamine theory of addiction?","a":"Mesolimbic DA from VTA to nucleus accumbens is the final common pathway of reward."},{"id":"c13-4","q":"Why do abusers snort, inject, or smoke stimulants?","a":"Faster brain entry gives stronger phasic DA and a bigger high; oral absorption is slow."},{"id":"c13-5","q":"Name the stages of stimulant abuse progression.","a":"Fun → craving → addiction → withdrawal → compulsive use → burn-out."},{"id":"c13-6","q":"Name the three ways nicotine releases dopamine.","a":"Direct α4β2 on VTA DA neurons; α7 on glutamate neurons; desensitizing α4β2 on GABA interneurons."},{"id":"c13-7","q":"Why are cigarettes the length they are?","a":"One cigarette desensitizes α4β2 receptors; ~45 minutes to resensitize (20 a day over 16 hours)."},{"id":"c13-8","q":"Compare quit rates for varenicline, bupropion, and NRT.","a":"Varenicline triples/quadruples quit rates (~10% at a year); bupropion ~half of varenicline; NRT similar to bupropion."},{"id":"c13-9","q":"How do naltrexone and acamprosate work in alcoholism?","a":"Naltrexone: μ antagonist blocks alcohol’s high. Acamprosate: mGluR blocker easing glutamate excess in withdrawal."},{"id":"c13-10","q":"Contrast methadone and buprenorphine.","a":"Methadone: full μ agonist, daily clinic. Buprenorphine: partial agonist, sublingual/depot, with naloxone."},{"id":"c13-11","q":"What reduces the severity and duration of opioid withdrawal?","a":"α2 agonist (lofexidine/clonidine) reduces severity; adding naltrexone also shortens duration."},{"id":"c13-12","q":"Name the four approved THC/CBD products (Table 13-4).","a":"Dronabinol, nabilone, nabiximols, Epidiolex."},{"id":"c13-13","q":"How do high-CBD and low-CBD cannabis differ?","a":"High-CBD: lower risk of psychosis, later onset, less memory impairment; CBD alone may be anxiolytic."},{"id":"c13-14","q":"How does MDMA release serotonin?","a":"SERT pseudosubstrate → enters terminal → VMAT → displaces 5HT → channel release and SERT reversal."},{"id":"c13-15","q":"What is the Sinclair method?","a":"Taking an opioid antagonist ~1 hour before drinking so alcohol is unrewarding, extinguishing the habit."},{"id":"c13-16","q":"What are first-line treatments for OCD?","a":"SSRIs plus exposure and response prevention."}],"glossary":[{"t":"VMPFC / ACC / OFC","m":"Ventromedial PFC / anterior cingulate / orbitofrontal cortex"},{"t":"VTA","m":"Ventral tegmental area"},{"t":"DAT / NET / SERT","m":"DA / NE / 5HT transporters"},{"t":"VMAT","m":"Vesicular monoamine transporter"},{"t":"NPA","m":"Nicotinic partial agonist"},{"t":"NDRI","m":"NE–DA reuptake inhibitor"},{"t":"NRT","m":"Nicotine replacement therapy"},{"t":"mGluR","m":"Metabotropic glutamate receptor"},{"t":"VSCC","m":"Voltage-sensitive calcium channel"},{"t":"POMC","m":"Pro-opiomelanocortin"},{"t":"MAT","m":"Medication-assisted therapy"},{"t":"LAI","m":"Long-acting injectable"},{"t":"CB1 / CB2","m":"Cannabinoid receptors"},{"t":"2-AG","m":"2-arachidonoylglycerol"},{"t":"THC / CBD","m":"Tetrahydrocannabinol / cannabidiol"},{"t":"MDMA","m":"3,4-methylenedioxymethamphetamine"},{"t":"PCP","m":"Phencyclidine"},{"t":"BED","m":"Binge eating disorder"},{"t":"ERP","m":"Exposure and response prevention"},{"t":"rTMS / DBS","m":"Repetitive TMS / deep brain stimulation"}]}],"ref":[{"t":"Foundations: the five molecular targets","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Target","Structure","Share of drugs","Examples [chapter]"],["Transporters","12 transmembrane regions","~30%","SERT, NET, DAT, VMAT2, GAT1 [2]"],["G-protein-linked receptors","7 transmembrane regions","~30%","D2, 5HT2A, α2A, H1, M1, μ-opioid [2]"],["Ligand-gated ion channels","4-TM subunits (pentamers) or 3-TM + loop (tetramers)","~20%","GABAA, nicotinic, 5HT3, NMDA, AMPA [3]"],["Voltage-gated ion channels","6-TM subunits; S4 voltmeter","~10%","VSSCs, VSCCs (α2δ) [3]"],["Enzymes","—","~10%","MAO, AChE, GSK-3; CYP450 for PK [2]"]]],"p":[{"label":"Key","text":"Master these few sites and you can understand the proposed mechanisms of virtually all psychotropics."}]},{"t":"Foundations: the agonist spectrum","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Agent","At G-protein receptors [Ch. 2]","At ligand-gated channels [Ch. 3]","Examples"],["Full agonist","Maximal signal transduction","Maximal opening frequency","Natural transmitter; SSRIs/NRIs indirectly"],["Partial agonist","Between; net agonist or antagonist depending on transmitter","Partly open; “stabilizer”","Aripiprazole, brexpiprazole, cariprazine, buspirone, varenicline, buprenorphine"],["Antagonist","Silent; back to baseline","Resting state","Most D2 drugs; H1, M1, α1 side effects"],["Inverse agonist","Below baseline constitutive activity","Closed, then inactivated (padlock)","Possibly 5HT2A “antagonists”, H3 blockers"],["Allosteric modulator","Another site","PAM boosts / NAM blocks","Benzodiazepines (PAM); PCP, ketamine (NAM)"]]],"p":[{"label":"Key","text":"Partial agonists in a dark room brighten; in a lit room they dim (Ch. 2 rheostat)."}]},{"t":"Foundations: signalling, timing, metabolism","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Concept","Key points [chapter]"],["Messengers","1st: transmitter → 2nd: cAMP/Ca²⁺ → 3rd: kinase/phosphatase → 4th: phosphoprotein/CREB → 5th: Fos, Jun → 6th: Fos–Jun → 7th: late gene product [1]"],["Timing","Binding in \u003c 1 second; gene effects over hours to days; lasting days to a lifetime [1, 6, 7]"],["Retrograde messengers","Endocannabinoids → CB1; nitric oxide → cGMP; NGF → back to nucleus [1]"],["Volume transmission","Dopamine diffuses widely in PFC (few DATs); somatodendritic autoreceptors [1]"],["Epigenetics","Acetylation and demethylation open genes; methylation and deacetylation silence them; L-methylfolate → SAMe → methyl groups [1]"],["CYP450","1A2, 2B6, 2D6, 2C9, 2C19, 3A4; poor, intermediate, extensive, ultra-rapid metabolizers [2]"]]],"p":[{"label":"Key","text":"Pharmacokinetics (CYP450) vs pharmacodynamics (targets)."}]},{"t":"Dopamine (1): synthesis and receptors","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Step","Details"],["Synthesis","Tyrosine → (tyrosine hydroxylase, rate-limiting) DOPA → (DDC) dopamine → VMAT2 into vesicles [4]"],["Termination","DAT in striatum; COMT (main route) and NET in prefrontal cortex; MAO-A/B intracellular [4]"],["D1-like (D1, D5)","Excitatory; ↑ adenylate cyclase; D1 predominates in PFC and is LEAST sensitive to DA [4, 11]"],["D2-like (D2, D3, D4)","Inhibitory; ↓ adenylate cyclase; D3 MOST sensitive, then D2 [4, 11]"],["Autoreceptors","D2 and D3 at terminals and somatodendritic sites: gatekeepers that brake release [4]"],["Tonic vs phasic","Tonic PFC tone vs phasic bursts in nucleus accumbens (reward, abuse) [11, 13]"]]],"p":[{"label":"Key","text":"Sensitivity order: D3 > D2 > D1."}]},{"t":"Dopamine (2): the five pathways","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Pathway","From → to","Function","Schizophrenia [4]","D2 blockade [5]"],["Nigrostriatal","Substantia nigra → striatum","Movement","Normal","DIP, akathisia, dystonia; TD"],["Mesolimbic","VTA → nucleus accumbens","Reward, motivation","Hyperactive: positive symptoms","Antipsychotic; secondary negative symptoms"],["Mesocortical","VTA → DLPFC, VMPFC","Cognition, affect","Hypoactive: negative, cognitive, affective","May worsen"],["Tuberoinfundibular","Hypothalamus → pituitary","Inhibits prolactin","Normal","Hyperprolactinemia"],["Thalamic","Several nuclei → thalamus","Sleep/arousal?","No evidence of abnormality","—"]]],"p":[{"label":"Key","text":"Newer view: an integrative mesostriatal hub with overactivity in the associative striatum [Ch. 4]."}]},{"t":"Dopamine (3): drugs and disorders","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Target / action","Drugs","Uses and effects [chapter]"],["D2 antagonism","First-generation agents; pines, dones","Psychosis, mania [5, 7]"],["D2/D3 partial agonism","Aripiprazole, brexpiprazole, cariprazine","Psychosis, mania, depression adjunct; lower prolactin [5, 7]"],["DAT (± NET) inhibition","Methylphenidate, amphetamine, bupropion, modafinil, solriamfetol, cocaine","ADHD, sleepiness, depression; abuse when pulsatile [7, 10, 11, 13]"],["VMAT2 inhibition","Tetrabenazine, deutetrabenazine, valbenazine","Tardive dyskinesia, Huntington’s chorea [5]"],["MAO inhibition","MAOIs; selegiline, rasagiline (MAO-B)","Depression; Parkinson’s [7]"],["Indirect via 5HT","5HT2A antagonism, 5HT1A agonism, 5HT2C antagonism","↑ DA in PFC and motor striatum [4, 5, 7]"]]],"p":[{"label":"Key","text":"Disorders: psychosis, mania, ADHD, addiction, movement disorders, anhedonia."}]},{"t":"Serotonin (1): synthesis and autoreceptors","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Item","Details"],["Synthesis","Tryptophan → (tryptophan hydroxylase) 5HTP → (AAADC) 5HT → VMAT2 [4]"],["Termination","SERT on all 5HT neurons; MAO-B at high levels [4]"],["5HT1A (somatodendritic)","Brake on firing; desensitization over weeks underlies SSRI onset [4, 7]"],["5HT2B (somatodendritic)","Feed-forward: more firing and release [4]"],["5HT1B/D (terminal)","Brake on release; also heteroreceptors on NE, DA, HA, ACh terminals [4]"],["Raphe projections","PFC, basal forebrain, thalamus, hypothalamus; descending to spinal cord (pain) [4, 9]"]]],"p":[{"label":"Key","text":"Unlike DA and NE neurons, 5HT neurons have different receptors at the two ends."}]},{"t":"Serotonin (2): postsynaptic receptors","sec":"Receptor & Neurotransmitter Atlas","fig":"","tb":[[["Receptor","Action / site","Net effect","Drug relevance [chapter]"],["5HT1A","Inhibitory; GABA interneurons","↑ NE, DA, ACh","Buspirone, vilazodone, partial agonists [5, 7, 8]"],["5HT2A","Excitatory; glutamate and GABA neurons","Both ↑ and ↓ glutamate","Hallucinogens agonists; antagonists antipsychotic, PDP, sleep [4, 5, 12]"],["5HT2C","Ex <script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const CH = DATA.chapters;
const COLORS = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)','var(--m6)','var(--m7)'];
const col = n => COLORS[(n - 1) % 7];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5, INTERVALS = [0, 0, 1, 3, 7, 16, 35];

/* ---------- storage ---------- */
const KEY = 'psychopharm-trainer-v1';
let S;
function load() { try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; } S.cards = S.cards || {}; S.q = S.q || {}; S.days = S.days || []; S.sessions = S.sessions || 0; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: progress lasts this session only */ } }
function touchDay() { const d = new Date().toISOString().slice(0, 10); if (!S.days.includes(d)) { S.days.push(d); S.days = S.days.slice(-400); } }
function streak() { let n = 0; const set = new Set(S.days); const d = new Date(); for (;;) { const k = d.toISOString().slice(0, 10); if (set.has(k)) { n++; d.setDate(d.getDate() - 1); } else break; } return n; }
load();

/* ---------- derived ---------- */
const allCards = CH.flatMap(c => c.cards.map(k => ({...k, ch: c.n})));
const cardById = Object.fromEntries(allCards.map(c => [c.id, c]));
function mastery(n) { const cs = CH[n - 1].cards; if (!cs.length) return 0; const sum = cs.reduce((a, c) => a + Math.max(0, ((S.cards[c.id] || {}).box || 1) - 1), 0); return Math.round(100 * sum / (cs.length * 5)); }
function overall() { const t = CH.reduce((a, c) => a + mastery(c.n), 0); return Math.round(t / CH.length); }
function quizAcc(n) { const r = S.q['ch' + n]; return r && r.t ? Math.round(100 * r.c / r.t) : null; }
function dueCount(chs) { const now = Date.now(); return allCards.filter(c => chs.includes(c.ch) && S.cards[c.id] && S.cards[c.id].due <= now).length; }
function newCount(chs) { return allCards.filter(c => chs.includes(c.ch) && !S.cards[c.id]).length; }
const badge = (n, size = '', p = null) => `<span class="badge ${size}" style="--c:${col(n)};--p:${p == null ? 100 : p}" aria-hidden="true"><span>${n}</span></span>`;

/* ---------- routing ---------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  cards: '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 012 2v12"/>',
  quiz: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',

function startDeck(list) { deck = list; di = 0; shown = false; sessionStats = { hit: 0, miss: 0 }; S.sessions++; touchDay(); save(); showCard(); }

  $('#main').innerHTML = `

  keyHandler = e => { if (e.key === ' ' && !shown) { e.preventDefault(); shown = true; showCard(); } else if (shown && e.key === '1') grade(false); else if (shown && e.key === '2') grade(true); };
}
function grade(ok) {
  const c = deck[di], st = S.cards[c.id] || { box: 1, seen: 0, right: 0 };

/* ---------- QUIZ ---------- */
let qset = [], qi = 0, qscore = 0, qmissed = [], qsrc = 'mixed', qlen = 10;
function buildQuestions(src, chs, n) {
  const qs = [];
  const board = DATA.mc.filter(m => chs.includes(m.ch)).map(m => ({ kind: 'board', ch: m.ch, stem: m.stem, opts: m.opts, ans: m.ans, why: m.why }));
  const fromCards = () => allCards.filter(c => chs.includes(c.ch)).map(c => {
    const others = shuffle(CH[c.ch - 1].cards.filter(k => k.id !== c.id)).slice(0, 3).map(k => k.a);
    const opts = shuffle([c.a, ...others]);
    return { kind: 'card', ch: c.ch, stem: c.q, opts, ans: opts.indexOf(c.a), why: 'From the Chapter ' + c.ch + ' self-test.' };
  });
  const fromGloss = () => CH.filter(c => chs.includes(c.n)).flatMap(c => c.glossary.map(g => {
    const others = shuffle(c.glossary.filter(x => x.m !== g.m)).slice(0, 3).map(x => x.m);
    const opts = shuffle([g.m, ...others]);
    return { kind: 'gloss', ch: c.n, stem: `What does “${g.t}” stand for or mean?`, opts, ans: opts.indexOf(g.m), why: `${g.t}: ${g.m} (Chapter ${c.n}).` };
  }));
  if (src === 'board') qs.push(...board);
  else if (src === 'cards') qs.push(...fromCards());
  else if (src === 'gloss') qs.push(...fromGloss());
  else qs.push(...board, ...shuffle(fromCards()).slice(0, n), ...shuffle(fromGloss()).slice(0, Math.ceil(n / 3)));
  return shuffle(qs).slice(0, n);
}
function quizView() {
  const chs = [...sel];
  const boardN = DATA.mc.filter(m => chs.includes(m.ch)).length;
  $('#main').innerHTML = `

        </div></div>
      <div class="row"><span style="min-width:90px"><b>Length</b></span>
        <div class="seg" id="len" role="group" aria-label="Quiz length">${[10, 20, 40].map(k => `<button data-v="${k}" aria-pressed="${qlen === k}">${k}</button>`).join('')}</div></div>
      <div class="row"><button class="btn" id="go">Start quiz</button></div>
    </div>${credit}`;

}
function showQ(answered = null) {

  const q = qset[qi];
  $('#main').innerHTML = `
    <div class="row" style="justify-content:space-between"><h1>Quiz</h1><button class="btn ghost small" id="quit">End quiz</button></div>

    </div>${credit}`;
  $('#quit').onclick = quizDone;
  const pick = i => { if (answered != null) return; const ok = i === q.ans; if (ok) qscore++; else qmissed.push(q); const r = S.q['ch' + q.ch] || { t: 0, c: 0 }; r.t++; if (ok) r.c++; S.q['ch' + q.ch] = r; save(); showQ(i); };

function quizDone() {

/* ---------- NOTES ---------- */
function hl(text, term) { const e = esc(text); if (!term) return e; const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); return e.replace(re, '<mark>$1</mark>'); }
function noteHTML(s, term = '', chTag = '') {
  const h = t => hl(t, term);
  let out = `<article class="note"><h3>${h(s.t)}${s.fig ? `<span class="fig">See Stahl ${esc(s.fig)}</span>` : ''}</h3>${chTag}`;
  if (s.b) out += `<ul>${s.b.map(x => `<li>${h(x)}</li>`).join('')}</ul>`;
  if (s.c) out += `<div class="cardsgrid">${s.c.map(c => `<div class="mini">${c.head ? `<b>${h(c.head)}</b>` : ''}${Array.isArray(c.body) ? `<ul>${c.body.map(x => `<li>${h(x)}</li>`).join('')}</ul>` : h(c.body)}</div>`).join('')}</div>`;
  if (s.f) out += s.f.map(fl => `<ol class="steps">${fl.map(x => `<li>${h(x)}</li>`).join('')}</ol>`).join('');
  if (s.x && !s.b && !s.c && !s.tb) out += `<p class="extra">${s.x.map(h).join(' · ')}</p>`;
  if (s.tb) out += s.tb.map(tb => `<div class="tw"><table><thead><tr>${tb[0].map(x => `<th>${h(x)}</th>`).join('')}</tr></thead><tbody>${tb.slice(1).map(r => `<tr>${r.map(x => `<td>${h(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('');
  if (s.p) out += s.p.map(p => `<div class="pearl"><b>${esc(p.label)}.</b> ${h(p.text)}</div>`).join('');
  return out + '</article>';
}
function textOf(s) { return [s.t, ...(s.b || []), ...(s.c || []).flatMap(c => [c.head, ...(Array.isArray(c.body) ? c.body : [c.body])]), ...(s.f || []).flat(), ...(s.tb || []).flat(2), ...(s.p || []).map(p => p.text), ...(s.x || [])].join(' ').toLowerCase(); }

    const run = () => { const t = $('#q').value.trim(); if (t.length < 2) { $('#res').innerHTML = ''; $('#list').hidden = false; return; }
      const tl = t.toLowerCase(); const hits = CH.flatMap(c => c.notes.filter(s => textOf(s).includes(tl)).map(s => ({ s, c })));
      $('#list').hidden = true;
      $('#res').innerHTML = `<p class="muted" style="margin-top:12px">${hits.length} note${hits.length === 1 ? '' : 's'} match “${esc(t)}”${hits.length > 60 ? '; showing the first 60' : ''}.</p>` + hits.slice(0, 60).map(({ s, c }) => noteHTML(s, t, `<button class="tag" data-go="notes/${c.n}" style="border:0;margin-bottom:6px">${'Chapter ' + c.n + ': ' + esc(c.short)}</button>`)).join('') + (hits.length ? '' : '<div class="empty">No notes match. Try a drug name, receptor, or abbreviation.</div>'); };

  $('#drill').onclick = () => { sel = new Set([n]); go('cards'); };

  $('#q').addEventListener('input', () => { const t = $('#q').value.trim(); const tl = t.toLowerCase();
    if (t.length < 2) { $('#body').innerHTML = body; return; }
    const hits = c.notes.filter(s => textOf(s).includes(tl));
    $('#body').innerHTML = `<p class="muted" style="margin-top:12px">${hits.length} match${hits.length === 1 ? '' : 'es'}.</p>` + hits.map(s => noteHTML(s, t)).join(''); });
}

function glossaryView() {
  const all = CH.flatMap(c => c.glossary.map(g => ({ ...g, ch: c.n })));
  $('#main').innerHTML = `<h1>Glossary</h1><p class="lede">Abbreviations and terms from each chapter deck. Filter by chapter, search, or drill them as a quiz.</p>
    ${pickerHTML('pk')}
    <div class="row" style="margin-bottom:12px"><input class="search" id="q" type="search" placeholder="Search terms or meanings" aria-label="Search glossary" style="flex:1;min-width:220px"><button class="btn" id="drill">Quiz these terms</button></div>
    <dl class="gl" id="gl"></dl>${credit}`;
  const render = () => { const t = $('#q').value.trim().toLowerCase(); const list = all.filter(g => sel.has(g.ch) && (!t || (g.t + ' ' + g.m).toLowerCase().includes(t)));
    $('#gl').innerHTML = list.length ? list.map(g => `<dt>${hl(g.t, t)}</dt><dd>${hl(g.m, t)}</dd><span class="ch" title="Chapter ${g.ch}">${badge(g.ch, 'sm')}</span>`).join('') : '<div class="empty" style="grid-column:1/-1">No terms match.</div>'; };
  bindPicker('pk', glossaryView); $('#q').addEventListener('input', render); render();
  $('#drill').onclick = () => { qsrc = 'gloss'; go('quiz'); };
}

/* ---------- REFERENCE ---------- */
let refTab = 'Receptor & Neurotransmitter Atlas';
function refView() {
  const tabs = [...new Set(DATA.ref.map(r => r.sec))];
  const label = { 'Receptor & Neurotransmitter Atlas': 'Neurotransmitter atlas', 'Drug-by-Drug Quick Reference': 'Drug reference', 'Board-Style Review': 'High-yield review' };
  $('#main').innerHTML = `<h1>Atlas & drugs</h1><p class="lede">Cross-chapter synthesis from the cumulative review deck. Chapter numbers in brackets point back to the source chapter.</p>
    <div class="seg tabs" id="tabs" role="tablist">${tabs.map(t => `<button role="tab" data-v="${esc(t)}" aria-pressed="${refTab === t}" aria-selected="${refTab === t}">${esc(label[t] || t)}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="Search this section" aria-label="Search this section">
    <div id="body"></div>${credit}`;
  const render = () => { const t = $('#q').value.trim(); const tl = t.toLowerCase(); const list = DATA.ref.filter(r => r.sec === refTab && (t.length < 2 || textOf(r).includes(tl)));
    $('#body').innerHTML = list.map(r => noteHTML(r, t.length < 2 ? '' : t)).join('') || '<div class="empty">Nothing matches in this section.</div>'; };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { refTab = b.dataset.v; refView(); } };
  $('#q').addEventListener('input', render); render();
}

/* ---------- ABOUT / PROGRESS ---------- */
function aboutView() {
  const seen = Object.keys(S.cards).length;
  $('#main').innerHTML = `<h1>About & progress</h1>
    <p class="lede">Psychopharmacology Trainer helps psychiatry residents retain the content of the 13 chapter study guides for Stahl’s Essential Psychopharmacology, 5th edition. All content summarizes those chapters and is for education only; confirm prescribing details in current references before clinical use.</p>
    <h2 class="section-title">Your progress</h2>
    <p class="muted">${seen} of ${allCards.length} cards studied · ${S.sessions} flashcard sessions · ${S.days.length} study days · ${streak()}-day streak</p>
    <div class="tw"><table><thead><tr><th>Chapter</th><th>Mastery</th><th>Cards studied</th><th>Quiz accuracy</th></tr></thead><tbody>
    ${CH.map(c => { const st = c.cards.filter(k => S.cards[k.id]).length; const qa = quizAcc(c.n); const r = S.q['ch' + c.n]; return `<tr><td><span class="row" style="flex-wrap:nowrap">${badge(c.n, 'sm')}${esc(c.short)}</span></td><td>${mastery(c.n)}%</td><td>${st} / ${c.cards.length}</td><td>${qa != null ? qa + '% (' + r.c + '/' + r.t + ')' : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:.9rem">Progress is saved in this browser only. Export it to move between devices.</p>
    <div class="row" style="margin-top:10px"><button class="btn ghost small" id="exp">Export progress</button><label class="btn ghost small" style="display:inline-flex;align-items:center">Import progress<input type="file" id="imp" accept="application/json" hidden></label><button class="btn ghost small" id="reset">Reset all progress</button></div>
    <p id="msg" class="muted" role="status"></p>
    <h2 class="section-title">How the flashcards work</h2>
    <p>Each card sits in one of six boxes. “Knew it” moves a card up a box and schedules it further out (same day, 1, 3, 7, 16, then 35 days). “Missed it” sends it back to box 1 and repeats it before the session ends. Mastery is how far your cards have climbed.</p>
    <h2 class="section-title">Source</h2>
    <p>Stahl SM. <i>Stahl’s Essential Psychopharmacology</i>, 5th edition, Chapters 1–13, via the chapter study-guide decks. Figure references (“See Stahl Fig …”) point to the book.</p>
    ${credit}`;
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'psychopharm-trainer-progress.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); $('#msg').textContent = 'Progress exported.'; };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (!o || typeof o.cards !== 'object') throw 0; S = Object.assign({ cards: {}, q: {}, days: [], sessions: 0 }, o); save(); aboutView(); $('#msg').textContent = 'Progress imported.'; } catch (err) { $('#msg').textContent = 'That file is not a Psychopharmacology Trainer export. Choose the .json file created by “Export progress.”'; } }); };
  $('#reset').onclick = () => { if (confirm('Reset all flashcard and quiz progress in this browser? This cannot be undone.')) { S = { cards: {}, q: {}, days: [], sessions: 0 }; save(); aboutView(); $('#msg').textContent = 'Progress reset.'; } };
}

route();
</script>
</body>
</html>
