 targets and are not emphasized."],"f":[["A: VSSCs open; Na⁺ rushes “downhill” into the negatively charged neuron","B: milliseconds later, the voltage change opens VSCCs; Ca²⁺ enters","C: recovery: K⁺ moves back into the cell while Na⁺ is pumped out"]]},{"t":"Building a voltage-sensitive channel","sec":"Voltage-Sensitive Ion Channels and VSSCs","fig":"Fig 3-19","b":["Subunit: six transmembrane segments.","Segment 4: senses charge across the membrane; the “voltmeter” that triggers opening or closing.","Loop between 5 and 6: extracellular “ionic filter” covering the pore opening.","Selectivity: lets only sodium through a VSSC, or only calcium through a VSCC."],"p":[{"label":"Reading the figure","text":"Stahl draws the ionic filter as a colander that lets only Na⁺ (left) or Ca²⁺ (right) through."}],"x":["S5–S6 loop = ionic filter","Schematic, not Stahl’s artwork"]},{"t":"The VSSC α pore and its “bathtub plug”","sec":"Voltage-Sensitive Ion Channels and VSSCs","fig":"Fig 3-20","b":["Four subunits (I–IV) form one complete α pore.","Cytoplasmic loops tying them together regulate channel functions.","Amino acids on the III–IV loop act like a ball on a chain, plugging the pore from the inside.","Sodium flows in when the channel is open and unplugged."],"p":[{"label":"Reading the figure","text":"Figs 3-20B and C show the same icon both ways up. Later chapters often draw these channels on presynaptic membranes with the inside of the neuron at the top."}],"x":["III–IV loop: pore inactivator (plug)"]},{"t":"Regulatory β units and drug sites","sec":"Voltage-Sensitive Ion Channels and VSSCs","fig":"Fig 3-20C","c":[{"head":"β units","body":["Regulatory proteins flanking the α pore","Function not clearly established; may modify α unit and indirectly affect opening","May be phosphoproteins"]},{"head":"α unit","body":["May itself be a phosphoprotein","Its phosphorylation could change channel sensitivity via signal transduction"]}],"p":[{"label":"Clinical link","text":"Both β and α units may carry sites where psychotropic drugs act, especially anticonvulsants, some of which are also mood stabilizers or treatments for chronic pain."}]},{"t":"Three states of a VSSC","sec":"Voltage-Sensitive Ion Channels and VSSCs","fig":"Fig 3-21","c":[{"head":"Open","body":"Active; maximum ion flow through the α unit"},{"head":"Inactivated","body":"Plugged by the pore inactivator so fast the channel has not even closed"},{"head":"Closed and inactivated","body":"Conformational change closes the channel"}],"p":[{"label":"Note","text":"Many sodium channel subtypes exist; their locations, functions, and drug actions are only beginning to be clarified. Most anticonvulsants probably act at multiple sites on multiple channel types."}]},{"t":"VSCC vs VSSC: cousins with one key difference","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Figs 3-19, 3-22","tb":[[["Feature","VSSC (sodium)","VSCC (calcium)"],["Subunit","6 TM; S4 voltmeter; S5–S6 filter","Same design"],["Ionic filter lets through","Na⁺","Ca²⁺"],["Pore name","α unit","α1 unit"],["Key connector loop","III–IV: pore inactivator (plug)","II–III: snare to synaptic vesicles"],["Accessory proteins","β units","γ, β, and α2δ"]]],"x":["II–III loop: snare","Schematic VSCC α1 pore"]},{"t":"α2δ: a drug target on VSCCs","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Fig 3-22C","p":[{"label":"Clinical link","text":"The α2δ protein is the target of the anticonvulsants pregabalin and gabapentin. It may help regulate the conformational changes that control how the channel opens and closes."}],"x":["δ part transmembrane; α2 part extracellular"]},{"t":"“Calcium channel” is too general a term","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"","c":[{"head":"Ligand-gated calcium channels","body":"Associated with glutamate and nicotinic cholinergic ionotropic receptors. Opened by neurotransmitters."},{"head":"VSCCs","body":"Opened by voltage. A different class entirely, with its own subtypes (Table 3-4)."}],"p":[{"label":"Tip","text":"Always specify which kind of calcium channel is meant: the drugs, mechanisms, and consequences differ."}]},{"t":"Table 3-4: Subtypes of VSCCs","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Table 3-4","tb":[[["Type","Pore-forming","Location","Function"],["L","Cav1.2, 1.3","Cell bodies, dendrites","Gene expression, synaptic integration"],["N","Cav2.2","Nerve terminals; dendrites, cell bodies","Transmitter release; synaptic integration"],["P/Q","Cav2.1","Nerve terminals; dendrites, cell bodies","Transmitter release; synaptic integration"],["R","Cav2.3","Nerve terminals; cell bodies, dendrites","Transmitter release; repetitive firing, synaptic integration"],["T","Cav3.1, 3.2, 3.3","Cell bodies, dendrites","Pacemaking, repetitive firing, synaptic integration"]]],"p":[{"label":"Focus","text":"N and P/Q: presynaptic, transmitter release, targeted by some psychotropics."}]},{"t":"Which VSCC subtypes matter where","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Table 3-4","c":[{"head":"N, P/Q","body":"Presynaptic; regulate transmitter release; targeted by certain psychotropics"},{"head":"L","body":"CNS roles still being clarified; on vascular smooth muscle, target of dihydropyridine “calcium channel blockers” for hypertension"},{"head":"R, T","body":"Of interest; some anticonvulsants and psychotropics may act here; roles still being clarified"}]},{"t":"The snare: a cocked gun","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Fig 3-23","c":[{"head":"If a drug stops the channel opening…","body":"The vesicle stays tethered and neurotransmission can be prevented."}],"f":[["II–III loop snare hooks a synaptic vesicle to the channel","Nerve impulse arrives","Channel opens; Ca²⁺ enters","Snare “fires”: transmitter released"]],"p":[{"label":"Clinical link","text":"This may be desirable in states of excessive neurotransmission: pain, seizures, mania, or anxiety. It may explain some anticonvulsant actions."}]},{"t":"Snare proteins and vesicle docking","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"Fig 3-24","tb":[[["Protein","Role in Fig 3-24"],["SNAP 25 (synaptosomal-associated protein 25)","Snare protein linking the VSCC to the synaptic vesicle"],["Synaptobrevin","Snare protein linking the VSCC to the synaptic vesicle"],["Syntaxin","Snare protein linking the VSCC to the synaptic vesicle"],["Synaptotagmin","Snare protein linking the VSCC to the synaptic vesicle"],["VMAT","Vesicular monoamine transporter (shown on the left)"],["SV2A","Vesicle transporter; mechanism unclear; binds levetiracetam"]]],"p":[{"label":"Reading the figure","text":"Synaptic vesicle membrane on top, presynaptic membrane with the N or P/Q VSCC below; the snare proteins bridge them."}]},{"t":"Anticonvulsants across psychiatry","sec":"VSCCs: Voltage-Sensitive Calcium Channels","fig":"","p":[{"label":"Examples","text":"Examples from this chapter: pregabalin and gabapentin at α2δ (VSCC); levetiracetam at SV2A (vesicle)."}],"x":["Anticonvulsants are thought to act at various VSSCs and VSCCs, with uses including:","Bipolar depression","Bipolar maintenance"]},{"t":"Signal propagation: lighting a fuse","sec":"Ion Channels and Neurotransmission","fig":"Fig 3-25","f":[["Neuron A integrates inputs, encodes an action potential","VSSCs along the axon open one after another (the burning fuse)","Impulse reaches VSCCs loaded with vesicles in the terminal","Glutamate released onto neuron B"]],"p":[{"label":"Reading the figure","text":"Top (A): presynaptic neuron with labels for reception, integration, encoding, propagation, and transduction. Bottom (B): postsynaptic neuron receiving glutamate and beginning its own propagation. Same labels as Fig 1-3: this figure adds the ion channels that carry out each step."}]},{"t":"Excitation–secretion coupling, step by step","sec":"Ion Channels and Neurotransmission","fig":"Fig 3-26","x":["Action potential approaches; VSSC closed; VSCC closed but poised, snared to vesicle","Wave of positive charge detected by the VSSC voltmeter","Last VSSC opens; Na⁺ enters","Charge change detected by the VSCC voltmeter","VSCC opens: release is now irreversibly triggered","Local Ca²⁺ rises near vesicle and release machinery","Vesicle docks, merges, and spews transmitter into synapse"]},{"t":"The other half: neuron B","sec":"Ion Channels and Neurotransmission","fig":"Fig 3-25","f":[["VSSCs in neuron A propagate the impulse","VSCCs in neuron A release glutamate","Ligand-gated channels on neuron B dendrites receive it","VSSCs in neuron B propagate a new impulse"]],"p":[{"label":"Also","text":"Ligand-gated channels in neuron B also translate the glutamate signal into long-term potentiation, changing how neuron B functions."}],"x":["Voltage-gated and ligand-gated channels are presented separately, but they work cooperatively during neurotransmission."]},{"t":"Chapter summary: ligand-gated channels","sec":"Summary and Review","fig":"","c":[{"head":"Two classes of channel","body":"Ligand-gated (opened by transmitters) and voltage-sensitive (opened by membrane charge)."},{"head":"Receptor and channel","body":"Also called ionotropic or ion-channel-linked receptors."},{"head":"Two structures","body":"Pentameric: GABAA, nicotinic, 5HT3, glycine. Tetrameric: AMPA, kainate, NMDA."},{"head":"Agonist spectrum","body":"Full agonist, partial agonist, antagonist, inverse agonist."},{"head":"PAMs and NAMs","body":"Boost or diminish transmitter action at other sites."},{"head":"Several states","body":"Open, resting, closed, inactivated, desensitized."}]},{"t":"Chapter summary: voltage-sensitive channels","sec":"Summary and Review","fig":"","c":[{"head":"VSSCs and VSCCs","body":"The voltage-gated channels of most interest to psychopharmacology."},{"head":"Shared design","body":"6-TM subunits; S4 voltmeter; S5–S6 ionic filter; four subunits form the pore."},{"head":"Key difference","body":"VSSC III–IV loop plugs the pore; VSCC II–III loop is a snare to vesicles."},{"head":"Anticonvulsants","body":"Bind various sites on these channels: anticonvulsant, mood-stabilizing, pain, anxiety, and sleep effects."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Expect fast onset","body":"Drugs at ligand-gated channels (e.g. benzodiazepines) can act almost immediately, unlike many G-protein-receptor effects on mood."},{"head":"Know the GABAA sites","body":"Benzodiazepine, Z-drug PAM, and neurosteroid sites; phasic vs tonic inhibition."},{"head":"Think adaptation","body":"Prolonged agonist exposure desensitizes, then inactivates channels, as nicotine shows."},{"head":"Calming overactive release","body":"Blocking N and P/Q VSCC opening (e.g. via α2δ) keeps vesicles tethered: a rationale in pain, seizures, mania, anxiety."}]}],"cards":[{"id":"c3-1","q":"Give three names for a ligand-gated ion channel and explain why there are several.","a":"Ligand-gated ion channel, ionotropic receptor, ion-channel-linked receptor: it is both receptor and channel."},{"id":"c3-2","q":"Why can drugs at ionotropic receptors have immediate clinical onset?","a":"They immediately change ion flow, without waiting for downstream signal transduction."},{"id":"c3-3","q":"Name the pentameric ligand-gated channels (Table 3-1).","a":"GABAA, nicotinic (e.g. α7, α4β2), 5HT3, and strychnine-sensitive glycine receptors."},{"id":"c3-4","q":"How do tetrameric glutamate receptor subunits differ in structure?","a":"Three full TM regions plus a re-entrant loop; four subunits, with loops lining the pore."},{"id":"c3-5","q":"What is constitutive activity at an ion channel?","a":"Infrequent opening even with no agonist or with an antagonist bound."},{"id":"c3-6","q":"What does an antagonist do in the presence of an inverse agonist?","a":"It increases opening frequency, returning the channel to its resting state."},{"id":"c3-7","q":"Name the five states of a ligand-gated ion channel.","a":"Resting, open, closed, desensitized, inactivated."},{"id":"c3-8","q":"Why do cigarettes last as long as they do?","a":"One cigarette desensitizes nicotinic receptors; they stay inactivated about as long as the gap between cigarettes."},{"id":"c3-9","q":"What is a PAM? Give an example and its clinical effects.","a":"Boosts transmitter action at another site; benzodiazepines at GABAA: less anxiety, sleep, anticonvulsant, amnesia, muscle relaxation."},{"id":"c3-10","q":"How do PCP and ketamine block NMDA receptors?","a":"NAMs that enter only the OPEN channel and bind inside it, blocking glutamate/glycine opening."},{"id":"c3-11","q":"What does transmembrane segment 4 do?","a":"It is the voltmeter that senses membrane charge and triggers opening or closing."},{"id":"c3-12","q":"Which loop plugs the VSSC, and which loop forms the VSCC snare?","a":"VSSC: III–IV loop (pore inactivator). VSCC: II–III loop (snare)."},{"id":"c3-13","q":"Which drugs bind α2δ?","a":"Pregabalin and gabapentin."},{"id":"c3-14","q":"Which VSCC subtypes regulate transmitter release?","a":"N and P/Q (also R, per Table 3-4)."},{"id":"c3-15","q":"Why might blocking N/P/Q channels help pain, seizures, mania, or anxiety?","a":"The vesicle stays tethered, preventing excessive neurotransmission."},{"id":"c3-16","q":"Trace the ion channels from an action potential in neuron A to a new impulse in neuron B.","a":"VSSCs (A axon) → VSCCs (A terminal, glutamate release) → ligand-gated channels (B dendrites) → VSSCs (B)."}],"glossary":[{"t":"LGIC","m":"Ligand-gated ion channel"},{"t":"TM","m":"Transmembrane region"},{"t":"GABAA","m":"GABA A receptor (chloride channel)"},{"t":"5HT3","m":"Serotonin 3 receptor"},{"t":"α4β2, α7","m":"Nicotinic receptor subtypes"},{"t":"NRPA","m":"Nicotinic receptor partial agonist"},{"t":"AMPA","m":"α-amino-3-hydroxy-5-methyl-4-isoxazole-propionic acid"},{"t":"NMDA","m":"N-methyl-D-aspartate"},{"t":"GluR","m":"Glutamate receptor subunit"},{"t":"KA","m":"Kainate receptor subunit"},{"t":"PAM","m":"Positive allosteric modulator"},{"t":"NAM","m":"Negative allosteric modulator"},{"t":"PCP","m":"Phencyclidine (“angel dust”)"},{"t":"Mg²⁺","m":"Magnesium"},{"t":"Z drugs","m":"Zolpidem, zaleplon, zopiclone, eszopiclone"},{"t":"ACh","m":"Acetylcholine"},{"t":"AChE","m":"Acetylcholinesterase"},{"t":"VSSC","m":"Voltage-sensitive sodium channel"},{"t":"VSCC","m":"Voltage-sensitive calcium channel"},{"t":"S4","m":"Transmembrane segment 4 (voltmeter)"},{"t":"α / α1","m":"Pore-forming unit (VSSC / VSCC)"},{"t":"β","m":"Regulatory subunit"},{"t":"γ","m":"Membrane-spanning VSCC subunit"},{"t":"α2δ","m":"VSCC protein; pregabalin/gabapentin target"},{"t":"Cav","m":"Calcium channel pore-forming subunit"},{"t":"L, N, P/Q, R, T","m":"VSCC subtypes"},{"t":"SNAP 25","m":"Synaptosomal-associated protein 25"},{"t":"VMAT","m":"Vesicular monoamine transporter"},{"t":"SV2A","m":"Vesicle transporter bound by levetiracetam"},{"t":"LTP","m":"Long-term potentiation"},{"t":"Na⁺ / Ca²⁺","m":"Sodium / calcium ions"},{"t":"K⁺ / Cl⁻","m":"Potassium / chloride ions"},{"t":"EC coupling","m":"Excitation–secretion coupling"},{"t":"Phasic","m":"GABAA inhibition via benzodiazepine/Z sites"},{"t":"Tonic","m":"GABAA inhibition via neurosteroid sites"},{"t":"Desens.","m":"Desensitization"}]},{"n":4,"title":"Psychosis, Schizophrenia, and the Networks Dopamine, Serotonin, and Glutamate","short":"Psychosis & schizophrenia","notes":[{"t":"Psychosis is a syndrome, not a disorder","sec":"","fig":"","b":["At a minimum, psychosis means delusions and hallucinations: the “positive symptoms.”","May also include: disorganized speech and behavior, gross distortions of reality testing, and negative symptoms (diminished emotional expression, decreased motivation).","Stigma: the term is often misused, even by professionals."],"c":[{"head":"Delusions","body":"Fixed beliefs, often bizarre, with an inadequate rational basis, that cannot be changed by rational argument or contrary evidence."},{"head":"Hallucinations","body":"Perceptual experiences in any sense, especially auditory, without a real stimulus: vivid, clear, like normal perception, and not under voluntary control."}]},{"t":"Table 4-1: Pharmacological models of psychosis","sec":"","fig":"Table 4-1","tb":[[["","Psychostimulants (cocaine, amphetamine)","Dissociative anesthetics (PCP, ketamine)","Psychedelics (LSD, psilocybin)"],["Proposed mechanism","Dopamine D2 agonist","NMDA antagonist","Serotonin 5HT2A agonist (and to a lesser extent 5HT2C)"],["Main type of hallucinations","Auditory","Visual","Visual"],["Most frequent delusions","Paranoid","Paranoid","Mystical"],["Insightfulness","No","No","Yes"]]],"x":["D2 = dopamine 2; PCP = phencyclidine; NMDA = N-methyl-D-aspartate; LSD = lysergic acid diethylamide; 5HT = serotonin"]},{"t":"Three neurotransmitter hypotheses of psychosis","sec":"","fig":"Fig 4-1","x":["Hyperactive dopamine at D2 receptors in the mesolimbic pathway","NMDA receptor hypofunction at critical prefrontal synapses","5HT2A receptor hyperfunction in the cortex","Downstream mesolimbic DA hyperactivity","Glutamate and serotonin theories both converge on dopamine"]},{"t":"Three kinds of psychosis","sec":"Symptoms of Psychosis","fig":"","c":[{"head":"Paranoid","body":["Paranoid projection","Hostile belligerence","Grandiose expansiveness","Often schizophrenia and drug-induced psychoses"]},{"head":"Disorganized / excited","body":["Conceptual disorganization","Disorientation","Excitement","Any psychotic disorder can be disorganized"]},{"head":"Depressive","body":["Psychomotor retardation and apathy","Anxious self-punishment and blame","Often psychotic depression"]}]},{"t":"Paranoid and disorganized/excited features","sec":"Symptoms of Psychosis","fig":"","tb":[[["Feature","Examples from Ch. 4","Often seen in"],["Paranoid projection","Preoccupied with delusions; people talking about or plotting against one; external forces controlling one","Schizophrenia; drug-induced; PDP (unfaithful spouse, theft)"],["Hostile belligerence","Hostility, disdain, irritability, blaming, resentment, fault-finding, suspicion","Schizophrenia; drug-induced"],["Grandiose expansiveness","Superiority; praising voices; special powers, fame, or divine mission","Schizophrenia; manic psychosis"],["Conceptual disorganization","Irrelevant or incoherent answers, drifting off, neologisms, repetition","Any psychotic disorder"],["Disorientation","Not knowing place, season, year, or own age","Dementias; drug-induced states"],["Excitement","Unrestrained, hurried, loud speech; elevated mood; overactivity","Mania; schizophrenia"]]]},{"t":"Depressive psychosis, perception, and motor signs","sec":"Symptoms of Psychosis","fig":"","c":[{"head":"Psychomotor retardation & apathy","body":"Slowed speech and movement; fixed face; indifference to future; poor recent memory; blocking; slovenly appearance; whispered speech. Hard to tell from negative symptoms."},{"head":"Anxious self-punishment & blame","body":"Self-condemnation, guilt, remorse, worthlessness, apprehension, preoccupation with suicidal thoughts. Seen often in psychotic depression."},{"head":"Perceptual distortions","body":"Distressing voices (accusing, blaming, threatening); visions; touch, taste, or smell hallucinations; familiar things seem changed."},{"head":"Motor disturbances","body":"Rigid postures, tension, inappropriate grins, repetitive gestures, muttering, glancing around as if hearing voices."}]},{"t":"Dopamine synthesis and inactivation","sec":"The Dopamine Neurotransmitter Network","fig":"Figs 4-2, 4-3","tb":[[["Inactivation route","Striatal DA terminal","Prefrontal (cortical) DA terminal"],["DAT (reuptake)","Principal route; DA re-stored for reuse","Relatively sparse"],["COMT (extracellular)","Secondary","Principal route"],["MAO-A / MAO-B (intracellular)","Destroys excess DA","Destroys excess DA"],["NET on nearby NE neurons","—","Takes up diffusing DA as a “false” substrate"]]],"f":[["Tyrosine enters via tyrosine transporter","TOH (rate-limiting) → DOPA","DDC → dopamine","VMAT2 → synaptic vesicle"]]},{"t":"Dopamine receptors: D1-like vs D2-like","sec":"The Dopamine Neurotransmitter Network","fig":"Figs 4-4, 4-5","c":[{"head":"D1-like: D1, D5","body":["Excitatory","Positively linked to adenylate cyclase","Stimulate the postsynaptic neuron"]},{"head":"D2-like: D2, D3, D4","body":["Inhibitory","Negatively linked to adenylate cyclase","Inhibit the postsynaptic neuron"]}],"p":[{"label":"Sensitivity","text":"D2 and D3 are also presynaptic autoreceptors that brake DA release. D3 is MORE sensitive to DA than D2, so it shuts release off at a lower synaptic DA concentration. D1 is the LEAST sensitive, needing more DA to activate."}]},{"t":"D2/D3 autoreceptors: the gatekeepers","sec":"The Dopamine Neurotransmitter Network","fig":"Figs 4-6, 4-7, 4-8","c":[{"head":"Axon terminal (Fig 4-7)","body":"When DA builds up in the synapse and occupies the autoreceptor, further DA release is inhibited."},{"head":"Somatodendritic (Fig 4-8)","body":"DA binding here shuts off impulse flow in the DA neuron (loss of the lightning bolts), stopping further release."}],"p":[{"label":"Reading the figure","text":"Fig 4-6 draws the autoreceptor as a gatekeeper: empty-handed, the gate is open and DA is released; holding DA, the gate closes."}]},{"t":"Mesocortical vs mesostriatal dopamine neurons","sec":"The Dopamine Neurotransmitter Network","fig":"Fig 4-9","tb":[[["Feature","Mesocortical (VTA → PFC)","Mesostriatal (VTA/SN → striatum)"],["Somatodendritic autoreceptors","D2 or D3 in VTA","D3 (mesolimbic, VTA); D2 (nigrostriatal, SN)"],["Terminal autoreceptors","Sparse","Present (D2 or D3)"],["DATs at terminals","Few if any","Present"],["Diffusion radius (blue cloud)","Large: volume transmission","Smaller; D2 wider than D3"],["Main postsynaptic receptors","D1 (excitatory, least DA-sensitive)","D1, D2, and D3"]]],"p":[{"label":"Why it matters","text":"Wide DA diffusion in PFC suits D1 receptors, which need higher DA concentrations."}]},{"t":"The five dopamine pathways","sec":"The Dopamine Neurotransmitter Network","fig":"Fig 4-10","tb":[[["","Pathway","From → to","Function","In untreated schizophrenia"],["a","Nigrostriatal","Substantia nigra → striatum","Motor (extrapyramidal)","Believed normal"],["b","Mesolimbic","VTA → nucleus accumbens","Motivation, reward, pleasure","Hyperactive: positive symptoms"],["c","Mesocortical","VTA → DLPFC and VMPFC","Cognition (DLPFC); affect (VMPFC)","Hypoactive: cognitive, negative, affective"],["d","Tuberoinfundibular","Hypothalamus → anterior pituitary","Inhibits prolactin","Relatively preserved"],["e","Thalamic","PAG, ventral mesencephalon, hypothalamic nuclei, lateral parabrachial → thalamus","Under study (sleep/arousal?)","No evidence of abnormality"]]]},{"t":"Tuberoinfundibular pathway and prolactin","sec":"The Dopamine Neurotransmitter Network","fig":"Fig 4-11","c":[{"head":"If disrupted (lesions or drugs)","body":["Galactorrhea","Gynecomastia","Amenorrhea","Possibly sexual dysfunction"]}],"f":[["Hypothalamic DA neurons tonically active","DA inhibits prolactin release from anterior pituitary","Postpartum: DA activity falls → prolactin rises → lactation"]],"p":[{"label":"Clinical link","text":"These problems can occur with many drugs for psychosis that block D2 receptors, because they remove DA’s brake on prolactin."}]},{"t":"Nigrostriatal pathway: “go” and “stop”","sec":"The Dopamine Neurotransmitter Network","fig":"Figs 4-12, 4-13A–F","f":[["Striatal GABA neuron with D1 (excitatory)","→ GPi/SNr (inhibited)","Thalamus released → glutamate to cortex","GO: movement"],["Striatal GABA neuron with D2 (inhibitory)","→ GPe → STN → GPi","GPi GABA inhibits thalamus","STOP: no movement"]],"x":["Direct pathway: DA at D1 says “go more”","Indirect pathway: DA at D2 says “don’t stop”"]},{"t":"Nigrostriatal dopamine: too little or too much","sec":"The Dopamine Neurotransmitter Network","fig":"Figs 4-12, 4-13","c":[{"head":"Too little DA","body":["Parkinson’s disease: rigidity, akinesia/bradykinesia, tremor","Possibly akathisia (restlessness) and dystonia (twisting of face and neck)","Replicated by D2 blockers: drug-induced parkinsonism (“EPS”)"]},{"head":"Too much DA","body":["Hyperkinetic disorders: chorea, dyskinesias, tics (e.g. Huntington’s, Tourette)","Levodopa-induced dyskinesias (chronic D2 stimulation)","Tardive dyskinesia (hypothesized from chronic D2 BLOCKADE)"]}]},{"t":"Mesolimbic pathway: the reward circuit","sec":"The Dopamine Neurotransmitter Network","fig":"Fig 4-14","c":[{"head":"Normal (Fig 4-14A)","body":"Motivation, pleasure, reward: food, sex, music. Possibly the final common pathway of all reward."},{"head":"Drug-induced high (4-14B)","body":"Too much DA: artificial reward of substance abuse (Chapter 13)."},{"head":"Positive symptoms (4-14C)","body":"Too much DA: delusions and hallucinations."},{"head":"Too little (4-14D)","body":"Anhedonia, apathy, lack of energy: depression and negative symptoms."}]},{"t":"Classic hypothesis: mesolimbic hyperdopaminergia","sec":"The Dopamine Hypothesis of Psychosis","fig":"Fig 4-15","b":["Hyperactive mesolimbic DA = a final common pathway for positive symptoms in schizophrenia, drug-induced psychosis, mania, depression, Parkinson’s disease, and dementia.","May also drive impulsivity, agitation, aggression/violence, and hostility.","Direct pharmacological cause with cocaine or methamphetamine.","In schizophrenia and other disorders it may be an INDIRECT consequence of dysregulated prefrontal glutamate and serotonin circuits."],"p":[{"label":"Caution","text":"Some wrongly assume all positive symptoms come from mesolimbic DA and all treatment must block D2. There is much more to psychosis and to its treatment (Chapter 5)."}]},{"t":"New concept: the integrative hub","sec":"The Dopamine Hypothesis of Psychosis","fig":"Fig 4-16","c":[{"head":"Classic view (Fig 4-16A)","body":["Dorsal striatum = motor (“neurologists’ striatum”)","Ventral striatum = emotion (“psychiatrists’ striatum”)","Overactivity in ventral striatum"]},{"head":"Neuroimaging view (Fig 4-16B)","body":["Ventral striatum may be unaltered","Overactivity in the associative striatum","Input from medial and lateral substantia nigra"]}],"p":[{"label":"Take-home","text":"Think “mesostriatal” rather than separate nigrostriatal and mesolimbic pathways. The dorsal striatum also has emotional roles (compulsions and habits, Chapter 13)."}]},{"t":"Mesocortical hypodopaminergia","sec":"The Dopamine Hypothesis of Psychosis","fig":"Figs 4-17, 4-18, 4-19","c":[{"head":"VTA → DLPFC (Fig 4-17)","body":["Normally: cognition and executive function","Too little DA: cognitive and some negative symptoms"]},{"head":"VTA → VMPFC (Fig 4-18)","body":["Normally: emotions and affect","Too little DA: affective and other negative symptoms"]}],"p":[{"label":"Note","text":"The exact role is still debated, but the deficit state of negative symptoms implies underactive mesocortical projections."}]},{"t":"Dopamine in schizophrenia: one picture","sec":"The Dopamine Hypothesis of Psychosis","fig":"","x":["Mesolimbic / mesostriatal","Positive symptoms; possibly agitation, hostility, aggression","Cognitive, negative, affective symptoms","Nigrostriatal & tuberoinfundibular","But blocking D2 here causes parkinsonism, TD, hyperprolactinemia"]},{"t":"Glutamate: the brain’s “master switch”","sec":"The Glutamate Neurotransmitter Network","fig":"","c":[{"head":"Major excitatory transmitter","body":"Can excite and turn on virtually all CNS neurons"},{"head":"Also a building block","body":"Its main use is actually as an amino acid for protein synthesis"},{"head":"Clinical relevance","body":"Implicated in schizophrenia, positive symptoms generally, and depression"}],"p":[{"label":"Key difference","text":"Unlike other transmitter systems, glutamate’s synaptic action is stopped not by enzymatic breakdown but by removal via EAATs (mainly into glia)."}]},{"t":"The glutamate–glutamine cycle","sec":"The Glutamate Neurotransmitter Network","fig":"Figs 4-20A–D","p":[{"label":"Reading the figure","text":"Numbers 1–7 match the arrows in Figs 4-20A–D."}],"x":["Glutamate released from presynaptic neuron","Taken into glia by EAAT","Glutamine synthetase: glutamate → glutamine (glia)","Glutamine leaves glia on reversed glial SNAT","Enters neuron via neuronal SNAT","Glutaminase (mitochondria): glutamine → glutamate","vGluT loads glutamate into vesicles"]},{"t":"NMDA cotransmitters: glycine and D-serine","sec":"The Glutamate Neurotransmitter Network","fig":"Figs 4-21, 4-22","c":[{"head":"Glycine","body":["Not made by glutamate neurons","Glycine neurons contribute little (GlyT2 recaptures it)","Glia are the main source: released on reversed GlyT1","Inward GlyT1 terminates synaptic glycine","Made from L-serine by SHMT (reversible)"]},{"head":"D-serine","body":["A D-amino acid with high affinity for the NMDA glycine site","Glial D-serine racemase converts L-serine ↔ D-serine","Released on reversed glial D-SER-T; recaptured by D-SER-T","Destroyed by DAO → hydroxypyruvate","DAO is activated by DAOA"]}]},{"t":"Glutamate receptors at the synapse","sec":"The Glutamate Neurotransmitter Network","fig":"Fig 4-23","p":[{"label":"Naming","text":"NMDA, AMPA, and kainate are named for the agonists that selectively bind them."}],"x":["Presynaptic/glial reuptake; clears glutamate","Loads glutamate into vesicles","Metabotropic (mGluR)","G-protein-linked; pre- or postsynaptic","Ligand-gated Ca²⁺ channel; needs cotransmitter","Ligand-gated; fast excitatory (Na⁺)","Ligand-gated; fast excitatory"]},{"t":"Table 4-2: Glutamate receptors","sec":"The Glutamate Neurotransmitter Network","fig":"Table 4-2","tb":[[["Metabotropic group","Subtypes"],["Group I","mGluR1, mGluR5"],["Group II","mGluR2, mGluR3"],["Group III","mGluR4, mGluR6, mGluR7, mGluR8"]],[["Ionotropic class","Gene family","Agonists","Antagonists"],["AMPA","GluR1–4","Glutamate, AMPA, kainate","—"],["Kainate","GluR5–7, KA1, KA2","Glutamate, kainate","—"],["NMDA","NR1, NR2A–D","Glutamate, aspartate, NMDA","MK801, ketamine, PCP"]]],"p":[{"label":"Metabotropic roles","text":"Groups II and III may sit presynaptically as autoreceptors that block glutamate release (Fig 4-24), so their agonists could reduce glutamate release. Group I may be mainly postsynaptic, strengthening ionotropic responses."}]},{"t":"AMPA/kainate vs NMDA receptors","sec":"The Glutamate Neurotransmitter Network","fig":"Figs 4-25, 4-26, 4-27","c":[{"head":"AMPA and kainate (Fig 4-25)","body":["Fast excitatory transmission: Na⁺ in, depolarization","Sustained glutamate → desensitization"]},{"head":"NMDA: a coincidence detector","body":"At rest, Mg²⁺ plugs its calcium channel (Mg²⁺ acts as a NAM, Fig 4-26)."}],"f":[["1: glutamate bound","2: glycine or D-serine bound","3: depolarization removes Mg²⁺","Ca²⁺ enters → LTP, plasticity"]],"x":["All three must happen at the same time (Fig 4-27: AMPA depolarization unplugs the NMDA channel)"]},{"t":"Key glutamate pathways","sec":"The Glutamate Neurotransmitter Network","fig":"Fig 4-28","tb":[[["","Pathway","Key point"],["a","Cortico-brainstem","PFC → raphe, VTA/SN, locus coeruleus; direct = stimulates release, via GABA = blocks"],["b","Cortico-striatal","PFC → striatal GABA neurons → globus pallidus"],["c","Hippocampal-accumbens","Hippocampus → nucleus accumbens GABA neurons; linked to schizophrenia"],["d","Thalamo-cortical","Brings (often sensory) information into cortex"],["e","Cortico-thalamic","May direct how thalamus reacts to sensory input"],["f","Cortico-cortical (direct)","Pyramidal neurons excite each other"],["g","Cortico-cortical (indirect)","Pyramidal neurons inhibit each other via GABA interneurons"]]]},{"t":"The hypothetical site: glutamate onto GABA","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Fig 4-29A","f":[["1: Pyramidal neuron releases glutamate onto NMDA receptor of GABA interneuron","2: Interneuron releases GABA at α2 GABA receptors on next pyramidal neuron’s axon","3: That pyramidal neuron is inhibited; cortical glutamate output restrained"]],"p":[{"label":"The problem","text":"Break step 1 and the brake fails: the downstream glutamate neuron is disinhibited and overactive (Fig 4-29B). In schizophrenia these interneurons may also have low GAD67 (less GABA made), with a compensatory increase in α2 GABAA receptors on the pyramidal axon initial segment."}]},{"t":"Three roads to the same broken synapse","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Figs 4-29B, 4-29C, 4-30","c":[{"head":"Neurodevelopment (box 1A)","body":"Genetic and environmental programming in schizophrenia makes the NMDA synapse hypofunctional."},{"head":"Ketamine / PCP (box 1B)","body":"Acute, reversible NMDA blockade at the same site. Both bind inside the open channel at the “PCP site” (Fig 4-30)."},{"head":"Neurodegeneration (Fig 4-29C)","body":"Plaques, tangles, Lewy bodies, and strokes knock out some neurons and spare others, creating the same dysconnectivity."}]},{"t":"From NMDA hypofunction to dopamine excess","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Figs 4-31, 4-33, 4-34","tb":[[["Cause","Figure","Extra point"],["Schizophrenia","Fig 4-31","Neurodevelopmental hypofunction"],["Ketamine / PCP","Fig 4-33","Drug blocks NMDA directly"],["Dementia","Fig 4-34","Excess glutamate in visual cortex can also cause visual hallucinations"]]],"f":[["NMDA hypofunction on PFC GABA interneuron","Cortico-brainstem glutamate neuron disinhibited","Excess glutamate at VTA (direct innervation)","Mesolimbic DA release ↑","Positive symptoms"]]},{"t":"A second route: the ventral hippocampus","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Fig 4-32","f":[["Hippocampal NMDA on GABA interneuron hypofunctional","Glutamate to nucleus accumbens ↑","Accumbens GABA to globus pallidus ↑","Pallidal GABA to VTA ↓","VTA DA disinhibited: DA ↑ in accumbens"]],"p":[{"label":"Take-home","text":"Same end point as the prefrontal route: too much mesolimbic dopamine."}]},{"t":"Why NMDA hypofunction also causes negative symptoms","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Fig 4-35","c":[{"head":"Mesostriatal DA neurons","body":["Glutamate innervates DA neurons DIRECTLY","Excess glutamate → DA ↑","Positive symptoms"]},{"head":"Mesocortical DA neurons","body":["Glutamate acts via a VTA GABA interneuron","Excess glutamate → GABA ↑ → DA ↓ in PFC","Negative, cognitive, affective symptoms"]}],"p":[{"label":"Key","text":"One upstream defect, opposite downstream dopamine effects: too much in striatum, too little in cortex."}]},{"t":"Why only some dementia patients become psychotic","sec":"The NMDA Glutamate Hypofunction Hypothesis","fig":"Fig 4-29C","b":["Neurodegeneration knocks out some glutamate pyramidal neurons and GABA interneurons while sparing others, at least temporarily.","Psychosis hypothetically arises only when the pattern of loss leaves intact the glutamate neurons that drive dopamine neurons downstream.","This produces the same dysconnectivity as schizophrenia and ketamine/PCP psychosis, by a different mechanism."],"p":[{"label":"Scale","text":"Up to half of patients with dementia may experience psychosis at some point (Chapter 12)."}]},{"t":"Serotonin synthesis and termination","sec":"The Serotonin Neurotransmitter Network","fig":"Figs 4-36, 4-37","c":[{"head":"SERT","body":["Terminates 5HT action by reuptake","Thought to be on ALL 5HT neurons (unlike DAT on DA neurons)","Functional polymorphisms matter for SERT-blocking drugs"]},{"head":"MAO-B","body":["Inside serotonin neurons","Low affinity for 5HT","Destroys 5HT only at high intracellular concentrations"]}],"f":[["Tryptophan transported in","TRY-OH → 5HTP","AAADC → 5HT","VMAT2 → vesicle"]]},{"t":"Serotonin autoreceptors","sec":"The Serotonin Neurotransmitter Network","fig":"Figs 4-38 to 4-41","tb":[[["Receptor","Location","Effect of 5HT","Role"],["5HT1A","Somatodendritic (raphe)","Slows impulse flow; less release","Negative feedback"],["5HT2B","Somatodendritic","More impulse flow; more release","Feed-forward"],["5HT1B/D","Axon terminal","Blocks further release","Negative feedback (terminal autoreceptor)"]]],"p":[{"label":"Balance","text":"The balance between 5HT1A and 5HT2B at the somatodendritic end appears important for how much serotonin is released throughout the brain. All these receptors can ALSO be postsynaptic."}]},{"t":"Beyond “chemical imbalance”: tuning networks","sec":"The Serotonin Neurotransmitter Network","fig":"Figs 4-42, 4-43","b":["Every neurotransmitter regulates every other, trans-synaptically, through brain circuits.","Serotonin projects from raphe to PFC and to the cell bodies of NE (locus coeruleus), DA (VTA), histamine (tuberomammillary nucleus), and ACh (basal forebrain) neurons.","“Out-of-tune” networks may mediate symptoms; drugs may “tune” them at specific receptor subtypes.","Two-mechanism drugs, or two drugs, can be additive/synergistic or canceling/antagonistic."],"p":[{"label":"Net effect","text":"Net effect of 5HT depends on: which receptor, where it is expressed, its density and sensitivity, 5HT concentration and firing rate, and whether action is direct or via GABA."}]},{"t":"Serotonin controls glutamate directly and via GABA","sec":"The Serotonin Neurotransmitter Network","fig":"Fig 4-42","c":[{"head":"Directly on glutamate neurons","body":["Excitatory: 5HT2A, 5HT2C, 5HT4, 5HT6, 5HT7","Inhibitory: 5HT1A, 5HT5, possibly postsynaptic 5HT1B"]},{"head":"Indirectly via GABA interneurons","body":["5HT receptors on GABA interneurons control glutamate output","Some receptors (e.g. 5HT2A) sit on both, with opposing effects"]}],"p":[{"label":"Reading the figure","text":"Fig 4-42 labels two GABA interneuron types: parvalbumin-positive fast-spiking, and non-parvalbumin regular/late-spiking or bursting (the 5HT3-bearing type)."}]},{"t":"Postsynaptic 5HT receptors: net downstream effects","sec":"The Serotonin Neurotransmitter Network","fig":"Figs 4-44 to 4-51","tb":[[["Receptor","Direct action / usual site","Net downstream effect","Drug relevance (Ch. 4)"],["5HT1A","Inhibitory; often on GABA interneurons","↑ NE, DA, ACh release (disinhibition)","Many agents for psychosis, mood, anxiety are agonists/partial agonists"],["5HT1B","Inhibitory heteroreceptor on NE, DA, HA, ACh terminals","↓ release of those four","5HT1B antagonists used for depression"],["5HT2A","Excitatory; on glutamate neurons AND GABA interneurons","Both ↑ and ↓ glutamate","Antagonists: psychosis, mood; hallucinogens are agonists"],["5HT2C","Excitatory; mostly on GABA interneurons","↓ NE and DA release","Agonists: obesity; antagonists: psychosis, mood"],["5HT3","Excitatory; on non-parvalbumin GABA interneurons","↓ ACh, NE, glutamate (and 5HT)","Antagonists may ↑ ACh, NE (depression)"],["5HT6","Postsynaptic; regulates ACh","Cognition","Antagonists proposed as pro-cognitive"],["5HT7","Excitatory; on GABA interneurons (cortex, raphe)","↓ glutamate; ↓ 5HT","Antagonists for psychosis and mood"]]]},{"t":"5HT2A: always excitatory, but it depends","sec":"The Serotonin Neurotransmitter Network","fig":"Fig 4-46","c":[{"head":"On glutamate neurons (apical dendrites)","body":"5HT2A stimulation → more glutamate release downstream."},{"head":"On GABA interneurons","body":"5HT2A stimulation → GABA release → inhibits the glutamate neuron: the opposite downstream effect."}],"p":[{"label":"Why it matters","text":"This dual location is central to the serotonin hyperfunction hypothesis of psychosis (next section) and to 5HT2A antagonist drugs (Chapters 5, 7)."}]},{"t":"Serotonin and glutamate regulate each other","sec":"The Serotonin Neurotransmitter Network","fig":"Figs 4-49, 4-51","f":[["High 5HT at 5HT3 on PFC GABA interneurons","More GABA onto pyramidal neuron","Less glutamate output","Less glutamate excitation of raphe → less 5HT"],["High 5HT → recurrent collateral in raphe","5HT7 on raphe GABA neuron","GABA inhibits 5HT cell body","Less 5HT release"]],"x":["Top: 5HT3 route (Fig 4-49)   ·   Bottom: 5HT7 route (Fig 4-51)"]},{"t":"Why a serotonin hypothesis was needed","sec":"The Serotonin Hyperfunction Hypothesis","fig":"","c":[{"head":"Parkinson’s disease","body":"D2 blockers worsen movements."},{"head":"Alzheimer disease","body":"D2 blockers increase risk of stroke and death."}],"p":[{"label":"The idea","text":"Hypothesis: psychosis can arise from an imbalance in excitatory 5HT2A stimulation of glutamate pyramidal neurons that project to the VTA/mesostriatal hub and to visual cortex."}]},{"t":"Three routes to 5HT2A-driven psychosis","sec":"The Serotonin Hyperfunction Hypothesis","fig":"Figs 4-52 to 4-55","tb":[[["","Hallucinogens (4-52B, 4-53)","Parkinson’s disease psychosis (4-52C, 4-54)","Dementia (4-52D, 4-55)"],["Agents / cause","LSD, mescaline, psilocybin (5HT2A agonists)","Loss of raphe 5HT terminals in PFC and visual cortex","Plaques, tangles, Lewy bodies, strokes"],["5HT2A status","Overstimulated","Upregulated: normal or low 5HT overstimulates","No consistent upregulation"],["Core imbalance","Too much 5HT2A excitation","Too many 5HT2A receptors","Loss of GABA inhibition; normal 5HT2A excitation now unopposed"],["Blocked by 5HT2A antagonists?","Yes","Yes","Yes (selective antagonism reduces it)"]]],"p":[{"label":"Common path","text":"All three end in glutamate excess → mesolimbic DA hyperactivity, plus visual hallucinations from visual cortex."}]},{"t":"Summary: three interconnected pathways","sec":"The Serotonin Hyperfunction Hypothesis","fig":"","p":[{"label":"Take-home","text":"Both 5HT2A and NMDA dysfunction can drive downstream mesolimbic DA. Targeting any node could, in theory, treat psychosis."}],"x":["Dopamine hyperactivity at D2 in the mesolimbic/mesostriatal pathway (VTA/mesostriatal hub → ventral striatum)","NMDA receptor hypoactivity at GABA interneurons, losing GABA inhibition in PFC","Serotonin hyperactivity/imbalance at 5HT2A on cortical glutamate neurons"]},{"t":"The burden of schizophrenia","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"","tb":[[["Measure","Figures given in Ch. 4"],["Suicide","5% complete suicide; elsewhere: 25–50% attempt, up to 10% eventually succeed"],["Mortality","3–4× general population; elsewhere: 8× (suicide and premature cardiovascular disease)"],["Onset","Adolescence and early adulthood"]]],"x":["of the population, worldwide","minimum duration, with ≥1 month of positive or negative symptoms","shorter life expectancy (also stated as 25–30)"]},{"t":"Table 4-3: Positive symptoms","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Table 4-3; Fig 4-56","c":[{"head":"Key facts","body":["Delusions: most commonly persecutory; also referential, somatic, religious, grandiose","Hallucinations: any sense, but auditory are by far the most common and characteristic","Onset can be a sudden “break” from reality","Most effectively treated by medications"]}],"tb":[[["Positive symptoms of psychosis and schizophrenia"],["Delusions"],["Hallucinations"],["Distortions or exaggerations in language and communication"],["Disorganized speech"],["Disorganized behavior"],["Catatonic behavior"],["Agitation"]]]},{"t":"Table 4-4: Negative symptoms","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Table 4-4; Fig 4-56","tb":[[["Negative symptoms of schizophrenia",""],["Blunted affect","Difficulty in abstract thinking"],["Emotional withdrawal","Lack of spontaneity"],["Poor rapport","Stereotyped thinking"],["Passivity","Alogia: restricted fluency/productivity of thought and speech"],["Apathetic social withdrawal","Avolition: restricted initiation of goal-directed behavior"],["Anhedonia: lack of pleasure","Attentional impairment"]]],"p":[{"label":"Caution","text":"Negative symptoms can be hard to tell apart from cognitive and affective symptoms and from drug side effects (Chapter 5)."}]},{"t":"Table 4-5: The five “A”s of negative symptoms","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Table 4-5","tb":[[["Domain","Term","Translation (examples)"],["Communication","Alogia","Poverty of speech; talks little, uses few words"],["Affect","Blunted affect","Reduced range of emotions; feels numb or empty; recalls few emotional experiences"],["Socialization","Asociality","Reduced social drive; little sexual interest, few friends, little time with friends"],["Capacity for pleasure","Anhedonia","Previous hobbies or interests no longer pleasurable"],["Motivation","Avolition","Reduced ability to undertake and complete everyday tasks; may have poor hygiene"]]]},{"t":"Spotting negative symptoms quickly","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Figs 4-57, 4-58","c":[{"head":"By observation alone (Fig 4-57)","body":["Reduced speech","Poor grooming and hygiene","Limited eye contact"]},{"head":"With simple questions (Fig 4-58)","body":["Reduced emotional responsiveness","Reduced interest (hobbies, life goals)","Reduced social drive"]}],"p":[{"label":"Clinical link","text":"Negative symptoms can be part of a prodrome before full schizophrenia; monitor high-risk patients so treatment can start at the first signs of psychosis. They can also persist between episodes and impair functioning."}]},{"t":"Five symptom dimensions and their circuits","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Fig 4-59","tb":[[["Symptom dimension","Hypothetically malfunctioning region (Fig 4-59)"],["Positive","Mesolimbic"],["Negative","Mesocortical/prefrontal cortex; nucleus accumbens reward circuits"],["Cognitive","Dorsolateral prefrontal cortex"],["Affective","Ventromedial prefrontal cortex"],["Aggressive","Orbitofrontal cortex; amygdala"]]],"p":[{"label":"Reading the figure","text":"Match each coloured symptom bubble in Fig 4-59 to its brain region."}]},{"t":"Table 4-6: Cognitive symptoms","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Table 4-6","c":[{"head":"Not dementia-like","body":["Emphasis is executive dysfunction, not short-term memory","Begins before first psychosis","Worsens in prodrome and over the course"]}],"tb":[[["Cognitive symptoms of schizophrenia",""],["Representing and maintaining goals","Prioritizing"],["Allocating attentional resources","Modulating behavior based on social cues"],["Focusing attention","Serial learning"],["Sustaining attention","Impaired verbal fluency"],["Evaluating functions","Difficulty with problem solving"],["Monitoring performance",""]]]},{"t":"Affective symptoms: treat them","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"","b":["Common: depressed mood, anxious mood, guilt, tension, irritability, worry.","Overlap: depressed mood, anhedonia, and low motivation can be hard to tell from negative symptoms or a comorbid mood/anxiety disorder.","Action: if not improved by drugs for positive symptoms, consider adding drugs for anxiety and/or depression (e.g. SSRIs).","Why: relieve symptoms AND help prevent suicide, which is common in schizophrenia."],"p":[{"label":"Clinical link","text":"Treat affective symptoms even if they do not meet full criteria for a comorbid disorder. The same drugs do little for true negative symptoms."}]},{"t":"Aggression, agitation, and violence","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"Fig 4-60","tb":[[["Type","Features"],["Impulsive (reactive)","High autonomic arousal; provoked; anger or fear; response to stress"],["Organized (predatory)","Planned, “cold-blooded,” no arousal; psychopathic/criminogenic"],["Psychotic","Command hallucinations and/or delusions; least common"]]],"p":[{"label":"Clinical link","text":"Aggression = intentional harm; agitation = nonspecific heightened activity with tension. Both often improve when positive symptoms are treated. Clozapine or high doses may help psychotic or impulsive violence; behavioral approaches help impulsive violence."}]},{"t":"Serious mental illness and the justice system","sec":"Schizophrenia: The Prototypical Psychotic Disorder","fig":"","p":[{"label":"Perspective","text":"Violence is often exaggerated by media and fuels stigma. In forensic settings, criminogenic risk from institutionalization, more than positive symptoms, appears to drive much violence. Only about a third of state forensic patients commit a violent act during hospitalization."}],"x":["Largest “mental health facilities”","Jails: LA County, Rikers Island, Cook County","of ~2 million US inmates have serious mental illness","of California forensic patients commit ~40% of hospital violence"]},{"t":"Not one gene: inherited risk, not illness","sec":"What Causes Schizophrenia?","fig":"Figs 4-61, 4-62","c":[{"head":"Classic theory (rejected)","body":"Abnormal gene → abnormal product → neuronal malfunction → mental illness."},{"head":"Modern view","body":"Genes code for proteins and epigenetic regulators. Many risk genes “conspire” with environmental stressors."}],"p":[{"label":"Key","text":"Individuals inherit RISK for mental illness, not mental illness. A few hundred risk genes each contribute less than 1%; summed as a polygenic risk score, they still explain only part of the risk."}]},{"t":"Nurture: environmental stressors","sec":"What Causes Schizophrenia?","fig":"Fig 4-62","tb":[[["Stressor / finding","Figure given in Ch. 4"],["High-potency cannabis","If nobody smoked it: 12% of first-episode psychosis across Europe prevented; 32% in London; 50% in Amsterdam"],["Migrants","In London, psychosis incidence falls by one-third if migrants and their children are excluded"],["Identical twins","Only half of co-twins of patients also have schizophrenia"],["Others","Early childhood adversity, bullying, obstetric events, sleep deprivation, trauma, viruses/toxins"]]],"p":[{"label":"Take-home","text":"Schizophrenia results from both nature and nurture."}]},{"t":"Table 4-7: Candidate risk genes","sec":"What Causes Schizophrenia?","fig":"Table 4-7","tb":[[["Function","Gene","Description (paraphrased)"],["Glutamate & synaptic plasticity","GRIA1","Ionotropic glutamate receptor for fast neurotransmission"],["","GRIN2A","Glutamate-gated channel protein; key mediator of synaptic plasticity"],["","GRM3","Metabotropic glutamate receptor 3; explored as a drug target"],["Calcium channels & signaling","CACNA1C","α1 subunit of voltage-sensitive calcium channels"],["","CACNB2","A voltage-sensitive calcium channel"],["Neurogenesis","SOX2","Transcription factor essential for neurogenesis"],["","SATB2","Cognitive development; long-term plasticity"]]]},{"t":"Normal neurodevelopment","sec":"What Causes Schizophrenia?","fig":"Figs 4-63, 4-64","c":[{"head":"Birth → age 6","body":"Synapses formed at a furious rate"},{"head":"Puberty & adolescence","body":"Competitive elimination peaks; ½ to ⅔ of childhood synapses survive"},{"head":"Adulthood","body":"About 7% of cortical synapses lost (and replaced) each week"}],"f":[["Stem cells → immature neurons","Selection (others die: apoptosis)","Migration","Differentiation & myelination","Synaptogenesis","Competitive elimination"]]},{"t":"The neurodevelopmental hypothesis","sec":"What Causes Schizophrenia?","fig":"Fig 4-65","f":[["Active glutamate synapse → NMDA → LTP","More AMPA receptors: “strong” synapse","Survives competitive elimination"],["Flawed genes + environment → NMDA hypofunction","Weak LTP, few AMPA: “weak” synapse","Wrongly eliminated → dysconnectivity"]],"p":[{"label":"Why adolescence?","text":"Extra weak connections may mask the defect in childhood; when adolescent pruning removes them, schizophrenia emerges. This may explain onset timing."}]},{"t":"Neurodegeneration: the course of illness","sec":"What Causes Schizophrenia?","fig":"Fig 4-66","f":[["Asymptomatic","Prodrome","First episode: robust treatment response; brain looks normal","Recurrent episodes: declining response; progressive tissue loss","Treatment resistance; pervasive negative/cognitive symptoms"]],"p":[{"label":"Clinical link","text":"Episodes often follow medication discontinuation. Shortening untreated psychosis may slow progression, and continuous treatment after onset is now the standard of care, to reduce deterioration, tissue loss, tripled suicide attempts, and treatment resistance. Prodromal prevention remains speculative."}]},{"t":"Cost and course: the bigger picture","sec":"What Causes Schizophrenia?","fig":"","p":[{"label":"Clinical link","text":"Premature cardiovascular death comes from genetics and lifestyle (smoking, diet, inactivity, obesity, diabetes), and also from some antipsychotics that raise obesity and diabetes risk."}],"x":["acute schizophrenic episodes a year in the US","of all US social security benefit days","of dollars a year, direct and indirect, in the US"]},{"t":"Tables 4-8 and 4-9: Where psychosis appears","sec":"Other Psychotic Illnesses","fig":"Tables 4-8, 4-9","tb":[[["Table 4-8: psychosis is a DEFINING feature"],["Schizophrenia"],["Substance/medication-induced psychotic disorders"],["Schizophreniform disorder"],["Schizoaffective disorder"],["Delusional disorder"],["Brief psychotic disorder"],["Shared psychotic disorder"],["Psychotic disorder due to another medical condition"],["Childhood psychotic disorder"]],[["Table 4-9: psychosis is an ASSOCIATED feature"],["Mania"],["Depression"],["Cognitive disorders"],["Alzheimer disease and other dementias"],["Parkinson’s disease"]]],"p":[{"label":"Note","text":"Positive, negative, and cognitive symptoms are not unique to schizophrenia; mood disorders, dementias, autism, and others share them."}]},{"t":"Parkinson’s disease psychosis is not schizophrenia","sec":"Other Psychotic Illnesses","fig":"Figs 4-52C, 4-54","tb":[[["Feature","Parkinson’s disease psychosis","Schizophrenia"],["Hallucinations","Visual (people, animals)","Auditory most common"],["Delusions","Loved one harming, stealing, deceiving; jealousy (partner cheating)","Most commonly persecutory"],["Insight","Initially retained","Not characteristic"],["Mechanism","5HT2A upregulation; serotonin–dopamine imbalance","DA, glutamate, 5HT hypotheses"],["Treatment approach","5HT2A antagonists","D2 blockers and more (Ch. 5)"]]],"p":[{"label":"Scale","text":"Occurs in over half of cases; a big risk for hospital admission, nursing-home placement, and death."}]},{"t":"Mood-related and dementia-related psychosis","sec":"Other Psychotic Illnesses","fig":"","c":[{"head":"Mood disorders","body":"Unipolar and bipolar disorders can have psychotic symptoms; schizophrenia can have affective symptoms. Treat whichever symptoms are present, and act to prevent suicide."},{"head":"Alzheimer disease","body":"Delusions more common than hallucinations (5-year period prevalence over 50%). Possible serotonin component; more plaques, tangles, and tau in psychotic patients."},{"head":"Lewy body dementia","body":"Visual hallucinations and delusions like PDP; Lewy bodies in cortex likely contribute to both."},{"head":"Agitation vs psychosis","body":"Distinguish them in dementia: different pathways and different evolving treatments (Chapter 12)."}]},{"t":"Chapter summary: the three networks","sec":"Summary and Review","fig":"","c":[{"head":"Mesolimbic DA overactivity","body":"May mediate positive symptoms; may stem from NMDA hypofunction at parvalbumin GABA interneurons in PFC and hippocampus."},{"head":"Mesocortical DA underactivity","body":"May mediate negative, cognitive, affective symptoms; also linked to NMDA hypofunction at different GABA interneurons."},{"head":"5HT2A excess or imbalance","body":"May explain PDP (upregulation) and dementia psychosis (lost GABA inhibition); relieved by 5HT2A antagonists."},{"head":"Drug targets","body":"D2 receptors for psychosis; 5HT2A specifically for PDP and dementia psychosis."}]},{"t":"Chapter summary: schizophrenia","sec":"Summary and Review","fig":"","c":[{"head":"Prototype","body":"~1% of people; five symptom dimensions: positive, negative, cognitive, affective, aggressive."},{"head":"Cause","body":"Hundreds of small-effect risk genes plus environment/epigenetics. Dysconnectivity of NMDA synapses is a major hypothesis."},{"head":"Course","body":"Neurodevelopmental onset in adolescence; neurodegenerative-like progression with repeated episodes."},{"head":"Treatment stance","body":"Treat symptoms (no drug treats the disorder itself); treat continuously; shorten untreated psychosis."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Not all psychosis is dopamine","body":"Consider glutamate and serotonin mechanisms, especially in Parkinson’s disease and dementia, where D2 blockers can harm."},{"head":"Know your D2 side effects","body":"Tuberoinfundibular: prolactin. Nigrostriatal: parkinsonism, akathisia, dystonia, TD."},{"head":"Look past positive symptoms","body":"Screen negative symptoms by observation and simple questions; treat affective symptoms; watch suicide risk."},{"head":"Violence in context","body":"Most patients are not violent; impulsive violence is commonest; psychotic violence is least common."}]}],"cards":[{"id":"c4-1","q":"Define delusions and hallucinations.","a":"Delusions: fixed, often bizarre beliefs unchanged by evidence. Hallucinations: vivid perceptions without a stimulus, not under voluntary control."},{"id":"c4-2","q":"What does Table 4-1 say about hallucination type for each drug model?","a":"Stimulants: auditory. PCP/ketamine: visual. Psychedelics: visual (with mystical delusions and insight)."},{"id":"c4-3","q":"Name the five dopamine pathways and their status in untreated schizophrenia.","a":"Nigrostriatal normal; mesolimbic hyper; mesocortical hypo; tuberoinfundibular preserved; thalamic no evidence of abnormality."},{"id":"c4-4","q":"Why can DA diffuse widely in the prefrontal cortex?","a":"Few DATs and few terminal D2/D3 autoreceptors, so DA reaches D1 receptors by volume transmission."},{"id":"c4-5","q":"Explain the “go” and “stop” pathways.","a":"Direct (D1, excitatory) promotes movement; indirect (D2, inhibitory) normally stops it. DA says “go more” and “don’t stop.”"},{"id":"c4-6","q":"What is the “integrative hub” concept?","a":"VTA–substantia nigra act as one hub; hyperdopaminergia is mesostriatal, notably in the associative striatum."},{"id":"c4-7","q":"List the three conditions needed to open an NMDA receptor.","a":"Glutamate bound, glycine or D-serine bound, and depolarization removing the Mg²⁺ plug."},{"id":"c4-8","q":"Where is the hypothesized faulty NMDA synapse, and what follows?","a":"Glutamate onto NMDA receptors of PFC GABA interneurons; loss of GABA disinhibits pyramidal neurons, causing glutamate excess."},{"id":"c4-9","q":"How can NMDA hypofunction cause both positive and negative symptoms?","a":"Direct glutamate drive of mesostriatal DA → too much DA; via a VTA GABA interneuron onto mesocortical DA → too little DA."},{"id":"c4-10","q":"Which 5HT receptors are somatodendritic vs terminal autoreceptors?","a":"Somatodendritic: 5HT1A (brake) and 5HT2B (accelerator). Terminal: 5HT1B/D."},{"id":"c4-11","q":"Why does 5HT1A stimulation increase NE, DA, and ACh release?","a":"5HT1A is inhibitory and sits on GABA interneurons, so it reduces GABA and disinhibits those neurons."},{"id":"c4-12","q":"Compare hallucinogen, PDP, and dementia psychosis.","a":"Hallucinogens overstimulate 5HT2A; PDP upregulates 5HT2A; dementia loses GABA inhibition. All respond to 5HT2A antagonism."},{"id":"c4-13","q":"Name the five “A”s of negative symptoms.","a":"Alogia, affective blunting, asociality, anhedonia, avolition."},{"id":"c4-14","q":"What are the three types of institutional violence and their frequencies?","a":"Impulsive 54%, organized 29%, psychotic 17% (Fig 4-60)."},{"id":"c4-15","q":"Why does schizophrenia often begin in adolescence?","a":"Weak synapses masked in childhood are removed during peak competitive elimination in adolescence."},{"id":"c4-16","q":"What features distinguish Parkinson’s disease psychosis?","a":"Visual hallucinations, jealous/theft delusions, initially retained insight; 5HT2A mechanism and treatment."}],"glossary":[{"t":"VTA","m":"Ventral tegmental area"},{"t":"SN","m":"Substantia nigra"},{"t":"DLPFC / VMPFC","m":"Dorsolateral / ventromedial prefrontal cortex"},{"t":"TOH / DDC","m":"Tyrosine hydroxylase / DOPA decarboxylase"},{"t":"COMT","m":"Catechol-O-methyltransferase"},{"t":"CSTC","m":"Cortico-striato-thalamo-cortical loop"},{"t":"GPi / GPe / STN","m":"Globus pallidus interna / externa; subthalamic nucleus"},{"t":"EAAT / vGluT","m":"Excitatory amino acid / vesicular glutamate transporter"},{"t":"SNAT","m":"Specific neutral amino acid transporter"},{"t":"GlyT1 / GlyT2","m":"Glycine transporters"},{"t":"SHMT","m":"Serine hydroxymethyl-transferase"},{"t":"DAO / DAOA","m":"D-amino acid oxidase / its activator"},{"t":"mGluR","m":"Metabotropic glutamate receptor"},{"t":"LTP","m":"Long-term potentiation"},{"t":"GAD67","m":"Glutamic acid decarboxylase (makes GABA)"},{"t":"TRY-OH / AAADC","m":"Tryptophan hydroxylase / aromatic amino acid decarboxylase"},{"t":"PDP","m":"Parkinson’s disease psychosis"},{"t":"TD / LID","m":"Tardive / levodopa-induced dyskinesia"},{"t":"DISC1","m":"Disrupted in schizophrenia-1"},{"t":"SMI","m":"Serious mental illness"}]},{"n":5,"title":"Targeting Dopamine and Serotonin Receptors for Psychosis, Mood, and Beyond","short":"Antipsychotics","notes":[{"t":"Why not call them “antipsychotics”?","sec":"","fig":"Fig 5-1","b":["These drugs are prescribed more often for mania, bipolar depression, and treatment-resistant unipolar depression than for psychosis.","On the horizon: PTSD, agitation in dementia, and beyond.","So the book says they have “antipsychotic action” (and “antidepressant action”), naming them by mechanism."],"x":["the first mechanism, used alone for decades","5HT2A/D2 antagonist","adds 5HT2A antagonism","D2/5HT1A partial agonist","partial agonism at both","5HT2A antagonist alone","drops D2 targeting entirely"]},{"t":"How D2 antagonism was discovered","sec":"D2 Blockade Across the Four Dopamine Pathways","fig":"","c":[{"head":"Neurolepsis (animals)","body":"Extreme slowing or absence of movement and behavioral indifference. Drugs were first found by this effect."},{"head":"Human counterpart","body":"Psychomotor slowing, emotional quieting, affective indifference: “secondary” negative symptoms."}],"f":[["1950s: chlorpromazine, an antihistamine, improves psychosis by accident","Effect is out of proportion to its sedation","Mechanism found: D2 antagonism","By 1970s: all “neuroleptics” block mesolimbic D2"]]},{"t":"D2 blockade pathway by pathway","sec":"D2 Blockade Across the Four Dopamine Pathways","fig":"Figs 5-2 to 5-5","c":[{"head":"Mesolimbic/mesostriatal (Fig 5-2)","body":"Therapeutic: fewer positive symptoms. Cost: blocked reward → secondary negative symptoms."},{"head":"Mesocortical (Fig 5-3)","body":"DA already low; further blockade can worsen negative, cognitive, and affective symptoms."},{"head":"Tuberoinfundibular (Fig 5-4)","body":"Prolactin rises (hyperprolactinemia)."},{"head":"Nigrostriatal (Fig 5-5)","body":"Motor side effects: DIP, akathisia, dystonia; chronically, tardive dyskinesia."}]},{"t":"Secondary negative symptoms","sec":"D2 Blockade Across the Four Dopamine Pathways","fig":"Figs 5-2, 5-3","b":["Blocking mesolimbic D2 reduces positive symptoms but also blocks reward: apathy, anhedonia, lack of motivation or joy.","Caused by the drug, not the illness, hence “secondary.”","May help explain high rates of smoking and drug abuse in schizophrenia (self-treating anhedonia).","Emotional flattening can lead patients to stop their medication."],"p":[{"label":"Management","text":"Options: lower the D2 blocker dose, switch to a better-tolerated one, or add adjuncts such as drugs for depression. 5HT2A antagonists and D3 partial agonists are in development."}]},{"t":"Hyperprolactinemia from D2 blockade","sec":"D2 Blockade Across the Four Dopamine Pathways","fig":"Fig 5-4","c":[{"head":"Established consequences","body":["Gynecomastia (men and women)","Galactorrhea","Amenorrhea","Reduced fertility, especially in women"]},{"head":"Possible consequences","body":["Faster bone demineralization (postmenopausal, no estrogen replacement)","Sexual dysfunction and weight gain (role unclear)"]}],"f":[["D2 antagonist blocks tuberoinfundibular D2","DA can no longer inhibit prolactin","Plasma prolactin rises"]]},{"t":"Drop “EPS”: name the movement","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-5, 5-6","tb":[[["Problem","Timing","Features"],["Drug-induced parkinsonism (DIP)","Acute","Tremor, rigidity, bradykinesia/akinesia; the most common side effect"],["Acute dystonia","Often on first exposure","Spasmodic or sustained contractions of face, neck, trunk, pelvis, limbs, eyes"],["Akathisia","Acute","Inner restlessness plus restless movements (rocking, marching, pacing)"],["Neuroleptic malignant syndrome","Rare","Extreme rigidity, high fever, coma, possible death"],["Tardive dyskinesia (TD)","Months to years","Chewing, tongue protrusion, grimacing; quick, jerky, choreiform limb movements; can be irreversible"]]]},{"t":"DIP: the dopamine–acetylcholine seesaw","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-7A, B, C","f":[["A: DA at D2 on cholinergic interneurons suppresses ACh release","B: D2 blocker removes the brake → excess ACh at muscarinic receptors → DIP","C: Anticholinergic blocks M1 → balance partly restored"]],"p":[{"label":"Options","text":"Alternatives to anticholinergics: switch to a drug for psychosis without anticholinergic properties, stop the anticholinergic, or use amantadine (probably weak NMDA antagonism). Amantadine may also help TD and levodopa-induced dyskinesias."}]},{"t":"The price of anticholinergics","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Fig 5-8","c":[{"head":"Peripheral (e.g. benztropine)","body":["Dry mouth","Blurred vision","Urinary retention","Constipation → paralytic ileus"]},{"head":"Central","body":["Drowsiness","Memory and concentration problems","Slowed cognitive processing"]}],"p":[{"label":"Clinical link","text":"Add up the total anticholinergic burden from all of a patient’s medicines; life-threatening decrease in bowel motility (paralytic ileus) is possible."}]},{"t":"Treating dystonia, akathisia, and NMS","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"","tb":[[["Problem","Most likely with","Treatment in Ch. 5"],["Acute dystonia","D2 blockers with neither serotonergic nor anticholinergic properties","IM anticholinergic: nearly always effective within 20 minutes"],["Tardive dystonia","Chronic D2 blockade","Treat as TD; anticholinergics rarely work, may worsen"],["Akathisia","D2 blockers (including partial agonists)","β-adrenergic blockers or benzodiazepines; 5HT2A antagonists can help; anticholinergics not particularly effective"],["Neuroleptic malignant syndrome","D2 blockade (possibly extreme DIP or toxic effect on membranes)","Emergency: stop D2 blocker; dantrolene and DA agonists; intensive supportive care"]]]},{"t":"Tardive dyskinesia: how common?","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"","p":[{"label":"Clinical link","text":"Monitor everyone on these drugs with a neurological exam and a scale such as the AIMS (Abnormal Involuntary Movement Scale). It is often not done, especially in depression, yet patients with mood disorders may be at greater risk. Same drugs, whoever takes them."}],"x":["on D2 antagonists with little or no serotonin action (~25% by 5 years)","in the elderly within the first year","with 5HT2A/D2 antagonists or D2/5HT1A partial agonists"]},{"t":"TD mechanism: from “too much stop” to “too much go”","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-6, 5-9A, B, C","c":[{"head":"Reversible?","body":["Stopping D2 blockade early may let receptors “reset” and TD reverse","After long treatment receptors may not reset: irreversible TD","Stopping often worsens movements at first"]}],"f":[["Normal (5-9A): DA at D2 inhibits the indirect “stop” pathway → go","Acute D2 blockade (5-9B): stop is no longer inhibited → too much stop → DIP","Chronic blockade (5-9C): D2 receptors upregulate and become supersensitive","Now too much inhibition of stop → too much go → TD"]]},{"t":"Treatment options for TD","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"","tb":[[["Option","Problem"],["Raise the D2 antagonist dose","May work short-term; more side effects; may make TD worse later"],["Stop the D2 blocker","Most patients with psychosis cannot tolerate it; reversal mainly if stopped soon after onset; movements often worsen at first"],["VMAT2 inhibitor","Lowers DA stimulation without blocking D2: the current successful approach"]]],"p":[{"label":"Dosing clue","text":"Perhaps >90% VMAT2 inhibition is often required for the best balance of efficacy and tolerability."}]},{"t":"VMAT2 inhibition depletes dopamine","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-10A, 5-10B","tb":[[["VMAT inhibitor","Targets","Reversibility","Peripheral side effects"],["Reserpine","VMAT1 and VMAT2","Irreversible","Frequent (orthostasis, stuffy nose, itching, GI)"],["Tetrabenazine-related drugs","VMAT2 only","Reversible","Much less"]]],"f":[["VMAT2 normally loads DA (and NE, 5HT, histamine) into vesicles","Tetrabenazine-type drug blocks VMAT2 (preferentially DA at clinical doses)","Cytoplasmic DA destroyed by MAO","DA depleted in proportion to VMAT2 inhibition"]]},{"t":"Three VMAT2 inhibitors compared","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-11A, B, C","tb":[[["","Tetrabenazine","Deutetrabenazine","Valbenazine"],["Structure","Inactive prodrug → four active dihydro metabolites (carbonyl reductase); inactivated by CYP2D6","Deuterated tetrabenazine; same metabolites, slower 2D6 metabolism","Valine + (+α) tetrabenazine → only the +α dihydro enantiomer (most selective, potent)"],["Dosing","Three times a day","Twice a day, with food","Once a day, no food requirement"],["Genetic testing","Needed (2D6 poor metabolizers) for higher doses","Not needed","Not needed"],["Approved for","Huntington’s chorea (not TD)","TD and Huntington’s disease","TD"],["Other notes","Peak-dose sedation, DIP; depression/suicide risk in Huntington’s","No suicide warning for TD; –α/–β metabolites add 5HT7 (and some D2) antagonism","No suicide warning"]]]},{"t":"Why VMAT2 inhibition quiets TD","sec":"Motor Side Effects and Tardive Dyskinesia","fig":"Figs 5-12A–D","c":[{"head":"Indirect pathway (5-12C)","body":"Less DA at upregulated D2 receptors → less inhibition of “stop” → TD movements reduced."},{"head":"Direct pathway (5-12D)","body":"Less DA at D1 receptors → less “go,” even though this pathway is not the site of pathology."}],"p":[{"label":"Take-home","text":"VMAT2 inhibition “trims” dopamine’s “go” drive in BOTH pathways to compensate for abnormal learning in just the indirect pathway."}]},{"t":"Table 5-1: Earliest agents used to treat psychosis","sec":"First-Generation D2 Antagonists","fig":"Table 5-1","tb":[[["Generic (trade)","Comment"],["Chlorpromazine (Thorazine)","Low potency"],["Cyamemazine (Tercian)","Popular in France; not in US"],["Flupenthixol (Depixol)","Depot; not in US"],["Fluphenazine (Prolixin)","High potency; depot"],["Haloperidol (Haldol)","High potency; depot"],["Loxapine (Loxitane)","—"],["Mesoridazine (Serentil)","Low potency; QTc issues; discontinued"],["Perphenazine (Trilafon)","High potency"]],[["Generic (trade)","Comment"],["Pimozide (Orap)","High potency; Tourette; QTc issues; second line"],["Pipothiazine (Piportil)","Depot; not in US"],["Sulpiride (Dolmatil)","Not in US"],["Thioridazine (Mellaril)","Low potency; QTc issues; second line"],["Thiothixene (Navane)","High potency"],["Trifluoperazine (Stelazine)","High potency"],["Zuclopenthixol (Clopixol)","Depot; not in US"]]]},{"t":"Extra receptor actions drive side effects","sec":"First-Generation D2 Antagonists","fig":"Figs 5-8, 5-13, 5-14","p":[{"label":"Why sedation","text":"ACh, histamine, and NE all drive cortical arousal (Fig 5-14), so blocking all three adds up to heavy sedation."}],"x":["M1 (muscarinic) antagonism","Dry mouth, blurred vision, constipation/ileus, cognitive dysfunction, drowsiness","Weight gain, drowsiness","Dizziness, drowsiness, decreased blood pressure (orthostasis)"]},{"t":"Built-in anticholinergic action: a trade-off","sec":"First-Generation D2 Antagonists","fig":"","c":[{"head":"Weak anticholinergic D2 blockers","body":["More likely to cause DIP"]},{"head":"Strong “inbuilt” anticholinergic D2 blockers","body":["Less DIP","But more constipation and risk of paralytic ileus, especially with other anticholinergics"]}],"p":[{"label":"Clinical link","text":"Monitor GI status and bowel movements with strongly anticholinergic agents."}]},{"t":"Selected first-generation agents","sec":"First-Generation D2 Antagonists","fig":"Figs 5-27 to 5-31","tb":[[["Drug","Key binding besides D2 (per text)","Clinical notes from Ch. 5"],["Chlorpromazine","Potent α1, D3, H1; plus muscarinic and many others","Used for sedation, short-term oral or short-acting IM for agitation"],["Fluphenazine","Potent D3, 5HT7, α1","More potent and less sedating; short- and long-acting forms; plasma levels useful"],["Haloperidol","σ, D3, α1","One of the most potent D2 antagonists; less sedating; short- and long-acting; plasma levels useful"],["Sulpiride","D3 antagonist/partial agonist","Motor effects and prolactin at usual doses; activating at low doses; popular outside US"],["Amisulpride","D3 antagonist; weak 5HT7","Possibly mesolimbic-selective; negative symptoms and depression at low doses"]]]},{"t":"What 5HT2A antagonism adds","sec":"Adding 5HT2A Antagonism","fig":"","c":[{"head":"Positive symptoms","body":"Adding selective 5HT2A antagonism may improve them; high 5HT2A:D2 potency may need less D2 blockade."},{"head":"PDP and dementia psychosis","body":"5HT2A antagonism alone can be enough, avoiding D2 side effects."},{"head":"Negative symptoms","body":"Selective 5HT2A antagonists alone or added may improve them."},{"head":"Motor side effects","body":"Less drug-induced parkinsonism."},{"head":"Hyperprolactinemia","body":"Less prolactin elevation."}]},{"t":"Where drugs for psychosis sit on the agonist spectrum","sec":"Adding 5HT2A Antagonism","fig":"Fig 5-15","p":[{"label":"Key","text":"Small shifts along the spectrum have big clinical effects: too agonistic worsens psychosis; too antagonistic worsens Parkinson’s movements. Never lump all partial agonists together."}],"x":["5HT2A “antagonists” (possibly)","Partial agonist (near antagonist)","D2 partial agonists for psychosis","Partial agonist (near agonist)","DA partial agonists for Parkinson’s; 5HT1A partial agonists","← less activity                                        more activity →"]},{"t":"5HT2A controls three downstream dopamine pathways","sec":"Adding 5HT2A Antagonism","fig":"Figs 5-16, 5-17","tb":[[["Glutamate neuron targets…","Wiring","Serotonin at 5HT2A →","5HT2A antagonism →"],["A: mesolimbic/mesostriatal DA (SNm/VTA → emotional striatum)","Direct","More DA: hallucinations, positive symptoms","Less DA: fewer positive symptoms (independent of D2 blockade)"],["B: nigrostriatal DA (SNl → motor striatum)","Via GABA interneuron","Less DA: DIP","More DA competes with D2 blocker: less DIP"],["C: mesocortical DA (VTA → PFC)","Via GABA interneuron","Less DA: blunting, poor mental sharpness","More DA in PFC: better negative, cognitive, affective symptoms"]]],"p":[{"label":"Key","text":"The GABA interneuron flips polarity: same 5HT2A blockade, less DA in one pathway, more DA in the other two."}]},{"t":"Why 5HT2A antagonism lowers prolactin","sec":"Adding 5HT2A Antagonism","fig":"Figs 5-18A–D","p":[{"label":"Key","text":"Dopamine and serotonin have reciprocal control of prolactin; blocking both cancels the effect."}],"x":["DA at D2 on lactotrophInhibits prolactin","5HT at 5HT2A on lactotrophStimulates prolactin","D2 antagonist aloneProlactin rises","5HT2A/D2 antagonistEffects cancel: less rise"]},{"t":"Wide 5HT2A–D2 separation, lower D2 occupancy","sec":"Adding 5HT2A Antagonism","fig":"","b":["Almost all these agents bind 5HT2A more potently than D2 (Fig 5-32).","The wider the gap between 5HT2A and D2 potency, the less D2 occupancy may be needed for antipsychotic effect.","The widest separations, lumateperone, quetiapine, and clozapine, show the lowest D2 occupancy at antipsychotic doses: below 60%."],"p":[{"label":"Horizon","text":"Trials are testing whether adding a selective 5HT2A antagonist can boost antipsychotic effect or allow lower D2 blockade with fewer side effects."}]},{"t":"Too cold, too hot, just right","sec":"D2 and 5HT1A Partial Agonism","fig":"Fig 5-19","c":[{"head":"Full D2 antagonist: too cold","body":"Antipsychotic, but DIP and prolactin elevation."},{"head":"Full agonist (DA, amphetamine): too hot","body":"Positive symptoms of psychosis."},{"head":"D2 partial agonist: just right?","body":"Antipsychotic, with less DIP and less prolactin elevation."}]},{"t":"Receptor output: the volume knob","sec":"D2 and 5HT1A Partial Agonism","fig":"Figs 5-20, 5-21","x":["Dopamine (full agonist)","D2 partial agonist","Conceptual output, not measured values","Partial agonists can occupy any point between the two extremes; D2 partial agonists for psychosis sit near the antagonist end with just “a whiff” of intrinsic activity."]},{"t":"Finding the right amount of partial agonism","sec":"D2 and 5HT1A Partial Agonism","fig":"","tb":[[["Agent","Where on spectrum","Outcome"],["OPC4392","Too much agonism","Helped negative symptoms, little motor effect, but worsened positive symptoms; never marketed"],["Bifeprunox","Still too agonistic","Some efficacy, no motor effects, but less robust and nausea/vomiting; not FDA approved"],["Aripiprazole","Closer to antagonist","Improves positive symptoms without severe motor effects; some akathisia"],["Brexpiprazole, cariprazine","Similar to aripiprazole","Antipsychotic, low motor effects, some akathisia; differ in other receptors"]]],"p":[{"label":"Prolactin","text":"D2 partial agonists actually LOWER prolactin; adding one can reverse hyperprolactinemia from a D2 antagonist."}]},{"t":"5HT1A partial agonism: stepping on the brake","sec":"D2 and 5HT1A Partial Agonism","fig":"Fig 5-22","c":[{"head":"The analogy","body":"On the same glutamate pyramidal neuron, 5HT2A is the accelerator and 5HT1A (always inhibitory) is the brake. Lifting off the accelerator ≈ stepping on the brake."},{"head":"The results","body":["Motor striatum: more DA → less DIP (Fig 5-22A)","PFC: more DA → better negative, cognitive, affective symptoms (Fig 5-22B)"]}],"p":[{"label":"Clinical link","text":"D2 partial agonists are also 5HT1A partial agonists, so the two properties combine to reduce motor side effects, although akathisia still commonly occurs. Mood benefits may be especially robust in bipolar and unipolar depression."}]},{"t":"Many more prescriptions for other indications","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"","c":[{"head":"Mania","body":"Essentially all D2 antagonists/partial agonists treat acute mania and prevent recurrence: “you get mania treatment for free.”"},{"head":"Depression (most common use)","body":"Unipolar and bipolar depression, at lower doses unlikely to block D2 robustly (psychosis needs ~80%)."},{"head":"Anxiety, PTSD","body":"Controversial; mixed studies. Promising: brexpiprazole plus sertraline for PTSD."},{"head":"Agitation in dementia","body":"Controversial; safety warning in elderly dementia patients. Positive results for brexpiprazole."}]},{"t":"Candidate antidepressant mechanisms","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"Figs 5-34 to 5-40","p":[{"label":"Key","text":"Key idea: 5HT2A antagonism and 5HT1A partial agonism raise prefrontal DA. The others add more routes to boost monoamines."}],"x":["5HT1A partial agonism","Monoamine reuptake inhibition","D3 partial agonism","Possibly 5HT1B/D antagonism"]},{"t":"Sedation: good and bad","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"","c":[{"head":"Good: short term","body":["Early in treatment","During hospitalization","Aggression, agitation","Sleep induction"]},{"head":"Bad: long term",
