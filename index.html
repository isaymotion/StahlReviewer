<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychopharmacology Trainer</title>
<meta name="description" content="Flashcards, quizzes, and study notes covering Chapters 1–13 of Stahl’s Essential Psychopharmacology (5th edition), for psychiatry residents.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232D1B3D'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%230F8B7E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2D1B3D; --plum2:#5B3A78; --ink:#2B2733; --muted:#6B6475; --paper:#FCFBFE; --lav:#F2EDF7; --lav2:#E6DDF0; --line:#DDD6E6;
  --teal:#0F8B7E; --tealt:#E2F3F0; --coral:#C8492F; --coralt:#FBEAE5; --amber:#B9780F; --ambert:#FBF1DD;
  --m1:#0F8B7E; --m2:#D9951F; --m3:#D65A3F; --m4:#7A4E9C; --m5:#2F6F9F; --m6:#5E8C31; --m7:#8C5E3C;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:6px; --r-md:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:650;color:var(--plum);line-height:1.2;margin:0}
h1{font-size:2.2rem}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:.4rem 0}
button{font:inherit;cursor:pointer}
a{color:var(--plum2)}
:focus-visible{outline:3px solid var(--m2);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--plum);color:#E9E1F2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 16px 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.brand .dots{display:grid;grid-template-columns:repeat(4,9px);gap:3px}
.brand .dots i{width:9px;height:9px;border-radius:50%;display:block}
.brand b{font-family:var(--serif);font-size:1.12rem;color:#fff;font-weight:650;line-height:1.15}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:#E9E1F2;text-align:left;padding:10px 12px;border-radius:var(--r-sm);font-size:.98rem;display:flex;gap:10px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:#fff;color:var(--plum);font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.side .credit{margin-top:auto;font-size:.78rem;color:#B7A6C9;line-height:1.45;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.side .credit a{color:#E9E1F2}
.topbar{display:none}
main{min-width:0;padding:34px 44px 60px;max-width:1040px}
.lede{color:var(--muted);max-width:62ch;margin-top:.5rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--plum);background:var(--plum);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.95rem}
.btn:hover{background:var(--plum2);border-color:var(--plum2)}
.btn.ghost{background:transparent;color:var(--plum)}
.btn.ghost:hover{background:var(--lav)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--plum2);background:var(--lav);border-radius:999px;padding:2px 10px;font-weight:700}
/* chapter badge (messenger circle) with progress ring */
.badge{--c:var(--m1);--p:0;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%), var(--lav2) 0);position:relative}
.badge::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--c)}
.badge span{position:relative;color:#fff;font-weight:700;font-size:1rem;font-family:var(--serif)}
.badge.sm{width:28px;height:28px}.badge.sm::before{inset:0}.badge.sm span{font-size:.8rem}
/* Home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center;margin-bottom:34px}
.hero>*{min-width:0}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;justify-items:center;padding:18px;background:var(--lav);border-radius:16px}
.ladder button{background:none;border:0;padding:4px;border-radius:50%}
.ladder .badge{width:58px;height:58px}
.ladder .badge span{font-size:1.15rem}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0 6px}
.stats div b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--plum)}
.stats div{font-size:.88rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 34px}
.mode{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.mode:hover{border-color:var(--plum2)}
.mode h3{font-size:1.08rem}
.mode p{font-size:.9rem;color:var(--muted);margin:0}
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.chrow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-align:left;color:var(--ink)}
.chrow:hover{border-color:var(--plum2)}
.chrow .t{font-weight:700;font-size:.95rem;line-height:1.25}
.chrow .s{font-size:.8rem;color:var(--muted)}
.section-title{margin:28px 0 12px}
/* chapter picker */
.picker{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pick{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--plum);background:var(--lav)}
.pick .badge.sm{width:24px;height:24px}
/* Flashcards */
.cardstage{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;min-height:300px;display:flex;flex-direction:column;gap:16px;margin-top:16px}
.cardstage .q{font-family:var(--serif);font-size:1.45rem;color:var(--plum);line-height:1.3}
.cardstage .a{font-size:1.1rem;color:var(--ink);border-top:2px dashed var(--line);padding-top:16px;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.meter{height:6px;background:var(--lav2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.grade{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.grade .miss{background:var(--coral);border-color:var(--coral)}
.grade .hit{background:var(--teal);border-color:var(--teal)}
.kbd{font-size:.78rem;color:var(--muted)}
kbd{font-family:var(--sans);background:var(--lav);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.78rem}
.boxes{display:flex;gap:6px;align-items:flex-end}
.boxes span{width:22px;background:var(--lav2);border-radius:3px 3px 0 0;display:block}
.boxes span.on{background:var(--m4)}
/* Quiz */
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-md);padding:12px 16px;text-align:left;font-size:1rem;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--plum2);background:var(--lav)}
.opt .l{font-weight:700;color:var(--plum2);min-width:1.2em}
.opt.right{border-color:var(--teal);background:var(--tealt)}
.opt.wrong{border-color:var(--coral);background:var(--coralt)}
.opt:disabled{cursor:default}
.feedback{border-radius:var(--r-md);padding:12px 16px;font-size:.98rem}
.feedback.ok{background:var(--tealt)}
.feedback.no{background:var(--coralt)}
.score{font-family:var(--serif);font-size:3rem;color:var(--plum)}
.setup{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px;display:grid;gap:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-size:.9rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
/* Notes */
.search{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:999px;font:inherit;font-size:1rem;background:#fff}
.search:focus{border-color:var(--plum2);outline:none}
.secHead{font-family:var(--serif);color:var(--plum2);font-size:1.1rem;margin:30px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--lav2)}
.note{padding:16px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note h3{font-size:1.12rem;margin-bottom:6px}
.note .fig{font-size:.78rem;color:var(--plum2);margin-left:6px;font-family:var(--sans);font-weight:700;white-space:nowrap}
.note ul{margin:.3rem 0 .3rem 1.1rem;padding:0}
.note li{margin:.15rem 0}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0}
.mini{background:var(--lav);border-radius:var(--r-sm);padding:10px 12px;font-size:.92rem}
.mini b{display:block;color:var(--plum);margin-bottom:2px}
.mini ul{margin:.2rem 0 0 1rem}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px 6px 30px;position:relative;font-size:.9rem;max-width:100%}
.steps li::before{content:counter(st);position:absolute;left:8px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--m4);color:#fff;font-size:.7rem;display:grid;place-items:center;font-weight:700}
.pearl{background:var(--ambert);border-radius:var(--r-sm);padding:9px 12px;margin:8px 0;font-size:.93rem}
.pearl b{color:var(--amber)}
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
th{background:var(--plum);color:#fff;text-align:left;padding:7px 10px;font-weight:700;vertical-align:bottom}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#FAF7FC}
.extra{font-size:.9rem;color:var(--muted)}
mark{background:#FFE9A8;color:inherit;border-radius:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
/* Glossary */
.gl{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:4px 16px;align-items:baseline}
.gl dt{font-weight:700;color:var(--plum)}
.gl dd{margin:0}
.gl .ch{justify-self:end}
.gl > *{padding:7px 0;border-bottom:1px solid var(--line)}
.empty{background:var(--lav);border-radius:var(--r-md);padding:22px;text-align:center}
footer.credit{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;max-width:290px;z-index:20;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(20,10,30,.45)}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--plum);color:#fff;position:sticky;top:0;z-index:10}
  .topbar button{background:none;border:0;color:#fff;padding:6px}
  .topbar b{font-family:var(--serif);font-weight:650}
  main{padding:22px 18px 50px}
  .hero{grid-template-columns:1fr}
  .ladder{gap:8px;padding:12px}
  .ladder .badge{width:46px;height:46px}
  .ladder .badge span{font-size:1rem}
  .modes{grid-template-columns:1fr}
  h1{font-size:1.75rem}
  .cardstage{padding:20px}
  .cardstage .q{font-size:1.2rem}
  .gl{grid-template-columns:1fr auto}
  .gl dd{grid-column:1/-1;padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

rs."]},{"t":"The enlarged synapse","sec":"Anatomical versus Chemical Basis of Neurotransmission","fig":"Fig 1-4","tb":[[["Structure","Role"],["Mitochondria (presynaptic)","Supply energy for neurotransmission"],["Synaptic vesicles","Store neurotransmitter, ready for release when the neuron fires"],["Synaptic cleft","The gap between neurons; contains proteins, scaffolding, and “synaptic glue” that reinforce the connection"],["Receptors","Present on BOTH sides of the cleft; key elements of chemical neurotransmission"]]],"x":["presynaptic terminal","postsynaptic neuron"]},{"t":"Classic synaptic neurotransmission, step by step","sec":"Anatomical versus Chemical Basis of Neurotransmission","fig":"Fig 1-3","b":["Input: neuron A can be stimulated by neurotransmitters, light, drugs, hormones, or nerve impulses.","Within neuron A: inputs are integrated and encoded as electrical impulses sent down the axon.","At the terminal: electrical impulses are converted to chemical messengers and released.","In neuron B: receptors are stimulated and the signal is transduced onward."],"f":[["Reception","Integration","Electrical encoding","Signal propagation","Chemical encoding","Signal transduction"]],"p":[{"label":"Reading the figure","text":"Neuron A (top) is the sender; neuron B (bottom) the receiver. Arrows trace one message from its inputs to B’s receptors. Bottom line: electrical within a neuron, chemical between neurons."}]},{"t":"The chemically addressed nervous system","sec":"Anatomical versus Chemical Basis of Neurotransmission","fig":"","c":[{"head":"What it is","body":"The chemical basis of neurotransmission: how chemical signals are coded, decoded, transduced, and sent along the way. It complements the anatomically addressed (wired) system."},{"head":"Why it matters","body":"Psychopharmacological agents target key molecules in neurotransmission. You cannot grasp how drugs work without it. (Drug targets are covered in Chapters 2 and 3.)"}],"p":[{"label":"Your goal","text":"The ,{"t":"Volume neurotransmission: no synapse required","sec":"Neurotransmission: Classic, Retrograde, and Volume","fig":"Fig 1-6","b":["1  Neurotransmitter A acts at its own synaptic receptor (a): classic.","2  If A diffuses away before it is destroyed, it can activate a matching receptor (a) far from its synapse.","3  A reaching a non-matching receptor (c) does nothing, even if it gets there.","Rule: transmission can occur at any compatible receptor within the transmitter’s diffusion radius."]},{"t":"Wires and “chemical soup”","sec":"Neurotransmission: Classic, Retrograde, and Volume","fig":"Fig 1-6","c":[{"head":"Anatomically addressed","body":"Landline telephones: messages travel down fixed wires to the place where the wire is plugged in (the synapse)."},{"head":"Chemically addressed","body":"Cell phones: messages work anywhere within range of the tower. Transmission occurs in chemical “puffs.”"}],"p":[{"label":"Clinical link","text":"Drugs act wherever their receptors are, not only where synapses innervate them. Modifying volume neurotransmission may be a major way several psychotropics work."}],"x":["The brain is not only a collection of wires but also a sophisticated “chemical soup.”"]},{"t":"Example 1: dopamine in the prefrontal cortex","sec":"Neurotransmission: Classic, Retrograde, and Volume","fig":"Fig 1-7","tb":[[["Region","Dopamine transporters (DATs)","Consequence"],["Prefrontal cortex","Very few","Released dopamine is free to spill over and diffuse"],["Striatum","Abundant","Reuptake terminates dopamine’s action more locally"]]],"p":[{"label":"Reading the figure","text":"Arrow 1: dopamine released at a synapse onto neuron A (D1 receptors). Arrow 2: the same dopamine reaches receptors on neuron A outside that synapse, on neighbouring dendrites. Arrow 3: it reaches extrasynaptic receptors on a neighbouring neuron B."}]},{"t":"Example 2: somatodendritic autoreceptors","sec":"Neurotransmission: Classic, Retrograde, and Volume","fig":"Fig 1-8","b":["Location:  seven-transmembrane receptor; a “2” marks a second messenger such as cAMP. Convergence: the two left columns both end on CREB; the hormone column ends at HRE; the right column ends at “genes.”"}]},{"t":"The hormone-linked cascade","sec":"Signal Transduction Cascades","fig":"Fig 1-11","b":["HRE = hormone-response element: a region of the gene that the complex can influence.","Key contrast: unlike neurotransmitters, these hormones act on receptors inside the cell, not on the membrane surface.","End result: activation of specific nearby genes."],"f":[["Hormone (estrogen, thyroid, cortisol) enters neuron","Binds its receptor in the cytoplasm","Hormone–nuclear receptor complex forms","Complex moves to the nucleus","Binds HREs and acts as a transcription factor"]]},{"t":"The neurotrophin-linked cascade","sec":"Signal Transduction Cascades","fig":"Fig 1-11","c":[{"head":"The take-away","body":"Kinase activates kinase until one phosphorylates a nuclear transcription factor. This pathway may drive genes for synaptogenesis, cell survival, learning, memory, and even disease expression."}],"tb":[[["Abbrev.","Stands for"],["MEK","MAPK kinase / ERK kinase (mitogen-activated protein kinase kinase)"],["ERK","Extracellular signal-regulated kinase"],["RSK","Ribosomal S6 kinase"],["MAPK","MAP kinase"],["GSK-3","Glycogen synthase kinase 3"]]],"f":[["Neurotrophin","Ras (a G protein)","Raf (a kinase)","MEK","ERK / RSK / MAPK / GSK-3","Gene expression"]]},{"t":"Four elements of the G-protein-linked system","sec":"Forming a Second Messenger","fig":"Fig 1-12","c":[{"head":"First messenger","body":"The neurotransmitter itself"},{"head":"Receptor","body":"A protein with seven transmembrane regions (the “7” icon)"},{"head":"G protein","body":"Connecting protein that binds the receptor and the enzyme"},{"head":"Enzyme (E)","body":"Synthesises the second messenger when activated"}],"p":[{"label":"Compare","text":"In the G-protein system the second messenger is a chemical (cAMP). In the ion-channel system it can be an ion (Ca²⁺); in the hormone system it is the hormone–receptor complex; for neurotrophins, a set of kinases."}]},{"t":"Building the second messenger, one step at a time","sec":"Forming a Second Messenger","fig":"Figs 1-12 to 1-15","tb":[[["Stage","What forms"],["NT + receptor","Binary complex (Fig 1-13)"],["+ G protein","Ternary complex (Fig 1-14)"],["+ enzyme (adenylate cyclase)","Quaternary complex → cAMP (Fig 1-15)"]]],"x":["NT binds; receptor changes shape","G protein binds and changes shape","Enzyme binds; cAMP is made"]},{"t":"Why the complex matters: cooperation","sec":"Forming a Second Messenger","fig":"Figs 1-13 to 1-15","b":["Step 1 (Fig 1-13): the first messenger docks and changes the receptor’s conformation so it can now fit the G protein.","Step 2 (Fig 1-14): the G protein, effectively a second receptor on the inner membrane, binds and changes its own shape so it can bind the enzyme.","Step 3 (Fig 1-15): the enzyme (adenylate cyclase) binds, is activated, and synthesises cAMP.","Principle: it is the cooperation of all four elements, wrapped together, that produces the second messenger. Information passes from first to second messenger via receptor–G protein–enzyme intermediaries."],"p":[{"label":"Reading the figure","text":"Colour = active. Each element “turns green” (the neurotransmitter’s colour) when switched on. Shape change: watch the bottom of the receptor and the right side of the G protein reshape. “2” icon is cAMP, the second messenger."}]},{"t":"The two ultimate targets of signal transduction","sec":"Beyond the Second Messenger: Phosphoprotein Messengers","fig":"","c":[{"head":"Phosphoproteins","body":"Dormant proteins that “spring into action” when signal transduction changes their phosphorylation. Many intermediate targets on the way to the gene are phosphoproteins."},{"head":"Genes","body":"Turning a gene on or off is the ultimate cellular function that neurotransmission often seeks to modify."}],"f":[["2nd messenger","3rd messenger (kinase or phosphatase)","4th messenger phosphoprotein","Response or gene"]]},{"t":"Activating a third-messenger kinase through cAMP","sec":"Beyond the Second Messenger: Phosphoprotein Messengers","fig":"Fig 1-16","b":["When inactive, some protein kinases exist as dimers bound to regulatory units, locked in an inactive shape.","Two copies of cAMP bind each regulatory unit; the regulatory units dissociate, the dimer splits, and each kinase is freed and active.","The active kinase is ready to phosphorylate fourth-messenger proteins."],"p":[{"label":"Reading the figure","text":"“R” regulatory units “2” cAMP “3” active kinase Bow and arrow: Stahl’s symbol for a kinase ready to “shoot” phosphates"}],"x":["inactive: kinase dimer + 2 regulatory units","two active kinases (3rd messengers)"]},{"t":"Activating a third-messenger phosphatase through calcium","sec":"Beyond the Second Messenger: Phosphoprotein Messengers","fig":"Fig 1-17","c":[{"head":"The kinase’s nemesis","body":"While the kinase is being activated in Fig 1-16, its opponent, a protein phosphatase, is forming in Fig 1-17. It reverses what kinases do."}],"f":[["1st messenger opens an ion channel","Ca²⁺ enters (2nd messenger)","Ca²⁺ binds inactive calcineurin","Active calcineurin (phosphatase, 3rd messenger)"]],"p":[{"label":"Reading the figure","text":"Scissors: active calcineurin, ready to rip phosphate groups off. “Ca++” and “2”: calcium acting as the second messenger. “3”: active phosphatase, the third messenger."}]},{"t":"The clash on fourth-messenger phosphoproteins","sec":"Beyond the Second Messenger: Phosphoprotein Messengers","fig":"Figs 1-18, 1-19","c":[{"head":"Kinase","body":"+ phosphate (Fig 1-18)"},{"head":"Phosphatase","body":"− phosphate (Fig 1-19)"}],"p":[{"label":"Watch out","text":"Phosphorylation activates some phosphoproteins and inactivates others; dephosphorylation can likewise be activating."}],"x":["Ligand-gated ion channels","Voltage-gated ion channels","Regulatory enzymes" ene → Fos (5th)","cJun gene → Jun (5th)","Fos + Jun = leucine zipper (6th)","Returns to genome; finds a late gene","Late gene product"]]},{"t":"Examples of late gene products","sec":"How Neurotransmission Triggers Gene Expression","fig":"Fig 1-27","x":["Neurotrophic growth factor","Such gene products modify neuronal function for many hours or days. Neurotransmitter-driven cascades change the synthesis not only of a neuron’s own receptors, but also of many other postsynaptic proteins, including enzymes and receptors for other neurotransmitters."]},{"t":"The full messenger ladder: first to seventh","sec":"How Neurotransmission Triggers Gene Expression","fig":"Figs 1-28, 1-29","p":[{"label":"Reading the figure","text":"Fig 1-28 covers messengers 1 → 5: from the transmitter to Fos, the early gene product. Fig 1-29 covers 5 → 7: Fos and Jun zip together and switch on a late gene. Numbers on icons are the messenger rank, exactly as on this ladder."}],"x":["Neurotransmitter (extracellular)","cAMP (intracellular)","Protein kinase (awakened by cAMP)","Phosphorylated transcription factor","Fos / Jun (immediate early gene products)","Fos–Jun leucine zipper (new transcription factor)","Late gene product → biological response"]},{"t":"Which late genes get drafted?","sec":"How Neurotransmission Triggers Gene Expression","fig":"","c":[{"head":"Which neurotransmitter","body":"is sending the message"},{"head":"How frequently","body":"the message is being sent"},{"head":"Concert or opposition","body":"whether it works with or against other transmitters acting on the same neuron at the same time"}],"p":[{"label":"Breadth","text":"Genes targeted range from synthetic enzymes for neurotransmitters to growth factors, cytoskeleton and adhesion proteins, ion channels, receptors, and the signalling proteins themselves, made in more or fewer copies."}]},{"t":"Biological responses driven by gene expression","sec":"How Neurotransmission Triggers Gene Expression","fig":"","c":[{"head":"Neuronal ted DNA / histones → silencing"]],"p":[{"label":"Reading the figure","text":"Key box at the bottom of Fig 1-30 decodes the symbols: Me = methyl, Ac = acetyl, TF = transcription factor, L-MF = L-methylfolate. Left half = gene activating (gates open); right half = gene silencing (gates close). Centre “neurotransmission / drugs / environment” is what pushes chromatin either way."}]},{"t":"Keeping versus changing the status quo","sec":"Epigenetics","fig":"","c":[{"head":"Maintenance: DNMT1","body":["Maintains methylation of specific DNA areas, keeping genes quiet for a lifetime","Keeps a neuron a neuron and a liver cell a liver cell, even through cell division","Methylation is presumably maintained at genes a cell does not need"]},{"head":"De novo change: DNMT2 / DNMT3","body":["De novo DNA methylation silences genes previously active in a mature neuron","HDAC-mediated deacetylation can do the same","In reverse, demethylation or acetylation activates previously silent genes"]}]},{"t":"What can rewrite a neuron’s epigenome?","sec":"Epigenetics","fig":"","p":[{"label":"Clinical link","text":"Previously silenced genes can become active, and active genes can become silenced, in mature differentiated neurons. Your patients’ histories (trauma, stress, substance use) and your treatments (medication, psychotherapy) are all on this list."}],"x":["Dietary deficiencies","Productive new encounters","Psychotropic medications"]},{"t":"Favourable versus unfavourable epigenetic change","sec":"Epigenetics","fig":"","c":[{"head":"Favourable","body":["Learning (e.g. spatial memory formation)","Therapeutic actions of psychopharmacological agents"]},{"head":"Unfavourable","body":["Addiction to drugs of abuse","“Abnormal learning”: fear conditioning, an anxiety disorder, a chronic pain condition"]}],"p":[{"label":"Horizon","text":"Future hope: harness epigenetics to treat addictions, extinguish fear, prevent chronic pain states, and perhaps prevent progression of disorders such as schizophrenia by identifying high-risk individuals early."}]},{"t":"Alternative splicing: one gene, many proteins","sec":"A Brief Word about RNA","fig":"Fig 1-31","b":["Primary transcript = the “first draft” mRNA copied from DNA.","Splicing reorganises sections or leaves them “on the cutting-room floor.”","Result: brain molecular diversity exceeds our ~20,000 genes."],"x":["Primary transcript"]},{"t":"RNA that does not code for protein","sec":"A Brief Word about RNA","fig":"","c":[{"head":"Two directions","body":"Forms of RNA can lead to protein synthesis (mRNA) and also block protein synthesis (RNA interference)."}],"tb":[[["Noncoding RNA","Abbreviation"],["Ribosomal RNA","rRNA"],["Transfer RNA","tRNA"],["Small nuclear RNA","snRNA"],["Small hairpin RNA (hairpin-shaped), also called microRNA","shRNA / miRNA"],["Interference RNA","iRNA"],["Small interfering RNA","siRNA"]]]},{"t":"RNA interference","sec":"A Brief Word about RNA","fig":"Fig 1-32","f":[["miRNA / shRNA transcribed from DNA, not translated","Forms hairpin loops in the nucleus","Exportin moves it into the cytoplasm","Dicer chops it into small pieces","Pieces bind the RISC protein complex","RISC binds mRNA → no translation"]],"p":[{"label":"Reading the figure","text":"Top: the nucleus, where DNA gives rise to the hairpin RNA. Labelled enzymes: exportin, then dicer. Bottom: RISC on mRNA at the ribosome, marked “no translation.”"},{"label":"Horizon","text":"Future therapeutics may use iRNAs to block protein synthesis in genetic disorders such as Huntington’s disease."}]},{"t":"The real purpose of neurotransmission","sec":"Summary and Review","fig":"","b":["Many neurotransmitters exist, and every neuron receives input from many of them.","Most transmission is classic and asymmetric (pre → post), across roughly a trillion synapses.","Some is retrograde (post → pre), and volume transmission needs no synapse at all.","Transmitters launch molecule-by-molecule cascades that alter the receiving cell’s biochemical machinery."],"x":["Not merely a transmitter meeting its receptor, but a presynaptic genome conversing with a postsynaptic genome: DNA to DNA, command centre to command centre, and back."]},{"t":"Three “molecular pony express” routes","sec":"Summary and Review","fig":"","c":[{"head":"Presynaptic synthesis route","body":"From the presynaptic genome to synthesis and packaging of neurotransmitter, supporting enzymes, and receptors."},{"head":"Postsynaptic route to the genome","body":"From receptor occupancy through second messengers all the way to the genome, turning on postsynaptic genes."},{"head":"Postsynaptic route from new genes","body":"From newly expressed genes, a molecular cascade of biochemical consequences spreads throughout the postsynaptic neuron."}]},{"t":"Timescales: a brief puff, a lasting effect","sec":"Summary and Review","fig":"","p":[{"label":"Remember","text":"The ultimate goal of neurotransmission is to alter the target neuron’s biochemistry in a profound and enduring way, which takes time."}],"x":["Milliseconds–seconds","Receptor binding, ion flow changes, second-messenger formation","Usual time from receptor occupancy to gene expression","Biochemical events set off by gene activation begin","Days–weeks (or a lifetime)","How long those changes can last once in motion"]},{"t":"Drugs and disease act on the same machinery","sec":"Summary and Review","fig":"","c":[{"head":"Today’s drugs","body":"Most psychotropics act on neurotransmitters, their enzymes, and especially their receptors."},{"head":"Tomorrow’s drugs","body":"Will likely act directly on the biochemical cascades, especially elements controlling pre- and postsynaptic gene expression."},{"head":"Illness","body":"Mental and neurological illnesses are known or suspected to affect these same aspects of chemical neurotransmission."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","b":["Think in circuits and multiple transmitters: this is the rationale Stahl gives for combining agents when single-mechanism drugs fail.","Think beyond the synapse: drugs act wherever their receptors are, including sites reached only by volume transmission.","Think in time: binding is immediate, but gene-expression effects take hours to days and can last days to weeks or longer.","Think bidirectionally: genes shape behaviour, and experience, stress, drugs and psychotherapy can reshape gene expression and the epigenome.","Learn the icons now: the numbered-messenger and “7” conventions from this chapter recur throughout the book."]}],"cards":[{"id":"c1-1","q":"Name the three modes of chemical neurotransmission described in Chapter 1.","a":"Classic (anterograde), retrograde, and volume (nonsynaptic diffusion)."},{"id":"c1-2","q":"Give three retrograde messengers and where each acts presynaptically.","a":"Endocannabinoids → CB1 receptors; nitric oxide → cGMP-sensitive targets; NGF → taken up and carried back to the nucleus/genome."},{"id":"c1-3","q":"Why is dopamine in the prefrontal cortex a good example of volume transmission?","a":"The PFC has very few DATs, so dopamine spills over to extrasynaptic receptors (unlike the DAT-rich striatum)."},{"id":"c1-4","q":"Which ions and channels drive excitation–secretion coupling?","a":"Na⁺ through VSSCs carries the action potential; Ca²⁺ through VSCCs at the terminal triggers vesicle release."},{"id":"c1-5","q":"List the four elements of a G-protein-linked second-messenger system.","a":"Neurotransmitter (1st messenger), 7-transmembrane receptor, G protein, and the second-messenger-synthesising enzyme."},{"id":"c1-6","q":"How does cAMP turn on a dormant protein kinase?","a":"Two cAMP bind each regulatory unit; the units dissociate, the dimer splits, and each kinase is freed and active."},{"id":"c1-7","q":"What activates calcineurin, and what does it do?","a":"Calcium (the 2nd messenger); calcineurin is a phosphatase that removes phosphates from phosphoproteins."},{"id":"c1-8","q":"Name the four major signal transduction cascades.","a":"G-protein-linked, ion-channel-linked, hormone-linked, and neurotrophin-linked."},{"id":"c1-9","q":"How does the ion-channel-linked cascade reach CREB?","a":"Ca²⁺ → calmodulin → CaMK, which enters the nucleus and phosphorylates CREB."},{"id":"c1-10","q":"What are cFos and cJun, and how do they switch on late genes?","a":"Immediate early genes; their products Fos and Jun form a leucine-zipper transcription factor that activates late genes."},{"id":"c1-11","q":"Which chemical changes open chromatin gates, and which close them?","a":"Open: acetylation, demethylation. Close: methylation, deacetylation."},{"id":"c1-12","q":"Trace the methyl donor pathway used by methyltransferases.","a":"L-methylfolate → SAMe → methyl groups donated to DNA or histones."},{"id":"c1-13","q":"Contrast DNMT1 with DNMT2/DNMT3.","a":"DNMT1 maintains existing methylation for life; DNMT2/3 add de novo methylation, silencing previously active genes."},{"id":"c1-14","q":"How can one gene produce more than one protein?","a":"Alternative splicing of the primary transcript into different mRNA variants."},{"id":"c1-15","q":"Outline the steps of RNA interference.","a":"miRNA/shRNA forms hairpins → exportin → dicer → pieces bind RISC → RISC binds mRNA → no translation."},{"id":"c1-16","q":"How long from receptor occupancy to gene expression, and how long can effects last?","a":"Usually hours to gene expression; changes can last days to weeks, or even a lifetime."}],"glossary":[{"t":"CB1","m":"Cannabinoid 1 receptor"},{"t":"EC","m":"Endocannabinoid"},{"t":"NO","m":"Nitric oxide"},{"t":"cGMP","m":"Cyclic guanosine monophosphate"},{"t":"NGF","m":"Nerve growth factor"},{"t":"DAT","m":"Dopamine transporter"},{"t":"VSSC","m":"Voltage-sensitive sodium channel"},{"t":"VSCC","m":"Voltage-sensitive calcium channel"},{"t":"NT","m":"Neurotransmitter"},{"t":"cAMP","m":"Cyclic adenosine monophosphate"},{"t":"E","m":"Enzyme (e.g. adenylate cyclase)"},{"t":"PKA","m":"Protein kinase A"},{"t":"CaMK","m":"Calcium/calmodulin-dependent kinase"},{"t":"CREB","m":"cAMP response element-binding protein"},{"t":"HRE","m":"Hormone-response element"},{"t":"MEK","m":"MAPK kinase / ERK kinase"},{"t":"ERK","m":"Extracellular signal-regulated kinase"},{"t":"RSK","m":"Ribosomal S6 kinase"},{"t":"MAPK","m":"Mitogen-activated protein kinase"},{"t":"GSK-3","m":"Glycogen synthase kinase 3"},{"t":"TF","m":"Transcription factor"},{"t":"mRNA","m":"Messenger RNA"},{"t":"HDAC","m":"Histone deacetylase"},{"t":"DNMT","m":"DNA methyltransferase"},{"t":"SAMe","m":"S-adenosyl-methionine"},{"t":"L-MF","m":"L-methylfolate"},{"t":"Ac / Me","m":"Acetyl / methyl group"},{"t":"rRNA","m":"Ribosomal RNA"},{"t":"tRNA","m":"Transfer RNA"},{"t":"snRNA","m":"Small nuclear RNA"},{"t":"shRNA","m":"Small hairpin RNA"},{"t":"miRNA","m":"MicroRNA"},{"t":"iRNA","m":"Interference RNA"},{"t":"siRNA","m":"Small interfering RNA"},{"t":"RISC","m":"Protein complex that binds mRNA to block translation"},{"t":"PFC","m":"Prefrontal cortex"}]},{"n":2,"title":"Transporters, Receptors, and Enzymes as Targets of Drug Action","short":"Transporters & receptors","notes":[{"t":"Only a few targets for 100+ drugs","sec":"","fig":"Fig 2-1","b":["This chapter: transporters (~⅓), G-protein-linked receptors (~⅓), enzymes (~10%).","Chapter 3: the ion channels that make up the balance.","Payoff: master a few sites and you can understand the proposed mechanisms of virtually all psychotropics."]},{"t":"Name drugs by mechanism, not indication","sec":"","fig":"","c":[{"head":"Old: by indication","body":"e.g. “antidepressant,” “antipsychotic.” Confusing, because drugs get used far beyond their original indication (so-called antipsychotics used for depression)."},{"head":"New: by mechanism","body":"Neuroscience-based nomenclature, e.g. “serotonin transport inhibitor” or “dopamine D2 and serotonin 5HT2A antagonist.”"}],"p":[{"label":"Why it matters","text":"Chapters 2 and 3 explain every known mechanism targeted by psychotropic drugs, which is exactly f glutamate transporters as targets is unclear, since it is often more desirable to reduce than to enhance glutamate transmission."]},{"t":"SLC6 versus SLC1 transporters","sec":"Other Transporters (SLC6 and SLC1)","fig":"","tb":[[["Feature","SLC6 (monoamines, GABA, glycine, choline)","SLC1 (glutamate: EAAT1–5)"],["Chloride cotransport with Na⁺","Yes, in most cases","Does not seem to occur"],["K⁺ countertransport","In some cases","Almost always"],["Working units","Seem to be dimers","May be trimers"],["Clinical drugs","Many (monoamine transporters; tiagabine at GAT1)","None known"]]]},{"t":"Transmitters without a reuptake pump","sec":"Other Transporters (SLC6 and SLC1)","fig":"","c":[{"head":"Histamine","body":["No known presynaptic transporter","Still packaged into vesicles by VMAT2","Inactivation thought to be entirely enzymatic"]},{"head":"Neuropeptides","body":["No reuptake pumps or presynaptic transporters found","Inactivated by diffusion, sequestration, and enzymatic destruction"]}]},{"t":"Vesicular transporter subtypes","sec":"Vesicular Transporters","fig":"Fig 2-2B; Table 2-3","c":[{"head":"Also: SV2A","body":"A novel 12-TM synaptic vesicle transporter with uncertain mechanism and substrates. It binds the anticonvulsant levetiracetam, perhaps interfering with neurotransmitter release and so reducing seizures."}],"x":["SLC185HT, NE, DA, histamine","SLC18Acetylcholine"]},{"t":"Filling vesicles: the proton pump and “antiport”","sec":"Vesicular Transporters","fig":"Figs 2-2A, 2-2B","tb":[[["","Plasma membrane (Fig 2-2A)","Vesicle (Fig 2-2B)"],["Energy source","Na⁺/K⁺ ATPase (sodium pump)","Proton ATPase (proton pump)"],["Mode","Cotransport with Na⁺ (± Cl⁻)","Antiport: swapped for H⁺"],["Charge","—","Kept constant inside vesicle"]]],"x":["H⁺ pumped out (proton ATPase)","Transmitter in (e.g. DA via VMAT)","Schematic, not Stahl’s artwork"]},{"t":"Drugs that target VMATs","sec":"Vesicular Transporters","fig":"","tb":[[["Drug","Action at VMAT","Other targets"],["Amphetamine","Transported substrate","Also monoamine transporters (two targets)"],["Tetrabenazine","Inhibitor","—"],["Deutetrabenazine","Inhibitor (tetrabenazine derivative)","—"],["Valbenazine","Inhibitor (tetrabenazine derivative)","—"],["Methylphenidate, cocaine","None","Monoamine transporters only"]]],"p":[{"label":"Clinical link","text":"VMAT2 inhibitors have been introduced to treat movement disorders such as tardive dyskinesia (details in Chapter 5)."}]},{"t":"No drugs yet at the other vesicular transporters","sec":"Vesicular Transporters","fig":"","p":[{"label":"Take-home","text":"Clinically, the vesicular story is about VMATs in monoamine (especially dopamine) neurons: amphetamine as a substrate, and tetrabenazine and its derivatives as inhibitors."}],"x":["SLC18 · acetylcholine","no human drug known","no human drug known","no human drug known"]},{"t":"Structure: seven transmembrane regions","sec":"G-Protein-Linked Receptors","fig":"Fig 2-1B","b":["Receptors span the membrane seven times.","The transmembrane regions cluster around a central core holding the neurotransmitter binding site.","Drugs can act at the neurotransmitter site or at other (allosteric) sites.","Drugs can mimic or block, partially or fully, the neurotransmitter’s normal action."],"x":["neurotransmitter site (central core)","7 membrane crossings (schematic)"]},{"t":"Drug action here ripples downstream","sec":"G-Protein-Linked Receptors","fig":"","b":["Modified targets: enzymes, receptors, and ion channels downstream.","Gene-level effects: which proteins are made and which neuronal functions are amplified, from synaptogenesis to receptor and enzyme synthesis to communication with downstream neurons.","Clinical result: these modifications can profoundly affect psychiatric symptoms."],"f":[["Drug at G-protein-linked receptor","Changed signal transduction (Ch. 1)","Which phosphoproteins are on or off","Which genes are expressed or silenced"]]},{"t":"The single most common action of psychotropics","sec":"G-Protein-Linked Receptors","fig":"","c":[{"head":"Therapeutic actions","body":"Specific receptors, specific drugs, distinct symptom improvements (developed in the clinical chapters)."},{"head":"Side effects","body":"The same receptor actions also produce characteristic side effects."}],"x":["Modifying the actions of one or more G-protein-linked receptors is the single most common action of psychotropic drugs in clinical practice."]},{"t":"Pharmacological subtypes: master key vs specific key","sec":"G-Protein-Linked Receptors","fig":"","c":[{"head":"Natural neurotransmitter","body":"A master key: it opens all the doors, acting at every one of its receptor subtypes."},{"head":"Selective drug","body":"A specific key: it opens only one door. The subtype it selects defines a pharmacological subtype of receptor."}],"p":[{"label":"Next","text":"Drugs can interact with pharmacological subtypes of G-protein-linked receptors in many ways, across what is called the agonist spectrum (next section)."}]},{"t":"The agonist spectrum at a glance","sec":"The Agonist Spectrum","fig":"Figs 2-3, 2-10","b":["Full agonist: maximum signal transduction.","Partial agonist: more than none, less than full; “stabilizer.”","Antagonist: no activity of its own; blocks others. “Silent.”","Inverse agonist: the true opposite of an agonist; drops activity below baseline."],"x":["No agonist / silent antagonist","baseline (constitutive)","Conceptual heights, not measured data"]},{"t":"No agonist ≠ no activity: constitutive activity","sec":"The Agonist Spectrum","fig":"Fig 2-4","b":["Without agonist, the activating conformational change may still happen, but at very low frequency.","This is called constitutive activity.","Density matters: low frequency across a high number of receptors can still give detectable signal output."],"x":["No agonist / silent antagonist","baseline (constitutive)"]},{"t":"Full agonists: maximum signal transduction","sec":"The Agonist Spectrum","fig":"Fig 2-5","b":["Usually the natural neurotransmitter itself; some drugs act as fully.","Downstream proteins are maximally phosphorylated; genes are maximally affected.","Useful where reduced signal transduction produces symptoms."],"x":["No agonist / silent antagonist","baseline (constitutive)"]},{"t":"Two routes to full agonist action","sec":"The Agonist Spectrum","fig":"Tables 2-4, 2-5","c":[{"head":"Direct-acting agonists (Table 2-4)","body":"The drug binds the neurotransmitter site on the receptor itself and produces the full array of signal transduction."},{"head":"Indirect agonism (Table 2-5)","body":["Boost levels of the natural transmitter by blocking its inactivation:","block transporters: SERT, NET, DAT, GAT1","block destroying enzymes: MAO, acetylcholinesterase"]}]},{"t":"Table 2-4 (1/4): Dopamine and serotonin 5HT2A","sec":"The Agonist Spectrum","fig":"Table 2-4","tb":[[["Receptor","Pharmacological action","Therapeutic action / side effect"],["D2","Antagonist or partial agonist","Antipsychotic; antimanic"],["5HT2A","Antagonist or inverse agonist","Antipsychotic actions in Parkinson’s disease psychosis and in dementia-related psychosis; reduced drug-induced parkinsonism; possible reduction of negative symptoms in schizophrenia; possible mood-stabilizing and antidepressant actions in bipolar disorder; improved insomnia and anxiety"],["5HT2A","Agonist","Psychotomimetic actions; experimental treatment of refractory depression and other disorders, especially accompanying psychotherapy"]]],"p":[{"label":"Notice","text":"The same receptor (5HT2A) gives very different clinical effects depending on where the drug sits on the agonist spectrum: blocking it is antipsychotic, stimulating it is psychotomimetic."}]},{"t":"Table 2-4 (2/4): Other serotonin receptors","sec":"The Agonist Spectrum","fig":"Table 2-4","tb":[[["Receptor","Pharmacological action","Therapeutic action / side effect"],["5HT1B/1D","Antagonist or partial agonist","Possible pro-cognitive and antidepressant actions"],["5HT2C","Antagonist","Antidepressant"],["5HT6","?","?"],["5HT7","Antagonist","Possible pro-cognitive and antidepressant actions"],["5HT1A","Partial agonist","Reduced drug-induced parkinsonism; anxiolytic; booster of antidepressant actions of SSRIs/SNRIs"]]]},{"t":"Table 2-4 (3/4): Norepinephrine, GABA, melatonin","sec":"The Agonist Spectrum","fig":"Table 2-4","tb":[[["Receptor","Pharmacological action","Therapeutic action / side effect"],["Alpha 2","Antagonist","Antidepressant actions"],["Alpha 2","Agonist","Improved cognition and behavioural disturbance in ADHD"],["Alpha 1","Antagonist","Improved sleep (nightmares); improved agitation in Alzheimer disease; side effects of orthostatic hypotension and possibly sedation"],["GABA-B","Agonist","Cataplexy; sleepiness in narcolepsy; possible enhanced slow-wave sleep; pain reduction in chronic pain and fibromyalgia; possible utility for alcohol use disorder and withdrawal"],["MT1","Agonist","Improvement of insomnia and circadian rhythms"],["MT2","Agonist","Improvement of insomnia and circadian rhythms"]]]},{"t":"Table 2-4 (4/4): Histamine, acetylcholine, orexin","sec":"The Agonist Spectrum","fig":"Table 2-4","tb":[[["Receptor","Pharmacological action","Therapeutic action / side effect"],["H1","Antagonist","Therapeutic for anxiety and insomnia; side effect of sedation and weight gain"],["H3","Antagonist / inverse agonist","Improvement of daytime sleepiness"],["M1","Agonist","Procognitive and antipsychotic"],["M1","Antagonist","Side effect of sedation and memory disturbance"],["M4","Agonist","Antipsychotic"],["M2/3","Antagonist","Dry mouth, blurred vision, constipation, urinary retention; may contribute to metabolic dysregulation (dyslipidemia, diabetes)"],["M5","?","?"],["Ox1,2 (orexin A, B)","Antagonist","Hypnotic for insomnia"]]]},{"t":"Table 2-5: Receptors indirectly targeted","sec":"The Agonist Spectrum","fig":"Table 2-5","tb":[[["Transmitter","Receptor(s) indirectly targeted","How (drug action)","Therapeutic action"],["Dopamine","D1–D5 agonist actions","DA reuptake inhibition / release by methylphenidate / amphetamine","Improves ADHD, depression, wakefulness"],["Serotonin","5HT1A (presynaptic somatodendritic autoreceptors); 5HT2A (postsynaptic; possibly 5HT1A, 2C, 6, 7)","Serotonin reuptake inhibition by SSRIs/SNRIs","Antidepressant, anxiolytic"],["Serotonin","5HT2A/2C agonist","Serotonin release by MDMA","“Empathogen”: experimental PTSD treatment, especially with psychotherapy"],["Norepinephrine","All NE receptors (agonist)","NE reuptake inhibition","Antidepressant; neuropathic pain; ADHD"],["Acetylcholine","M1 (possibly M2–M5)","Raises ACh at all its receptors via acetylcholinesterase inhibition","Cognition in Alzheimer disease"]]]},{"t":"Antagonists: “silent” blockers","sec":"The Agonist Spectrum","fig":"Fig 2-6","b":["Used when full agonism is “too much of a good thing” (overstimulation).","Cause no change in signal transduction, including no change in constitutive activity.","Therefore neutral, or “silent.”","Not the opposite of agonists: that is the inverse agonist."],"x":["No agonist / silent antagonist","baseline (constitutive)"]},{"t":"An antagonist reverses everything on the spectrum","sec":"The Agonist Spectrum","fig":"Figs 2-6, 2-10","p":[{"label":"Note","text":"Clinically: many more antagonists than direct full agonists are used (Table 2-4)."}],"x":["Full agonist present","+ antagonist: Blocks it → back to baseline","Partial agonist present","+ antagonist: Blocks it → back to baseline","Inverse agonist present","+ antagonist: Reverses it → back UP to baseline","Nothing else present","+ antagonist: No effect at all"]},{"t":"Partial agonists: the “Goldilocks” solution","sec":"The Agonist Spectrum","fig":"Fig 2-7","b":["Turn the gain down from full agonist, but not to zero.","Not too “hot,” not too “cold,” but “just right.”","“Stabilizers”: may steady out-of-tune neurotransmission.","Not simply “weak”: partial agonism need not mean partial efficacy."],"x":["No agonist / silent antagonist","baseline (constitutive)"]},{"t":"Light switch vs rheostat","sec":"The Agonist Spectrum","fig":"Fig 2-8","p":[{"label":"Key","text":"Each partial agonist has its own built-in set point: a higher dose cannot make the light brighter."}],"x":["light at its brightest","dimmed but still shining"]},{"t":"Net agonist or net antagonist? It depends on the room","sec":"The Agonist Spectrum","fig":"Fig 2-8","tb":[[["Starting condition","Add partial agonist","Net effect"],["Dark room: no natural full agonist","Lights come up to the partial agonist’s set level","Net AGONIST"],["Brightly lit room: full agonist present","Lights dim to the same set level (not to zero)","Net ANTAGONIST"]]],"p":[{"label":"Clinical link","text":"A partial agonist can boost deficient activity and block excessive activity at the same time. This is why it is proposed for states of deficiency, excess, or a mixture of both."}]},{"t":"Inverse agonists: beyond antagonism","sec":"The Agonist Spectrum","fig":"Fig 2-9","b":["Stabilize the receptor in a totally inactive form.","Shut down even constitutive activity: below baseline.","Density caveat: with too few receptors for detectable constitutive activity, an inverse agonist looks like an antagonist.","Clinical distinction from antagonists is still being clarified."],"x":["No agonist / silent antagonist","baseline (constitutive)"]},{"t":"Agonist spectrum: summary table","sec":"The Agonist Spectrum","fig":"Fig 2-10","tb":[[["Agent","Receptor conformation","Signal vs baseline","Stahl’s nickname"],["Full agonist","Fully activating","Maximum","Light fully on"],["Partial agonist","Intermediate","Above baseline, below max; lowers full-agonist signal","Stabilizer; Goldilocks"],["Antagonist","Same as no agonist","Baseline (constitutive) only","Silent; neutral"],["Inverse agonist","Totally inactive","Below baseline","Opposite of agonist"]]],"p":[{"label":"Summary","text":"Most drugs acting directly at G-protein-linked receptors are antagonists; a few are partial or inverse agonists."}]},{"t":"Enzyme activity: substrate to product","sec":"Enzymes as Sites of Drug Action","fig":"Fig 2-11","b":["Substrates, products, and inhibitors are each highly unique and selective for a given enzyme.","An inhibitor prevents the enzyme from binding its substrates.","Inhibitor binding can be irreversible or reversible (next slide)."],"f":[["Substrate approaches the enzyme’s active site","Substrate binds the active site","Transformed and released as product"]]},{"t":"Irreversible versus reversible inhibitors","sec":"Enzymes as Sites of Drug Action","fig":"Figs 2-12, 2-13","c":[{"head":"Irreversible (“suicide”)","body":["Binds covalently; the substrate cannot displace it","Drawn as chains that scissors cannot cut","Enzyme is permanently nonfunctional","Activity returns only when new enzyme is synthesized"]},{"head":"Reversible","body":["Substrate competes and can shove it off","Drawn as strings the substrate cuts with scissors","Winner depends on affinity and concentration"]}]},{"t":"Only three enzymes targeted clinically","sec":"Enzymes as Sites of Drug Action","fig":"","p":[{"label":"Note","text":"Enzymes act throughout neurotransmission (synthesis, destruction, signal transduction), yet only these three are targeted by psychotropics currently used."}],"x":["Mood disorder treatments (Ch. 7)","Acetylcholinesterase","Glycogen synthase kinase 3","Possible lithium target (this chapter)"]},{"t":"GSK-3: a possible target for lithium","sec":"Enzymes as Sites of Drug Action","fig":"Fig 2-14","f":[["Neurotrophins · insulin / IGF-1 · Wnt glycoproteins","GSK-3 active","Proapoptotic (promotes cell death)"],["Lithium (? valproate, ? ECT)","GSK-3 inhibited","Neuroprotection · long-term plasticity · antimanic / mood stabilizing"]],"x":["Question marks for valproate and ECT reflect uncertainty in the text"]},{"t":"Pharmacokinetics vs pharmacodynamics","sec":"Cytochrome P450 Drug-Metabolizing Enzymes","fig":"","c":[{"head":"Pharmacokinetics (PK)","body":"How the body acts on the drug: absorption, distribution, metabolism, excretion. Mediated largely by CYP450 enzymes in gut and liver."},{"head":"Pharmacodynamics (PD)","body":"The drug’s action at its targets (this chapter and Chapter 3): the mechanism of action behind therapeutic effects and side effects."}],"p":[{"label":"Key","text":"Most psychotropic drugs also target CYP450 enzymes as a substrate, an inhibitor, and/or an inducer."}]},{"t":"The journey through CYP450","sec":"Cytochrome P450 Drug-Metabolizing Enzymes","fig":"Fig 2-15","f":[["Drug absorbed through gut wall","CYP450 in gut wall or liver biotransforms it","Bloodstream: unchanged drug + biotransformed product","Excreted via kidney"]],"p":[{"label":"Link","text":"CYP450 enzymes follow the same substrate → product rules as any enzyme (Figs 2-11 to 2-13)."}]},{"t":"Six key CYP450 enzymes and their names","sec":"Cytochrome P450 Drug-Metabolizing Enzymes","fig":"Fig 2-16","x":["Over 30 CYP450 enzymes are known."]},{"t":"Metabolizer types","sec":"Cytochrome P450 Drug-Metabolizing Enzymes","fig":"","tb":[[["Metabolizer type","Enzyme activity","Consequences at standard doses","Dosing implication"],["Extensive (“normal”)","Normal","Expected levels; most doses are set for these patients","Standard dose"],["Intermediate","Reduced","Higher drug levels; drug–drug interaction risk; less active metabolite","May need less than standard"],["Poor","Reduced","Higher drug levels; drug–drug interaction risk; less active metabolite","May need less than standard"],["Ultra-rapid","Elevated","Subtherapeutic levels; poor efficacy","May need more (dose up)"]]],"p":[{"label":"Clinical link","text":"Unknown genetic variation can explain unexpected lack of efficacy or unexpected side effects."}]},{"t":"Genotyping and therapeutic drug monitoring","sec":"Cytochrome P450 Drug-Metabolizing Enzymes","fig":"","c":[{"head":"Genotyping","body":"Measuring the patient’s CYP450 genes to predict who may need doses adjusted up or down."},{"head":"Therapeutic drug monitoring","body":"Measuring actual blood levels to confirm the genetic prediction (sometimes called phenotyping)."}],"p":[{"label":"When to use","text":"Combining the two is especially useful for patients who do not respond to or tolerate standard doses (treatment-resistant patients). Interactions keep being discovered, so check an up-to-date reference before combining drugs."}]},{"t":"Chapter summary: transporters","sec":"Summary and Review","fig":"","c":[{"head":"About a third of drugs","body":"Nearly a third of psychotropic drugs bind a neurotransmitter transporter."},{"head":"Five subclasses","body":"Two plasma membrane (SLC6, SLC1) and three vesicular (SLC18, SLC32, SLC17)."},{"head":"SERT, NET, DAT","body":"Key targets for most drugs for unipolar depression and ADHD, and many others from anxiety to pain."},{"head":"VMAT2","body":"Stores monoamines and histamine; inhibited by drugs recently introduced for movement disorders such as tardive dyskinesia."}]},{"t":"Chapter summary: receptors and enzymes","sec":"Summary and Review","fig":"","c":[{"head":"Most common target","body":"G-protein-linked receptors, for both therapeutic effects and side effects."},{"head":"Agonist spectrum","body":"Each drug’s conformational change places it: full, partial, antagonist, or inverse."},{"head":"Mostly antagonists","body":"Most direct-acting drugs are antagonists; a few partial agonists, some inverse agonists."},{"head":"Three enzymes","body":"MAO, acetylcholinesterase, and GSK-3 are targeted for therapeutic effect."},{"head":"CYP450","body":"Many more drugs interact with CYP450 enzymes: a pharmacokinetic, not pharmacodynamic, matter."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Think mechanism, not label","body":"Monoamine transport inhibitors treat far more than depression, and are not first-line for bipolar or mixed-features depression."},{"head":"Place drugs on the spectrum","body":"A partial agonist is a net agonist or net antagonist depending on how much natural transmitter is present."},{"head":"Side effects are receptor actions","body":"H1: sedation, weight gain. M2/3: anticholinergic effects. Alpha 1: orthostatic hypotension."},{"head":"Remember PK","body":"CYP450 genotype and drug levels can explain non-response or intolerance at standard doses."}]}],"cards":[{"id":"c2-1","q":"What share of psychotropics targets transporters, G-protein-linked receptors, and enzymes?","a":"About ⅓, ⅓, and ~10% respectively (ion channels make up the rest)."},{"id":"c2-2","q":"Name the five transporter gene families and what each carries.","a":"SLC6 (monoamines, GABA, glycine, choline), SLC1 (glutamate), SLC18 (VMATs, VAChT), SLC32 (GABA), SLC17 (glutamate)."},{"id":"c2-3","q":"What is the false substrate for SERT? For DAT?","a":"SERT: MDMA (Ecstasy). DAT: norepinephrine, epinephrine, amphetamine."},{"id":"c2-4","q":"What supplies the energy for monoamine reuptake?","a":"Na⁺/K⁺ ATPase creates a sodium gradient; downhill Na⁺ is coupled to uphill monoamine."},{"id":"c2-5","q":"Where do SSRIs bind on SERT, and why is that “allosteric”?","a":"At a site other than the substrate site; it lowers SERT’s affinity for serotonin and is not transported."},{"id":"c2-6","q":"Which clinical drug blocks GAT1?","a":"Tiagabine."},{"id":"c2-7","q":"Which transmitters lack presynaptic transporters?","a":"Histamine and neuropeptides."},{"id":"c2-8","q":"How are neurotransmitters loaded into vesicles?","a":"A proton pump pushes H⁺ out; transmitter is antiported in, keeping charge constant."},{"id":"c2-9","q":"Name drugs that act at VMATs and how.","a":"Amphetamine (transported substrate); tetrabenazine, deutetrabenazine, valbenazine (inhibitors)."},{"id":"c2-10","q":"Define constitutive activity and when it is detectable.","a":"Low-frequency receptor activation without agonist; detectable where receptor density is high."},{"id":"c2-11","q":"Give two ways to achieve indirect full agonism.","a":"Block reuptake (SERT, NET, DAT, GAT1) or block breakdown enzymes (MAO, AChE)."},{"id":"c2-12","q":"Why is an antagonist called “silent”?","a":"It has no activity of its own and returns the receptor to baseline."},{"id":"c2-13","q":"When is a partial agonist a net antagonist?","a":"When natural full agonist is present: it dims the signal to its set level."},{"id":"c2-14","q":"How does an inverse agonist differ from an antagonist?","a":"It drops signalling below baseline, shutting off constitutive activity; antagonists only return to baseline."},{"id":"c2-15","q":"Name the three enzymes targeted clinically.","a":"MAO, acetylcholinesterase, GSK-3."},{"id":"c2-16","q":"What should you do for a patient who fails or cannot tolerate standard doses?","a":"Consider CYP450 genotyping plus therapeutic drug monitoring, and check an up-to-date interaction reference."}],"glossary":[{"t":"SLC","m":"Solute carrier (gene family)"},{"t":"SERT","m":"Serotonin transporter"},{"t":"NET","m":"Norepinephrine transporter"},{"t":"DAT","m":"Dopamine transporter"},{"t":"GAT","m":"GABA transporter"},{"t":"BGT1","m":"Betaine transporter"},{"t":"GlyT","m":"Glycine transporter"},{"t":"EAAT","m":"Excitatory amino acid transporter"},{"t":"VMAT","m":"Vesicular monoamine transporter"},{"t":"VAChT","m":"Vesicular acetylcholine transporter"},{"t":"VIAAT","m":"Vesicular inhibitory amino acid transporter"},{"t":"vGluT","m":"Vesicular glutamate transporter"},{"t":"SV2A","m":"Synaptic vesicle transporter bound by levetiracetam"},{"t":"ATPase","m":"Adenosine triphosphatase"},{"t":"MDMA","m":"3,4-methylenedioxymethamphetamine"},{"t":"SSRI","m":"Selective serotonin reuptake inhibitor"},{"t":"SNRI","m":"Serotonin norepinephrine reuptake inhibitor"},{"t":"ADHD","m":"Attention deficit hyperactivity disorder"},{"t":"TM","m":"Transmembrane region"},{"t":"5HT","m":"Serotonin"},{"t":"D2","m":"Dopamine 2 receptor"},{"t":"H1 / H3","m":"Histamine 1 / 3 receptors"},{"t":"M1–M5","m":"Muscarinic receptors"},{"t":"MT1 / MT2","m":"Melatonin receptors"},{"t":"Ox1,2","m":"Orexin receptors"},{"t":"GABA-B","m":"GABA B receptor"},{"t":"MAO","m":"Monoamine oxidase"},{"t":"AChE","m":"Acetylcholinesterase"},{"t":"GSK-3","m":"Glycogen synthase kinase 3"},{"t":"IGF-1","m":"Insulin-like growth factor 1"},{"t":"ECT","m":"Electroconvulsive therapy"},{"t":"CYP450","m":"Cytochrome P450"},{"t":"PK / PD","m":"Pharmacokinetics / pharmacodynamics"},{"t":"PTSD","m":"Posttraumatic stress disorder"},{"t":"OCD","m":"Obsessive–compulsive disorder"},{"t":"NE / DA","m":"Norepinephrine / dopamine"}]},{"n":3,"title":"Ion Channels as Targets of Drug Action","short":"Ion channels","notes":[{"t":"Two major classes of ion channel","sec":"","fig":"","c":[{"head":"Ligand-gated","body":["Opened by neurotransmitters (ligands)","Also called ionotropic receptors or ion-channel-linked receptors","e.g. GABAA, nicotinic, 5HT3, glycine, AMPA, kainate, NMDA"]},{"head":"Voltage-sensitive (voltage-gated)","body":["Opened by the voltage across the membrane","Drive nerve conduction, action potentials, and transmitter release","VSSCs (sodium) and VSCCs (calcium)"]}],"p":[{"label":"Key ions","text":"The most important ion channels in psychopharmacology regulate calcium, sodium, chloride, and potassium."}]},{"t":"Three names for the same thing","sec":"Ligand-Gated Ion Channels","fig":"","b":["Why several names? the complex is both a receptor and an ion channel, and each name captures part of that dual role.","Ligand: a neurotransmitter, drug, or hormone that binds a receptor (literally, “tying”).","Why channels exist: ions cannot cross membranes because of their charge, so membranes are “decorated” with channels to control ion entry and exit."],"x":["Ligand-gated ion channel","Ionotropic receptor","Ion-channel-linked receptor"]},{"t":"The receptor as gatekeeper","sec":"Ligand-Gated Ion Channels","fig":"Fig 3-1","p":[{"label":"Reading the figure","text":"In Fig 3-1 the receptor is drawn as a molecular gatekeeper that acts on instructions from neurotransmission: panel A opens the gate (“ENTER”), panel B keeps it shut (“NO ENTRY”)."}],"x":["A: neurotransmitter binds → channel opens, ions ENTER","B: gatekeeper keeps channel closed, NO ENTRY"]},{"t":"Immediate and delayed consequences","sec":"Ligand-Gated Ion Channels","fig":"","c":[{"head":"Immediate","body":"Drugs at these complexes alter the flow of ions through the channel right away."},{"head":"Delayed","body":["Activation or inactivation of phosphoproteins","Shifts in enzyme activity, receptor sensitivity, channel conductivity","Changes in gene expression, e.g. synaptogenesis, receptor and enzyme synthesis"]}],"p":[{"label":"Why it matters","text":"Drug-induced changes in signalling from ionotropic receptors can have profound actions on psychiatric symptoms."}]},{"t":"Fast onset: a clinical signature","sec":"Ligand-Gated Ion Channels","fig":"","p":[{"label":"Clinical link","text":"This is why many drugs for anxiety and sleep acting at these receptors, such as the benzodiazepines, may work almost immediately."}],"x":["of psychotropic drugs act at ligand-gated ion channels","change in ion flow → possible immediate clinical onset","many G-protein-receptor effects (e.g. on mood) await signal transduction"]},{"t":"Receptor or channel? “Yes”","sec":"Structure: Pentameric and Tetrameric Channels","fig":"","b":["Built from several long strings of amino acids assembled as subunits around an ion channel.","Subunits carry multiple binding sites for neurotransmitters, ions, and drugs.","Some ions pass through the channel; others bind to it.","One neurotransmitter, or two cotransmitters, can act at separate sites.","Allosteric modulators (natural substances or drugs binding away from the transmitter site) raise or lower the sensitivity of channel opening."]},{"t":"Pentameric channels: five 4-TM subunits","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Fig 3-2","b":["Each subunit goes in and out of the membrane four times.","Five subunits come together to form the functional receptor with the channel in the middle.","Examples: GABAA, nicotinic cholinergic, serotonin 5HT3, and certain glycine receptors."],"x":["one subunit: 4 TM regions","×5 around a central pore","Schematic, not Stahl’s artwork"]},{"t":"Table 3-1: Pentameric ligand-gated ion channels","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Table 3-1","tb":[[["Neurotransmitter","Receptor subtype"],["Acetylcholine","Nicotinic receptors (e.g. α7 nicotinic; α4β2 nicotinic)"],["GABA","GABAA receptors (e.g. α1 subunits; γ subunits; δ subunits)"],["Glycine","Strychnine-sensitive glycine receptors"],["Serotonin","5HT3 receptors"]]],"p":[{"label":"Note","text":"Subtypes differ by which forms of each subunit are assembled; some drugs bind selectively to certain subtypes."}],"x":["Structure: four transmembrane regions per subunit · five subunits"]},{"t":"Subtypes built from subunit choices","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Fig 3-2","c":[{"head":"Natural neurotransmitter","body":"Binds every subtype of its ionotropic receptor."},{"head":"Selective drugs","body":"Some drugs in practice, and many in trials, bind one or more subtypes but not others, which may have clinical consequences."}],"f":[["Several forms of each subunit exist","Five are chosen and assembled","Different constellations = receptor subtypes"]]},{"t":"Tetrameric channels: glutamate receptors","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Fig 3-3","b":["Subunits have three full transmembrane regions plus a fourth re-entrant loop.","Four subunits form the channel, with the re-entrant loops lining it.","Examples: the ionotropic glutamate receptors AMPA, kainate, and NMDA.","Subtype-selective glutamate drugs are under investigation, not yet in practice."],"x":["3 TM + 1 re-entrant loop (coral)","×4 around a central pore","Schematic, not Stahl’s artwork"]},{"t":"Table 3-3: Tetrameric ligand-gated ion channels","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Table 3-3","tb":[[["Neurotransmitter","Receptor subtype","Example subunits"],["Glutamate","AMPA","GluR1–4"],["Glutamate","Kainate","GluR5–7, KA1–2"],["Glutamate","NMDA","NMDAR1, NMDAR2A–D, NMDAR3A"]]],"x":["Structure: three TM regions and one re-entrant loop per subunit · four subunits","AMPA = α-amino-3-hydroxy-5-methyl-4-isoxazole-propionic acid; NMDA = N-methyl-D-aspartate"]},{"t":"Pentameric vs tetrameric at a glance","sec":"Structure: Pentameric and Tetrameric Channels","fig":"","tb":[[["Feature","Pentameric","Tetrameric"],["Subunits","Five","Four"],["TM regions per subunit","Four full","Three full + one re-entrant loop"],["Channel lining","Five subunits around the pore","Re-entrant loops line the pore"],["Receptors","GABAA, nicotinic, 5HT3, strychnine-sensitive glycine","Glutamate: AMPA, kainate, NMDA"],["Binding sites","On all subunits, inside and outside the channel","On all subunits, inside and outside the channel"]]]},{"t":"Table 3-2 (1/2): Acetylcholine and GABA","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Table 3-2","tb":[[["Receptor / site","Pharmacological action","Drug class (examples)","Therapeutic action"],["α4β2 nicotinic (ACh)","Partial agonist","Nicotinic receptor partial agonist, NRPA (varenicline)","Smoking cessation"],["GABAA benzodiazepine receptors","Full agonist, phasic inhibition","Benzodiazepines","Anxiolytic"],["GABAA non-benzodiazepine PAM sites","Full agonist, phasic inhibition","“Z drugs”/hypnotics (zolpidem, zaleplon, zopiclone, eszopiclone)","Improves insomnia"],["GABAA neurosteroid sites (benzodiazepine-insensitive)","Full agonist, tonic inhibition","Neuroactive steroids (allopregnanolone)","Postpartum depression; rapid-acting antidepressant; anesthetic"]]],"p":[{"label":"Notice","text":"Three different GABAA sites, three drug classes: benzodiazepines (anxiety), Z drugs (insomnia), and neuroactive steroids (postpartum depression). Varenicline is the table’s only partial agonist."}]},{"t":"Table 3-2 (2/2): Glutamate and serotonin","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Table 3-2","tb":[[["Receptor / site","Pharmacological action","Drug class (examples)","Therapeutic action"],["NMDA NAM channel sites / Mg²⁺ sites","Antagonist","NMDA glutamate antagonist (memantine)","Pro-cognitive in Alzheimer disease"],["NMDA open-channel sites","Antagonist","PCP (phencyclidine), ketamine, dextromethorphan, dextromethadone","See the list below"],["5HT3","Antagonist","Mirtazapine, vortioxetine","Pro-cognitive; antidepressant"],["5HT3","Antagonist","Anti-emetic","Reduce chemotherapy-induced emesis"]]],"x":["Therapeutic actions listed for NMDA open-channel antagonists (not paired to individual drugs in the book): dissociative hallucinogen; anesthetic; pseudobulbar affect; agitation in Alzheimer disease; rapid-acting antidepressant; treatment-resistant depression."]},{"t":"Patterns to notice in Table 3-2","sec":"Structure: Pentameric and Tetrameric Channels","fig":"Table 3-2","c":[{"head":"GABAA: many sites","body":["Benzodiazepine site","Non-benzodiazepine PAM site (Z drugs)","Neurosteroid site"]},{"head":"Phasic vs tonic","body":["Benzodiazepines and Z drugs: phasic inhibition","Neurosteroids: tonic inhibition"]},{"head":"Most are antagonists","body":["Only varenicline is a partial agonist","NMDA and 5HT3 drugs are antagonists"]}]},{"t":"Spectrum = frequency of channel opening","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Fig 3-4","p":[{"label":"Rule","text":"Antagonists block anything on the spectrum, returning the channel to its resting state each time."}],"x":["Full agonist: maximal opening frequency","Partial agonist: more than resting, less than full","Antagonist: resting state, infrequent opening","Inverse agonist: closed and inactive"]},{"t":"Resting state and the silent antagonist","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Fig 3-6","b":["The resting channel opens occasionally even with no agonist: constitutive activity.","An antagonist stabilizes this same resting state.","No difference with or without it: “neutral” or “silent.”","Antagonists do not block constitutive activity."],"p":[{"label":"Reading the figure","text":"The yellow antagonist docks and turns the receptor yellow, but the channel looks the same as at rest."}],"x":["B: antagonist bound, no change"]},{"t":"Full agonists and what lies beyond","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Figs 3-5, 3-7","b":["Full agonists open the channel at the maximal frequency that binding site allows, giving maximal downstream signalling.","Going further requires a positive allosteric modulator (PAM).","An antagonist shoves the agonist off and restores the resting state (Fig 3-7)."],"p":[{"label":"Reading the figure","text":"The red agonist turns the receptor red and opens the channel; in Fig 3-7 the yellow antagonist wins and resets it."}],"x":["Agonist: channel opens more often","Antagonist displaces agonist → resting"]},{"t":"Partial agonists at ion channels","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Figs 3-8, 3-10","b":["Opens the channel more often than at rest, but less than a full agonist.","Where it sits on the spectrum decides its downstream impact.","“Goldilocks”: not too hot, not too cold; a “stabilizer.”"],"p":[{"label":"Reading the figure","text":"Orange partial agonist turns the receptor orange and half-opens the channel; in Fig 3-10 the yellow antagonist restores the resting state."}],"x":["Partial agonist: partly open","Antagonist displaces it → resting"]},{"t":"Net agonist or net antagonist?","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Fig 3-9","tb":[[["Starting point","Partial agonist added","Net effect"],["Resting state, no full agonist","Channel opens more often","Net AGONIST"],["Full agonist present","Channel opens less often (not zero)","Net ANTAGONIST"]]],"p":[{"label":"Clinical link","text":"A partial agonist can boost deficient activity and block excessive activity: theoretically useful for deficiency, excess, or mixtures. Partial agonists at ligand-gated channels are just entering practice (e.g. varenicline at α4β2 nicotinic receptors, Table 3-2)."}]},{"t":"Inverse agonists: close, then padlock","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Figs 3-11, 3-13","b":["Less ion flow than resting or antagonist states.","The opposite of an agonist.","Whether this is clinically distinct from the antagonist resting state is not yet clear."],"p":[{"label":"Reading the figure","text":"Purple inverse agonist turns the receptor purple and closes the channel; over time a padlock marks the inactive state (Fig 3-11)."}],"x":["Closed by inverse agonist","Stabilized: inactive"]},{"t":"The antagonist’s two-way trick","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"Figs 3-12, 3-13","c":[{"head":"Against an agonist","body":"Antagonist DECREASES the frequency of channel opening, back to resting."},{"head":"Against an inverse agonist","body":"Antagonist INCREASES the frequency of opening, back to resting. The inactive state can be reversed quickly (Fig 3-13)."}],"p":[{"label":"Key","text":"Either way, the antagonist returns the channel to its resting state, despite having no action of its own."}]},{"t":"Agonist spectrum at ion channels: summary","sec":"The Agonist Spectrum at Ligand-Gated Channels","fig":"","tb":[[["Agent","Channel state","Opening frequency","Stahl’s colour"],["Full agonist","Open","Maximal for that site","Red"],["Partial agonist","Partly open","Above resting, below full","Orange"],["Antagonist","Resting","Infrequent (constitutive)","Yellow"],["Inverse agonist","Closed → inactivated","Below resting","Purple (padlock)"],["Full agonist + PAM","Open further","Beyond full agonist alone","—"]]],"p":[{"label":"Tip","text":"Colours refer to the figures in the book (Figs 3-5 to 3-13)."}]},{"t":"Five states of a ligand-gated channel","sec":"Different States of Ligand-Gated Channels","fig":"Fig 3-14","p":[{"label":"Key","text":"Desensitization and inactivation are the best-known adaptive states."}],"x":["Opens infrequently; constitutive activity","Ion conductance and signal transduction","No ion flow; below resting","Stops responding to agonist even while it is bound","Closed channel stabilized in an inactive shape over time"]},{"t":"From open to desensitized to inactivated","sec":"Different States of Ligand-Gated Channels","fig":"Fig 3-15","c":[{"head":"Desensitized","body":"Reversed fairly quickly by promptly removing the agonist. May protect the receptor from overstimulation."},{"head":"Inactivated","body":"Not reversed simply by removing the agonist: it also takes hours without agonist to return to a sensitive resting state."}],"f":[["Resting","Open: acute agonist","Desensitized: prolonged agonist","Inactivated: agonist stays for hours"]]},{"t":"Why a cigarette is the length it is","sec":"Different States of Ligand-Gated Channels","fig":"","c":[{"head":"Acetylcholine","body":"Quickly hydrolyzed by abundant acetylcholinesterase, so it rarely gets to desensitize or inactivate nicotinic receptors."},{"head":"Nicotine","body":"Not hydrolyzed by acetylcholinesterase, so it stimulates nicotinic receptors profoundly and enduringly."}],"f":[["One cigarette: receptors rapidly desensitized","Between cigarettes: receptors inactivated","~20 cigarettes over ~16 waking hours"]],"x":["Smoking behaviour matches nicotine dosing to nicotinic receptor states."]},{"t":"What is an allosteric modulator?","sec":"Allosteric Modulation: PAMs and NAMs","fig":"","c":[{"head":"PAM: positive allosteric modulator","body":"Boosts what the neurotransmitter does: the channel opens even further and more often than with a full agonist alone."},{"head":"NAM: negative allosteric modulator","body":"Blocks or reduces what the neurotransmitter does: the channel opens less often."}],"p":[{"label":"Key","text":"Bound without neurotransmitter, a PAM or a NAM does nothing: modulators only work when the transmitter is present."}],"x":["Binds the receptor/ion channel complex at an “other site” from the neurotransmitter, and has little or no activity of its own."]},{"t":"PAMs: benzodiazepines at GABAA","sec":"Allosteric Modulation: PAMs and NAMs","fig":"Fig 3-16","c":[{"head":"Clinical effects of benzodiazepines","body":["Reduce anxiety","Induce sleep","Block convulsions","Block short-term memory","Relax muscles"]}],"p":[{"label":"Reading the figure","text":"More chloride flux: the PAM (plus sign) amplifies GABA’s opening of the channel."}],"x":["GABA alone: opens more often","GABA + PAM: opens much more often"]},{"t":"NAMs: the opposite effect","sec":"Allosteric Modulation: PAMs and NAMs","fig":"Fig 3-17","c":[{"head":"Benzodiazepine inverse agonists (experimental)","body":["Reduce chloride conductance","Cause panic attacks and seizures","Some improvement in memory","The opposite of benzodiazepine full agonists"]}],"p":[{"label":"Key","text":"Same site, opposite effects: PAM or NAM depends on whether the ligand is a full agonist or an inverse agonist."}],"x":["Transmitter + NAM: opens much less often"]},{"t":"NAMs at the NMDA receptor: PCP and ketamine","sec":"Allosteric Modulation: PAMs and NAMs","fig":"","c":[{"head":"Phencyclidine (PCP)","body":"Also called “angel dust.”"},{"head":"Ketamine","body":"A structurally related anesthetic, also used as a treatment for resistant depression and suicidal thoughts."}],"f":[["Glutamate/glycine cotransmission opens NMDA channel","PCP or ketamine enters the OPEN channel","Binds a site inside the calcium channel","Channel blocked: cotransmission cannot open it"]]},{"t":"Ionic components of an action potential","sec":"Voltage-Sensitive Ion Channels and VSSCs","fig":"Fig 3-18","b":["Voltage-sensitive channels mediate nerve conduction, action potentials, and neurotransmitter release.","Several psychotropic drugs are known or suspected to act on VSSCs and VSCCs.","Potassium channels are less well known as psychotropic
