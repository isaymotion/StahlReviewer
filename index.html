"body":["Diminished arousal and somnolence","Cognitive impairment","Worse functional outcomes"]}],"p":[{"label":"Clinical link","text":"Sedation comes mainly from M1, H1, and α1 antagonism. Use it deliberately early on, and avoid it long term when cognition and function matter most."}]},{"t":"Cardiometabolic risk varies by agent","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"","p":[{"label":"Mechanism 1","text":"Weight gain may come from H1 plus 5HT2C blockade (clozapine, olanzapine, quetiapine; also mirtazapine)."}],"x":["Clozapine, olanzapine","Risperidone, paliperidone, quetiapine, asenapine, iloperidone","Lurasidone, cariprazine, lumateperone, ziprasidone, pimavanserin, aripiprazole, brexpiprazole"]},{"t":"The metabolic highway","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"Figs 5-23, 5-24","c":[{"head":"Mechanism 2: “receptor X”","body":"Immediate insulin resistance, detectable as rising fasting triglycerides before weight gain. Present in high/moderate-risk agents, lacking in low-risk ones."},{"head":"Rare emergency: DKA / HHS","body":"Diabetic ketoacidosis or hyperglycemic hyperosmolar syndrome, perhaps from decompensating unrecognized hyperinsulinemia. Know where the patient is on the highway first."}],"f":[["Appetite ↑, weight gain","Obesity, BMI ↑","Insulin resistance; fasting triglycerides ↑","Hyperinsulinemia → β-cell failure → prediabetes → diabetes","Cardiovascular events; premature death"]]},{"t":"Metabolic monitoring and management","sec":"Uses Beyond Psychosis and Cardiometabolic Risk","fig":"Figs 5-25, 5-26","c":[{"head":"Co-therapy","body":["Metformin: weight loss and less weight gain","Topiramate: less consistent","Olanzapine + samidorphan (μ-opioid antagonist)"]}],"tb":[[["Risk factor","Manageable?"],["Genes, age","No"],["Lifestyle: diet, exercise, smoking","Modestly"],["Choice of drug (switch if BMI or triglycerides rise)","Most manageable"]]],"x":["Fasting triglycerides","Track on a simple flow chart at baseline and each visit, especially around switches"]},{"t":"How to read Stahl’s binding strips","sec":"Reading Binding Profiles","fig":"Figs 5-27 to 5-63","c":[{"head":"“Our similarities are different”","body":"Stahl borrows Yogi Berra’s line: these drugs are alike in D2 and 5HT2A/5HT1A binding, but differ greatly in everything else."}],"p":[{"label":"Reading the strips","text":"One box per receptor, ranked from most potent (left) to least potent (right). Dotted vertical line runs through the D2 box. Left of D2: occupied ≥60% at antipsychotic doses. Right of D2: occupied \u003c60% at antipsychotic doses. Box size reflects potency on a standard Ki scale; orange outline marks 5HT2A. Clinically relevant: receptors within about an order of magnitude of D2; maybe none at lower depression doses."}]},{"t":"Class comparison: serotonin and dopamine receptors","sec":"Reading Binding Profiles","fig":"Figs 5-32, 5-33, 5-36, 5-37","tb":[[["Receptor","Pines","Dones and a rone","Pips and a rip"],["5HT2A (vs D2)","All much more potent than D2","More or as potent as D2","Aripiprazole, cariprazine: D2 > 5HT2A; brexpiprazole: similar"],["5HT1A","Clozapine, quetiapine > D2; olanzapine none","Dones \u003c D2; lumateperone none","Similar to D2; brexpiprazole’s most potent property"],["D3","All bind, varying potency","Dones bind; lumateperone none","Cariprazine’s most potent property"],["5HT2C","All more potent than D2","Some affinity; ziprasidone ≈ D2","Relatively weak"]]]},{"t":"Class comparison: other receptors","sec":"Reading Binding Profiles","fig":"Figs 5-34, 5-35, 5-38 to 5-42","tb":[[["Property","Notable agents (from captions)"],["Monoamine reuptake","Quetiapine: NET; ziprasidone: NET and SERT; lumateperone: SERT; pips/rip: none"],["α2","Clozapine and quetiapine > D2 at some subtypes; risperidone/paliperidone α2C ≈ D2; lumateperone none"],["5HT3","Pines bind (less than D2); dones none; aripiprazole weakly"],["5HT7 / 5HT6","Lurasidone: 5HT7 > D2; clozapine, olanzapine, asenapine, zotepine: 5HT6"],["H1 / muscarinic","Clozapine, olanzapine, quetiapine: strong H1 and muscarinic; dones and pips: no anticholinergic"],["α1","Clozapine, quetiapine, zotepine, paliperidone, iloperidone: more potent than D2"]]]},{"t":"Clozapine: the gold standard","sec":"The Pines","fig":"Fig 5-43","c":[{"head":"Unique benefits","body":["Most effective when other drugs fail","Only drug documented to reduce suicide risk in schizophrenia","Niche for aggression and violence","Rare “awakenings”","Little motor effect; no TD (may treat it); no prolactin rise"]},{"head":"Why it is underused","body":["Unique, serious side effects (Table 5-2)","Ongoing blood count monitoring for neutropenia","Not first-line; used when others fail","Now: finger-stick point-of-care blood counts"]}]},{"t":"Table 5-2: Clozapine side effects needing expert care","sec":"The Pines","fig":"Table 5-2","c":[{"head":"Links to pharmacology","body":["Weight: H1 + 5HT2C blockade","Sedation: M1, H1, α1","Sialorrhea and constipation: muscarinic blockade (worse with benztropine or chlorpromazine)","Neutropenia, myocarditis: mechanism unknown","Sialorrhea: pro-cholinergic treatment or botulinum toxin"]}],"tb":[[["Side effects of clozapine requiring expert management"],["Neutropenia"],["Constipation / paralytic ileus"],["Sedation, orthostasis, tachycardia"],["Sialorrhea"],["Seizures"],["Weight gain, dyslipidemia, hyperglycemia"],["Myocarditis, cardiomyopathy, interstitial nephritis"],["DRESS (drug reaction with eosinophilia and systemic symptoms), serositis"]]]},{"t":"Olanzapine","sec":"The Pines","fig":"Fig 5-44","b":["Efficacy: widely considered next most effective after clozapine (clinical experience, not definitive trials).","Dosing: often used above originally approved doses, guided by plasma levels.","Risk: high metabolic risk; H1 + 5HT2C blockade.","US approvals: schizophrenia and maintenance (13+); IM agitation; bipolar mania/mixed and maintenance (13+); with fluoxetine for bipolar depression and treatment-resistant unipolar depression.","Forms: orally disintegrating tablet, IM injection, 4-week depot; inhaled form in development; samidorphan combination to curb weight gain."]},{"t":"Quetiapine: one drug, three bears","sec":"The Pines","fig":"Figs 5-45, 5-46","tb":[[["Dose","Use","Dominant pharmacology"],["Baby Bear: 50 mg","Hypnotic (not approved; not first-line; metabolic risk)","H1 antagonism"],["Mama Bear: ~300 mg","Depression (bipolar; SSRI/SNRI augmentation)","NET inhibition, 5HT1A partial agonism; 5HT2A, α2, 5HT2C, 5HT7 antagonism"],["Papa Bear: 800 mg","Psychosis, mania","Saturates H1 and 5HT2A; inconsistent >60% D2 occupancy"]]],"p":[{"label":"Profile","text":"Virtually no motor side effects or prolactin elevation, but at least moderate risk of weight gain and metabolic disturbance. More often used for depression and insomnia than psychosis."}]},{"t":"Asenapine and zotepine","sec":"The Pines","fig":"Figs 5-47, 5-48","c":[{"head":"Asenapine","body":["Structurally related to mirtazapine (5HT2A, 5HT2C, H1, α2) plus D2","Sublingual only: not absorbed if swallowed; no food or drink for 10 min","Rapid peak: useful as oral PRN “top-up”","Oral hypoesthesia; sedating at first; moderate weight and motor risk","Schizophrenia; bipolar mania (10+)"]},{"head":"Zotepine","body":["Japan and Europe, not US","Three times a day dosing","Possible elevated seizure risk","5HT2C, α1, 5HT7 antagonism; weak 5HT1A partial agonism; weak NET inhibition","Antidepressant effects suggested but not established"]}]},{"t":"Risperidone vs paliperidone","sec":"Many Dones and a Rone","fig":"Figs 5-49, 5-50","tb":[[["","Risperidone","Paliperidone (9-hydroxy-risperidone)"],["Metabolism","Hepatic","Renal excretion; few drug interactions"],["Oral form","Rapid absorption, higher peaks; may need twice daily at start","Sustained release, once daily (risk of underdosing)"],["Tolerability","Prolactin raised even at low doses","Anecdotally less sedation, orthostasis, motor effects"],["Approvals","Schizophrenia (13+); mania (10+); autism irritability (5–16)","Schizophrenia/maintenance (12+)"],["Long-acting","2- or 4-week depot","1- and 3-month (6-month in study); easier to load"],["Metabolic","Moderate; weight gain a problem in children","Moderate"]]]},{"t":"Ziprasidone, iloperidone, lurasidone","sec":"Many Dones and a Rone","fig":"Figs 5-51, 5-52, 5-53","c":[{"head":"Ziprasidone","body":["Little or no weight gain or metabolic risk","Short-acting: more than once daily, with food","QTc concern now seems exaggerated","IM form; schizophrenia and mania"]},{"head":"Iloperidone","body":["Potent α1: orthostasis, sedation","Very low motor side effects","Slow titration delays onset: good for non-urgent switches"]},{"head":"Lurasidone","body":["5HT7 > D2; minimal H1/M1","Low metabolic risk; dose at night","Highly effective for bipolar depression (10+)","NRX101 adds D-cycloserine (in study)"]}]},{"t":"Lumateperone: the “rone”","sec":"Many Dones and a Rone","fig":"Figs 5-54, 5-55","c":[{"head":"Profile","body":["Very high 5HT2A; moderate D2, D1, α1; low H1","Moderate SERT affinity (antidepressant potential)","No titration; little weight gain or DIP"]}],"f":[["Psychosis: excess presynaptic DA synthesis and release","Usual D2 blockers also block presynaptic D2 → even more DA release","Lumateperone: possibly presynaptic agonist, postsynaptic antagonist","Less DA made → less postsynaptic D2 blockade needed"]],"p":[{"label":"Key","text":"Wide 5HT2A–D2 separation may explain antipsychotic action at low D2 occupancy."}]},{"t":"The partial agonists","sec":"Two Pips, a Rip, and the Others","fig":"Figs 5-56, 5-57, 5-58","c":[{"head":"Aripiprazole (pip)","body":["D2/5HT1A partial agonist; lowers prolactin","Mostly akathisia; not sedating; little weight gain","Main US use: add-on to SSRIs/SNRIs in MDD","Autism irritability, Tourette; several LAIs"]},{"head":"Brexpiprazole (pip)","body":["More 5HT2A, 5HT1A, α1 than aripiprazole","Perhaps less akathisia (unproven)","Schizophrenia, not mania","Agitation in dementia; PTSD with sertraline"]},{"head":"Cariprazine (rip)","body":["D3 partial agonism is its most potent action","Better than D2/5HT2A antagonism for negative symptoms","Bipolar depression at low doses; mania","Long-lived metabolites: “oral depot” potential"]}]},{"t":"Pimavanserin and the others","sec":"Two Pips, a Rip, and the Others","fig":"Figs 5-59 to 5-62","c":[{"head":"Pimavanserin","body":["The only proven antipsychotic with NO D2 action","Potent 5HT2A antagonism (inverse agonism), lesser 5HT2C","Approved: Parkinson’s disease psychosis","Late-stage testing: dementia-related psychosis"]}],"tb":[[["Agent","Notes"],["Sertindole","5HT2A/D2; withdrawn then reintroduced as second-line; QTc monitoring"],["Perospirone","5HT2A/D2 with 5HT1A partial agonism; Asia; three times daily"],["Blonanserin","5HT2A/D2; D3 affinity higher than DA; Asia; twice daily"]]]},{"t":"Pipeline mechanisms","sec":"Future Treatments for Schizophrenia","fig":"Fig 5-63","c":[{"head":"Roluperidone (MIN-101)","body":"5HT2A plus σ2 antagonism; possible efficacy for negative symptoms."},{"head":"D3 antagonists","body":"e.g. F17464, more selective for D3 than D2 or 5HT1A; early efficacy in schizophrenia."},{"head":"DAO inhibition","body":"Boost glutamate function via D-serine (Fig 4-22)."},{"head":"PDE9/10 inhibition","body":"Alters D1/D2 second-messenger signalling, possibly more selectively in hyperactive DA neurons."}]},{"t":"Table 5-3: Trace amines and TAAR1 agonists","sec":"Future Treatments for Schizophrenia","fig":"Table 5-3; Figs 5-64 to 5-66","tb":[[["Five principal trace amines","Six human TAARs"],["β-phenylethylamine (PEA)","TAAR1 (main TAAR in humans)"],["p-Tyramine","TAAR2"],["Tryptamine","TAAR5"],["p-Octopamine","TAAR6"],["p-Synephrine","TAAR8"],["","TAAR9"]]],"f":[["TAAR1 agonist → TAAR1 couples with D2 (heterodimer)","D2 signalling biased to Gi, away from β-arrestin 2","Presynaptic: less DA synthesis/release. Postsynaptic: less GSK-3","Antipsychotic effect without blocking D2"]],"x":["SEP-363856: TAAR1 agonist (also 5HT1D, 5HT1A, 5HT7)"]},{"t":"Muscarinic agonists: xanomeline","sec":"Future Treatments for Schizophrenia","fig":"Fig 5-67","c":[{"head":"M4 agonism","body":"May reduce psychotic symptoms; xanomeline lowers VTA DA cell firing."},{"head":"M1 agonism","body":"May improve cognitive deficits; xanomeline raises prefrontal DA."}],"p":[{"label":"Horizon","text":"Combined with trospium, a non-brain-penetrant anticholinergic that blocks peripheral M2/M3 side effects, xanomeline has shown promising efficacy and tolerability in schizophrenia."}]},{"t":"Drug quick reference (1): pines and dones","sec":"Summary and Review","fig":"","tb":[[["Drug","Group","Metabolic","Distinguishing points"],["Clozapine","Pine","High","Gold standard; suicide reduction; neutropenia monitoring"],["Olanzapine","Pine","High","Next most effective; + fluoxetine for depression"],["Quetiapine","Pine","Moderate","Dose-dependent actions; norquetiapine NET; no motor/prolactin"],["Asenapine","Pine","Moderate","Sublingual; mirtazapine-like"],["Risperidone","Done","Moderate","Prolactin even at low dose; autism irritability"],["Paliperidone","Done","Moderate","Renal; ER oral; 1- and 3-month LAI"],["Ziprasidone","Done","Low","With food; twice daily; IM"],["Iloperidone","Done","Moderate","Potent α1; slow titration; very low motor"],["Lurasidone","Done","Low","5HT7; bipolar depression"],["Lumateperone","Rone","Low","Wide 5HT2A:D2 gap; SERT"]]]},{"t":"Drug quick reference (2): pips, rip, and others","sec":"Summary and Review","fig":"","tb":[[["Drug","Group","Metabolic","Distinguishing points"],["Aripiprazole","Pip","Low","D2/5HT1A PA; lowers prolactin; akathisia; MDD add-on"],["Brexpiprazole","Pip","Low","More 5HT2A/1A/α1; dementia agitation; PTSD + sertraline"],["Cariprazine","Rip","Low","D3 PA; negative symptoms; bipolar depression"],["Pimavanserin","5HT2A only","Low","No D2; Parkinson’s disease psychosis"],["Haloperidol","First-gen","—","Very potent D2; LAI; plasma levels useful"],["Chlorpromazine","First-gen","—","Sedating; α1, H1, muscarinic"],["Sulpiride / amisulpride","First-gen","—","D3 action; low-dose activating/antidepressant"]]]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Name the movement problem","body":"DIP, dystonia, akathisia, NMS, and TD each have different treatments; avoid lumping them as “EPS.”"},{"head":"Watch anticholinergic burden","body":"Consider amantadine or a switch before stacking anticholinergics."},{"head":"Monitor everyone","body":"AIMS for TD; weight/BMI, fasting triglycerides, glucose, BP, whatever the indication."},{"head":"Match drug to patient","body":"Use binding profiles to fit efficacy and tolerability to the individual; clozapine when others fail."}]}],"cards":[{"id":"c5-1","q":"Which dopamine pathway is the therapeutic target, and what are the side effects in the other three?","a":"Mesolimbic/mesostriatal (antipsychotic). Mesocortical: worse negative/cognitive; tuberoinfundibular: prolactin; nigrostriatal: motor effects."},{"id":"c5-2","q":"What are secondary negative symptoms?","a":"Apathy, anhedonia, low motivation caused by D2 blockade of reward, not by the illness."},{"id":"c5-3","q":"How do anticholinergics relieve DIP, and what are the risks?","a":"Block excess ACh at M1 after D2 blockade; risks include dry mouth, constipation/ileus, blurred vision, cognitive dysfunction."},{"id":"c5-4","q":"How are akathisia and acute dystonia treated?","a":"Akathisia: β-blockers, benzodiazepines, 5HT2A antagonists. Dystonia: IM anticholinergic."},{"id":"c5-5","q":"What is the proposed mechanism of TD?","a":"Chronic D2 blockade upregulates supersensitive D2 in the indirect pathway → too much inhibition of stop → too much go."},{"id":"c5-6","q":"Compare tetrabenazine, deutetrabenazine, and valbenazine.","a":"Tetrabenazine: TID, 2D6 testing, not for TD. Deutetrabenazine: BID with food, TD. Valbenazine: once daily, TD."},{"id":"c5-7","q":"How does 5HT2A antagonism reduce DIP but also reduce positive symptoms?","a":"Via GABA interneurons it raises DA in motor striatum and PFC; directly it lowers mesolimbic DA."},{"id":"c5-8","q":"Why do D2 partial agonists lower prolactin?","a":"Lactotroph D2 receptors sense them more as agonists, shutting prolactin off."},{"id":"c5-9","q":"What is the “accelerator and brake” analogy?","a":"5HT2A is the accelerator and 5HT1A the brake on the same glutamate neuron; both routes raise downstream DA."},{"id":"c5-10","q":"List the cardiometabolic risk tiers.","a":"High: clozapine, olanzapine. Moderate: risperidone, paliperidone, quetiapine, asenapine, iloperidone. Low: the rest listed."},{"id":"c5-11","q":"Name four parameters in the metabolic monitoring toolkit.","a":"Weight/BMI, fasting triglycerides, fasting glucose, blood pressure."},{"id":"c5-12","q":"What do quetiapine’s three “bears” represent?","a":"50 mg hypnotic (H1); ~300 mg antidepressant; 800 mg antipsychotic."},{"id":"c5-13","q":"Name three unique benefits of clozapine.","a":"Efficacy when others fail; reduced suicide; little motor effect/no TD (also: aggression, awakenings)."},{"id":"c5-14","q":"What is distinctive about lumateperone’s proposed D2 action?","a":"Possibly presynaptic D2 agonist and postsynaptic antagonist, so less DA is made."},{"id":"c5-15","q":"What makes pimavanserin unique?","a":"Only proven antipsychotic with no D2 action; 5HT2A antagonist for PDP."},{"id":"c5-16","q":"How might TAAR1 agonists work?","a":"TAAR1 dimerizes with D2, biasing it to Gi: less DA release and less GSK-3, without blocking D2."}],"glossary":[{"t":"DIP","m":"Drug-induced parkinsonism"},{"t":"EPS","m":"Extrapyramidal symptoms (imprecise)"},{"t":"TD","m":"Tardive dyskinesia"},{"t":"NMS","m":"Neuroleptic malignant syndrome"},{"t":"AIMS","m":"Abnormal Involuntary Movement Scale"},{"t":"VMAT2","m":"Vesicular monoamine transporter 2"},{"t":"PA","m":"Partial agonist"},{"t":"LAI","m":"Long-acting injectable"},{"t":"BMI","m":"Body mass index"},{"t":"TGs","m":"Triglycerides"},{"t":"DKA / HHS","m":"Diabetic ketoacidosis / hyperglycemic hyperosmolar syndrome"},{"t":"NET / SERT","m":"Norepinephrine / serotonin transporter"},{"t":"SNm / SNl","m":"Medial / lateral substantia nigra"},{"t":"PDP","m":"Parkinson’s disease psychosis"},{"t":"DRESS","m":"Drug reaction with eosinophilia and systemic symptoms"},{"t":"TAAR1","m":"Trace amine-associated receptor 1"},{"t":"Gi","m":"Inhibitory G protein"},{"t":"GSK-3","m":"Glycogen synthase kinase 3"},{"t":"DAO","m":"D-amino acid oxidase"},{"t":"PDE","m":"Phosphodiesterase"}]},{"n":6,"title":"Mood Disorders and the Networks Norepinephrine and GABA","short":"Mood disorders","notes":[{"t":"Construct the diagnosis, then deconstruct it","sec":"","fig":"","f":[["Construct a diagnosis from the symptom profile","Deconstruct it into individual symptoms","Match each symptom to a malfunctioning circuit","Target that circuit’s neurotransmitters","More efficient information processing → fewer symptoms"]],"p":[{"label":"Big picture","text":"Beyond the monoamines (norepinephrine, dopamine, serotonin), mood disorders are now also linked to glutamate, GABA, neurotrophic factors, neuroinflammation, and stress. This chapter sets up the drug choices in Chapter 7."}]},{"t":"A major depressive episode is more than mood","sec":"The Mood Spectrum","fig":"Fig 6-1","c":[{"head":"At least one of","body":["Depressed mood","Apathy / loss of interest"]},{"head":"Plus four more of","body":["Sleep disturbances (insomnia or hypersomnia)","Weight / appetite changes","Psychomotor agitation or retardation","Fatigue","Guilt or worthlessness","Executive dysfunction","Suicidal ideation"]}]},{"t":"A manic episode: symptom dimensions","sec":"The Mood Spectrum","fig":"Fig 6-2","c":[{"head":"Required","body":["Elevated / expansive mood, OR","Irritable mood"]},{"head":"Plus three or more (four if only irritable)","body":["Inflated self-esteem / grandiosity","Increased goal-directed activity or agitation","Risk taking","Decreased need for sleep","Distractibility / poor concentration","More talkative / pressured speech","Flight of ideas / racing thoughts"]}]},{"t":"Mood episodes and mood disorders","sec":"The Mood Spectrum","fig":"Figs 6-3 to 6-6","tb":[[["Disorder","Defined by"],["Major depressive disorder (Fig 6-4)","At least one major depressive episode; most have recurrent episodes"],["Bipolar I (Fig 6-5)","At least one manic episode; depressive episodes common but not required; mania with mixed features common"],["Bipolar II (Fig 6-6)","At least one hypomanic episode and one major depressive episode"]]],"x":["Mania with mixed features of depression","Depression with mixed features of mania","▲ “up” pole  ···  ▼ “down” pole (Fig 6-3)"]},{"t":"Table 6-1: Mixed features (DSM-5)","sec":"The Mood Spectrum","fig":"Table 6-1; Fig 6-7","tb":[[["Manic or hypomanic episode, with mixed features"],["Full criteria for manic or hypomanic episode, plus ≥3 depressive symptoms:"],["Depressed mood"],["Loss of interest or pleasure"],["Psychomotor retardation"],["Fatigue or loss of energy"],["Worthlessness or excessive/inappropriate guilt"],["Recurrent thoughts of death or suicidal ideation/actions"]],[["Depressive episode, with mixed features"],["Full criteria for major depressive episode, plus ≥3 manic/hypomanic symptoms:"],["Elevated, expansive mood"],["Inflated self-esteem or grandiosity"],["More talkative / pressured to keep talking"],["Flight of ideas or racing thoughts"],["Increased energy or goal-directed activity"],["Excessive involvement in risky activities"],["Decreased need for sleep"]]],"x":["Not included: psychomotor agitation, irritability, distractibility"]},{"t":"From categories to spectrums","sec":"The Mood Spectrum","fig":"Figs 6-7, 6-8, 6-9","c":[{"head":"Old: dichotomous model (Fig 6-8)","body":["Schizophrenia: chronic psychosis, poor outcome","Bipolar: cyclical mood, good outcome","Schizoaffective: a separate third disorder"]},{"head":"New: continuum model (Fig 6-9)","body":["Pure psychotic disorder at one end","Pure mood disorder at the other","Psychotic depression, schizoaffective in between"]}],"p":[{"label":"Key","text":"The mixed-features modifier treats depression and mania as opposite ends of one spectrum. Many real patients are some mixture of both, and the mix changes over the course of illness (Fig 6-7)."}]},{"t":"Bipolar depression is often missed","sec":"Unipolar vs Bipolar Depression; Mixed Features","fig":"","p":[{"label":"Why it matters","text":"Treating bipolar depression as unipolar may be ineffective or dangerous: it can increase mood cycling, relapse, and suicide, and even reduce the chance of responding to the right treatment later. Current symptoms alone cannot reliably tell the two apart."}],"x":["of patients with unipolar depression are eventually re-diagnosed as bipolar","of depressed patients with bipolar II are first diagnosed as unipolar","bipolar risk with a first-degree relative with bipolar disorder"]},{"t":"Clues that favor bipolar depression","sec":"Unipolar vs Bipolar Depression; Mixed Features","fig":"Fig 6-10","c":[{"head":"History","body":["Family history of bipolar disorder","Family history of substance abuse","Comorbid substance abuse","Suicide attempts","Early onset (\u003c25 years)","Shorter depressive episodes","More previous depressive episodes"]},{"head":"Symptoms","body":["Irritability","Psychotic symptoms","Mood reactivity","Restlessness","Psychomotor agitation (bipolar II)","Psychomotor retardation (bipolar I)","Guilt; melancholia"]}]},{"t":"Table 6-2: Unipolar or bipolar? Questions to ask","sec":"Unipolar vs Bipolar Depression; Mixed Features","fig":"Table 6-2","tb":[[["Question","What to ask / why"],["“Who’s your daddy?”","Family history of: mood disorder; psychiatric hospitalizations; suicide; anyone who took lithium, mood stabilizers, drugs for psychosis or depression; anyone who received ECT. These can indicate a unipolar or bipolar spectrum disorder in relatives."],["“Where’s your mama?”","Get additional history from someone close (mother, spouse). Patients may especially lack insight about manic symptoms and under-report them."]]],"p":[{"label":"Tip","text":"An outside informant may give a very different history from the patient’s own."}]},{"t":"Mixed features: common and dangerous","sec":"Unipolar vs Bipolar Depression; Mixed Features","fig":"Fig 6-11","tb":[[["Finding","Figure given in Ch. 6"],["Each subthreshold manic symptom","Raises risk of conversion to bipolar disorder by 30%"],["Mixed features in unipolar depression","About a quarter (higher in children and adolescents)"],["Mixed features in bipolar I or II depression","About a third"],["Suicidality with mixed features","Fourfold increase, unipolar and bipolar"]]],"f":[["Recurrent unipolar depression","Mixed features","Mania or hypomania (bipolar spectrum)","Treatment resistance"]]},{"t":"Suicide risk and treatment implications","sec":"Unipolar vs Bipolar Depression; Mixed Features","fig":"","p":[{"label":"Clinical link","text":"Non-euphoric manic symptoms (agitation, impulsivity, irritability, racing thoughts) plus depression are a recipe for suicidality. Depression with mixed features, unipolar or bipolar, is NOT treated first-line with monoamine reuptake inhibitors, but with serotonin/dopamine antagonists/partial agonists (Chapter 5)."}],"x":["suicide rate in bipolar vs unipolar depression","suicide rate in bipolar disorder vs general population","of bipolar patients attempt suicide; 10–20% succeed"]},{"t":"Norepinephrine synthesis and termination","sec":"Norepinephrine","fig":"Figs 6-12, 6-13","tb":[[["Termination route","Location","Result"],["NET (reuptake pump)","Presynaptic terminal","Removes NE from synapse without destroying it; can be reused"],["MAO-A or MAO-B","Mitochondria, presynaptic neuron and other cells","Destroys NE"],["COMT","Largely outside the presynaptic terminal","Destroys NE"]]],"f":[["Tyrosine via tyrosine transporter","TOH (rate-limiting) → DOPA","DDC → dopamine","DBH → norepinephrine","VMAT2 → vesicle"]]},{"t":"Norepinephrine receptors","sec":"Norepinephrine","fig":"Fig 6-14","p":[{"label":"Key","text":"Only α2 receptors can act as presynaptic autoreceptors."}],"x":["Presynaptic reuptake","Presynaptic autoreceptor AND postsynaptic"]},{"t":"α2 autoreceptors: the NE brake","sec":"Norepinephrine","fig":"Figs 6-15, 6-16","c":[{"head":"Axon terminal (Fig 6-15)","body":"Gatekeepers: empty = gate open, NE released; bound by NE = gate closed, release halted."},{"head":"Somatodendritic (Fig 6-16)","body":"NE binding shuts off impulse flow (loss of lightning bolts), stopping further release."},{"head":"Stimulate α2 (agonist)","body":"= stepping on the brake: NE neuron stops firing."},{"head":"Block α2 (antagonist)","body":"= cutting the brake cable: more NE released."}]},{"t":"GABA synthesis, termination, and receptors","sec":"GABA (γ-Aminobutyric Acid)","fig":"Figs 6-17, 6-18, 6-19","tb":[[["Receptor","Type","Notes"],["GABAA","Ligand-gated chloride channel","Many subtypes; benzodiazepine and neurosteroid targets"],["GABAB","G-protein-linked","May be coupled with calcium or potassium channels"],["GABAC","Ligand-gated chloride channel","Part of an inhibitory chloride channel complex"]]],"f":[["Glutamate","GAD → GABA","VIAAT → vesicle","Released; terminated by GAT (reuptake)","GABA-T converts GABA to inactive substance"]]},{"t":"GABAA receptor structure and subunits","sec":"GABA (γ-Aminobutyric Acid)","fig":"Figs 6-20A, B, C","tb":[[["Subunit","Isoforms"],["α","α1–α6"],["β","β1–β3"],["γ","γ1–γ3"],["ρ","ρ1–ρ3"],["Others","δ, ε, π, θ"]]],"p":[{"label":"Key","text":"Which subunits are present determines the receptor’s function, location (synaptic or extrasynaptic), and benzodiazepine sensitivity."}],"x":["one subunit = 4 TM regions","×5 around a chloride channel"]},{"t":"Benzodiazepine-sensitive vs insensitive GABAA","sec":"GABA (γ-Aminobutyric Acid)","fig":"Figs 6-20C, 6-21","tb":[[["Feature","Benzodiazepine-SENSITIVE","Benzodiazepine-INSENSITIVE"],["Subunits","2 β + γ2 or γ3 + 2 α (α1, α2, or α3)","δ (not γ) + α4 or α6 (also γ1)"],["Location","Synaptic (postsynaptic)","Extrasynaptic"],["Inhibition","Phasic: bursts from peak synaptic GABA","Tonic: ambient GABA that escaped the synapse"],["Modulator site","Between γ2/γ3 and α1–3; one BZ per complex","Between α and δ; neuroactive steroids, possibly alcohol, some general anesthetics"],["Function","α1: sleep (sedative hypnotics). α2/α3: anxiety (anxiolytics)","Sets the overall tone and excitability of the neuron"]]],"p":[{"label":"Note","text":"GABA binds two orthosteric sites between α and β on both types."}]},{"t":"Benzodiazepines as PAMs; flumazenil","sec":"GABA (γ-Aminobutyric Acid)","fig":"Figs 6-22, 6-23","c":[{"head":"Positive allosteric modulation","body":"Benzodiazepines bind an “other site” and make GABA more effective, increasing chloride channel opening. GABA must be present for the PAM to work."},{"head":"Flumazenil","body":"A neutral antagonist at the benzodiazepine site. Reverses benzodiazepine anesthesia or overdose, showing benzodiazepines act as agonists at their PAM site."}],"x":["GABA alone → channel opens more often (limited)","benzodiazepine alone → no effect","GABA + benzodiazepine → opens even more often"]},{"t":"Neuroactive steroids, tonic inhibition, and depression","sec":"GABA (γ-Aminobutyric Acid)","fig":"Fig 6-21","f":[["Pregnancy: high neuroactive steroid levels","Delivery: precipitous decline","Loss of tonic inhibition → major depressive episode?","~60-hour IV infusion restores tonic inhibition"]],"p":[{"label":"Theory","text":"Hypothesis: some depressed patients lack normal tonic inhibition and have too much excitability in some circuits; neuroactive steroids may calm them. This is reasonable but not yet proven."},{"label":"Reading the figure","text":"Fig 6-21: glia make neuroactive steroids from cholesterol via pregnenolone; they act at extrasynaptic α4/α6 δ receptors (tonic), while synaptic α1–3 receptors mediate phasic inhibition."}]},{"t":"Monoamine and monoamine receptor hypotheses","sec":"The Monoamine Hypotheses of Depression","fig":"Fig 6-24","c":[{"head":"The evidence","body":["Direct evidence largely lacking for both hypotheses","Consistent postmortem finding: more 5HT2 receptors in frontal cortex of suicide victims","No clear monoamine or receptor lesion","Still valuable: focused attention on NE, DA, 5HT and led to many treatments"]}],"f":[["A: normal monoamines (NE, 5HT, DA) → no depression","B: monoamine deficiency → depression (mania = excess?)","C: deficiency → compensatory postsynaptic receptor upregulation → depression"]]},{"t":"The timing puzzle","sec":"The Monoamine Hypotheses of Depression","fig":"Figs 6-25, 6-26","p":[{"label":"Key","text":"If monoamines rise at once but benefit takes weeks, depression is not simply a monoamine deficit. Receptor downregulation and BDNF synthesis match the clinical timing."}],"x":["Neurotransmitter levelsrise almost immediately","Receptor sensitivitydownregulates over weeks","Clinical effectdelayed for weeks","Drug started →  time (schematic)"]},{"t":"Monoamines, signaling, and BDNF","sec":"Neuroplasticity and Neuroprogression","fig":"Fig 6-27","f":[["Monoamine at receptor","Signal cascades (PKA, CaMK)","CREB activated","BDNF gene expressed","Synaptogenesis, neuroplasticity, cell survival, neurogenesis"]],"p":[{"label":"BDNF","text":"BDNF promotes growth of immature neurons (including monoamine neurons), survival and function of adult neurons, and maintenance of synapses. Low BDNF may contribute to atrophy or even cell loss."}]},{"t":"Neuroprogression: losing growth factors","sec":"Neuroplasticity and Neuroprogression","fig":"Figs 6-28, 6-29, 6-30","c":[{"head":"Triggers (Fig 6-28)","body":["Chronic stress","Inflammation","Chronic clinical illness","Early life adversity","Microbiome changes","Sleep disruption"]}],"f":[["Epigenetic silencing of BDNF genes","Lack of synaptic maintenance","Loss of synapses and dendritic spines","Loss of neurons (apoptosis): irreversible"]]},{"t":"Neuroprogression is multifactorial","sec":"Neuroplasticity and Neuroprogression","fig":"Fig 6-31","f":[["Damage to synapses and neurons","Functional and structural brain abnormalities"]],"x":["Neurotrophic dysregulation","Vulnerability to relapse","Treatment resistance","Three unwanted clinical outcomes"]},{"t":"The HPA axis in depression","sec":"Neuroplasticity and Neuroprogression","fig":"Figs 6-32A, 6-32B","c":[{"head":"Depression (Fig 6-32B)","body":["Chronic stress → excess glucocorticoids → hippocampal atrophy","Lost inhibition → HPA overactivity; feedback insensitivity"]},{"head":"Novel targets in testing","body":"CRF receptor, vasopressin 1B receptor, and glucocorticoid receptor antagonists."}],"f":[["Hypothalamus releases CRF","Pituitary releases ACTH","Adrenal releases glucocorticoids","Glucocorticoids feed back to stop CRF"]],"x":["Normal (Fig 6-32A): hippocampus and amygdala also suppress the axis"]},{"t":"Neuroinflammation in depression","sec":"Neuroplasticity and Neuroprogression","fig":"Figs 6-33A–D","c":[{"head":"How immune cells cause damage (Fig 6-33D)","body":["Disrupt neurotransmission","Oxidative stress and mitochondrial dysfunction","HPA-axis dysfunction; less neurotrophic factor","Epigenetic changes → synapse loss and neuronal death"]}],"f":[["A: stress, obesity, early adversity, microbiome, sleep, chronic inflammatory illness","B: microglia activated; release proinflammatory cytokines","C: monocytes and macrophages drawn into brain","D: synaptic and neuronal damage"]]},{"t":"Depression as a circadian disorder","sec":"Neuroplasticity and Neuroprogression","fig":"Figs 6-34, 6-35","tb":[[["Rhythm","In depression"],["Sleep–wake cycle","Phase delay: trouble falling asleep, sleeping later, daytime sleepiness"],["Body temperature","Less fluctuation across 24 hours"],["Cortisol","Same pattern but elevated all day"],["Melatonin","No nighttime spike"],["BDNF and neurogenesis","Reduced (normally peak at night)"]]],"p":[{"label":"Key","text":"For some patients depression may reflect a “broken” circadian clock."}]},{"t":"Resetting the clock","sec":"Neuroplasticity and Neuroprogression","fig":"Figs 6-36A, 6-36B","c":[{"head":"Light (Fig 6-36A)","body":"Retina → retinohypothalamic tract → SCN → pineal turns melatonin OFF. Bright-light therapy in the early morning may reset the rhythm."},{"head":"Darkness / melatonin (Fig 6-36B)","body":"No retinal input → SCN signals pineal to make melatonin, which acts back on the SCN. Early-evening melatonin may reset the rhythm."}],"p":[{"label":"Options","text":"Circadian treatments with therapeutic effects in some patients: bright light, melatonin, phase advance, phase delay, and even sleep deprivation."}]},{"t":"Cognitive symptoms: the hidden burden","sec":"Neuroplasticity and Neuroprogression","fig":"","b":["After sad mood, cognitive symptoms have the second strongest link to impaired functioning.","Depressed patients need more effortful thinking (greater DLPFC and anterior cingulate activation).","Hippocampal decline correlates with duration of untreated depression; smaller volumes, worse outcomes.","Memory worsens with the number of previous episodes.","Cognitive symptoms are among the most common residual symptoms between episodes."],"c":[{"head":"How impaired?","body":["About like a night of sleep deprivation","Or being legally intoxicated","Or a high dose of a benzodiazepine or antihistamine","Common across many psychiatric disorders"]}]},{"t":"Restoring neuroplasticity","sec":"Neuroplasticity and Neuroprogression","fig":"Fig 6-37","f":[["Monoamine, glutamate, or GABA regulation","Cascades (MAPK, RSK, cAMP, PKC, Wnt/GSK-3, CaMK)","CREB activated","BDNF ↑; AMPA subunits ↑; NMDA ↓","Neuroplasticity and restored neurotransmission"]],"p":[{"label":"Clinical link","text":"Damage may be reversible when caught at the stage of synapse loss, before neuron loss. Novel glutamate (and possibly GABA) drugs may form new synapses within minutes to hours: a rapid onset and hope for patients who fail monoamine drugs. The best current strategy: treat early and completely."}]},{"t":"Monoamine projections to symptom circuits","sec":"Symptoms and Circuits in Mood Disorders","fig":"Fig 6-40","tb":[[["Monoamine","Origin","Projections","Functions"],["Dopamine","VTA and substantia nigra","Via hypothalamus to PFC, basal forebrain, striatum, nucleus accumbens; thalamic DA system","Movement, pleasure/reward, cognition, psychosis; arousal and sleep (thalamic)"],["Norepinephrine","Locus coeruleus","Ascending to many regions; descending down spinal cord","Mood, arousal, cognition; pain (descending)"],["Serotonin","Raphe nucleus","Ascending to many of the same regions; descending through spinal cord","Mood, anxiety, sleep; pain (descending)"]]],"p":[{"label":"Key","text":"Each brain node gets a unique, partly overlapping mix of monoamines: a chance to target symptoms selectively."}]},{"t":"Matching symptoms to circuits","sec":"Symptoms and Circuits in Mood Disorders","fig":"Figs 6-38, 6-39, 6-43","tb":[[["Common residual symptom","Hypothetically malfunctioning region (Fig 6-43)"],["Insomnia","Hypothalamus"],["Problems concentrating","Dorsolateral prefrontal cortex"],["Reduced interest","Prefrontal cortex and nucleus accumbens"],["Fatigue","Prefrontal cortex, striatum, nucleus accumbens, spinal cord"]]],"p":[{"label":"Idea","text":"Each of the nine symptoms of a major depressive episode (Fig 6-38) and of a manic episode (Fig 6-39) maps onto circuits, some shared and some different."}]},{"t":"Reduced positive vs increased negative affect","sec":"Symptoms and Circuits in Mood Disorders","fig":"Fig 6-41","c":[{"head":"Reduced positive affect","body":["Depressed mood; loss of joy, interest, pleasure","Loss of energy, enthusiasm, alertness, self-confidence","Mainly DA dysfunction (± NE)","Boost DA, possibly NE"]},{"head":"Increased negative affect","body":["Depressed mood; guilt, disgust, fear, anxiety","Hostility, irritability, loneliness","Mainly 5HT dysfunction (± NE)","Boost 5HT, possibly NE"]}],"p":[{"label":"Nuance","text":"Neurotransmission in mood disorders may be chaotic, not simply too high or too low."}]},{"t":"Symptom-based treatment algorithm","sec":"Symptoms and Circuits in Mood Disorders","fig":"Figs 6-42, 6-43, 6-44","tb":[[["Residual symptom","Regulating neurotransmitters","Pharmacological approach"],["Fatigue","NE, DA","Boost NE or DA (consider stopping a serotonergic drug if it contributes)"],["Concentration problems","NE, DA","Boost NE or DA"],["Sleep disturbance","5HT, GABA, histamine","Boost GABA; block 5HT or histamine"]]],"f":[["1: Deconstruct the diagnosis into symptoms (Fig 6-42)","2: Match symptoms to circuits (Fig 6-43)","3: Target regulating neurotransmitters (Fig 6-44)","Add or switch until remission"]]},{"t":"Treat symptoms, not just diagnoses","sec":"Symptoms and Circuits in Mood Disorders","fig":"","c":[{"head":"Mechanisms cross diagnoses","body":"Drug treatments do not respect psychiatric disorders: a mechanism that treats a symptom in one disorder can treat it in another."},{"head":"Anxiety in depression","body":"Even without a full anxiety disorder, use the same 5HT and GABA mechanisms proven in anxiety disorders (Chapter 8)."},{"head":"Painful physical symptoms","body":"SNRIs and other approaches (Chapter 9)."},{"head":"Goal: sustained remission","body":"Build a portfolio of mechanisms until every symptom is gone."}]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"A spectrum","body":"Mood disorders range from depression to mania with many mixed states in between."},{"head":"Distinguish carefully","body":"Tell unipolar from bipolar depression and detect mixed features: prognosis and treatment differ."},{"head":"More than mood","body":"Several non-mood symptoms are required for depressive and manic episodes."},{"head":"Beyond monoamines","body":"Neurotrophic factors, circadian rhythms, inflammation, stress, genes, and environment all contribute."},{"head":"Possibly progressive","body":"Especially if not adequately treated."},{"head":"Circuit-based care","body":"Match each symptom to a circuit and its neurotransmitters to reach remission."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Ask about mania every time","body":"Use “Who’s your daddy?” and “Where’s your mama?” before treating depression."},{"head":"Look for mixed features","body":"They raise suicide risk fourfold and change first-line treatment."},{"head":"Treat early and completely","body":"Untreated duration and repeated episodes may damage cognition and hippocampus."},{"head":"Target residual symptoms","body":"Fatigue and concentration: NE/DA. Sleep: GABA, or block 5HT/histamine."}]}],"cards":[{"id":"c6-1","q":"What is required for a major depressive episode?","a":"Depressed mood or loss of interest, plus at least four more symptoms (five total)."},{"id":"c6-2","q":"What is required for a manic episode if mood is only irritable?","a":"Four additional symptoms (three if elevated/expansive mood)."},{"id":"c6-3","q":"Define bipolar I and bipolar II.","a":"Bipolar I: ≥1 manic episode. Bipolar II: ≥1 hypomanic and ≥1 major depressive episode."},{"id":"c6-4","q":"Which three symptoms are excluded from mixed-features criteria?","a":"Psychomotor agitation, irritability, distractibility."},{"id":"c6-5","q":"Name five clues favoring bipolar depression.","a":"Any five of: family history of bipolar or substance abuse, substance abuse, suicide attempts, onset \u003c25, irritability, psychosis, more/shorter episodes…"},{"id":"c6-6","q":"What do the questions in Table 6-2 mean?","a":"Take a family history; and get collateral history from someone close, since patients under-report mania."},{"id":"c6-7","q":"How common are mixed features in unipolar and bipolar depression?","a":"About a quarter of unipolar and a third of bipolar I/II depression."},{"id":"c6-8","q":"Describe norepinephrine synthesis.","a":"Tyrosine → (TOH) DOPA → (DDC) DA → (DBH) NE → VMAT2 into vesicles."},{"id":"c6-9","q":"What happens when α2 autoreceptors are stimulated or blocked?","a":"Stimulated: brake on, NE release stops. Blocked: brake cable cut, more NE released."},{"id":"c6-10","q":"Contrast benzodiazepine-sensitive and insensitive GABAA receptors.","a":"Sensitive: γ2/3 + α1–3, synaptic, phasic. Insensitive: δ + α4/α6, extrasynaptic, tonic, neurosteroid-sensitive."},{"id":"c6-11","q":"What does flumazenil do?","a":"Neutral antagonist at the benzodiazepine site; reverses benzodiazepine sedation/overdose."},{"id":"c6-12","q":"How might neuroactive steroids treat postpartum depression?","a":"Restore tonic inhibition lost when steroid levels fall after delivery (~60-hour infusion)."},{"id":"c6-13","q":"Why does the delayed onset of antidepressants challenge the monoamine hypothesis?","a":"Monoamines rise at once but benefit takes weeks, matching receptor downregulation and BDNF instead."},{"id":"c6-14","q":"List three unwanted outcomes of neuroprogression.","a":"Cognitive decline, vulnerability to relapse, treatment resistance."},{"id":"c6-15","q":"Name three circadian abnormalities in depression.","a":"Phase-delayed sleep; flattened temperature; elevated cortisol; absent melatonin night spike (any three)."},{"id":"c6-16","q":"Which neurotransmitters would you target for fatigue, and for insomnia?","a":"Fatigue: boost NE/DA. Insomnia: boost GABA or block 5HT/histamine."}],"glossary":[{"t":"MDE","m":"Major depressive episode"},{"t":"BPI / BPII","m":"Bipolar I / II disorder"},{"t":"TOH / DDC","m":"Tyrosine hydroxylase / DOPA decarboxylase"},{"t":"DBH","m":"Dopamine β-hydroxylase"},{"t":"NET","m":"Norepinephrine transporter"},{"t":"VMAT2","m":"Vesicular monoamine transporter 2"},{"t":"MAO / COMT","m":"Monoamine oxidase / catechol-O-methyltransferase"},{"t":"GAD","m":"Glutamic acid decarboxylase"},{"t":"VIAAT","m":"Vesicular inhibitory amino acid transporter"},{"t":"GAT / GABA-T","m":"GABA transporter / GABA transaminase"},{"t":"PAM","m":"Positive allosteric modulator"},{"t":"BZ","m":"Benzodiazepine"},{"t":"BDNF","m":"Brain-derived neurotrophic factor"},{"t":"CREB","m":"cAMP response element-binding protein"},{"t":"HPA","m":"Hypothalamic-pituitary-adrenal axis"},{"t":"CRF / ACTH","m":"Corticotropin-releasing factor / adrenocorticotropic hormone"},{"t":"SCN","m":"Suprachiasmatic nucleus"},{"t":"PFC / NA","m":"Prefrontal cortex / nucleus accumbens"},{"t":"ECT","m":"Electroconvulsive therapy"},{"t":"SNRI","m":"Serotonin–norepinephrine reuptake inhibitor"}]},{"n":7,"title":"Treatments for Mood Disorders","short":"Mood treatments","notes":[{"t":"Naming by mechanism, not by label","sec":"","fig":"","c":[{"head":"Not “antidepressants”","body":"Drugs with “antidepressant action.” Many classic “antidepressants” are not used for bipolar or mixed depression, and treat anxiety, eating, trauma, OCD, impulsive disorders, and pain."},{"head":"Not “mood stabilizers”","body":"Drugs with antimanic or mood-stabilizing action, named by presumed mechanism instead."}],"p":[{"label":"Why learn so many drugs","text":"Unlike schizophrenia (typically one drug, 20–30% symptom reduction), mood disorders offer a real chance of sustained, asymptomatic remission, often by building a “portfolio” of two or more mechanisms."}]},{"t":"Response, remission, relapse, recurrence","sec":"Treatment Outcomes and the “Mood Stabilizer” Label","fig":"Figs 7-1, 7-2, 7-3","tb":[[["Term","Definition"],["Response","≥50% reduction in symptoms: better but not well (the old goal)"],["Remission","Essentially all symptoms gone: well, not cured (the goal now)"],["Recovery","Remission sustained beyond several months"],["Relapse","Depression returns before full remission or within the first months after it"],["Recurrence","Depression returns after recovery"]]],"f":[["Acute: 6–12 weeks","Continuation: 4–9 months","Maintenance: 1+ years"]]},{"t":"How often does unipolar depression remit?","sec":"Treatment Outcomes and the “Mood Stabilizer” Label","fig":"Fig 7-4","b":["First treatment: only about a third remit.","Each later monotherapy: lower odds (20%, then about 6–7% each).","After ~1 year (four 12-week treatments): about two-thirds ever remit."]},{"t":"Residual symptoms and relapse","sec":"Treatment Outcomes and the “Mood Stabilizer” Label","fig":"Figs 7-5, 7-6","c":[{"head":"Most common residual symptoms","body":["Insomnia","Fatigue","Painful physical complaints","Problems concentrating","Lack of interest / motivation"]},{"head":"Least common residual symptoms","body":["Depressed mood","Suicidal ideation","Psychomotor retardation"]}],"tb":[[["Relapse rate (Fig 7-6)","Remitters","Non-remitters"],["After 1 treatment","33% at 12 months","60% at 12 months"],["After 4 treatments","70% at 6 months","70% at 6 months"]]]},{"t":"What is a “mood stabilizer”? Four separate actions","sec":"Treatment Outcomes and the “Mood Stabilizer” Label","fig":"Figs 7-7, 7-8","c":[{"head":"Treat from above","body":"Reduce symptoms of mania."},{"head":"Stabilize from above","body":"Prevent relapse and recurrence of mania."},{"head":"Treat from below","body":"Reduce symptoms of bipolar depression."},{"head":"Stabilize from below","body":"Prevent relapse and recurrence of bipolar depression."}]},{"t":"SSRIs transformed psychopharmacology","sec":"SSRIs and SPARIs","fig":"Figs 7-9, 7-10","p":[{"label":"Scope","text":"Indications go far beyond unipolar depression: anxiety disorders, PTSD, OCD, premenstrual dysphoric disorder, eating disorders, and others."}],"x":["SSRI prescriptions in the US (estimate)","SSRI prescriptions a year in the US","principal SSRIs, all SERT inhibitors"]},{"t":"How SSRIs work: a delayed cascade","sec":"SSRIs and SPARIs","fig":"Figs 7-11 to 7-15","c":[{"head":"Why the delay","body":"Somatodendritic events near the cell body, not the terminal, may best explain therapeutic action. Autoreceptor desensitization timing matches clinical onset."}],"f":[["Depressed state: low 5HT; upregulated 5HT1A and postsynaptic receptors (7-11)","SSRI blocks SERT: 5HT rises first at the somatodendritic area, stimulating 5HT1A autoreceptors (7-12)","Over time, somatodendritic 5HT1A autoreceptors desensitize (7-13)","Neuron disinhibited: impulse flow and 5HT release at axon terminals rise (7-14)","Postsynaptic receptors desensitize: tolerance to side effects (7-15)"]]},{"t":"The not-so-selective SSRIs (1)","sec":"SSRIs and SPARIs","fig":"Figs 7-16, 7-17, 7-18","tb":[[["SSRI","Extra properties","Clinical profile in Ch. 7"],["Fluoxetine","5HT2C antagonism; weak NET (high doses)","Activating, energizing; suits low positive affect, hypersomnia, fatigue; may activate anxious or agitated patients; bulimia; half-life 2–3 days (metabolite 2 weeks), fewer withdrawal reactions; weekly form"],["Sertraline","Weak DAT inhibition; σ1 binding","Mildly activating (atypical depression); slow titration in panic; σ1 may help anxiety and psychotic depression; “Well-oft” with bupropion"],["Paroxetine","Mild anticholinergic (M1); weak NET; NOS inhibition","Calming, even sedating early; possible sexual dysfunction (NOS); notorious withdrawal reactions; controlled-release form"]]]},{"t":"The not-so-selective SSRIs (2)","sec":"SSRIs and SPARIs","fig":"Figs 7-19, 7-20, 7-21","tb":[[["SSRI","Extra properties","Clinical profile in Ch. 7"],["Fluvoxamine","More potent σ1 binding (possibly agonist)","Considered an OCD agent in the US; anxiolytic; psychotic/delusional depression; controlled-release once daily"],["Citalopram","R + S enantiomers; R has mild antihistamine action and may interfere with S at SERT","Well tolerated, good in elderly; inconsistent at lowest dose; dose limited by QTc prolongation"],["Escitalopram","Pure S enantiomer: “quintessential SSRI”","Pure SERT inhibition; predictable at lowest dose; no high-dose QTc restriction; perhaps best tolerated; fewest CYP450 interactions"]]]},{"t":"Vilazodone: a SPARI","sec":"SSRIs and SPARIs","fig":"Figs 7-22 to 7-27","c":[{"head":"SERT inhibition + 5HT1A partial agonism","body":["One drug instead of SSRI + buspirone","5HT1A partial agonist acts like “artificial serotonin”","May reduce sexual dysfunction (downstream DA)","Relative lack of weight gain"]}],"f":[["About half of SERTs and half of 5HT1A receptors occupied immediately (7-23)","Faster, stronger rise in somatodendritic 5HT (7-24)","5HT1A autoreceptors downregulate (7-25)","Firing and 5HT release disinhibited (7-26)","Postsynaptic desensitization; downstream DA release (7-27)"]]},{"t":"NET inhibition boosts dopamine in prefrontal cortex","sec":"SNRIs","fig":"Fig 7-33","f":[["PFC has abundant SERTs and NETs but very few DATs","Released DA diffuses widely; cleared by COMT or taken up by NET","Block NET → NE rises AND DA rises in PFC"]],"x":["throughout the brain","throughout the brain","in prefrontal cortex only","Hence “two-and-a-half” actions, not a full triple action"]},{"t":"Comparing the SNRIs","sec":"SNRIs","fig":"Figs 7-28 to 7-31","tb":[[["SNRI","Potency","Key points in Ch. 7"],["Venlafaxine","SERT at low doses; NET only at higher doses","Efficacy rises with dose (“noradrenergic boost”); sweating, raised BP; XR much better tolerated; withdrawal reactions"],["Desvenlafaxine","More NET relative to SERT","Active metabolite via CYP2D6; more predictable NET inhibition than venlafaxine"],["Duloxetine","Slightly more SERT than NET","Depression AND pain (neuropathic, fibromyalgia, musculoskeletal); geriatric cognitive symptoms; start twice daily; milder withdrawal"],["Milnacipran","More NET than SERT","US: fibromyalgia; Europe/Japan: depression; energizing; sweating, urinary hesitancy; twice daily"],["Levomilnacipran","S enantiomer; more NET than SERT","US depression; fatigue/low energy; once daily controlled release"]]]},{"t":"Duloxetine changed how we think about pain","sec":"SNRIs","fig":"","c":[{"head":"Old view","body":"Depression causes “psychic” pain; somatic pain was not thought to come from depression and was not treated with drugs for depression."},{"head":"New view","body":"Painful physical symptoms are a legitimate part of depression, and NET inhibition seems critical to treating them. SNRIs beat SSRIs here."}],"p":[{"label":"Clinical link","text":"Ask about painful physical symptoms: often missed, not in diagnostic criteria, and one of the leading residual symptoms after first treatment."}]},{"t":"Bupropion: an NDRI","sec":"Bupropion, Agomelatine, and Mirtazapine","fig":"Figs 7-34, 7-35, 7-36","b":["Weak DAT and NET inhibitor itself; active metabolites are more potent and concentrated in brain (a prodrug too).","PET: perhaps only 10–15%, at most 20–30%, of striatal DATs occupied.","Low, slow, long-lasting DAT occupancy: enough for craving (smoking cessation) and depression, not enough for abuse; not scheduled.","Activating; no bothersome sexual dysfunction (no serotonergic component).","Targets “reduced positive affect”: joy, interest, pleasure, energy, alertness, self-confidence.","SR and XL forms reduced peak-dose seizure risk; IR all but abandoned."],"c":[{"head":"DAT occupancy: “just right”","body":["Too much, too fast (≥50%, brief): euphoria, abuse (cocaine)","Too little: ineffective","Low, slow, sustained: antidepressant (bupropion)"]}]},{"t":"Agomelatine","sec":"Bupropion, Agomelatine, and Mirtazapine","fig":"Figs 7-37, 7-38, 7-39","c":[{"head":"Two actions","body":["MT1 and MT2 agonist (“substitute melatonin”) in the SCN","5HT2C (and 5HT2B) antagonist","In the SCN, both resynchronize circadian rhythms and may reverse the phase delay of depression"]},{"head":"5HT2C antagonism releases NE and DA","body":["5HT at 5HT2C on brainstem GABA interneurons normally inhibits NE and DA release in PFC","Blocking 5HT2C disinhibits NE and DA release","Shared by fluoxetine, trazodone, mirtazapine, some TCAs, olanzapine, quetiapine"]}]},{"t":"Mirtazapine: five mechanisms, no transporter","sec":"Bupropion, Agomelatine, and Mirtazapine","fig":"Figs 7-40, 7-41","c":[{"head":"α2 antagonism: cutting two brake cables","body":["Blocks α2 autoreceptors on NE neurons → more NE","Blocks α2 heteroreceptors on 5HT neurons → more 5HT","Like an SNRI’s result by a different route; synergistic with SNRIs"]},{"head":"Other effects","body":["H1: sedation, weight gain","5HT2A: better (slow-wave) sleep; more DA in PFC","5HT2C: more NE and DA in PFC","5HT3: see next slide"]}],"x":["α2 antagonism (primary)"]},{"t":"5HT3 antagonism","sec":"Bupropion, Agomelatine, and Mirtazapine","fig":"Figs 7-42, 7-43","c":[{"head":"Peripheral / brainstem","body":"5HT3 receptors in the chemoreceptor trigger zone and gut mediate nausea, vomiting, and bowel motility. Blocking them protects against chemotherapy and SSRI/SNRI GI effects."},{"head":"In the brain","body":"5HT3 receptors sit on GABA interneurons and are always excitatory: 5HT → GABA → inhibits glutamate, ACh, NE neurons."}],"f":[["5HT3 antagonist","Less GABA release","Glutamate, ACh, NE disinhibited","Downstream DA, NE, ACh, HA release → antidepressant action"]]},{"t":"Trazodone: two drugs in one","sec":"SARIs, Vortioxetine, and Neuroactive Steroids","fig":"Figs 7-44 to 7-47","tb":[[["","Insomnia dose","Depression dose"],["Dose (Fig 7-46)","25–150 mg","150–600 mg"],["Engaged receptors","5HT2A, α1, H1 antagonism (highest affinity)","Adds SERT inhibition; 5HT1D, 5HT2C, 5HT7, α2 antagonism; 5HT1A agonism"],["Best formulation","Immediate release: fast peak, gone by morning","Once-daily controlled release (XR): blunted peaks, less daytime sedation"],["Notes","Popular add-on for residual insomnia with SSRIs/SNRIs","No sexual dysfunction or weight gain; rapid first-dose sleep benefit"]]],"p":[{"label":"Reading the figure","text":"Fig 7-47: hypnotic IR doses only briefly reach, if at all, the minimum antidepressant level; 300 mg XR stays above it all night and day."}]},{"t":"SSRI vs SARI at the serotonin synapse","sec":"SARIs, Vortioxetine, and Neuroactive Steroids","fig":"Fig 7-48","c":[{"head":"SSRI (Fig 7-48A)","body":["More 5HT at ALL receptors","5HT1A: antidepressant","5HT2A and 5HT2C: sexual dysfunction, insomnia, anxiety"]},{"head":"SARI (Fig 7-48B)","body":["More 5HT at 5HT1A: antidepressant","5HT2A and 5HT2C blocked","No sexual dysfunction; improves insomnia and anxiety"]}],"p":[{"label":"Clinical link","text":"Insomnia is one of the most frequent residual symptoms after SSRIs/SNRIs."}]},{"t":"Vortioxetine: a multimodal agent","sec":"SARIs, Vortioxetine, and Neuroactive Steroids","fig":"Figs 7-49, 7-51 to 7-54","tb":[[["Action","Result"],["SERT inhibition","More 5HT"],["5HT1A agonism","More DA, ACh, NE downstream"],["5HT1B/D presynaptic antagonism (7-51)","Removes 5HT autoreceptor brake: even more 5HT"],["5HT1B heteroreceptor partial agonism/antagonism (7-52)","More NE, DA, HA, ACh in PFC"],["5HT3 antagonism (one of its most potent actions)","More ACh, DA, NE (via GABA)"],["5HT7 antagonism (7-53, 7-54)","More 5HT (raphe) and glutamate (PFC)"]]],"p":[{"label":"Key","text":"Net: more 5HT plus four pro-cognitive transmitters (DA, NE, ACh, HA): robust pro-cognitive action."}]},{"t":"The “Fab Four” of cognition","sec":"SARIs, Vortioxetine, and Neuroactive Steroids","fig":"Fig 7-50","p":[{"label":"Clinical link","text":"If any member is out of synch, the “music” fails. The quick DSST (digit symbol substitution test) mostly measures processing speed and can track objective change in patients with cognitive complaints. Cognitive symptoms cut across many psychiatric disorders."}],"x":["Attention / concentration","Executive function / problem solving"]},{"t":"Neuroactive steroids: brexanolone and SAGE-217","sec":"SARIs, Vortioxetine, and Neuroactive Steroids","fig":"Figs 7-55, 7-56, 7-57","c":[{"head":"Brexanolone","body":["IV cyclodextrin form of allopregnanolone","60-hour infusion for postpartum depression","Rapid and sustained effect"]},{"head":"SAGE-217","body":["Synthetic oral allopregnanolone analogue","In testing as rapid-onset treatment for MDD","Promising preliminary results"]}],"p":[{"label":"Mechanism","text":"They act at both benzodiazepine-sensitive and -insensitive GABAA receptors; since benzodiazepines lack antidepressant action, the extrasynaptic (tonic) sites are thought key. Depression shows low GABA and fewer GABA interneurons."}]},{"t":"Genetic testing: weighing the evidence","sec":"Treatment-Resistant Unipolar Depression","fig":"","c":[{"head":"Pharmacokinetic genes","body":"CYP450 variants predict high levels (side effects) or low levels (no efficacy). Combine with phenotyping: actual plasma drug levels."},{"head":"Pharmacodynamic genes","body":"Variants hypothetically linked to efficacy and side effects of drugs for depression."}],"p":[{"label":"Key","text":"Results shift the odds (“weight of the evidence”) rather than dictating one choice. They help build neurobiologically informed next steps instead of random selection."}]},{"t":"Table 7-1: Serotonin/dopamine blockers for the bipolar spectrum","sec":"Treatment-Resistant Unipolar Depression","fig":"Table 7-1","tb":[[["Drug","Mixed-features evidence","Bipolar depression","Bipolar mania","Bipolar maintenance","Major depressive disorder"],["Aripiprazole","","","Yes","Yes","Yes (adjunct)"],["Asenapine","Yes, MMX","","Yes","Yes",""],["Brexpiprazole","","","","","Yes (adjunct)"],["Cariprazine","Yes, MMX, DMX","Yes","Yes","",""],["Lurasidone","Yes, DMX*","Yes","","",""],["Olanzapine","Yes, MMX","Yes (with fluoxetine)","Yes","Yes","Yes (with fluoxetine)"],["Quetiapine","Yes, MMX","Yes","Yes","Yes","Yes (adjunct)"],["Risperidone","","","Yes","Yes",""],["Ziprasidone","Yes, MMX","","Yes","Yes",""]]],"x":["Columns 3–6 are FDA approvals. MMX: mania with mixed features; DMX: depression with mixed features; *unipolar and bipolar depression."]},{"t":"Serotonin/dopamine augmenters for unipolar depression","sec":"Treatment-Resistant Unipolar Depression","fig":"","tb":[[["Agent","Proposed antidepressant mechanisms","Caveats"],["Olanzapine–fluoxetine","Potent SERT + combined 5HT2C antagonism; 5HT2A antagonism","Unacceptable weight gain and metabolic effects for many"],["Quetiapine","NET (norquetiapine), 5HT2C, 5HT2A, 5HT7, α2A antagonism; 5HT1A agonism","Much sedation; moderate weight/metabolic risk"],["Aripiprazole","5HT1A partial agonism; D3, 5HT7, 5HT2C, α2","Well tolerated; little weight gain; akathisia; not for bipolar depression"],["Brexpiprazole","More 5HT2A, 5HT1A, α1, α2, 5HT7, D3 than aripiprazole","Possibly less akathisia (unproven); not for bipolar depression"],["Cariprazine","D3/D2/5HT1A partial agonist; 5HT2A/α1/α2 antagonist","Early evidence as adjunct in unipolar depression"]]]},{"t":"α1 antagonism works like 5HT2A antagonism","sec":"Treatment-Resistant Unipolar Depression","fig":"Fig 7-58","c":[{"head":"Motor striatum (7-58A)","body":"Less glutamate → less nigral GABA → more DA in motor striatum → less DIP. Lowest DIP: brexpiprazole, quetiapine, clozapine, iloperidone."},{"head":"Prefrontal cortex (7-58B)","body":"Less glutamate → less VTA GABA → more DA in PFC → better mood, affective, and cognitive symptoms. Seen with brexpiprazole, quetiapine, trazodone."}],"p":[{"label":"Clinical link","text":"Improved “top-down” PFC control may also explain brexpiprazole’s evidence in Alzheimer agitation and PTSD (with sertraline). Without muscarinic and H1 blockade, α1 antagonism need not mean sedation."}]},{"t":"Ketamine: a revolution in treatment","sec":"Treatment-Resistant Unipolar Depression","fig":"Figs 7-59, 7-60","b":["Subanesthetic IV infusion: rapid, almost immediate antidepressant effect, sometimes with specific anti-suicidal effects.","Used after multiple failures (“nonmonoaminergic” depressions).","Effects usually fade over a few days; can be re-triggered by repeat infusions or extended with monoamine drugs.","Leading target: NMDA antagonism at the open-channel PCP site."],"f":[["Ketamine blocks NMDA on GABA interneuron","GABA interneuron inactive","Downstream pyramidal neuron disinhibited","Burst of glutamate release"]]},{"t":"How the glutamate burst rebuilds synapses","sec":"Treatment-Resistant Unipolar Depression","fig":"Figs 7-61, 7-62","f":[["Glutamate burst stimulates AMPA (NMDA blocked)","ERK, AKT signalling","mTOR pathway → synaptic proteins","New dendritic spines within minutes to hours"],["Glutamate burst stimulates AMPA","VSCCs open; Ca²⁺ enters","BDNF and VEGF released (TRKB, FLK1)","Dendritic spine formation"]],"x":["Hypothesis 1: mTOR (Fig 7-61)","Hypothesis 2: BDNF/VEGF (Fig 7-62)"]},{"t":"Esketamine and other augmentation options","sec":"Treatment-Resistant Unipolar Depression","fig":"Fig 7-63","c":[{"head":"Esketamine","body":"Intranasal S-ketamine for treatment-resistant depression; twice weekly, then weekly or biweekly with a standard drug. Sustained benefit up to a year."},{"head":"Lithium","body":"Lower doses than for mania; used with TCAs in the past; now out of favor."},{"head":"Buspirone","body":"5HT1A partial agonist added to SSRI/SNRI (like vilazodone); less used than other 5HT1A agents."},{"head":"Thyroid hormone","body":"Nuclear transcription-factor action; to boost or speed response; now out of favor."}]},{"t":"Popular combinations","sec":"Treatment-Resistant Unipolar Depression","fig":"Figs 7-64, 7-65, 7-66","tb":[[["Combination","5HT","NE","DA","Rationale"],["SSRI + NDRI (bupropion)","Single","Single","Single","Triple action: covers low positive and high negative affect"],["SNRI + NDRI","Single","Double","Single","Triple action with more NE"],["SNRI + mirtazapine (“California rocket fuel”)","Quadruple","Quadruple","Possible double","Reuptake blockade + α2, 5HT2A, 5HT2C antagonism"],["SNRI + stimulant","Single","Double","Single","Arousal combo: fatigue, low energy, concentration"],["SNRI + modafinil","Single","Single","Single","Arousal combo via DAT inhibition"]]]},{"t":"Table 7-2: Some tricyclic antidepressants still in use","sec":"Second-Line Monotherapies: TCAs and MAOIs","fig":"Table 7-2","tb":[[["Generic","Trade name(s)"],["Clomipramine","Anafranil"],["Imipramine","Tofranil"],["Amitriptyline","Elavil; Endep; Tryptizol; Laroxyl"],["Nortriptyline","Pamelor; Aventyl"],["Protriptyline","Vivactil"],["Maprotiline","Ludiomil"],["Amoxapine","Asendin"]],[["Generic","Trade name(s)"],["Doxepin","Sinequan; Adapin"],["Desipramine","Norpramin; Pertofran"],["Trimipramine","Surmontil"],["Dothiepin","Prothiaden"],["Lofepramine","Deprimyl; Gamanil"],["Tianeptine","Coaxil; Stablon"]]],"x":["Uses beyond depression: clomipramine for OCD; many for panic; low doses for neuropathic and low back pain."]},{"t":"TCA pharmacology and the overdose danger","sec":"Second-Line Monotherapies: TCAs and MAOIs","fig":"Figs 7-67, 7-68","c":[{"head":"Therapeutic actions","body":["NET inhibition (all); more selective: desipramine, maprotiline, nortriptyline, protriptyline","SERT inhibition (some, e.g. clomipramine)","5HT2A/5HT2C antagonism (some)","Efficacy was never the problem"]},{"head":"Shared unwanted actions","body":["Muscarinic: dry mouth, blurred vision, retention, constipation","H1: sedation, weight gain","α1: orthostatic hypotension, dizziness","Na⁺ channels: in overdose, coma, seizures, arrhythmia, death"]}]},{"t":"MAOIs: the most powerful, least used","sec":"Second-Line Monotherapies: TCAs and MAOIs","fig":"Figs 7-69, 7-70, 7-71","b":["Irreversible: phenelzine, tranylcypromine, isocarboxazid, selegiline; enzyme returns in 2–3 weeks.","Amphetamine links: tranylcypromine is amphetamine-like; selegiline is metabolized to l-amphetamine and l-methamphetamine.","Also effective: panic disorder and social anxiety disorder."],"tb":[[["Inhibition","5HT","NE","DA","Antidepressant?"],["MAO-A only (7-69)","High","High","Moderate (MAO-B still acts)","Yes"],["MAO-B only (7-70)","Irrelevant","Irrelevant","Moderate","No (used in Parkinson’s: selegiline, rasagiline, safinamide)"],["MAO-A + MAO-B (7-71)","Very high","Very high","Very high","Robust, including dopamine"]]]},{"t":"MAOI safety: diet and drug interactions","sec":"Second-Line Monotherapies: TCAs and MAOIs","fig":"","c":[{"head":"Dietary tyramine","body":"Tyramine (classically in cheese) releases NE. Normally MAO-A destroys it; with MAO-A inhibited, blood pressure can rise (hypertensive crisis). Counsel patients on diet."},{"head":"Drug–drug interactions","body":["Possibly more common and important than diet","Sympathomimetic: raise blood pressure","Serotonin reuptake inhibitors: potentially fatal serotonin syndrome"]}],"p":[{"label":"Clinical link","text":"Keep up to date with tyramine content and interaction warnings, including cough/cold remedies and pain medicines."}]},{"t":"Serotonin/dopamine blockers in mania","sec":"Treatments for the Bipolar Spectrum","fig":"","b":["PET in mania shows the same excess presynaptic mesostriatal DA as psychosis: D2 blockade should be antimanic.","Acute mania is treated much like acute psychosis, with onset within minutes to hours.","Surprisingly they also treat core non-psychotic manic symptoms and prevent recurrence.","Not all are approved for mania or maintenance (Table 7-1): receptor or commercial reasons."],"p":[{"label":"Clinical link","text":"Lithium or valproate is commonly added to enhance antimanic response and prevent relapse."}]},{"t":"A paradigm shift for bipolar and mixed depression","sec":"Treatments for the Bipolar Spectrum","fig":"","c":[{"head":"Old answer","body":"“Treat all depression with monoamine reuptake inhibitors.”"},{"head":"Evolving best practice","body":"First-line for bipolar depression or depression with mixed features: an approved serotonin/dopamine blocker. Reuptake inhibitors second-line add-ons in bipolar depression."}],"p":[{"label":"Why","text":"Reuptake inhibitors may fail in bipolar or mixed depression and can cause intolerable activation, mania, and suicidality. No agent is approved for depression with mixed features."}]},{"t":"Approved agents for bipolar depression","sec":"Treatments for the Bipolar Spectrum","fig":"","tb":[[["Agent","Candidate antidepressant mechanisms","Notes"],["Olanzapine–fluoxetine","5HT2A + 5HT2C antagonism","Post hoc: mania with mixed features"],["Quetiapine","5HT2A, 5HT2C, α2 antagonism; 5HT1A agonism","Post hoc: mania with mixed features"],["Lurasidone","5HT2A, 5HT7, α2 antagonism; 5HT1A agonism","Never tested for mania; only large RCT in unipolar depression with mixed features (positive, no mania); lower doses; widely prescribed"],["Cariprazine","D3 partial agonism (most potent of any agent); 5HT1A; α1, α2","Approved for mania AND bipolar depression; post hoc benefit in both mixed states"]]]},{"t":"Cariprazine and the D3 receptor","sec":"Treatments for the Bipolar Spectrum","fig":"Figs 7-72, 7-73","tb":[[["Agent","D3 Ki, nM (lower = stronger)"],["Cariprazine","0.09"],["Blonanserin","0.28"],["Brexpiprazole","1.1"],["Asenapine","1.8"],["Paliperidone","2.6"],["Aripiprazole","17.7"],["Dopamine itself","60"],["Quetiapine","800"]]],"f":[["D3 autoreceptors in VTA normally brake mesocortical DA release","Cariprazine blocks VTA D3 (PFC has few D3)","Mesocortical DA disinhibited → DA at PFC D1 receptors","Better mood, motivation, energy, “brightening”"]]},{"t":"Lithium: the classic antimanic","sec":"Treatments for the Bipolar Spectrum","fig":"Fig 7-74","c":[{"head":"Possible mechanisms","body":["Inhibits inositol monophosphatase","Modulates G proteins","Inhibits GSK-3 and protein kinase C","Regulates growth-factor genes"]},{"head":"Proven","body":["Manic episodes","Maintenance, especially mania","Suicide prevention in mood disorders"]},{"head":"Side effects","body":["GI upset, weight gain, hair loss, acne","Tremor, sedation, cognition, incoordination","Thyroid and kidney long term","Narrow window: monitor levels"]}]},{"t":"Table 7-3: Anticonvulsant mood stabilizers","sec":"Treatments for the Bipolar Spectrum","fig":"Table 7-3","tb":[[["Agent","Epilepsy","Treat from above","Stabilize from above","Treat from below","Stabilize from below"],["Valproate","++++","++++","++","+","+/−"],["Carbamazepine","++++","++++","++","+","+/−"],["Lamotrigine","++++","+/−","++++","+++","++++"],["Oxcarbazepine / licarbazepine","++++","++","+","+/−","+/−"],["Riluzole","+","","","+","+/−"],["Topiramate","++++","+/−","+/−","",""],["Gabapentin","++++","+/−","+/−","",""],["Pregabalin","++++","+/−","+/−","",""]]],"x":["“Treat/stabilize from above” = mania-minded; “from below” = depression-minded. Blank = not listed."]},{"t":"Valproate and carbamazepine","sec":"Treatments for the Bipolar Spectrum","fig":"Figs 7-75 to 7-80","c":[{"head":"Valproate","body":["Possible actions: VSSC sensitivity, more GABA, downstream cascades (GSK-3, PKC, MARCKS; ERK, BCL2, GAP43)","Proven for acute mania; commonly used for maintenance","Hair loss, weight gain, sedation","Warnings: bone marrow, liver, pancreas, neural-tube defects; PCOS-like syndrome in women"]},{"head":"Carbamazepine","body":["First shown effective in mania; US approval for once-daily controlled release","Binds within the VSSC α subunit","Neuropathic pain (valproate: migraine)","Bone marrow suppression: monitor counts; strong CYP3A4 inducer; sedating; neural-tube defects"]}]},{"t":"Lamotrigine: depression-minded","sec":"Treatments for the Bipolar Spectrum","fig":"Figs 7-81, 7-82","b":["Approved to prevent recurrence of mania and depression; not approved for acute mania or depression.","Most experts believe it works for bipolar depression.","Binds the open VSSC like carbamazepine, but not effective for mania (weaker, or slow titration).","May uniquely reduce glutamate release: fits “treat and stabilize from below.”","Generally well tolerated, except rash, including rare Stevens–Johnson syndrome."],"p":[{"label":"Clinical link","text":"Titrate very slowly and watch for rash, especially with valproate."}]},{"t":"Anticonvulsants with uncertain or doubtful efficacy","sec":"Treatments for the Bipolar Spectrum","fig":"","c":[{"head":"Oxcarbazepine / eslicarbazepine","body":"Prodrug → licarbazepine (active S form: eslicarbazepine); same VSSC site as carbamazepine; less sedation, marrow toxicity, 3A4. Unproven; used off-label for mania."},{"head":"Topiramate","body":"Ambiguous results; weight loss; sometimes added to weight-gaining drugs; can sedate."},{"head":"Gabapentin, pregabalin","body":"Little or no mood-stabilizing action; used for pain and anxiety."},{"head":"L-type calcium blockers","body":"Anecdotal use, especially dihydropyridines."},{"head":"Riluzole","body":"Developed for ALS; may block glutamate release like lamotrigine."}]},{"t":"Combinations are the standard in bipolar disorder","sec":"Treatments for the Bipolar Spectrum","fig":"Fig 7-83","tb":[[["Target","Combination","Evidence"],["Mania","5HT/DA blocker + lithium","Evidence-based"],["Mania","5HT/DA blocker + valproate","Evidence-based"],["Depression","5HT/DA blocker + lamotrigine","Practice-based"],["Depression","5HT/DA blocker + lamotrigine + monoamine reuptake blocker","Practice-based, “careful combo” (controversial)"]]],"p":[{"label":"Key","text":"Monotherapy rarely suffices in bipolar disorder; combinations are the rule, not the exception."}]},{"t":"Dextromethorphan combinations","sec":"Future Treatments for Mood Disorders","fig":"Figs 7-84, 7-85","b":["Goal: oral ketamine-like drugs with rapid onset, sustained efficacy, easier use.","Dextromethorphan: NMDA antagonist; also σ1, SERT, weak μ-opioid binding.","Rapidly destroyed by CYP2D6, so it needs a 2D6 inhibitor."],"tb":[[["Combination","2D6 partner adds","Status in Ch. 7"],["Dextromethorphan–bupropion (AXS-05)","2D6 inhibition + NDRI action (possible synergy)","Breakthrough status for MDD; fast track for TRD and Alzheimer agitation"],["Dextromethorphan–quinidine","2D6 inhibition only","In trials; approved for pseudobulbar affect"],["Deuterated dextromethorphan–quinidine","Longer half-life; altered quinidine dose","In development"]]]},{"t":"Dextromethadone","sec":"Future Treatments for Mood Disorders","fig":"Fig 7-86","c":[{"head":"Methadone’s two halves","body":["Levo: potent μ-opioid agonist (opioid use disorder)","Dextro: more NMDA antagonism, weaker μ-opioid"]},{"head":"In development","body":"Dextromethadone as a rapid-onset treatment for major depression, with promising early results."}],"p":[{"label":"Hypothesis","text":"Some μ-opioid activity might enhance NMDA effects via NMDA–μ receptor dimers; this is under study."}]},{"t":"Hallucinogen-assisted psychotherapy","sec":"Future Treatments for Mood Disorders","fig":"Figs 7-87, 7-88","c":[{"head":"Rationale","body":["Psychotherapy is a form of learning that changes brain circuits","Dissociation may make patients more open to therapy","Disrupt reconsolidation of traumatic memories"]},{"head":"MDMA","body":["Serotonin reuptake inhibitor + VMAT2 → 5HT release; strong 5HT2A stimulation","Energy, warmth, trust, closeness","Testing: PTSD, anxiety, autism social anxiety, TRD"]},{"head":"Psilocybin","body":["Converted to psilocin","5HT2A agonism drives hallucinations (reversed by 5HT2A, not D2, antagonists)","Breakthrough status for depression"]}]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Unipolar depression","body":"Mostly monoamine mechanisms: SSRIs, SPARI, SNRIs, NDRI, α2 antagonist, SARIs, vortioxetine."},{"head":"Beyond monoamines","body":"Glutamate (ketamine, esketamine) and GABA (neuroactive steroids): rapid onset."},{"head":"Resistance","body":"Augment and combine mechanisms; TCAs and MAOIs as second-line."},{"head":"Bipolar spectrum","body":"Mostly different drugs: serotonin/dopamine blockers, lithium, valproate, carbamazepine, lamotrigine."},{"head":"Mixed features","body":"First-line serotonin/dopamine blockers, not reuptake inhibitors."},{"head":"Future","body":"Oral NMDA antagonists; hallucinogen-assisted psychotherapy."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Aim for remission","body":"Response is not enough; residual symptoms predict relapse."},{"head":"Match mechanism to symptom","body":"Fatigue/cognition: NE/DA; insomnia: SARI or hypnotic; pain: SNRI."},{"head":"Check the pole first","body":"Bipolar or mixed depression: use an approved serotonin/dopamine blocker first."},{"head":"Respect safety","body":"TCA overdose; MAOI diet and interactions; lithium levels; lamotrigine rash; valproate in women."}]}],"cards":[{"id":"c7-1","q":"Define response, remission, and recurrence.","a":"Response: ≥50% improvement. Remission: essentially no symptoms. Recurrence: return after recovery."},{"id":"c7-2","q":"What share of unipolar patients remit after the first and after four treatments?","a":"About a third after the first; about two-thirds after four."},{"id":"c7-3","q":"Name the four actions of an ideal “mood stabilizer.”","a":"Treat from above, stabilize from above, treat from below, stabilize from below."},{"id":"c7-4","q":"Why does SSRI benefit take weeks?","a":"Somatodendritic 5HT1A autoreceptors must desensitize before 5HT release rises at terminals."},{"id":"c7-5","q":"Which SSRI has 5HT2C antagonism, and what follows clinically?","a":"Fluoxetine: activating, energizing; may overactivate anxious patients; bulimia efficacy."},{"id":"c7-6","q":"What does NET inhibition do in the prefrontal cortex?","a":"Raises NE and DA (few DATs there): “two-and-a-half” actions of SNRIs."},{"id":"c7-7","q":"Why is bupropion not abused despite DAT inhibition?","a":"Low (10–30%), slow, sustained DAT occupancy: enough for effect, not for euphoria."},{"id":"c7-8","q":"How does α2 antagonism raise both NE and 5HT?","a":"Blocks α2 autoreceptors on NE neurons and α2 heteroreceptors on 5HT neurons (cuts both brakes)."},{"id":"c7-9","q":"How does trazodone differ at 50 mg vs 300 mg XR?","a":"50 mg IR: hypnotic via 5HT2A, α1, H1. 300 mg XR: SERT plus multiple serotonin actions for depression."},{"id":"c7-10","q":"List vortioxetine’s receptor actions.","a":"SERT inhibition; 5HT1A agonism; 5HT1B/D partial agonism/antagonism; 5HT3 and 5HT7 antagonism."},{"id":"c7-11","q":"Describe the two proposed ketamine pathways to new synapses.","a":"AMPA → ERK/AKT → mTOR → spines; and AMPA → VSCC Ca²⁺ → BDNF/VEGF release → spines."},{"id":"c7-12","q":"What is “California rocket fuel”?","a":"SNRI + mirtazapine: quadruple boost of 5HT and NE, possible DA boost."},{"id":"c7-13","q":"Why are TCAs dangerous in overdose?","a":"They block voltage-sensitive sodium channels: coma, seizures, arrhythmia; ~30-day supply can kill."},{"id":"c7-14","q":"Why does MAO-B inhibition alone not treat depression?","a":"MAO-B barely metabolizes 5HT or NE; MAO-A still destroys dopamine."},{"id":"c7-15","q":"Which agents are approved for bipolar depression?","a":"Olanzapine–fluoxetine, quetiapine, lurasidone, cariprazine."},{"id":"c7-16","q":"How is lamotrigine different from valproate in bipolar disorder?","a":"Lamotrigine is depression-minded (stabilizes from below); valproate is mania-minded."}],"glossary":[{"t":"SSRI","m":"Selective serotonin reuptake inhibitor"},{"t":"SPARI","m":"Serotonin partial agonist reuptake inhibitor"},{"t":"SNRI","m":"Serotonin–norepinephrine reuptake inhibitor"},{"t":"NDRI","m":"Norepinephrine–dopamine reuptake inhibitor"},{"t":"SARI","m":"Serotonin antagonist/reuptake inhibitor"},{"t":"TCA","m":"Tricyclic antidepressant"},{"t":"MAOI","m":"Monoamine oxidase inhibitor"},{"t":"SERT / NET / DAT","m":"Serotonin / NE / DA transporters"},{"t":"NOS","m":"Nitric oxide synthase"},{"t":"MT1 / MT2","m":"Melatonin receptors"},{"t":"DSST","m":"Digit symbol substitution test"},{"t":"mTOR","m":"Mammalian target of rapamycin"},{"t":"VEGF","m":"Vascular endothelial growth factor"},{"t":"TRKB / FLK1","m":"BDNF / VEGF receptors"},{"t":"MMX / DMX","m":"Mania / depression with mixed features"},{"t":"GSK-3","m":"Glycogen synthase kinase 3"},{"t":"VSSC / VSCC","m":"Voltage-sensitive Na⁺ / Ca²⁺ channel"},{"t":"MDMA","m":"3,4-methylene-dioxymethamphetamine"},{"t":"TRD","m":"Treatment-resistant depression"},{"t":"CYP2D6","m":"Cytochrome P450 2D6"}]},{"n":8,"title":"Anxiety, Trauma, and Treatment","short":"Anxiety & trauma","notes":[{"t":"When i
