s anxiety an anxiety disorder?","sec":"","fig":"","c":[{"head":"Normal anxiety","body":"An adaptive emotion under threat, part of the evolutionary “fight or flight” survival reaction (the saber-tooth tiger)."},{"head":"Anxiety disorder","body":"Anxiety that is maladaptive or excessive for the circumstances. Core symptoms: excessive fear and worry."}],"p":[{"label":"Clinical link","text":"Psychotherapy may be especially effective for anxiety and trauma disorders, sometimes more than drugs, and can enhance anxiolytic drugs."}]},{"t":"Depression and anxiety: different cores, shared edges","sec":"Symptom Dimensions in Anxiety Disorders","fig":"Fig 8-1","b":["Depressed mood","Loss of interest/pleasure","Sleep problems","Concentration","Fatigue","Psychomotor/arousal","Anxiety/fear","Worry"],"c":[{"head":"Other depression symptoms","body":"Appetite/weight, guilt/worthlessness, suicidality."},{"head":"Other anxiety symptoms","body":"Panic attacks, phobic avoidance, irritability, muscle tension, compulsions."}],"x":["Major depression core","Anxiety disorder core"]},{"t":"Anxiety disorders morph and co-occur","sec":"Symptom Dimensions in Anxiety Disorders","fig":"","b":["Many patients qualify over time for a second or third anxiety disorder.","Comorbid with major depression and with substance abuse, ADHD, bipolar disorder, pain, and sleep disorders.","All share core fear and worry and are treated with largely the same drugs, many of them drugs for depression."],"f":[["Full anxiety disorder","Subsyndromal symptoms","Same disorder returns, OR","A different anxiety disorder, OR","Major depression"]],"p":[{"label":"Question","text":"Are these different disorders, or different aspects of the same illness? Stahl leaves the question open."}]},{"t":"A symptom-based treatment strategy","sec":"Symptom Dimensions in Anxiety Disorders","fig":"","f":[["Deconstruct the disorder into its symptoms","Match symptoms to malfunctioning circuits","Target the neurotransmitters regulating those circuits","Improve information processing → remission"]],"p":[{"label":"Key","text":"“The brain is not organized according to the DSM, but according to brain circuits.” A patient with depression plus anxiety symptoms, or depression plus a full anxiety disorder, may get much the same treatment."}]},{"t":"Four disorders, one set of core symptoms","sec":"Symptom Dimensions in Anxiety Disorders","fig":"Figs 8-2 to 8-5","tb":[[["Disorder","Core fear/anxiety","Core worry","Associated symptoms"],["Generalized anxiety (8-2)","Generalized anxiety/fear","Worry","Arousal, fatigue, poor concentration, sleep problems, irritability, muscle tension"],["Panic disorder (8-3)","Anticipatory anxiety/fear","Worry about panic attacks","Unexpected panic attacks; phobic avoidance/behavior change"],["Social anxiety (8-4)","Social/performance anxiety/fear","Worry about exposure","Expected panic attacks in social situations; avoidance; arousal, fatigue, sleep"],["PTSD (8-5)","Anxiety while re-experiencing","Worry about other PTSD symptoms","Hyperarousal and startle, sleep problems and nightmares, avoidance"]]]},{"t":"Deconstructing anxiety: fear and worry","sec":"Symptom Dimensions in Anxiety Disorders","fig":"Figs 8-6, 8-7","c":[{"head":"FEAR","body":["Panic","Phobia","→ amygdala-centered circuit"]},{"head":"WORRY","body":["Anxious misery","Apprehensive expectation","Obsessions","→ cortico-striato-thalamo-cortical (CSTC) circuit"]}],"p":[{"label":"Key","text":"Different disorders may reflect different KINDS of malfunction in the same circuits, rather than different circuits."}]},{"t":"What differs between the disorders","sec":"Symptom Dimensions in Anxiety Disorders","fig":"","p":[{"label":"Key","text":"Same amygdala and CSTC circuits and neurotransmitters; different patterns of malfunction."}],"x":["Persistent and unremitting, yet not severe","Intermittent and catastrophic, unexpected","Intermittent and catastrophic, expected","Traumatic in origin and conditioned"]},{"t":"The amygdala integrates and decides","sec":"The Amygdala and the Neurobiology of Fear","fig":"","b":["Almond-shaped center near the hippocampus.","Integrates sensory and cognitive information, then decides whether there will be a fear response.","Its connections to other brain regions each produce a different part of the fear response."],"x":["Motor (fight, flight, freeze)","Endocrine (cortisol)","Autonomic (heart, BP)","Memory (re-experiencing)"]},{"t":"Amygdala connections and the fear response","sec":"The Amygdala and the Neurobiology of Fear","fig":"Figs 8-8 to 8-13","tb":[[["Component","Amygdala connection","Adaptive role","When excessive or chronic"],["Affect (8-8)","Anterior cingulate and orbitofrontal cortex","Feeling of fear","Pathological fear"],["Motor (8-9)","Periaqueductal gray","Fight, flight, or freeze","Avoidance"],["Endocrine (8-10)","Hypothalamus (HPA axis)","Quick cortisol boost","Coronary artery disease, type 2 diabetes, stroke; hippocampal atrophy"],["Breathing (8-11)","Parabrachial nucleus","Faster breathing for fight/flight","Shortness of breath, asthma flares, feeling smothered"],["Autonomic (8-12)","Locus coeruleus","Higher pulse and blood pressure","Atherosclerosis, ischemia, BP change, low HR variability, MI, sudden death"],["Re-experiencing (8-13)","Hippocampus","Memory of threats","Traumatic memories trigger fear (PTSD)"]]]},{"t":"“Scared to death” may not be an exaggeration","sec":"The Amygdala and the Neurobiology of Fear","fig":"","c":[{"head":"Chronic HPA activation (8-10)","body":["Coronary artery disease","Type 2 diabetes","Stroke","Possible hippocampal atrophy (Chapter 6)"]},{"head":"Chronic autonomic activation (8-12)","body":["Atherosclerosis and cardiac ischemia","Blood pressure changes, low HR variability","Myocardial infarction","Sudden death"]}],"p":[{"label":"Clinical link","text":"Treating anxiety disorders may protect physical health, not just relieve distress."}]},{"t":"Neurotransmitters regulating the amygdala","sec":"The Amygdala and the Neurobiology of Fear","fig":"Fig 8-14","p":[{"label":"Key","text":"Key known regulators: GABA, serotonin, norepinephrine, and voltage-gated calcium channels, exactly the targets of today’s anxiolytics."}],"x":["Norepinephrine (NE)","Voltage-gated ion channels"]},{"t":"The worry loop","sec":"CSTC Loops and the Neurobiology of Worry","fig":"Figs 8-15, 8-16","c":[{"head":"Worry includes","body":["Anxious misery","Apprehensive expectations","Catastrophic thinking","Obsessions"]},{"head":"Regulated by","body":["Serotonin, GABA, dopamine","Norepinephrine, glutamate","Voltage-gated ion channels"]}],"f":[["Dorsolateral prefrontal cortex","Striatum","Thalamus","Back to DLPFC"]]},{"t":"Fear circuit vs worry circuit","sec":"CSTC Loops and the Neurobiology of Worry","fig":"","tb":[[["","Fear","Worry"],["Circuit","Amygdala-centered","CSTC loop from DLPFC"],["Symptoms","Panic, phobia, fear","Anxious misery, apprehension, catastrophizing, obsessions"],["Regulators","5HT, GABA, glutamate, CRF, NE, voltage-gated ion channels","5HT, GABA, DA, NE, glutamate, voltage-gated ion channels"],["Pathology","Overactivation of amygdala outputs","Overactivation of the loop"]]],"p":[{"label":"Key","text":"Heavy overlap in regulators explains why the same drug classes reduce both fear and worry."}]},{"t":"Four ways to calm fear and worry","sec":"How Anxiolytics Work","fig":"Figs 8-17, 8-18","tb":[[["Drug class","On fear (amygdala, Fig 8-17)","On worry (CSTC, Fig 8-18)"],["Benzodiazepines","Enhance phasic GABA inhibition at postsynaptic GABAA receptors in the amygdala","Enhance inhibitory GABA interneurons in PFC"],["α2δ ligands","Block excess glutamate release at overactive N and P/Q VSCCs","Block excess glutamate release in CSTC circuits"],["Serotonergic agents","More 5HT input, which inhibits some amygdala outputs","More 5HT input to PFC, striatum, thalamus"],["NET inhibitors (delayed)","Downregulate β1 receptors in the amygdala","Downregulate β1 receptors in CSTC circuits"]]]},{"t":"Benzodiazepines","sec":"How Anxiolytics Work","fig":"Figs 8-17B, 8-18B","c":[{"head":"Mechanism","body":"Positive allosteric modulators of postsynaptic GABAA receptors: enhance phasic GABA inhibition, blunting fear outputs from the amygdala and worry loops."},{"head":"Timing","body":"Act acutely by occupying their receptors, unlike serotonergic drugs, whose effects are delayed by receptor adaptation."}],"p":[{"label":"Caution","text":"Do not prescribe benzodiazepines to patients abusing other substances, especially alcohol."}]},{"t":"α2δ ligands: gabapentin and pregabalin","sec":"How Anxiolytics Work","fig":"Figs 8-17C, 8-18C","b":["Bind the α2δ subunit of presynaptic N and P/Q voltage-sensitive calcium channels.","Block excessive glutamate release in the amygdala (fear) and CSTC circuits (worry).","Anxiolytic in social anxiety and panic disorder; approved for anxiety in some countries (not the US).","Also proven for epilepsy, neuropathic pain, and fibromyalgia."],"p":[{"label":"Clinical link","text":"A different mechanism from SSRIs and benzodiazepines: useful when those fail, and as add-ons for partial responders not yet in remission."}]},{"t":"Serotonin and anxiety","sec":"How Anxiolytics Work","fig":"Figs 8-17D, 8-18D","c":[{"head":"SSRIs and SNRIs","body":["Leading treatments today, originally developed for depression","Effective across GAD, panic, social anxiety, PTSD (and OCD)","More 5HT to amygdala and CSTC reduces fear and worry"]},{"head":"Buspirone (5HT1A partial agonist)","body":["Recognized for GAD only","Pre- and postsynaptic 5HT1A actions","Delayed onset: works by receptor adaptation, like SSRIs"]}],"p":[{"label":"Note","text":"SPARIs such as vilazodone (Chapter 7) should theoretically be anxiolytic too."}]},{"t":"Noradrenergic hyperactivity in anxiety","sec":"How Anxiolytics Work","fig":"Figs 8-19A, 8-20A","c":[{"head":"Symptoms of too much NE","body":["Fear and panic attacks","Tremor, sweating, tachycardia","Hyperarousal, flashbacks","Nightmares"]},{"head":"In worry circuits","body":"Excess NE reduces the efficiency of information processing in prefrontal cortex and CSTC circuits, theoretically causing worry."}],"p":[{"label":"Key","text":"The locus coeruleus drives both peripheral autonomic overdrive and central anxiety symptoms."}]},{"t":"Treating noradrenergic hyperactivity","sec":"How Anxiolytics Work","fig":"Figs 8-19B, 8-19C, 8-20B","c":[{"head":"α1 blockers (e.g. prazosin)","body":"Reduce nightmares and hyperarousal in some patients (Fig 8-19B)."},{"head":"NET inhibitors","body":"Sustained use downregulates and desensitizes β1 receptors, with delayed reduction of fear and worry (Figs 8-19C, 8-20B)."}],"p":[{"label":"Clinical link","text":"Anxiety can transiently WORSEN when starting an SNRI or selective NET inhibitor, before postsynaptic receptors adapt."}]},{"t":"Fear conditioning: learned fear","sec":"Fear Conditioning vs Fear Extinction","fig":"","tb":[[["Disorder","What gets “learned”"],["PTSD","Sensory reminders (explosion, burning rubber, flood waters) trigger re-experiencing, hyperarousal, fear"],["Social anxiety","Panic in social situations teaches panic in social situations"],["Panic disorder","A random attack in a crowd, on a bridge, or in a mall triggers panic there again"]]],"f":[["Aversive stimulus (e.g. footshock)","Paired with neutral stimulus (e.g. bell)","Neutral stimulus alone now triggers fear"]],"x":["Influenced by genes and by prior stress sensitization (e.g. child abuse)"]},{"t":"The fear-conditioning circuit","sec":"Fear Conditioning vs Fear Extinction","fig":"Fig 8-21","c":[{"head":"VMPFC","body":"If it fails to suppress fear upstream of the amygdala, conditioning proceeds."},{"head":"Hippocampus","body":"“Remembers” the context so fear is triggered again in similar settings."}],"f":[["Sensory input from thalamus or sensory cortex","Lateral amygdala: glutamate synapse strengthened","Central amygdala: second glutamate synapse strengthened","NMDA-driven LTP embeds learning → fear output every time"]]},{"t":"Fear extinction: new learning, not forgetting","sec":"Fear Conditioning vs Fear Extinction","fig":"Fig 8-21","c":[{"head":"Which wins?","body":["Both memories coexist","Output depends on which synapses are stronger","Extinction is more labile; conditioning often has the upper hand","“Renewal”: fear returns in a new context"]}],"f":[["Feared stimulus repeatedly presented without adverse consequence (e.g. exposure therapy)","VMPFC and hippocampus learn the new safe context","They activate glutamate neurons onto inhibitory GABA cells in the intercalated cell mass","GABA gate in central amygdala: no fear output"]]},{"t":"Why today’s drugs are not cures","sec":"Fear Conditioning vs Fear Extinction","fig":"","c":[{"head":"Current anxiolytics","body":"Suppress fear output from the amygdala (Fig 8-17). The fear-conditioning learning remains in place."},{"head":"Hope for lasting relief","body":"Psychotherapy, perhaps enhanced by drugs that target “unlearning” of fear conditioning."}],"p":[{"label":"Clinical link","text":"Exposure-based CBT may come closest to triggering extinction learning, but it is context-specific: gains made in the office may not generalize and fear can be “renewed” in the real world."}]},{"t":"Two ways to neutralize fear conditioning","sec":"Novel Approaches to Treatment","fig":"","c":[{"head":"Facilitate extinction","body":"Strengthen the new “safety” learning so the extinction side of the amygdala gate wins."},{"head":"Block consolidation or reconsolidation","body":"Stop a fear memory from being stored in the first place, or from being re-stored after it is recalled."}],"p":[{"label":"Target","text":"Aimed at patients who fail standard drugs and standard exposure or CBT."}]},{"t":"Boosting NMDA during exposure therapy","sec":"Novel Approaches to Treatment","fig":"Fig 8-22","f":[["Exposure therapy releases glutamate in lateral amygdala and intercalated cells","Drug boosts NMDA receptors at that moment","Disproportionate LTP in extinction synapses","Extinction pathway dominates → no fear response"]],"p":[{"label":"Clinical link","text":"Meanwhile, prudent psychopharmacologists already combine anxiolytic drugs with psychotherapy, since many patients gain more from the combination."}]},{"t":"Blocking consolidation and reconsolidation","sec":"Novel Approaches to Treatment","fig":"Fig 8-23","c":[{"head":"Consolidation","body":"Right after trauma, β blockers or opioids may mitigate conditioning of the memory and possibly reduce the chance of PTSD."},{"head":"Reconsolidation","body":"A recalled fear memory becomes labile. β blockers may disrupt re-storage; so might psilocybin, MDMA, and ketamine used during psychotherapy."}],"p":[{"label":"Horizon","text":"Early days, but this supports the growing idea that psychotherapy and psychopharmacology can be synergistic."}]},{"t":"Generalized anxiety disorder","sec":"Treatments for Anxiety Disorder Subtypes","fig":"","c":[{"head":"Treatments","body":["SSRIs, SNRIs","Benzodiazepines","Buspirone","α2δ ligands (pregabalin, gabapentin)"]},{"head":"Off-label options","body":["Mirtazapine, trazodone, vilazodone","Tricyclic antidepressants","Sedating antihistamines (hydroxyzine)"]}],"tb":[[["Good uses of benzodiazepines (non-substance-abusers)"],["Short-term while starting an activating, delayed-onset SSRI/SNRI"],["“Top up” partial responders stable on an SSRI/SNRI"],["Occasional intermittent use when symptoms surge"]]]},{"t":"Panic disorder and social anxiety disorder","sec":"Treatments for Anxiety Disorder Subtypes","fig":"","c":[{"head":"Panic disorder","body":["SSRIs, SNRIs, benzodiazepines, α2δ ligands","Off-label: mirtazapine, trazodone","MAOIs: powerful, neglected; consider when others fail","CBT: fixes distortions, reduces phobic avoidance"]},{"head":"Social anxiety disorder","body":["SSRIs, SNRIs, α2δ ligands","Benzodiazepines less accepted; less evidence for older antidepressants","β blockers (± benzodiazepine) for performance anxiety","CBT: sometimes better than drugs"]}]},{"t":"PTSD","sec":"Treatments for Anxiety Disorder Subtypes","fig":"","b":["Some SSRIs are approved, but drugs work less well than in anxiety disorders and often leave residual sleep problems.","Highly comorbid: many drugs are better aimed at depression, insomnia, substance abuse, and pain.","Most patients do not take monotherapy.","Benzodiazepines with caution: limited evidence and common substance abuse.","Unique option: α1 antagonists at night for nightmares.","Exposure therapy may be the most effective psychotherapy; MDMA-assisted reconsolidation blockade in testing."],"p":[{"label":"Reality","text":"Much more effective drug treatments for PTSD are greatly needed."}]},{"t":"Treatment at a glance (from Ch. 8 text)","sec":"Treatments for Anxiety Disorder Subtypes","fig":"","tb":[[["Treatment","GAD","Panic","Social anxiety","PTSD"],["SSRIs / SNRIs","Yes","Yes","Yes","Some SSRIs approved; less effective"],["Benzodiazepines","Yes (not with substance abuse)","Yes","Less widely accepted","Use with caution"],["α2δ ligands","Yes","Yes","Yes","—"],["Buspirone","Yes","—","—","—"],["MAOIs","—","Treatment-resistant cases","Less evidence (older drugs)","—"],["β blockers","—","—","Performance anxiety","Research: block consolidation"],["α1 antagonists","—","—","—","Nightmares (at night)"],["CBT / exposure","Yes","Yes","Powerful","Exposure most effective"]]]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Two core symptoms","body":"Fear and worry cut across GAD, panic, social anxiety, and PTSD."},{"head":"Two circuits","body":"Amygdala for fear; CSTC loops for worry."},{"head":"Key regulators","body":"Serotonin, norepinephrine, α2δ (VSCCs), and GABA; all effective drugs target them."},{"head":"Conditioning vs extinction","body":"Opposing amygdala circuits underlie symptoms and suggest new combined drug–therapy treatments."},{"head":"Reconsolidation","body":"Disrupting re-storage of fear memories is being tested."},{"head":"Psychotherapy","body":"Especially effective in anxiety; synergistic with drugs."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Think symptoms, not labels","body":"Deconstruct fear vs worry and treat the circuits behind them."},{"head":"Use benzodiazepines wisely","body":"Short-term bridging, top-up, or intermittent; avoid with substance abuse."},{"head":"Warn about early activation","body":"SSRIs/SNRIs can transiently worsen anxiety before receptors adapt."},{"head":"Combine with psychotherapy","body":"Drugs suppress fear; exposure-based therapy may help unlearn it."}]}],"cards":[{"id":"c8-1","q":"What symptoms do major depression and anxiety disorders share?","a":"Sleep problems, poor concentration, fatigue, psychomotor/arousal symptoms."},{"id":"c8-2","q":"Name the two core symptoms of all anxiety disorders and their circuits.","a":"Fear (amygdala-centered) and worry (CSTC loop)."},{"id":"c8-3","q":"How does malfunction differ between GAD, panic, and social anxiety?","a":"GAD: persistent, not severe. Panic: intermittent, catastrophic, unexpected. Social: the same but expected."},{"id":"c8-4","q":"Which amygdala connection drives autonomic fear responses?","a":"Amygdala → locus coeruleus."},{"id":"c8-5","q":"What medical risks follow chronic HPA activation?","a":"Coronary artery disease, type 2 diabetes, stroke; possible hippocampal atrophy."},{"id":"c8-6","q":"What is the worry loop?","a":"A CSTC loop from DLPFC through striatum and thalamus back to cortex."},{"id":"c8-7","q":"How do benzodiazepines reduce fear?","a":"Positive allosteric modulation of GABAA: more phasic inhibition in the amygdala."},{"id":"c8-8","q":"How do α2δ ligands reduce anxiety?","a":"Bind α2δ on N/P/Q VSCCs, blocking excess glutamate release in amygdala and CSTC."},{"id":"c8-9","q":"Why is buspirone’s onset delayed while benzodiazepines act quickly?","a":"Buspirone works through receptor adaptation; benzodiazepines act by acute receptor occupancy."},{"id":"c8-10","q":"Why might anxiety worsen when starting an SNRI?","a":"NE rises before postsynaptic receptors adapt (β1 downregulation takes time)."},{"id":"c8-11","q":"What treats PTSD nightmares?","a":"α1 antagonists (e.g. prazosin) at night."},{"id":"c8-12","q":"Describe fear extinction.","a":"New learning: VMPFC/hippocampus drive GABA cells in the intercalated mass that gate off fear output."},{"id":"c8-13","q":"What is “renewal”?","a":"Return of conditioned fear when the feared stimulus appears in a new context."},{"id":"c8-14","q":"How might NMDA boosting help exposure therapy?","a":"Extra LTP at extinction synapses activated during therapy lets extinction dominate."},{"id":"c8-15","q":"What is reconsolidation, and how might it be blocked?","a":"Recalled memories become labile; β blockers, or psilocybin/MDMA/ketamine during therapy, may block re-storage."},{"id":"c8-16","q":"Which drug should not be used for social anxiety despite being “effective”?","a":"Alcohol."}],"glossary":[{"t":"GAD","m":"Generalized anxiety disorder"},{"t":"PTSD","m":"Posttraumatic stress disorder"},{"t":"OCD","m":"Obsessive–compulsive disorder"},{"t":"CSTC","m":"Cortico-striato-thalamo-cortical"},{"t":"ACC / OFC","m":"Anterior cingulate / orbitofrontal cortex"},{"t":"PAG","m":"Periaqueductal gray"},{"t":"PBN","m":"Parabrachial nucleus"},{"t":"LC","m":"Locus coeruleus"},{"t":"HPA","m":"Hypothalamic-pituitary-adrenal"},{"t":"CRF","m":"Corticotropin-releasing factor"},{"t":"DLPFC / VMPFC","m":"Dorsolateral / ventromedial prefrontal cortex"},{"t":"VSCC","m":"Voltage-sensitive calcium channel"},{"t":"NET","m":"Norepinephrine transporter"},{"t":"SPARI","m":"Serotonin partial agonist reuptake inhibitor"},{"t":"NMDA","m":"N-methyl-D-aspartate"},{"t":"LTP","m":"Long-term potentiation"},{"t":"CBT","m":"Cognitive behavioral therapy"},{"t":"MAOI","m":"Monoamine oxidase inhibitor"}]},{"n":9,"title":"Chronic Pain and Its Treatment","short":"Chronic pain","notes":[{"t":"Pain: a psychiatric “vital sign”","sec":"","fig":"","c":[{"head":"Old view","body":"Centrally generated pain with emotional symptoms was not “real”: it would improve on its own once the psychiatric condition improved, so it needed no specific treatment."},{"head":"Modern view","body":"Such pain is a form of chronic neuropathic pain, treatable with the same agents: SNRIs and α2δ ligands."}],"p":[{"label":"Clinical link","text":"Assess and treat pain routinely: eliminating pain is often necessary for full remission of both chronic pain and many psychiatric disorders."}]},{"t":"Table 9-1: Pain definitions (1/2)","sec":"What Is Pain?","fig":"Table 9-1","tb":[[["Term","Definition"],["Pain","An unpleasant sensory and emotional experience associated with actual or potential tissue damage, or described in terms of such damage"],["Acute pain","Short duration and resolves; usually related to resolution or healing of tissue damage"],["Chronic pain","Persists longer than would be expected; an artificial threshold (e.g. 1 month) is not appropriate"],["Neuropathic pain","Arises from damage to, or dysfunction of, any part of the peripheral or central nervous system"],["Nociception","The process by which noxious stimuli produce activity in the sensory pathways that convey “painful” information"],["Allodynia","Pain caused by a stimulus that does not normally provoke pain"],["Hyperalgesia","An increased response to a stimulus that is not normally painful"],["Analgesia","Any process that reduces the sensation of pain, while not affecting normal touch"],["Local anesthesia","Blockade of all sensation (innocuous and painful) from a local area"]]]},{"t":"Table 9-1: Pain definitions (2/2)","sec":"What Is Pain?","fig":"Table 9-1","tb":[[["Term","Definition"],["Noxious stimulus","Inflicts, or would potentially inflict, damage on body tissues"],["Primary afferent neuron (PAN)","First neuron in the somatosensory pathway; detects mechanical, thermal, or chemical stimuli; cell body in the dorsal root ganglion"],["Nociceptor","A primary afferent (sensory) neuron activated only by a noxious stimulus"],["Nociception (2nd definition)","A nociceptor detects a noxious stimulus and generates action potentials toward higher centers"],["Dorsal root ganglion (DRG)","Contains PAN cell bodies; makes transmitters, receptors, structural proteins"],["Interneuron","Cell body, axon, dendrites within the spinal cord; excitatory (glutamate) or inhibitory (GABA)"],["Projection neurons","Dorsal horn neurons receiving PAN/interneuron input and projecting up the cord"],["Spinothalamic / spinobulbar tracts","Spinal cord → thalamus / → brainstem nuclei"],["Somatosensory cortex","Receives cutaneous sensory input; topographically arranged by body area"]]]},{"t":"Peripheral pain can become central pain","sec":"What Is Pain?","fig":"","c":[{"head":"Acute pain has a purpose","body":"Makes us aware of damage and rests the injured part until healed."},{"head":"Some pain starts centrally","body":"Never has a peripheral cause: e.g. depression, anxiety, fibromyalgia with unexplained painful physical symptoms."}],"f":[["Acute peripheral pain (osteoarthritis, low back pain, diabetic neuropathy)","Persists as chronic pain","Triggers central pain mechanisms","Central amplification and new central pain"]]},{"t":"Getting pain into the spinal cord","sec":"The Nociceptive Pathway","fig":"Fig 9-1","b":["Primary afferent neurons have cell bodies in the dorsal root ganglion: peripheral, not central, neurons.","Local anesthetics (lidocaine) block VSSCs and stop impulses from entering the CNS.","Receptors and channels determine what a neuron senses: stretch channels (mechanical), VR1 (capsaicin, heat)."],"f":[["Noxious stimulus at peripheral terminal","Transduction: membrane proteins change voltage","Depolarization opens VSSCs → action potential","Signal travels to central terminal in dorsal horn"]]},{"t":"Three kinds of primary afferent fibers","sec":"The Nociceptive Pathway","fig":"Fig 9-1","c":[{"head":"NSAIDs","body":"Reduce painful input from primary afferents, presumably peripherally (sprains, tooth extraction)."},{"head":"Opiates","body":"Also reduce such pain, but through central actions."}],"x":["Small movements, light touch, hair movement, vibration: non-noxious only","In between: noxious mechanical and sub-noxious thermal stimuli","Bare nerve endings activated only by noxious mechanical, thermal, or chemical stimuli"]},{"t":"The dorsal horn: a chemical crossroads","sec":"The Nociceptive Pathway","fig":"Fig 9-2","c":[{"head":"Why it matters","body":["First neurons fully inside the CNS: a key modulation site","Already targeted by opiates, SNRIs, and α2δ ligands","A plethora of new agents in development"]}],"tb":[[["Transmitter","Receptors in Fig 9-2"],["Substance P","NK1, NK2, NK3"],["Endorphins","μ-opioid"],["Norepinephrine","α2 adrenoceptors"],["Serotonin","5HT1B/D (inhibitory), 5HT3 (excitatory)"],["Glutamate / glycine","AMPA, NMDA"],["GABA","GABAA, GABAB"],["Others","CGRP, somatostatin, VIP, CCK (A, B), nitric oxide"]]]},{"t":"From nociception to “ouch”","sec":"The Nociceptive Pathway","fig":"Fig 9-3","c":[{"head":"Sensory/discriminatory","body":["Dorsal horn → spinothalamic tract","Thalamus → primary somatosensory cortex","Location and intensity"]},{"head":"Emotional/motivational","body":["Dorsal horn → spinobulbar tract","Brainstem nuclei → thalamus and limbic structures","Affective component"]}],"x":["Both combine → subjective PAIN (“ouch”)"]},{"t":"Nociceptive vs neuropathic pain","sec":"Neuropathic Pain and Central Sensitization","fig":"","c":[{"head":"“Normal” (nociceptive) pain","body":"Caused by activation of nociceptive nerve fibers."},{"head":"Neuropathic pain","body":"Arises from damage to, or dysfunction of, any part of the peripheral or central nervous system."}],"p":[{"label":"Mechanism","text":"Peripheral sensitization: disease or trauma alters neuron electrical activity, allows cross-talk, and starts inflammation, so signals continue without a relevant noxious stimulus. At every relay the signal can be dampened or amplified."}]},{"t":"Segmental central sensitization","sec":"Neuropathic Pain and Central Sensitization","fig":"Fig 9-4","b":["Plastic changes in the dorsal horn from constant firing of the pain pathway (activity- or use-dependent).","Wind-up: exaggerated or prolonged responses to noxious input (hyperalgesia).","Allodynia: pain from normally innocuous input.","Phosphorylation of receptors and channels trips a “master switch” that opens the pain gate.","Gate theory: innocuous stimulation away from the injury (acupuncture, vibration, rubbing) can close the gate."],"c":[{"head":"“Mixed” states","body":["Definite peripheral injury PLUS segmental central changes","Low back pain","Diabetic peripheral neuropathic pain","Shingles (herpes zoster)"]}]},{"t":"Suprasegmental central sensitization","sec":"Neuropathic Pain and Central Sensitization","fig":"Figs 9-5A, 9-5B","c":[{"head":"After peripheral injury (9-5A)","body":"The brain “learns” from pain and keeps it going, enhances it, and makes it permanent. Osteoarthritis, diabetic neuropathy, low back pain, shingles."},{"head":"Originating in the brain (9-5B)","body":"No peripheral input: the brain spontaneously activates its pain pathways. Fibromyalgia, chronic widespread pain, painful symptoms of depression and anxiety (especially PTSD)."}],"p":[{"label":"Big picture","text":"Plastic changes are especially in the thalamus and cortex. The same idea may apply to disease progression in schizophrenia, stress-related anxiety and mood disorders, and addiction."}]},{"t":"Segmental vs suprasegmental sensitization","sec":"Neuropathic Pain and Central Sensitization","fig":"Figs 9-4, 9-5","tb":[[["","Segmental","Suprasegmental"],["Where","Dorsal horn of the spinal cord segment receiving input from the damaged area","Brain sites in the pain pathway, especially thalamus and cortex"],["Trigger","Constant firing from a definite peripheral injury","Peripheral injury (9-5A) OR no identifiable trigger (9-5B)"],["Features","Wind-up (hyperalgesia), allodynia; phosphorylation opens the pain gate","The brain “learns” pain, or activates pain pathways spontaneously"],["Examples","Phantom limb pain, low back pain, diabetic neuropathy, shingles","Fibromyalgia, chronic widespread pain, painful symptoms of depression/anxiety/PTSD"]]]},{"t":"A spectrum from mood/anxiety to pain syndromes","sec":"Pain, Mood, Anxiety, and Fibromyalgia","fig":"Fig 9-6","p":[{"label":"Key","text":"Pain is the same symptom with the same treatments whether alone or with psychiatric disorders: SNRIs and α2δ ligands."}],"x":["Emotional symptoms","Depressed mood, anxiety, worry; MDD, GAD, PTSD, mixed anxiety","Fatigue, insomnia, problems concentrating","Painful physical symptoms, fibromyalgia, chronic widespread pain, shingles, diabetic neuropathy, osteoarthritis, low back pain"]},{"t":"Fibromyalgia","sec":"Pain, Mood, Anxiety, and Fibromyalgia","fig":"Fig 9-7","b":["Chronic widespread pain with tenderness but no structural pathology in muscles, ligaments, or joints.","Associated with fatigue and nonrestorative sleep.","Second most common diagnosis in rheumatology clinics; 2–4% of the general population.","Chronic and debilitating, but not necessarily progressive; no known cause.","Diagnosis (per text): widespread pain index (WPI) plus severity of fatigue, waking unrefreshed, cognitive and somatic symptoms."],"c":[{"head":"WPI body areas (Fig 9-7)","body":["Jaw, neck, shoulder girdle","Upper back, lower back","Upper arm, lower arm","Chest, abdomen","Hip (buttock)","Upper leg, lower leg"]}]},{"t":"Fibromyalgia symptoms and their circuits","sec":"Pain, Mood, Anxiety, and Fibromyalgia","fig":"Figs 9-8, 9-9","tb":[[["Symptom","Hypothetically malfunctioning region (Fig 9-9)"],["Pain","Thalamus"],["Physical fatigue","Striatum, spinal cord"],["“Fibro-fog” (concentration, interest) and mental fatigue","Prefrontal cortex (especially DLPFC)"],["Fatigue, low energy, lack of interest","Nucleus accumbens"],["Sleep and appetite","Hypothalamus"],["Depressed mood","Amygdala and orbitofrontal cortex"],["Anxiety","Amygdala"]]]},{"t":"Does chronic pain “shrink the brain”?","sec":"Pain, Mood, Anxiety, and Fibromyalgia","fig":"Fig 9-10","c":[{"head":"Reported gray-matter loss","body":["Dorsolateral prefrontal cortex","Thalamus","Temporal cortex","In fibromyalgia and chronic low back pain"]},{"head":"A hypothesis","body":"Persistent pain overuses DLPFC neurons → excitotoxic death → loss of the cortico-thalamic “brake” → more pain and poorer executive function (fibro-fog)."}],"p":[{"label":"Link","text":"Thalamic changes might explain nonrestorative sleep. Different regions from those in depression (hippocampus), but a similar idea of structural damage."}]},{"t":"The periaqueductal gray and opioids","sec":"Descending Inhibition: Opioids and SNRIs","fig":"Fig 9-11","tb":[[["Opioid peptide","Receptor","Effect"],["Endorphins","μ-opioid","Antinociceptive (target of opioid analgesics, spinal and PAG)"],["Enkephalins","δ-opioid","Antinociceptive"],["Dynorphins","κ-opioid","Anti- or pronociceptive"]]],"f":[["PAG integrates nociceptive and limbic input","Drives descending inhibitory pathways (via rostroventromedial medulla)","Endorphins at presynaptic μ-opioid receptors inhibit primary afferents"]]},{"t":"Opioids are not the answer for chronic neuropathic pain","sec":"Descending Inhibition: Opioids and SNRIs","fig":"","c":[{"head":"Chronic neuropathic pain","body":"Opiates are generally no more effective than SNRIs or α2δ ligands."},{"head":"Fibromyalgia","body":"Opiates are not proven effective at all in many cases, such as fibromyalgia."}],"p":[{"label":"Note","text":"Aβ fibers lack μ-opioid receptors, which may explain why opioid analgesics spare normal touch."}]},{"t":"Descending norepinephrine inhibition","sec":"Descending Inhibition: Opioids and SNRIs","fig":"Figs 9-12A, B, C","c":[{"head":"Details","body":["Inhibits primary afferent release (presynaptic α2) and dorsal horn neurons (postsynaptic α2)","Hence α2 agonists such as clonidine can relieve pain in some patients","May underlie pain in fibromyalgia, depression, IBS, anxiety"]}],"f":[["Normal (9-12A): descending NE at α2 receptors masks irrelevant bodily input","Deficient NE (9-12B): normal input from back, joints, gut perceived as pain","SNRI (9-12C): boosts NE; irrelevant input ignored again"]]},{"t":"Descending serotonin: a double-edged sword","sec":"Descending Inhibition: Opioids and SNRIs","fig":"Figs 9-13A, B, C","c":[{"head":"Inhibits pain","body":"Via 5HT1B/D receptors on primary afferent terminals and dorsal horn neurons (G-protein-coupled; hyperpolarize the terminal)."},{"head":"Facilitates pain","body":"Via excitatory 5HT3 receptors on some primary afferent terminals, increasing transmitter release."}],"p":[{"label":"Key","text":"This is why SSRIs (serotonin only) are not consistently useful for pain, whereas SNRIs (serotonin AND norepinephrine) are proven in diabetic neuropathy and fibromyalgia. NE effects may matter more."}]},{"t":"SNRIs for pain","sec":"Descending Inhibition: Opioids and SNRIs","fig":"","p":[{"label":"Mechanism","text":"Boosting descending NE and 5HT restores masking of irrelevant input from joints, muscles, and back (fibromyalgia, depression) and from the gut (irritable bowel syndrome, depression, anxiety), so it is no longer felt as pain."}]},{"t":"Adaptive analgesia under threat","sec":"Descending Inhibition: Opioids and SNRIs","fig":"","f":[["Severe injury or dangerous “conflict”","Descending release of opioids, 5HT, NE","Pain dulled: escape without impairment","Back in safety: descending facilitation","More awareness; rest the injury"]],"p":[{"label":"Example","text":"Explains athletes and soldiers persevering through severe injury. In neuropathic pain, this adaptive system is hijacked to keep pain going."}]},{"t":"Activity-dependent nociception","sec":"Targeting Sensitized Circuits: α2δ Ligands","fig":"Figs 9-14, 9-15A","tb":[[["Neuronal activity","Transmitter release","Result"],["Weak action potential (9-14A)","Minimal","No pain"],["Stronger action potential; VSCCs open longer (9-14B)","Full","Acute pain"],["Strong or repetitive firing; prolonged VSCC opening (9-15A)","Excessive","Molecular, synaptic, structural changes (sprouting): central sensitization → neuropathic pain"]]],"f":[["Action potential","Na⁺ influx","Ca²⁺ influx via VSCC","Neurotransmitter release"]]},{"t":"How α2δ ligands relieve neuropathic pain","sec":"Targeting Sensitized Circuits: α2δ Ligands","fig":"Figs 9-15B to 9-18","p":[{"label":"Key","text":"They act in the dorsal horn (Fig 9-17A) and in thalamus and cortex (Fig 9-17B), reducing excess release where central sensitization drives neuropathic pain while leaving normal neurotransmission alone."}],"x":["B: α2δ ligand binds open channel","Ca²⁺ influx reduced","Ligand does not bind; normal transmission spared","Fig 9-18: “use-dependent” block of the most active channels"]},{"t":"“Pay” for pain early","sec":"Targeting Sensitized Circuits: α2δ Ligands","fig":"","b":["Early treatment might stop painful experiences from imprinting on the CNS by preventing central sensitization.","The same mechanisms that relieve pain (SNRIs, α2δ ligands) might prevent progression to chronic persistent pain.","Aggressively treat painful symptoms in depression, anxiety, and fibromyalgia to reach full remission.","Future studies should test whether this prevents relapse, treatment resistance, and brain atrophy."],"p":[{"label":"Clinical link","text":"This is one reason pain is now considered a psychiatric vital sign: “intercept” central sensitization before it is durably imprinted in “angry circuits.”"}]},{"t":"SNRI + α2δ ligand: broader relief","sec":"Targeting Ancillary Symptoms in Fibromyalgia","fig":"","c":[{"head":"α2δ ligands also help","body":["Anxiety (Chapter 8)","The slow-wave sleep disorder of fibromyalgia"]},{"head":"SNRIs also help","body":["Depression and anxiety","Fatigue","Cognitive symptoms (“fibro-fog”)"]}],"p":[{"label":"Key","text":"Both classes are effective for fibromyalgia pain; together they may cover more symptoms."}]},{"t":"Treating fibro-fog and fatigue","sec":"Targeting Ancillary Symptoms in Fibromyalgia","fig":"","c":[{"head":"Via more NE and DA in DLPFC","body":["SNRIs raise DA in DLPFC through NET blockade (Fig 7-33C)","Especially milnacipran and levomilnacipran (potent NET at all doses)","Or higher doses of duloxetine, venlafaxine, desvenlafaxine"]},{"head":"Other strategies (as for depression)","body":["Modafinil, armodafinil","Atomoxetine (selective NRI)","Bupropion (NDRI)","Stimulants, with caution","SNRI + modafinil/stimulant/bupropion also for physical and mental fatigue"]}]},{"t":"Second-line options and sleep","sec":"Targeting Ancillary Symptoms in Fibromyalgia","fig":"","tb":[[["Target","Options in Ch. 9","Notes"],["Pain (second line)","Mirtazapine, TCAs, cyclobenzaprine","Sedating drugs for depression; tricyclic muscle relaxant"],["Sleep disturbance","Benzodiazepines, hypnotics, trazodone","Sleep aids"],["Severe, resistant cases","GHB (sodium oxybate)","Enhances slow-wave sleep; approved for narcolepsy; extreme caution: diversion and abuse"],["Neuropathic pain (second line)","Sodium-channel anticonvulsants","Different mechanism from α2δ; may help α2δ non-responders"]]]},{"t":"Fibromyalgia: a symptom-based portfolio","sec":"Targeting Ancillary Symptoms in Fibromyalgia","fig":"Figs 9-8, 9-9","tb":[[["Symptom","Options named in Ch. 9"],["Pain","SNRIs (duloxetine, milnacipran, venlafaxine, desvenlafaxine); α2δ ligands; second line: mirtazapine, TCAs, cyclobenzaprine, sodium-channel anticonvulsants"],["Anxiety","α2δ ligands; SNRIs"],["Depression","SNRIs"],["Sleep (slow-wave)","α2δ ligands; benzodiazepines, hypnotics, trazodone; GHB in severe resistant cases"],["Fatigue","SNRIs, augmented with modafinil, stimulants, or bupropion"],["“Fibro-fog”","SNRIs (especially milnacipran, levomilnacipran); modafinil, armodafinil, atomoxetine, bupropion; stimulants with caution"]]]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"The pathway","body":"Periphery → dorsal horn → spinothalamic (location, intensity) and spinobulbar (emotion) tracts → “ouch.”"},{"head":"Neuropathic pain","body":"Peripheral and central mechanisms; segmental and suprasegmental central sensitization."},{"head":"Descending inhibition","body":"5HT and NE pathways dampen pain: the basis of SNRI efficacy."},{"head":"VSCCs","body":"Excess release through N and P/Q channels: the basis of α2δ ligand efficacy."},{"head":"A spectrum","body":"From mood and anxiety disorders to chronic neuropathic pain syndromes."},{"head":"Fibromyalgia","body":"Chronic widespread pain plus fatigue, sleep, mood, and cognitive symptoms."}]},{"t":"Where each treatment acts on the pain pathway","sec":"Summary and Review","fig":"","tb":[[["Treatment","Site of action","Mechanism"],["Local anesthetics (lidocaine)","Peripheral primary afferent neurons","Block VSSCs: impulses cannot enter the CNS"],["NSAIDs","Periphery (presumed)","Reduce painful input from primary afferents"],["Opioids","Dorsal horn and periaqueductal gray","μ-opioid receptors inhibit nociceptive transmission"],["SNRIs","Descending pathways to dorsal horn","Boost NE (α2) and 5HT (5HT1B/D) inhibition"],["Clonidine","Dorsal horn","Direct α2 agonist"],["α2δ ligands","Dorsal horn, thalamus, cortex","Block open N and P/Q VSCCs: less excess release"],["Sodium-channel anticonvulsants","Voltage-gated sodium channels","Second line; different from α2δ"]]]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Ask about pain","body":"Pain is a psychiatric vital sign and often needed for full remission."},{"head":"Choose SNRIs, not SSRIs, for pain","body":"5HT alone is double-edged; NE matters."},{"head":"Use α2δ ligands","body":"They block the most active calcium channels driving central sensitization."},{"head":"Be wary of opioids","body":"No better than SNRIs/α2δ for neuropathic pain; unproven in fibromyalgia."}]}],"cards":[{"id":"c9-1","q":"Define allodynia and hyperalgesia.","a":"Allodynia: pain from a normally non-painful stimulus. Hyperalgesia: increased response to a normally non-painful stimulus."},{"id":"c9-2","q":"What do Aβ, Aδ, and C fibers detect?","a":"Aβ: light touch, vibration. Aδ: noxious mechanical and sub-noxious thermal. C: only noxious mechanical, thermal, chemical."},{"id":"c9-3","q":"How does lidocaine stop pain?","a":"Blocks VSSCs so action potentials cannot enter the CNS."},{"id":"c9-4","q":"What are the two ascending pain pathways?","a":"Sensory/discriminatory (spinothalamic → cortex) and emotional/motivational (spinobulbar → limbic)."},{"id":"c9-5","q":"What is segmental central sensitization? Give examples.","a":"Dorsal horn plasticity from constant firing (wind-up, allodynia); low back pain, diabetic neuropathy, shingles, phantom pain."},{"id":"c9-6","q":"What conditions arise from suprasegmental sensitization originating in the brain?","a":"Fibromyalgia, chronic widespread pain, painful symptoms of depression and anxiety (especially PTSD)."},{"id":"c9-7","q":"Name fibromyalgia’s core features and prevalence.","a":"Widespread pain, tenderness without pathology, fatigue, nonrestorative sleep; 2–4%."},{"id":"c9-8","q":"Where is gray-matter loss reported in chronic pain?","a":"DLPFC, thalamus, temporal cortex."},{"id":"c9-9","q":"Which opioid receptors mediate endorphin, enkephalin, and dynorphin effects?","a":"Endorphins: μ. Enkephalins: δ. Dynorphins: κ."},{"id":"c9-10","q":"Why do SNRIs work for pain when SSRIs often don’t?","a":"5HT inhibits via 5HT1B/D but facilitates via 5HT3; NE adds reliable descending inhibition."},{"id":"c9-11","q":"Why can clonidine relieve pain?","a":"Descending NE inhibits pain via α2 receptors; clonidine is a direct α2 agonist."},{"id":"c9-12","q":"How do α2δ ligands spare normal neurotransmission?","a":"They bind open, active VSCCs (use-dependent), not closed ones."},{"id":"c9-13","q":"What does “pay for pain early” mean?","a":"Treat pain early to prevent central sensitization from becoming permanent."},{"id":"c9-14","q":"Which SNRIs may best treat fibro-fog, and why?","a":"Milnacipran/levomilnacipran (potent NET → more DA in DLPFC), or high-dose duloxetine, venlafaxine, desvenlafaxine."},{"id":"c9-15","q":"Name second-line options for fibromyalgia pain.","a":"Mirtazapine, TCAs, cyclobenzaprine; sodium-channel anticonvulsants."},{"id":"c9-16","q":"What evidence links the placebo effect to opioids?","a":"Placebo analgesia is reversed by naloxone, a μ-opioid antagonist."}],"glossary":[{"t":"PAN","m":"Primary afferent neuron"},{"t":"DRG","m":"Dorsal root ganglion"},{"t":"PN","m":"Dorsal horn projection neuron"},{"t":"VSSC","m":"Voltage-sensitive sodium channel"},{"t":"VSCC","m":"Voltage-sensitive calcium channel"},{"t":"VR1","m":"Vanillinoid receptor 1 (capsaicin, heat)"},{"t":"NSAID","m":"Nonsteroidal anti-inflammatory drug"},{"t":"PAG","m":"Periaqueductal gray"},{"t":"NK1–3","m":"Substance P (neurokinin) receptors"},{"t":"CGRP","m":"Calcitonin gene-related peptide"},{"t":"CCK","m":"Cholecystokinin"},{"t":"WPI","m":"Widespread pain index"},{"t":"DLPFC","m":"Dorsolateral prefrontal cortex"},{"t":"SNRI","m":"Serotonin–norepinephrine reuptake inhibitor"},{"t":"NRI / NDRI","m":"NE / NE–DA reuptake inhibitor"},{"t":"GHB","m":"γ-hydroxybutyrate (sodium oxybate)"},{"t":"IBS","m":"Irritable bowel syndrome"},{"t":"TCA","m":"Tricyclic antidepressant"}]},{"n":10,"title":"Disorders of Sleep and Wakefulness and Their Treatment","short":"Sleep & wakefulness","notes":[{"t":"Sleep: another psychiatric “vital sign”","sec":"","fig":"","c":[{"head":"Assess routinely","body":"Detection, assessment, and treatment of sleep/wake disorders are becoming a standard part of psychiatric evaluation."},{"head":"Treat to remission","body":"Eliminating insomnia or sleepiness, whatever the psychiatric disorder, is needed for full symptomatic and functional remission."}],"p":[{"label":"Cross-links","text":"Related chapters: depression drugs used for insomnia (Ch. 7), benzodiazepines (Chs. 6–8), stimulants (Chs. 11 and 13)."}]},{"t":"Arousal is a dimmer switch, not an on/off switch","sec":"The Arousal Spectrum","fig":"Fig 10-1","p":[{"label":"Key","text":"Arousal neurotransmitters: histamine, dopamine, norepinephrine, serotonin, acetylcholine, plus GABA and orexin."}],"x":["Excessive daytime sleepiness","Cognitive dysfunction (under-aroused)","Awake, alert, creative, problem solving","Hypervigilant / insomnia","Cognitive dysfunction (over-aroused)","Hallucinations / psychosis","← deficient arousal (hypoactivation)","excessive arousal (overactivation) →"]},{"t":"Two symptoms, two treatment directions","sec":"The Arousal Spectrum","fig":"","c":[{"head":"Insomnia = excessive arousal at night","body":"Hypnotics move the patient from too much arousal to sleep."},{"head":"Sleepiness = deficient arousal by day","body":"Wake-promoting agents move the patient from too little arousal to normal alertness."}],"p":[{"label":"Approach","text":"Many pragmatic psychopharmacologists treat insomnia and sleepiness as symptoms that cut across many conditions, not only as separate disorders."}]},{"t":"Histamine synthesis and breakdown","sec":"Histamine","fig":"Figs 10-2, 10-3","f":[["Histidine enters via histidine transporter","Histidine decarboxylase (HDC) → histamine","Stored in synaptic vesicles","Released during neurotransmission"],["Histamine N-methyltransferase → N-methylhistamine","MAO-B → N-MIAA (inactive)"]],"p":[{"label":"Key","text":"No apparent reuptake pump for histamine, so it likely diffuses widely from its synapse, like dopamine in the prefrontal cortex."}]},{"t":"Histamine receptors","sec":"Histamine","fig":"Figs 10-4 to 10-7","tb":[[["Receptor","Location","Signalling / action","Relevance"],["H1","Postsynaptic","G protein → phosphatidylinositol, cFOS: wakefulness, alertness, pro-cognitive","Target of “antihistamines” (sedation, sleep)"],["H2","Postsynaptic (body and brain)","G protein → cAMP, PKA, CREB","Gastric acid (anti-ulcer drugs); brain role unclear, not directly wake-linked"],["H3","Presynaptic autoreceptor","Histamine binding closes the gate: stops further release","Blockers → more histamine: wake-promoting, pro-cognitive"],["H4","Not known in brain","—","—"],["NMDA polyamine site","Glutamate synapses","Allosteric modulation of NMDA","Role not well clarified"]]]},{"t":"The histamine wake circuit","sec":"Histamine","fig":"Fig 10-8","c":[{"head":"Tuberomammillary nucleus (TMN)","body":["Only source of brain histamine","Small, bilateral, in the hypothalamus","Projects to most brain regions and spinal cord","Regulates arousal, wakefulness, sleep"]},{"head":"Wake-relevant targets","body":["Prefrontal cortex","Basal forebrain","Thalamus","Brainstem neurotransmitter centers","Ventrolateral preoptic area (VLPO)","Lateral hypothalamus"]}]},{"t":"One transmitter, two names","sec":"Orexin / Hypocretin","fig":"","c":[{"head":"Hypocretin","body":"A hypothalamic peptide resembling the gut hormone secretin (incretin family). Now used for the gene and genetic products (HCRT)."},{"head":"Orexin","body":"Named for orexigenic (appetite-stimulating) activity. Now used for the peptide neurotransmitters (OX)."}],"tb":[[["Peptide","Length","Receptors"],["Orexin A","33 amino acids","OX1R and OX2R"],["Orexin B","28 amino acids","OX2R only"]]]},{"t":"Orexin neurons and receptors","sec":"Orexin / Hypocretin","fig":"Figs 10-9, 10-11","c":[{"head":"Where orexin is made","body":["Lateral hypothalamic area","Perifornical area","Posterior hypothalamus","Projects to TMN, basal forebrain, thalamus, brainstem centers"]}],"tb":[[["Receptor","Ligands","Signalling","Highly expressed in"],["OX1R","Orexin A","↑ intracellular Ca²⁺; Na⁺/Ca²⁺ exchanger","Noradrenergic locus coeruleus"],["OX2R","Orexin A and B","↑ NMDA receptor expression; inactivates GIRK channels","Histaminergic TMN"]]],"p":[{"label":"Key","text":"Orexin’s wake effect is thought to be largely via OX2R on TMN histamine neurons."}]},{"t":"Tonic vs phasic orexin firing","sec":"Orexin / Hypocretin","fig":"Figs 10-10, 10-12","tb":[[["Stimulus","Adaptive behavior"],["Hunger","Increased food intake"],["Drug withdrawal","Drug seeking"],["Cold","Peripheral thermogenesis"],["Elevated blood CO₂","Increased respiration"],["Escapable stress","HPA axis activation"],["Emotional/motivational stimulus","Attention, cognition, learning"]]],"x":["Tonic firing maintains arousal; a stimulus triggers phasic bursts that drive adaptive, goal-directed behavior:"]},{"t":"Orexin stabilizes wakefulness through all arousal systems","sec":"Orexin / Hypocretin","fig":"Figs 10-13 to 10-16","tb":[[["Transmitter","Source","Released onto","Figure"],["Acetylcholine","Basal forebrain; PPT/LDT","Cortex; thalamus","10-13"],["Dopamine","Ventral tegmental area","Cortex","10-14"],["Norepinephrine","Locus coeruleus","Cortex","10-15"],["Serotonin","Raphe nuclei","Basal forebrain; thalamus","10-16"],["Histamine","Tuberomammillary nucleus","Most brain regions","10-8"]]],"p":[{"label":"Key","text":"Orexin tonically drives release of all five arousal neurotransmitters."}]},{"t":"The sleep circuit: GABA from the VLPO","sec":"The Sleep/Wake Cycle","fig":"Fig 10-17","f":[["Circadian, homeostatic drives and darkness converge","Orexin falls; wakefulness no longer stabilized","VLPO releases GABA onto TMN, LH, basal forebrain, brainstem centers","Wake-promoting centers inhibited: sleep"]],"p":[{"label":"Key","text":"A hypothalamic sleep/wake switch: histamine (TMN) promotes wake; GABA (VLPO) promotes sleep."}]},{"t":"Two opposing drives","sec":"The Sleep/Wake Cycle","fig":"Fig 10-18","c":[{"head":"Homeostatic sleep drive","body":["Builds the longer you are awake","Depends on adenosine accumulation","Disinhibits VLPO → GABA release → sleep","Reset by sleep"]},{"head":"Circadian wake drive","body":["Light, melatonin, activity act on the SCN","Stimulates orexin release to stabilize wakefulness","Wanes as the day progresses"]}],"p":[{"label":"Key","text":"As the day goes on, circadian drive falls and homeostatic drive rises until a tipping point: sleep."}]},{"t":"A day in the sleep/wake cycle","sec":"The Sleep/Wake Cycle","fig":"Figs 10-8, 10-13 to 10-18","f":[["Light: TMN histamine to cortex and VLPO inhibits GABA; stimulates orexin release","Orexin releases ACh, DA, NE, 5HT: wakefulness stabilized","Light fades: NE and 5HT feed back onto LH, inhibiting orexin","VLPO/GABA suppresses arousal systems; melatonin secreted: sleep"]]},{"t":"Ultradian sleep cycles","sec":"The Sleep/Wake Cycle","fig":"Fig 10-18 (inset)","b":["One complete non-REM + REM cycle lasts about 90 minutes and repeats 4–5 times a night.","Stages 1–2 = non-REM; stages 3–4 = deeper slow-wave sleep.","Across the night, non-REM shortens and REM lengthens.","REM: EEG like wakefulness, eye movements, muscle atonia, dreaming.","Non-REM: overall reduced brain activity."],"p":[{"label":"Word","text":"“Ultradian” = a cycle faster (ultra) than a day (dian)."}]},{"t":"Neurotransmitters across the night","sec":"The Sleep/Wake Cycle","fig":"Figs 10-19 to 10-22","tb":[[["Transmitter","Pattern during sleep","Figure"],["GABA","Rises in the first hours, plateaus, declines before waking","10-19"],["Orexin","Opposite of GABA: drops early, plateaus, rises before waking","10-20"],["Acetylcholine","Lowest in stage 4; peaks in REM","10-21"],["DA, NE, 5HT, histamine","Peak in stage 2; lowest in REM","10-22"]]]},{"t":"The costs of disturbed sleep","sec":"Why Do We Sleep?","fig":"Figs 10-23, 10-24","c":[{"head":"Purpose debated","body":"Synaptic growth (potentiation), synaptic pruning, or both."},{"head":"Health risks","body":"Cardiometabolic disease, cancer, mental illness, immune and endocrine dysfunction."},{"head":"Economic costs","body":"Sickness absence, lost productivity, vehicular and mechanical accidents."},{"head":"Cognition","body":"24 hours without sleep, or chronic 4–5 hours a night, impairs cognition like legal alcohol intoxication."}]},{"t":"Sleep and obesity","sec":"Why Do We Sleep?","fig":"Fig 10-25","f":[["Impaired sleep/wake cycle","↓ leptin (appetite-inhibiting); ↑ ghrelin (appetite-stimulating); gut dysbiosis","Dysfunctional insulin, glucose, lipid metabolism","↑ risk of obesity, type 2 diabetes, cardiovascular disease"]],"p":[{"label":"Clinical link","text":"Fixing sleep may matter for metabolic health, not just mood and cognition."}]},{"t":"Insomnia: excessive nighttime arousal","sec":"Insomnia","fig":"Figs 10-26, 10-27","c":[{"head":"What imaging suggests","body":"Not an inability to switch ON sleep circuits (VLPO), but an inability to switch OFF arousal circuits."},{"head":"Associated conditions","body":["Poor sleep hygiene; medical illness","Other sleep disorders (circadian, RLS, apnea)","Medications, substances; psychiatric disorders"]}],"x":["Americans with chronic insomnia","more with episodic insomnia","may not report it to their clinician"]},{"t":"The biology of insomnia","sec":"Insomnia","fig":"Fig 10-28","tb":[[["Domain","Findings associated with insomnia"],["Neuroanatomical","Reduced gray matter in left orbitofrontal cortex and hippocampus"],["Neurobiological","Lower GABA (occipital, anterior cingulate); reduced nocturnal melatonin; blunted sleep-related fall in glucose metabolism; lower serum BDNF"],["Autonomic","Higher heart rate and variability, metabolic rate, body temperature; HPA activation; more NE"],["Inflammation","Systemic inflammation (IL-6)"],["Genetic","CLOCK, GABAA receptor, SERT, and HLA gene polymorphisms; stress-related epigenetic changes"]]]},{"t":"Insomnia and psychiatric illness","sec":"Insomnia","fig":"Figs 10-29, 10-30","p":[{"label":"Clinical link","text":"About 70% of people with depression report insomnia, and they have worse treatment response, more episodes, and worse long-term outcome. DSM-5 now treats insomnia as a COMORBIDITY with a two-way relationship, not merely a symptom of another illness."}],"x":["more likely to develop anxiety within 3–5 years","more likely to develop depression","more likely to develop substance use disorders"]},{"t":"Diagnosing insomnia","sec":"Insomnia","fig":"Fig 10-31","c":[{"head":"Practical points","body":["Usually diagnosed by subjective report","Polysomnography not generally needed, but rules out narcolepsy, RLS, obstructive sleep apnea","Treat both the subjective symptom and the objective disorder of arousal"]}],"tb":[[["Suggested criterion","Threshold"],["Average sleep latency","> 30 minutes"],["Wakefulness after sleep onset (WASO)","> 30 minutes"],["Sleep efficiency","\u003c 85%"],["Total sleep time","\u003c 6.5 hours"]]]},{"t":"Two strategies for insomnia","sec":"Drugs with Hypnotic Actions","fig":"Fig 10-32","c":[{"head":"Enhance sleep drive","body":["Boost GABA in the VLPO sleep center","GABAA positive allosteric modulators (PAMs)","Benzodiazepines and Z drugs"]},{"head":"Reduce arousal","body":["Block orexin: DORAs","Block histamine: H1 antagonists","Block serotonin: 5HT2A antagonists","Block norepinephrine: α1 antagonists"]}],"p":[{"label":"Goal","text":"Either way, the goal is to shift the bedtime state from hyperactive to asleep."}]},{"t":"Benzodiazepine hypnotics","sec":"Drugs with Hypnotic Actions","fig":"Fig 10-33","c":[{"head":"Place in therapy","body":["Second line: tolerance, withdrawal, rebound insomnia worse than baseline","Still useful when first-line agents fail","Especially severe, resistant insomnia with psychiatric or medical illness"]}],"tb":[[["Drug (US-approved for insomnia)","Half-life class","Half-life shown"],["Flurazepam (Dalmane)","Ultra-long","2–6 days"],["Quazepam (Doral)","Ultra-long","2–5 days"],["Estazolam (ProSom)","Moderate","12–30 hours"],["Temazepam (Restoril)","Moderate","4–20 hours"],["Triazolam (Halcion)","Ultra-short","1–2 hours"]]]},{"t":"GABAA α subunits: what each does","sec":"Drugs with Hypnotic Actions","fig":"","tb":[[["Subunit","Linked to"],["α1","Sedation (targeted by every effective GABAA PAM hypnotic); daytime sedation, anticonvulsant action, possibly amnesia; adaptations linked to tolerance and withdrawal"],["α2, α3","Anti-anxiety, muscle relaxant, alcohol-potentiating actions"],["α5","Mostly hippocampus; possibly cognition"]]],"p":[{"label":"Key","text":"Benzodiazepines and Z drugs target postsynaptic γ-containing receptors that mediate phasic inhibition."}]},{"t":"The Z drugs","sec":"Drugs with Hypnotic Actions","fig":"Fig 10-34","tb":[[["Drug","α-subunit binding","Notes"],["Zaleplon (Sonata)","α1 selective","Ultra-short"],["Zolpidem (Ambien)","α1 selective","IR lasts ~2–4 hours"],["Zolpidem CR (Ambien CR)","α1 selective","Extends to ~6–8 hours: sleep maintenance"],["Sublingual zolpidem","α1 selective","Low dose, fast onset, for middle-of-the-night waking"],["Eszopiclone (Lunesta)","α1, α2, α3, α5","Single S enantiomer (US)"],["R,S-zopiclone","α1, α2, α3, α5","Racemic; not in the US"]]]},{"t":"Dual orexin receptor antagonists (DORAs)","sec":"Drugs with Hypnotic Actions","fig":"Figs 10-35, 10-36, 10-37","tb":[[["","Suvorexant","Lemborexant"],["Receptor affinity","OX1R ≈ OX2R","OX2R > OX1R"],["Kinetics at OX2R","—","Much faster association/dissociation (may reverse faster in the morning)"]]],"f":[["DORA blocks OX1R and especially OX2R","Orexin cannot drive release of HA, ACh, NE, DA, 5HT","Wakefulness no longer stabilized","Sleep initiation and maintenance"]],"p":[{"label":"Advantage","text":"Neither causes dependence, withdrawal, rebound, unsteady gait, falls, confusion, amnesia, or respiratory depression."}]},{"t":"DORAs compete with the body’s own orexin","sec":"Drugs with Hypnotic Actions","fig":"","tb":[[["Problem","Adjustment suggested in Ch. 10"],["Early morning awakening","Higher DORA dose"],["Next-morning carryover","Lower DORA dose"],["Abnormally high orexin (some insomnia or comorbidity)","Higher dose may be needed"]]],"f":[["Middle of the night: low orexin","High drug-to-orexin ratio: strong blockade","Morning: orexin rises as DORA falls","Blockade drops below threshold: patient wakes"]]},{"t":"Trazodone: the world’s most prescribed sleep drug","sec":"Drugs with Hypnotic Actions","fig":"","c":[{"head":"How it works","body":["Reduces arousal, not boosts sleep drive","Blocks 5HT2A, α1, H1: a powerful hypnotic combination","5HT2A blockade enhances slow-wave, restorative sleep"]},{"head":"How it was found","body":"Studied at high doses, several times daily, for depression: effective but sedating by day. Low-dose immediate release at night proved a hypnotic that wears off by morning."}],"p":[{"label":"Clinical link","text":"Not approved for insomnia, yet not associated with tolerance, withdrawal, dependence, or rebound. Slow-wave benefits may even improve daytime pain and fatigue."}]},{"t":"H1 antagonists: not all antihistamines are alike","sec":"Drugs with Hypnotic Actions","fig":"Figs 10-38, 10-39, 10-40","tb":[[["","Diphenhydramine (OTC)","Low-dose doxepin"],["H1 blockade","Yes","Yes, highly selective"],["M1 (anticholinergic) blockade","Yes: blurred vision, constipation, memory problems, dry mouth","No, at hypnotic doses"],["Dose","Sleep-aid doses","1–6 mg/day (vs 150–300 mg/day for depression)"],["Other actions at high dose","—","SERT, NET inhibition; α1, M1 blockade"]]],"p":[{"label":"Key","text":"Many “antihistamine” problems (anticholinergic effects, hangover) come from M1 blockade, not H1 blockade. H1 antagonists: only anecdotal tolerance; no withdrawal, dependence, or rebound."}]},{"t":"α2δ ligands as hypnotics","sec":"Drugs with Hypnotic Actions","fig":"","c":[{"head":"Gabapentin and pregabalin","body":"Not approved for insomnia, but prescribed off-label. Not particularly sedating, yet enhance slow-wave, restorative sleep and help pain."}],"p":[{"label":"Clinical link","text":"Useful where insomnia coexists with pain or anxiety."}]},{"t":"Your sleep is at the mercy of your drug levels","sec":"Drugs with Hypnotic Actions","fig":"Figs 10-41A–D","tb":[[["Profile","Time above threshold","Result","Examples"],["Just right (A)","~8 hours","Onset and maintenance, no hangover","Eszopiclone, zolpidem CR, low-dose trazodone, low-dose doxepin, antihistamines, suvorexant, lemborexant"],["Way too hot (B)","24–150 hours","Accumulation; falls, especially elderly","Flurazepam, quazepam"],["Still too hot (C)","15–30 hours","Next-day hangover","Estazolam, temazepam, most TCAs, mirtazapine, chlorpromazine"],["Too cold (D)","Half-life 1–3 hours","Early waking (lost maintenance)","Triazolam, zaleplon, zolpidem, melatonin, ramelteon"]]],"x":["occupancy threshold for GABAA PAMs","threshold for DORAs","serotonin/histamine antagonists (single receptor; less if several)"]},{"t":"Troubleshooting a hypnotic","sec":"Drugs with Hypnotic Actions","fig":"Fig 10-41","tb":[[["Problem","Likely reason","Try"],["Not falling asleep quickly","Threshold reached too slowly","Give earlier; not with food; raise dose; change mechanism"],["Not sleeping long enough","Threshold lost too early","Raise dose; switch to longer duration above threshold"],["Groggy in the morning","Still near/above threshold at waking","Lower dose; give earlier; switch to shorter duration"]]],"p":[{"label":"Link","text":"The same threshold idea applies to stimulants for ADHD (Chapter 11)."}]},{"t":"Non-drug treatments for insomnia","sec":"Drugs with Hypnotic Actions","fig":"Figs 10-42, 10-43","c":[{"head":"Sleep hygiene","body":["Bed for sleep only","No alcohol, caffeine, nicotine, or hard exercise before bed","Not asleep in 20 min? Get up","Don’t watch the clock","Regular habits; dark, cool room; no light at night"]}],"tb":[[["Therapy","Approach"],["Relaxation training","Reduce somatic tension, intrusive thoughts"],["Stimulus control","Out of bed if not sleepy; bed for sleep; no naps"],["Sleep restriction","Limit time in bed; mild deprivation consolidates sleep"],["Intensive sleep retraining","25-hour deprivation; 50 onset trials, woken after 3 min"],["CBT","Reduce negative attitudes and misconceptions about sleep"]]]},{"t":"Sleepiness is not benign","sec":"Excessive Daytime Sleepiness","fig":"Figs 10-44, 10-45","b":["Most common cause: sleep deprivation, treated with sleep.","Loss of sleep impairs performance like legal alcohol intoxication: traffic accidents and deaths.","Patients often do not complain of it: ask, and interview the bed partner.","Tools: Epworth Sleepiness Scale; polysomnogram; Multiple Sleep Latency Test (MSLT); maintenance of wakefulness test; sleep diary; actigraphy."],"c":[{"head":"Causes (Fig 10-45)","body":["Central: idiopathic hypersomnia, recurrent hypersomnia, narcolepsy ± cataplexy","Other: medical conditions (e.g. sleep apnea), medications, substances, psychiatric disorders (depression)","Circadian rhythm disorders"]}]},{"t":"Hypersomnia and obstructive sleep apnea","sec":"Excessive Daytime Sleepiness","fig":"Fig 10-49","c":[{"head":"OSA clinical features","body":"Loud snoring, obesity, hypertension, neck >17\", enlarged tonsils; sleepiness, fatigue, loss of interest, depression."},{"head":"Pathophysiology","body":"Partial (hypopnea) or full (apnea) airway collapse lowers oxygen saturation, ended by arousal. Up to 75% with insomnia have a sleep-related breathing disorder."}],"x":["of the population has hypersomnia","with hypersomnia may have a mood disorder","adults has moderate OSA"]},{"t":"Idiopathic hypersomnia vs narcolepsy","sec":"Excessive Daytime Sleepiness","fig":"Figs 10-46, 10-47, 10-48","tb":[[["Feature","Idiopathic hypersomnia","Narcolepsy"],["Sleep","Long (>10 h) or normal, non-refreshing","Sleep intrudes into wakefulness"],["Sleepiness","Constant; ≥3 months","Excessive daytime sleepiness"],["REM","\u003c2 SOREMPs","≥2 SOREMPs on MSLT or 1 on polysomnogram; hypnagogic hallucinations"],["Sleep latency","Short","≤8 minutes on MSLT"],["Other features","Sleep drunkenness, memory/attention problems, GI problems, depression, anxiety","With or without cataplexy (emotion-triggered loss of muscle tone)"],["CSF","Histamine may be low; orexin usually normal","Orexin \u003c110 pg/mL is diagnostic (often normal without cataplexy)"],["Genetics","—","HLA DQB1-0602 in ~90% (vs 20% of general population)"]]]},{"t":"Why orexin loss causes narcolepsy and cataplexy","sec":"Excessive Daytime Sleepiness","fig":"Fig 10-48","c":[{"head":"Remember","body":["Orexin stabilizes wakefulness","Orexin stabilizes daytime motor tone","Loss of both = sleep attacks + cataplexy"]}],"f":[["Orexin neurons in lateral hypothalamus degenerate","Arousal neurotransmitters no longer driven: wake unstable → sleep intrusions","Motor control no longer stabilized by day","Motor inhibition intrudes into wakefulness: cataplexy"]]},{"t":"Four circadian rhythm disorders","sec":"Circadian Rhythm Disorders","fig":"Figs 10-50 to 10-54","tb":[[["Disorder","Pattern","Notes from Ch. 10"],["Shift work disorder","Insomnia and/or sleepiness tied to a recurring schedule overlapping usual sleep time (≥1 month)","Shift work = 6 pm–7 am; 15–25% of US workforce; 10–32% of shift workers develop it"],["Advanced sleep phase (ASPD)","To bed and up earlier than desired; normal sleep amount and quality","PER2 polymorphisms (familial form); common in normal elderly"],["Delayed sleep phase (DSPD)","Cannot fall asleep until early morning; wake late","Most common circadian disorder; CLOCK gene; common in depression and teens"],["Non-24-hour sleep–wake","Free-running irregular sleep/wake","Mostly blind people: no light entrainment of the SCN"]]]},{"t":"Shift work disorder: more than tiredness","sec":"Circadian Rhythm Disorders","fig":"Fig 10-51","p":[{"label":"Clinical link","text":"Beyond sleepiness at work and insomnia at home, SWD dramatically raises risk of cardiometabolic problems, cancer, gastrointestinal disease, and mood disorders."}],"x":["of US workforce do shift work","of shift workers develop SWD","develop a severe form"]},{"t":"Resetting the clock","sec":"Circadian Rhythm Disorders","fig":"Figs 10-55, 10-56","tb":[[["Who","Light","Melatonin"],["Delayed sleep phase; depression; normal teens","Morning","Evening"],["Shift work disorder (with modafinil/armodafinil)","Morning","Evening"],["Advanced sleep phase; normal elderly","Early evening","Early morning"],["Non-24-hour sleep–wake","—","Tasimelteon (MT1/MT2 agonist)"]]],"p":[{"label":"Everyday example","text":"Parents have long known the trick: open the shades to get hibernating teens up for school."}]},{"t":"Melatonergic agents","sec":"Circadian Rhythm Disorders","fig":"Fig 10-57","tb":[[["Agent","Receptors","Use in Ch. 10"],["Melatonin (OTC)","MT1, MT2, MT3 site","Shifts rhythms; sleep onset; delayed phase, teens, depression, jet lag"],["Ramelteon","MT1, MT2 agonist","Insomnia (sleep onset)"],["Tasimelteon","MT1, MT2 agonist","Non-24-hour sleep–wake disorder"],["Agomelatine","MT1, MT2 agonist; 5HT2C/2B antagonist","Antidepressant outside the US"]]],"p":[{"label":"Mechanism","text":"MT1: may quiet the SCN “alerting” signal. MT2: phase shifting. Help sleep onset (sometimes better after several days), not maintenance."}]},{"t":"Caffeine: blocking the “bean counter”","sec":"Wake-Promoting Agents","fig":"Figs 10-58, 10-59","c":[{"head":"Big picture","body":["World’s most widely consumed psychoactive drug","Adenosine tracks homeostatic sleep drive","Caffeine: wake-promoting, less fatigue"]}],"f":[["A: dopamine binds D2 with high affinity","B: adenosine receptor pairs with D2, lowering its dopamine affinity","C: caffeine blocks adenosine; D2 affinity restored, dopamine action enhanced"]]},{"t":"Amphetamine, methylphenidate, modafinil","sec":"Wake-Promoting Agents","fig":"Figs 10-60 to 10-63","tb":[[["","Amphetamine / methylphenidate","Modafinil / armodafinil"],["Mechanism","NE and DA reuptake inhibition; amphetamine also DA release and VMAT2 inhibition","Weak DAT inhibition, but high plasma levels; slow, sustained, incomplete DAT occupancy → tonic DA"],["Approved for","Narcolepsy (off-label: OSA, shift work)","Narcolepsy; adjunct in OSA; shift work disorder"],["Efficacy","Highly effective","Possibly less powerful (no head-to-head trials)"],["Abuse / safety","Controlled; abuse, diversion, psychosis, mania, high BP","Much lower abuse potential; milder side effects"],["Downstream","—","DA → cortical arousal → TMN histamine → LH orexin"]]],"x":["Armodafinil (R enantiomer): later peak, longer half-life, higher levels 6–14 h; may avoid a second daily dose."]},{"t":"Treating OSA and shift work disorder","sec":"Wake-Promoting Agents","fig":"Figs 10-64, 10-56","c":[{"head":"Obstructive sleep apnea","body":["First line: CPAP (adherence only 54%)","Alternatives: BPAP, APAP, oral appliances, surgery","Behavioral: weight loss (BMI \u003c25), exercise, no alcohol/sedatives at bedtime, positional therapy","Modafinil/armodafinil approved as adjuncts"]},{"head":"Shift work disorder","body":["Modafinil/armodafinil help alertness on shift","Add circadian treatments","Morning bright light (10,000 lux, 30 min) timed to melatonin phase","Bright light can improve night-shift performance, alertness, mood"]}]},{"t":"Solriamfetol and pitolisant","sec":"Wake-Promoting Agents","fig":"Figs 10-65, 10-66","c":[{"head":"Solriamfetol (NDRI)","body":["NE and DA reuptake inhibitor","More potent than bupropion; less potent but more tolerable and less abusable than amphetamine/methylphenidate","Narcolepsy; adjunct in OSA","Short half-life: morning dose wears off by bedtime"]},{"head":"Pitolisant (H3 antagonist)","body":["Blocks presynaptic H3 autoreceptors → more histamine release","Approved for narcolepsy; anecdotally helps cataplexy","Not controlled; no known abuse potential","Can over-activate (anxiety, insomnia); roughly as effective as modafinil"]}]},{"t":"Sodium oxybate (GHB)","sec":"Wake-Promoting Agents","fig":"Figs 10-67, 10-68","c":[{"head":"How it works","body":["Full agonist at GHB receptors","Partial agonist at GABAB: antagonist when GABA is high, agonist when low","Increases slow-wave sleep","Sleep so well at night that you are not sleepy by day"]},{"head":"Uses and cautions","body":["Approved for cataplexy and excessive sleepiness","Reduces hypnagogic hallucinations and sleep paralysis","Controlled; distributed via a central US pharmacy","Misused as a “date rape” drug with alcohol; abused by athletes for the growth-hormone surge"]}]},{"t":"Wake-promoting agents at a glance","sec":"Wake-Promoting Agents","fig":"","tb":[[["Agent","Mechanism","Approved uses in Ch. 10","Abuse potential"],["Caffeine","Adenosine antagonist → more DA action","—","—"],["Amphetamine / methylphenidate","NE/DA reuptake inhibition (± release)","Narcolepsy","High (controlled)"],["Modafinil / armodafinil","DAT inhibition (tonic DA)","Narcolepsy; OSA adjunct; shift work","Much reduced"],["Solriamfetol","NDRI","Narcolepsy; OSA adjunct","Less than stimulants"],["Pitolisant","H3 antagonist → more histamine","Narcolepsy","None known"],["Sodium oxybate","GHB agonist; GABAB partial agonist","Cataplexy; excessive sleepiness","Yes (controlled)"]]]},{"t":"Chapter summary","sec":"Summary and Review","fig":"","c":[{"head":"Arousal systems","body":"Histamine, DA, NE, ACh, 5HT (ascending reticular activating system), stabilized by orexin."},{"head":"The switch","body":"TMN histamine promotes wake; VLPO GABA promotes sleep."},{"head":"Insomnia","body":"Hyperarousal; GABAA PAMs enhance sleep drive, while DORAs, trazodone, H1 antagonists reduce arousal."},{"head":"Sleepiness","body":"Deficient arousal: hypersomnias, OSA, narcolepsy, circadian disorders."},{"head":"Wake promoters","body":"Caffeine, stimulants, modafinil, solriamfetol, pitolisant enhance DA/histamine."},{"head":"GHB","body":"Deep slow-wave sleep at night reduces daytime sleepiness and cataplexy."}]},{"t":"Take-aways for the resident","sec":"Summary and Review","fig":"","c":[{"head":"Ask about sleep and sleepiness","body":"Sleep is a psychiatric vital sign; interview the bed partner."},{"head":"Think time above threshold","body":"Match hypnotic duration to the patient’s problem (onset, maintenance, hangover)."},{"head":"Prefer arousal reducers first","body":"Benzodiazepines are second line because of tolerance, withdrawal, rebound."},{"head":"Rule out secondary causes","body":"Screen for OSA, medications, and psychiatric illness before wake-promoters."}]}],"cards":[{"id":"c10-1","q":"Name the arousal neurotransmitters.","a":"Histamine, dopamine, norepinephrine, serotonin, acetylcholine; orexin stabilizes; GABA promotes sleep."},{"id":"c10-2","q":"How is histamine synthesized and inactivated?","a":"Histidine → (HDC) histamine; broken down by histamine N-methyltransferase then MAO-B. No reuptake pump."},{"id":"c10-3","q":"What does blocking H1 vs H3 do?","a":"H1 block: sedation/sleep. H3 block: more histamine release, wakefulness."},{"id":"c10-4","q":"Which orexin binds which receptor?","a":"Orexin A: OX1R and OX2R. Orexin B: OX2R only."},{"id":"c10-5","q":"What are the two opposing drives of the sleep/wake cycle?","a":"Homeostatic sleep drive (adenosine) and circadian wake drive (SCN, orexin)."},{"id":"c10-6","q":"How do monoamines and ACh change across the sleep cycle?","a":"ACh peaks in REM, lowest in stage 4; DA, NE, 5HT, HA peak in stage 2, lowest in REM."},{"id":"c10-7","q":"How much more likely is depression after insomnia?","a":"About 4 times (2× anxiety, 7× substance use)."},{"id":"c10-8","q":"List four suggested criteria for insomnia.","a":"Latency >30 min; WASO >30 min; efficiency \u003c85%; total sleep \u003c6.5 h."},{"id":"c10-9","q":"Why are benzodiazepines second-line hypnotics?","a":"Tolerance, withdrawal, and rebound insomnia worse than baseline."},{"id":"c10-10","q":"Why are DORA half-lives not very relevant?","a":"They compete with endogenous orexin, so drug-to-orexin ratio, not half-life, sets blockade."},{"id":"c10-11","q":"Why is low-dose doxepin different from diphenhydramine?","a":"At 1–6 mg it is selective for H1 without anticholinergic effects."},{"id":"c10-12","q":"What is the ideal time above sleep threshold?","a":"About 8 hours."},{"id":"c10-13","q":"What diagnoses narcolepsy?","a":"CSF orexin \u003c110 pg/mL, or ≥2 SOREMPs on MSLT (or 1 on polysomnogram) with latency ≤8 min."},{"id":"c10-14","q":"How do you treat delayed vs advanced sleep phase?","a":"Delayed: morning light, evening melatonin. Advanced: early-evening light, early-morning melatonin."},{"id":"c10-15","q":"How does caffeine promote wakefulness?","a":"Blocks adenosine receptors, restoring D2 affinity for dopamine."},{"id":"c10-16","q":"How does pitolisant work?","a":"Blocks presynaptic H3 autoreceptors, releasing more histamine."}],"glossary":[{"t":"TMN","m":"Tuberomammillary nucleus"},{"t":"VLPO","m":"Ventrolateral preoptic area"},{"t":"LH / PH","m":"Lateral / posterior hypothalamus"},{"t":"PPT/LDT","m":"Pedunculopontine / laterodorsal tegmental nuclei"},{"t":"SCN","m":"Suprachiasmatic nucleus"},{"t":"HDC","m":"Histidine decarboxylase"},{"t":"OX1R / OX2R","m":"Orexin receptors"},{"t":"GIRK","m":"G-protein-regulated inward rectifying K⁺ channel"},{"t":"DORA","m":"Dual orexin receptor antagonist"},{"t":"PAM","m":"Positive allosteric modulator"},{"t":"REM / SOREMP","m":"Rapid eye movement / sleep-onset REM period"},{"t":"WASO","m":"Wakefulness after sleep onset"},{"t":"MSLT","m":"Multiple Sleep Latency Test"},{"t":"OSA","m":"Obstructive sleep apnea"},{"t":"CPAP","m":"Continuous positive airway pressure"},{"t":"SWD","m":"Shift work disorder"},{"t":"ASPD / DSPD","m":"Advanced / delayed sleep phase disorder"},{"t":"MT1 / MT2","m":"Melatonin receptors"},{"t":"NDRI","m":"Norepinephrine–dopamine reuptake inhibitor"},{"t":"GHB","m":"γ-hydroxybutyrate (sodium oxybate)"}]},{"n":11,"title":"ADHD and Its Treatment","short":"ADHD","notes":[{"t":"Not just attention, not always hyperactivity","sec":"","fig":"","c":[{"head":"The name misleads","body":"ADHD is not just a disorder of “attention,” and it does not have to include “hyperactivity.”"},{"head":"The modern scope","body":"Treat the full range of symptoms (inattention, impulsivity, hyperactivity), across all waking hours, from young children through adults."}],"p":[{"label":"Trend","text":"Psychiatry is moving from categorical diagnoses (DSM/ICD) toward single symptom dimensions, such as executive dysfunction, that cut across many disorders."}]},{"t":"Deconstructing ADHD into symptoms and circuits","sec":"Symptoms and Circuits","fig":"Figs 11-1, 11-2, 11-7","tb":[[["Symptom","Hypothetically malfunctioning region","Test that activates it"],["Sustained attention / problem solving (executive dysfunction)","Dorsolateral prefrontal cortex (DLPFC)","n-back test"],["Selective attention (focus)","Dorsal anterior cingulate cortex (dACC)","Stroop task"],["Impulsivity","Orbitofrontal cortex (OFC)","—"],["Hyperactivity","Prefrontal motor cortex / supplementary motor area","—"]]],"p":[{"label":"Circuits","text":"Each is a CSTC loop: cortex → striatum → thalamus → back to cortex."}]},{"t":"Testing the attention circuits","sec":"Symptoms and Circuits","fig":"Figs 11-3, 11-4","c":[{"head":"n-back test → DLPFC","body":["0-back: press the number shown","1-back: press the number from one screen before","Higher n = harder","Poor DLPFC activation: not finishing tasks, disorganization, trouble sustaining mental effort","Also seen in schizophrenia, depression, mania, anxiety, pain, sleep disorders"]},{"head":"Stroop task → dACC","body":["Name the ink color, not the word (“blue” printed in orange = “orange”)","Poor dACC activation: careless mistakes, not listening, losing things, distraction, forgetfulness"]}]},{"t":"Impulsivity and hyperactivity","sec":"Symptoms and Circuits","fig":"Figs 11-5, 11-6","c":[{"head":"Impulsivity: OFC loop","body":["Talking excessively","Blurting things out","Not waiting one’s turn","Interrupting"]},{"head":"Hyperactivity: motor cortex loop","body":["Fidgeting, leaving one’s seat","Running and climbing","Constantly on the go","Trouble playing quietly","Loop: prefrontal motor cortex → putamen → thalamus"]}],"p":[{"label":"Link","text":"The O
